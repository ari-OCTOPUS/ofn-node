# ============================================================
# MANIFEST — Vault Cartographer limb (OLP-1)
# Machine-readable control contract for the read-only cartography/audit limb.
# ZERO PII / secret / Project-F identity. Content-free. Safe cross-domain.
# Increment 2 (2026-07-12): manifest + Anchor-Ledger binding CONTRACT.
#   → live emit() calls land with the code leg (step 3, behind OCTOPUS_WIRE_CARTOGRAPHER).
# ============================================================
manifest_version: "OLP-1.0"
generated: "2026-07-12"
generated_by: "agent (cartographer limb conformance · increment 2)"
purpose: >
  Read-first contract so the master (Architect/_ops) can discover, observe, and
  safely task the Vault Cartographer limb. It maps the vault's real architecture
  and emits proposals only. It never mutates, never acts outward, never spends.
pii_policy: "ZERO identity/content/secret. Never expand Project-F. Content-free summaries only."

identity:
  limb_id: "vault-cartographer"
  logical_id: "limb:vault-cartographer"        # registry key (control-plane enrich)
  organ: "CARTOGRAPHER"
  entity_type: "audit-limb / read-model"
  domain: "architect (نقشه‌برداری)"
  parent_system: "OCTOPUS"
  parent_authority: "Architect/_ops"
  owner: "آری"
  status: "registered / not-deployed (phase-4)"
  kind: "on-demand read-only — does NOT tick per beat (unlike ziman/lead)"

status_snapshot:
  execution_state: "ZERO mutation · ZERO outward · ZERO spend — map/report/propose only"
  autonomy_floor: "read-only"                  # hard floor; stays even when Security Gate lifts
  autonomy_ceiling: "propose-only"             # text proposals for human/master ratification
  risk_tier: "R1"
  risk_declared: "low / contained"
  security_gate: "inherits §Security Gate (ROTATION_CHECKLIST)"

hard_rules_locked:
  - "read-only floor; no Write/commit/move/delete in limb mode"
  - "no mutation of code / charter / genome / policy / permissions"
  - "no verdict issuance; no external action (publish/send/spend/deploy/login)"
  - "zero echo of secret/key/seed or Project-F identity/platform/content"
  - "_Duplicates / _Archive / .agentignore are NOT sources of truth"
hard_rules_mutability: "immutable without explicit human verdict"

capabilities:
  - {id: map,   desc: "layered architecture map from REAL repo state", output: "06 - Architecture Maps/MASTER-ARCHITECTURE-*.md (proposed)"}
  - {id: audit, desc: "design↔reality gap map with citation",         output: "proposal/report in 00 - Inbox (propose-only)"}
  - {id: memory_candidate, desc: "provisional memory candidate",       output: "candidate (canonical only via curator + owner)"}

control_surface:
  reads: "whole vault minus .agentignore / _Duplicates / _Archive / secrets / Project-F identity"
  emits:
    - "06 - Architecture Maps/MASTER-ARCHITECTURE-*.md (proposed)"
    - "proposal/report in 00 - Inbox (propose-only)"
    - "memory candidate (provisional)"
  tools: ["Read", "Grep", "Glob", "Bash(harmless)"]
  master_boundary: >
    Architect/_ops may OBSERVE, task propose-only work, and read outputs. It MUST NOT
    deploy/activate the limb, expand its autonomy, or self-approve on the owner's behalf.

# ── Anchor-Ledger binding (increment 2 CONTRACT; live emit = step 3) ──────────
ledger:
  module: "_ops/events.py"
  sink: "state/events.jsonl (append-only, MAX_KEEP 500, content-free)"
  agent_id: "vault-cartographer"
  event_names: ["task.started", "task.completed", "task.failed", "task.blocked", "approval.required"]
  enrich: true                                 # attach control_plane from state/registry/registry-latest.json
  approval_policy: "any proposal touching a gated concern → approval_state=required (never auto-approve)"
  content_rule: >
    summary/next_action carry only generic phrasing + citation refs (file:line) — never
    secret/identity/content; events.py _BANNED_ECHO scrub is the backstop.
  correlation: "one trace_id per cartography run; idempotency_key = run content digest"
  binding_status: "leg implements the emit contract (injectable emitter, content-free); still NOT wired into organism — live emit begins at step 4"

kill_switches:
  - "§Security Gate (ROTATION_CHECKLIST) → effective autonomy = read-only"
  - "STOP-ORGANISM (global)"
  - "absence of OCTOPUS_WIRE_CARTOGRAPHER → leg incubating/inactive (from step 3)"

budget:
  spend_aud_monthly: 0
  organ_in_budgets_yaml: false                 # no-spend → incubating like `lead`; no organ required

interfaces:
  obsidian:
    home: "05 - Agents/Vault Cartographer.md"
    canonical_output: "06 - Architecture Maps/MASTER-ARCHITECTURE-*.md"
  octopus:
    registry_key: "limb:vault-cartographer"
    control_plane_enrich: true
  telegram:
    enabled: false                             # gateway-only if ever enabled; owner action
  model_gateway:
    mode: "inherits session model; no external spend"

sources_of_truth:
  identity: "05 - Agents/Vault Cartographer.md"
  limb_contract: "05 - Agents/Vault-Cartographer-LIMB.md"
  registry_row: "05 - Agents/AGENT_REGISTRY.md"
  rules: "04 - Architect System/architect/ARCHITECT_CHARTER.md"
  executable: ".claude/agents/vault-cartographer.md"

roadmap_state:
  increment_1_governance: "done (342f001)"
  increment_2_manifest_ledger: "this file"
  step_3_code_leg: "done — _ops/legs/cartographer_leg.py + test_cartographer_leg.py (10/10); inert until wired"
  step_4_wiring_tick: "pending"
  step_5_activation: "pending (owner verdict + rotation + per-domain audit)"

safety:
  fail_closed: true
  least_privilege: true
  audit_required: true          # every run → one ledger trace (once wired)
  rollback_required: true       # delete manifest + leg to revert; nothing else depends on it
  kill_switch_required: true
  secrets_allowed_in_documents: false
