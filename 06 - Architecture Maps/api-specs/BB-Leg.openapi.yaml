openapi: 3.0.3
info:
  title: BB-Leg — Isolated Worker & Proposal Emitter
  version: 1.0.0
  description: |
    Isolated worker (INV-17, IsolationModel.md). Takes a minimal task_packet
    with capability-scoped read-allowlist (no wildcards, never "*"), scoped tools,
    hard budget, spawn=0, and empty secrets. Output = verifiable Proposal only.
    No send/publish/pay/trade methods exist (propose-only, D3).
    Money_link (INV-14): leg without resolved organ = incubating (never reserves budget).
  contact:
    name: Octopus System
  x-invariant:
    - INV-17: worker isolation, spawn=0, empty secrets
    - I2: budget enforcement via organ_gate only
    - D3: structural output confinement (proposals only)
    - D5: approval is separate human event

servers: []

paths:
  /TaskPacket:
    post:
      operationId: leg.TaskPacket
      summary: Immutable capability-bound task packet
      description: |
        Frozen dataclass. Structural verification in __post_init__ (fail-closed:
        leg is not created if it violates constraints).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPacket"
      responses:
        "200":
          description: Validated TaskPacket instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPacket"
      x-python-signature: |
        @dataclass(frozen=True)
        class TaskPacket:
            leg_id: str
            organ: str
            read_allowlist: tuple[str, ...]
            tools: tuple[str, ...] = ()
            budget_aud: float = 0.0
            spawn: int = 0
            secrets: tuple = ()

  /Leg/init:
    post:
      operationId: leg.Leg.__init__
      summary: Construct Leg from TaskPacket
      description: |
        Resolves money_link (active/incubating). Injects organ_table for testing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packet]
              properties:
                packet:
                  $ref: "#/components/schemas/TaskPacket"
                organ_table:
                  type: object
                  nullable: true
                  description: Injectable organ table for testing
      responses:
        "200":
          description: Leg instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegStatus"
      x-python-signature: |
        def __init__(self, packet: TaskPacket, organ_table: dict | None = None)

  /Leg/readBrief:
    post:
      operationId: leg.Leg.read_brief
      summary: Read one note from allowlist
      description: |
        Capability-checked read. If note_id not in allowlist → None (fail-closed,
        not exception that kills the leg). fs_get injectable for testing.
        PII never goes to LLM — this method returns text; caller is responsible for boundary.
      parameters:
        - name: note_id
          in: query
          required: true
          schema:
            type: string
        - name: fs_get
          in: query
          required: false
          schema:
            type: object
            description: Injectable filesystem getter for testing
      responses:
        "200":
          description: Note text or None
          content:
            application/json:
              schema:
                type: string
                nullable: true
      x-python-signature: |
        def read_brief(self, note_id: str, fs_get=None) -> str | None

  /Leg/reserveBudget:
    post:
      operationId: leg.Leg.reserve_budget
      summary: Reserve budget under organ_gate (active legs only)
      description: |
        Incubating leg → deny (fail-closed). est_aud converted to USD via FX.
        Also checked against packet.budget_aud hard cap (0 = unlimited organism-level).
      parameters:
        - name: est_aud
          in: query
          required: true
          schema:
            type: number
        - name: task
          in: query
          required: false
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: organ_gate reserve verdict
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BudgetAllow"
                  - $ref: "#/components/schemas/BudgetDeny"
      x-python-signature: |
        def reserve_budget(self, est_aud: float, task: str = "") -> dict

  /Leg/settleBudget:
    post:
      operationId: leg.Leg.settle_budget
      summary: Settle actual cost after work
      description: Incubating leg → no-op.
      parameters:
        - name: est_aud
          in: query
          required: true
          schema:
            type: number
        - name: actual_aud
          in: query
          required: true
          schema:
            type: number
        - name: task
          in: query
          required: false
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: Settle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResult"
      x-python-signature: |
        def settle_budget(self, est_aud: float, actual_aud: float, task: str = "") -> dict

  /Leg/releaseBudget:
    post:
      operationId: leg.Leg.release_budget
      summary: Release failed reservation
      description: Incubating leg → no-op.
      parameters:
        - name: est_aud
          in: query
          required: true
          schema:
            type: number
        - name: task
          in: query
          required: false
          schema:
            type: string
            default: ""
      responses:
        "200":
          description: Release result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResult"
      x-python-signature: |
        def release_budget(self, est_aud: float, task: str = "") -> dict

  /Leg/emitProposal:
    post:
      operationId: leg.Leg.emit_proposal
      summary: Produce a verifiable Proposal (only legal output)
      description: |
        No send/publish/pay methods exist in Leg (propose-only, D3).
        If hlc is (0,0) and leg_beat stamped last_hlc, use causal stamp.
        Approval = separate human event (D5).
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [draft_quote, report, draft_message]
        - name: payload
          in: query
          required: true
          schema:
            type: object
        - name: hlc
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
            minItems: 2
            maxItems: 2
            default: [0, 0]
      responses:
        "200":
          description: Proposal instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
      x-python-signature: |
        def emit_proposal(self, kind: str, payload: dict, hlc: tuple = (0, 0)) -> Proposal

  /Leg/status:
    get:
      operationId: leg.Leg.status
      summary: Read-only snapshot of leg state
      responses:
        "200":
          description: Leg status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegStatus"
      x-python-signature: |
        def status(self) -> dict

components:
  schemas:
    TaskPacket:
      type: object
      required: [leg_id, organ, read_allowlist]
      properties:
        leg_id:
          type: string
          description: Leg identity (e.g., "lead-naghshi")
        organ:
          type: string
          description: Budget organ from budgets.yaml
        read_allowlist:
          type: array
          items:
            type: string
          minItems: 1
          description: Exact note IDs; never "*" or empty
        tools:
          type: array
          items:
            type: string
          default: []
          description: Scoped tool names
        budget_aud:
          type: number
          default: 0.0
          description: Hard task budget cap (0 = unlimited at organism level)
        spawn:
          type: integer
          default: 0
          enum: [0]
          description: INV-17 — always 0
        secrets:
          type: array
          default: []
          description: Always empty tuple (verified)

    Proposal:
      type: object
      required: [proposal_id, leg_id, kind, payload, hlc, hash]
      properties:
        proposal_id:
          type: string
          example: "P-abc123..."
        leg_id:
          type: string
        kind:
          type: string
          enum: [draft_quote, report, draft_message]
        payload:
          type: object
        hlc:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          example: [0, 0]
        hash:
          type: string
          description: SHA-256 canonical JSON truncated to 24 hex chars
          example: "a1b2c3d4e5f6..."

    LegStatus:
      type: object
      required: [leg_id, organ, money_link, read_allowlist, tools, budget_aud, spawn, secrets_count, proposals_emitted]
      properties:
        leg_id:
          type: string
        organ:
          type: string
        money_link:
          type: string
          enum: [active, incubating]
        read_allowlist:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: string
        budget_aud:
          type: number
        spawn:
          type: integer
          enum: [0]
        secrets_count:
          type: integer
          enum: [0]
        proposals_emitted:
          type: integer
          minimum: 0

    BudgetAllow:
      type: object
      required: [allow]
      properties:
        allow:
          type: boolean
          enum: [true]
        reserved:
          type: number

    BudgetDeny:
      type: object
      required: [allow, reason]
      properties:
        allow:
          type: boolean
          enum: [false]
        reason:
          type: string

    BudgetResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        reason:
          type: string
          nullable: true
        actual_usd:
          type: number
          nullable: true

  securitySchemes:
    LegBoundary:
      type: apiKey
      in: header
      name: X-Leg-Boundary
      description: |
        Internal module boundary. TaskPacket structural verification is the
        only gate; no external auth.

security:
  - LegBoundary: []

x-octopus-metadata:
  file_path: _ops/legs/leg.py
  invariant_tags: [INV-17, I2, D3, D5, INV-14]
  fail_closed: true
  propose_only: true
  side_effects: false
  notes: |
    Leg is the ONLY worker class. It never writes to source-of-truth;
    it only produces Proposal objects. No send/publish/pay/trade methods.
    Secrets never leave the boundary (empty tuple enforced).
