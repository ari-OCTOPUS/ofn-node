openapi: 3.0.3
info:
  title: BB-OpsLib — Common Metabolism Library
  version: 3.0.0
  description: |
    Shared library for paths, budgets.yaml (single source of truth, read-only H7),
    micro-USD unit, pinned FX rate, atomic file locking, ledger bridge, and
    STOP/FREEZE flags. This layer only MEASURES/proposes — the single enforcer
    is budget_gate (I2). Invariant: I3 fail-closed (FREEZE on divergence),
    I6 (no hardcoded numbers, read from budgets.yaml).
  contact:
    name: Octopus System
  x-invariant:
    - I2: this layer only measures/proposes
    - I3: fail-closed → FREEZE on divergence
    - I6: no hardcoded numbers, read from budgets.yaml
    - H7: budgets.yaml read-only, single source of truth

servers: []

paths:
  /loadBudgets:
    get:
      operationId: opslib.load_budgets
      summary: Load budgets.yaml (cached, force reload optional)
      description: |
        Read-only access to single source of truth. Missing required keys = exception
        (fail-closed, no imaginary defaults).
      parameters:
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: budgets.yaml contents
          content:
            application/json:
              schema:
                type: object
                required: [global, projects]
      x-python-signature: |
        def load_budgets(force: bool = False) -> dict

  /fxAudPerUsd:
    get:
      operationId: opslib.fx_aud_per_usd
      summary: Pinned USD→AUD rate
      description: |
        If aud_per_usd in budgets.yaml global, use it (FACT). Otherwise 1.5 (EST).
      responses:
        "200":
          description: FX rate and provenance tag
          content:
            application/json:
              schema:
                type: object
                required: [rate, tag]
                properties:
                  rate:
                    type: number
                  tag:
                    type: string
                    enum: ["FACT(budgets.yaml)", "EST(default=budget_gate.AUD)"]
      x-python-signature: |
        def fx_aud_per_usd() -> tuple[float, str]

  /organTable:
    get:
      operationId: opslib.organ_table
      summary: Official organs from budgets.yaml + synthetic DEBATE_LOOP
      description: |
        Returns organ configs with floor and cap_monthly. DEBATE_LOOP defaults
        to cap_monthly=5 if not in budgets.yaml.
      responses:
        "200":
          description: Organ table
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    floor:
                      type: number
                    cap_monthly:
                      type: number
                    human_priority:
                      type: number
                    deadline:
                      type: string
                      format: date
      x-python-signature: |
        def organ_table() -> dict[str, dict]

  /micro:
    get:
      operationId: opslib.micro
      summary: Convert USD float to micro-USD integer
      parameters:
        - name: usd
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: micro-USD integer
          content:
            application/json:
              schema:
                type: integer
      x-python-signature: |
        def micro(usd: float) -> int

  /usd:
    get:
      operationId: opslib.usd
      summary: Convert micro-USD integer to USD float
      parameters:
        - name: micro_usd
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: USD float
          content:
            application/json:
              schema:
                type: number
      x-python-signature: |
        def usd(micro_usd: int) -> float

  /halted:
    get:
      operationId: opslib.halted
      summary: First halt reason or None
      description: |
        Priority: HALT-ALL > STOP(architect) > STOP-METABOLIC > STOP-DEBATE (if for_debate).
      parameters:
        - name: for_debate
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Halt reason or null
          content:
            application/json:
              schema:
                type: string
                nullable: true
      x-python-signature: |
        def halted(*, for_debate: bool = False) -> str | None

  /frozen:
    get:
      operationId: opslib.frozen
      summary: Check FREEZE.flag existence
      responses:
        "200":
          description: Frozen state
          content:
            application/json:
              schema:
                type: boolean
      x-python-signature: |
        def frozen() -> bool

  /freeze:
    post:
      operationId: opslib.freeze
      summary: I3 — freeze all grants and record reason (idempotent)
      description: |
        Creates FREEZE.flag with timestamp + reason. Also alerts governor.
      parameters:
        - name: reason
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Freeze applied
      x-python-signature: |
        def freeze(reason: str) -> None

  /alert:
    post:
      operationId: opslib.alert
      summary: Append alert items to governor-alerts.md
      parameters:
        - name: items
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Alert logged
      x-python-signature: |
        def alert(items: list[str]) -> None

  /ledgerNote:
    post:
      operationId: opslib.ledger_note
      summary: Append NOTE to genome ledger (fail-soft on failure)
      description: |
        Failure = alert (silent errors forbidden) but flow continues.
        Spending is fail-closed elsewhere (gate).
      parameters:
        - name: subtype
          in: query
          required: true
          schema:
            type: string
        - name: payload
          in: query
          required: true
          schema:
            type: object
        - name: actor
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ledger record or None on failure
          content:
            application/json:
              schema:
                type: object
                nullable: true
      x-python-signature: |
        def ledger_note(subtype: str, payload: dict, actor: str) -> dict | None

  /appendJsonl:
    post:
      operationId: opslib.append_jsonl
      summary: Atomically append JSON line to file
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: record
          in: query
          required: true
          schema:
            type: object
      responses:
        "200":
          description: Line appended
      x-python-signature: |
        def append_jsonl(path: Path, record: dict) -> None

  /backupHealth:
    get:
      operationId: opslib.backup_health
      summary: Germline backup health (read-only)
      description: |
        Returns health level (ok/warn/err) based on germline lag and explicit
        git-write failure flag. Flag always dominates — mtime can lie (OBS-02).
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                required: [healthy, level, lag_h, gitwrite_failed, reason]
                properties:
                  healthy:
                    type: boolean
                  level:
                    type: string
                    enum: [ok, warn, err]
                  lag_h:
                    type: number
                    nullable: true
                  gitwrite_failed:
                    type: string
                    nullable: true
                  reason:
                    type: string
                    nullable: true
      x-python-signature: |
        def backup_health(offbox=None) -> dict

  /liveGateOpen:
    get:
      operationId: opslib.live_gate_open
      summary: Two-lock gate for live paths (date + activation flag)
      description: |
        (1) date >= 2026-07-21 OR ACTIVATION-GO-LIVE.flag exists;
        (2) per-activation flag exists (owner-only).
      parameters:
        - name: activation_flag
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: (open, reason) tuple
          content:
            application/json:
              schema:
                type: object
                required: [open, reason]
                properties:
                  open:
                    type: boolean
                  reason:
                    type: string
      x-python-signature: |
        def live_gate_open(activation_flag: Path) -> tuple[bool, str]

components:
  schemas:
    BudgetsYaml:
      type: object
      required: [global, projects]
      properties:
        global:
          type: object
          properties:
            cap_monthly:
              type: number
            currency:
              type: string
              enum: [AUD]
            epoch:
              type: string
            explore_pct:
              type: number
            spike_pct:
              type: number
            idle_epochs:
              type: integer
            lend_max_pct:
              type: number
            human_gate_aud:
              type: number
            weights:
              type: object
            aud_per_usd:
              type: number
        projects:
          type: object
          additionalProperties:
            type: object
        loop:
          type: object
        allocation:
          type: object
        business:
          type: object
        email:
          type: object
        routing:
          type: object

  securitySchemes:
    InternalModule:
      type: apiKey
      in: header
      name: X-Internal-Module
      description: Internal module access only. No external auth.

security:
  - InternalModule: []

x-octopus-metadata:
  file_path: _ops/budget/opslib.py
  invariant_tags: [I2, I3, I6, H7]
  fail_closed: true
  propose_only: false
  side_effects: true
  notes: |
    opslib.py is the shared metabolism library. It provides the ONLY paths
    to budgets.yaml, the ONLY atomic file locking (LockedJson), and the
    ONLY bridge to genome ledger. All numbers are from budgets.yaml (I6).
    Freeze is idempotent and alerts governor.
