      - bb_name: BB-Germline
        file_path: F:\backup\BB-Germline.openapi.yaml
        title: BB-Germline — Backup Immortality & Health Monitor
        version: 2.0.0
        category: Germline
        fail_closed: false
        propose_only: false
        side_effects: false
        invariant_tags: [LifeDoctrine-3, S-2]

  x-interface-map:
    type: array
    items:
      $ref: "#/components/schemas/InterfaceMap"
    value:
      - caller: BB-Leg
        callee: BB-OrganGate
        operation: reserve_budget / settle_budget / release_budget
        direction: internal
        boundary_type: function_call
        notes: Leg delegates to organ_gate when money_link=active. Incubating = deny/no-op.
      - caller: BB-OrganGate
        callee: BB-OpsLib
        operation: load_budgets / fx_aud_per_usd / organ_table / freeze / alert
        direction: internal
        boundary_type: function_call
        notes: OrganGate reads config and triggers freeze via shared library.
      - caller: BB-OrganGate
        callee: budget_gate (internal, not contract-external)
        operation: reserve / settle
        direction: downward
        boundary_type: function_call
        notes: I2 — budget_gate is the single global enforcer. Not exposed as independent BB.
      - caller: BB-Telemetry
        callee: BB-OpsLib
        operation: fx_aud_per_usd / load_budgets / freeze / alert / conflict_to_human
        direction: internal
        boundary_type: function_call
        notes: Telemetry reads FX and can trigger FREEZE + STOP-METABOLIC on divergence.
      - caller: BB-Telemetry
        callee: genome-system (external ledger)
        operation: read METRIC events
        direction: external
        boundary_type: file_system
        notes: Reads ledger.jsonl from genome-system directory.
      - caller: BB-Telemetry
        callee: control-brain (external DB)
        operation: read usage table (mode=ro)
        direction: external
        boundary_type: file_system
        notes: Opens core.db via sqlite URI read-only mode.
      - caller: BB-Reconcile
        callee: BB-Attribution
        operation: confirm / fold
        direction: internal
        boundary_type: function_call
        notes: Reconcile is the ONLY caller of attribution.confirm().
      - caller: BB-Reconcile
        callee: BB-OpsLib
        operation: LockedJson / append_jsonl / alert
        direction: internal
        boundary_type: function_call
        notes: Uses atomic file operations for state persistence.
      - caller: BB-PocketSmith
        callee: PocketSmith API v2
        operation: GET /me /users/{id}/transaction_accounts /users/{id}/transactions
        direction: external
        boundary_type: network
        notes: Flag-based (OCTOPUS_WIRE_POCKETSMITH). Default off = no-op. Only GET.
      - caller: BB-PocketSmith
        callee: txn_store (internal module)
        operation: sync / _dedup / save
        direction: internal
        boundary_type: file_system
        notes: Writes to local txn_store file only. Zero external financial side-effects.
      - caller: BB-Attribution
        callee: genome-system ledger
        operation: append MONEY_ATTRIBUTION
        direction: external
        boundary_type: file_system
        notes: Append-only ledger events via opslib.genome_ledger().
      - caller: BB-Germline
        callee: BB-OpsLib
        operation: alert / backup_health
        direction: internal
        boundary_type: function_call
        notes: Germline reports health but does not directly freeze.
      - caller: BB-Leg
        callee: BB-OpsLib
        operation: read_brief (fs_get) / organ_table / fx_aud_per_usd
        direction: internal
        boundary_type: function_call
        notes: Leg reads config and note content via opslib paths.

x-octopus-metadata:
  file_path: F:\backup\BB-Registry.openapi.yaml
  invariant_tags: [I1, I2, I3, I6, H7, INV-17, D3, D5, INV-14]
  fail_closed: true
  propose_only: false
  side_effects: false
  notes: |
    This registry is the master index of all interface contracts.
    No code is generated from these contracts; they serve as documentation,
    audit checkpoints, and test scaffolding references.
