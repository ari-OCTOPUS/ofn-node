openapi: 3.0.3
info:
  title: BB-Telemetry — Unified Micro-USD Consumption Reader
  version: 1.1.0
  description: |
    Reads consumption from both stacks in micro-USD space.
    Sources: (1) genome-system ledger METRIC events, (2) control-brain core.db usage table.
    I3 (fail-closed): if monthly spend exceeds cap_monthly, or billed vs telemetry
    divergence > 20% → FREEZE + [CONFLICT] to human queue + STOP-METABOLIC (death condition).
    Trap #1: "meter or 0" — zero cost with consumed tokens → counted in suspects.
    Trap #2: currency units — costs are USD, caps are AUD, conversion only via pinned FX.
  contact:
    name: Octopus System
  x-invariant:
    - I3: fail-closed → FREEZE on divergence
    - I6: no hardcoded numbers (DIVERGENCE_DEATH from code constant = 0.20, but cap from yaml)
    - I1: append-only ledger

servers: []

paths:
  /readGenome:
    get:
      operationId: telemetry.read_genome
      summary: Read METRIC llm_cost_usd events from genome ledger
      description: |
        Returns events count, cost in micro-USD, by_day breakdown, and suspect_zero count.
        Tolerates broken lines mid-crash (ledger contract). All genome consumption = GENOME_SYS organ.
      responses:
        "200":
          description: Genome telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenomeTelemetry"
      x-python-signature: |
        def read_genome() -> dict

  /readBrain:
    get:
      operationId: telemetry.read_brain
      summary: Read usage table from control-brain core.db (read-only mode=ro)
      description: |
        Opens sqlite with URI mode=ro to avoid writer contention.
        Maps business/actor to organ via ORGAN_MAP. Unmapped → UNMAPPED:{name}.
        Suspect_zero: zero cost with non-zero tokens consumed.
      responses:
        "200":
          description: Brain telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainTelemetry"
      x-python-signature: |
        def read_brain() -> dict

  /snapshot:
    get:
      operationId: telemetry.snapshot
      summary: Unified micro-USD snapshot of entire organism + disk write
      description: |
        Combines genome + brain sources. Calculates month and today totals.
        Persists to STATE_DIR/telemetry/ for UI/governor consumption.
      parameters:
        - name: write
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Unified snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetrySnapshot"
      x-python-signature: |
        def snapshot(write: bool = True) -> dict

  /reconcile:
    post:
      operationId: telemetry.reconcile
      summary: I3 + death condition check
      description: |
        Compares telemetry snapshot against budgets.yaml cap and budget-state billed amount.
        Divergence > DIVERGENCE_DEATH (20%) → FREEZE + STOP-METABOLIC + [CONFLICT].
        Returns list of problems (empty = healthy).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetrySnapshot"
      responses:
        "200":
          description: Reconciliation result
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                description: List of problems (empty = healthy)
      x-python-signature: |
        def reconcile(snap: dict) -> list[str]

components:
  schemas:
    GenomeTelemetry:
      type: object
      required: [events, cost_musd, by_day, suspect_zero, source]
      properties:
        events:
          type: integer
        cost_musd:
          type: integer
          description: micro-USD
        by_day:
          type: object
          additionalProperties:
            type: integer
        suspect_zero:
          type: integer
          description: Events with zero cost but consumed tokens
        source:
          type: string
          nullable: true

    BrainTelemetry:
      type: object
      required: [rows, cost_musd, by_day, by_organ, suspect_zero, unmapped, source]
      properties:
        rows:
          type: integer
        cost_musd:
          type: integer
        by_day:
          type: object
          additionalProperties:
            type: integer
        by_organ:
          type: object
          additionalProperties:
            type: integer
        suspect_zero:
          type: integer
        unmapped:
          type: object
          additionalProperties:
            type: integer
        source:
          type: string
          nullable: true

    TelemetrySnapshot:
      type: object
      required: [ts, unit, fx_aud_per_usd, sources, genome, brain, per_organ_alltime_musd, month, today, suspect_zero_total]
      properties:
        ts:
          type: string
          format: date-time
        unit:
          type: string
          enum: ["micro-USD (int)"]
        fx_aud_per_usd:
          type: object
          properties:
            rate:
              type: number
            tag:
              type: string
        sources:
          type: object
          properties:
            genome_ledger:
              type: string
              nullable: true
            brain_core_db:
              type: string
              nullable: true
        genome:
          type: object
          properties:
            events:
              type: integer
            cost_musd:
              type: integer
            suspect_zero:
              type: integer
        brain:
          type: object
          properties:
            rows:
              type: integer
            cost_musd:
              type: integer
            suspect_zero:
              type: integer
        per_organ_alltime_musd:
          type: object
          additionalProperties:
            type: integer
        unmapped_musd:
          type: object
          additionalProperties:
            type: integer
        month:
          type: object
          properties:
            key:
              type: string
            musd:
              type: integer
            usd:
              type: number
            aud:
              type: number
        today:
          type: object
          properties:
            musd:
              type: integer
            usd:
              type: number
        suspect_zero_total:
          type: integer

  securitySchemes:
    InternalModule:
      type: apiKey
      in: header
      name: X-Internal-Module
      description: Internal telemetry access only

security:
  - InternalModule: []

x-octopus-metadata:
  file_path: _ops/budget/telemetry.py
  invariant_tags: [I3, I6, I1]
  fail_closed: true
  propose_only: false
  side_effects: true
  notes: |
    Telemetry is read-only except for snapshot persistence to disk.
    reconcile() can trigger FREEZE and STOP-METABOLIC (I3 death condition).
    DIVERGENCE_DEATH = 0.20 (20%).
