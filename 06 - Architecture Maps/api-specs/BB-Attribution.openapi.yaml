openapi: 3.0.3
info:
  title: BB-Attribution — Dollar Attribution Lifecycle per Cell
  version: 1.4.0
  description: |
    Track B offline/paper attribution lifecycle:
    PROPOSAL (mint LEAD-YYYYMMDD-NNN + expected[EST]) → CLAIMED (human sends quote) →
    CONFIRMED (only reconcile.py) → ATTRIBUTED (credit to cell; fitness reads this).
    Invariants: fitness never reads below CONFIRMED. CONFIRMED/ATTRIBUTED only written
    by reconcile job. Self-reporting agents never get CONFIRMED. Append-only in genome
    ledger with MONEY_ATTRIBUTION events. 7-day attribution window.
  contact:
    name: Octopus System
  x-invariant:
    - I1: append-only ledger (MONEY_ATTRIBUTION events)
    - I6: no hardcoded numbers (window from ATTR_WINDOW_DAYS=7 constant)
    - Fitness only reads CONFIRMED/ATTRIBUTED

servers: []

paths:
  /propose:
    post:
      operationId: attribution.propose
      summary: Mint id + PROPOSAL state
      description: |
        Creates a new attribution_id with PROPOSAL state. Never enters fitness.
        Partners optional; resolved from budgets.yaml partners_default if not provided.
      parameters:
        - name: cell
          in: query
          required: true
          schema:
            type: string
        - name: expected_aud
          in: query
          required: true
          schema:
            type: number
        - name: lead
          in: query
          required: false
          schema:
            type: string
            default: ""
        - name: day
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: partners
          in: query
          required: false
          schema:
            type: array
            items:
              type: object
              properties:
                who:
                  type: string
                pct:
                  type: number
      responses:
        "200":
          description: Ledger record
          content:
            application/json:
              schema:
                type: object
      x-python-signature: |
        def propose(cell: str, expected_aud: float, lead: str = "", day: str | None = None, partners: list | None = None) -> dict

  /claim:
    post:
      operationId: attribution.claim
      summary: Record CLAIMED state (quote sent by human)
      description: |
        Necessary but worthless until reconcile. Records ref and amount.
      parameters:
        - name: attribution_id
          in: query
          required: true
          schema:
            type: string
        - name: ref
          in: query
          required: true
          schema:
            type: string
        - name: amount_aud
          in: query
          required: true
          schema:
            type: number
        - name: day
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Ledger record
      x-python-signature: |
        def claim(attribution_id: str, ref: str, amount_aud: float, day: str | None = None) -> dict

  /confirm:
    post:
      operationId: attribution.confirm
      summary: CONFIRMED + ATTRIBUTED (single-touch)
      description: |
        ONLY reconcile.py calls this. Writes CONFIRMED then ATTRIBUTED with partner split.
        Partners resolved from budgets.yaml or explicit parameter.
      parameters:
        - name: attribution_id
          in: query
          required: true
          schema:
            type: string
        - name: cell
          in: query
          required: true
          schema:
            type: string
        - name: amount_aud
          in: query
          required: true
          schema:
            type: number
        - name: matched
          in: query
          required: true
          schema:
            type: object
        - name: partners
          in: query
          required: false
          schema:
            type: array
            items:
              type: object
      responses:
        "200":
          description: CONFIRMED ledger record
      x-python-signature: |
        def confirm(attribution_id: str, cell: str, amount_aud: float, matched: dict, partners: list | None = None) -> dict

  /conflict:
    post:
      operationId: attribution.conflict
      summary: Mark attribution as CONFLICT (human-flagged dispute)
      description: |
        CONFLICT is sticky in fold() — requires human resolution.
        Never enters fitness.
      parameters:
        - name: attribution_id
          in: query
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: true
          schema:
            type: string
        - name: detail
          in: query
          required: false
          schema:
            type: object
      responses:
        "200":
          description: CONFLICT ledger record
      x-python-signature: |
        def conflict(attribution_id: str, reason: str, detail: dict | None = None) -> dict

  /fold:
    get:
      operationId: attribution.fold
      summary: Latest state per attribution_id from ledger
      description: |
        Append-only fold. CONFLICT is sticky (remains until human resolves).
        Carries forward identity fields across state transitions.
      responses:
        "200":
          description: Mapping of attribution_id → latest payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
      x-python-signature: |
        def fold() -> dict[str, dict]

  /confirmedRevenue:
    get:
      operationId: attribution.confirmed_revenue
      summary: Sum of CONFIRMED/ATTRIBUTED dollars per cell + coverage
      description: |
        The ONLY level fitness reads. Returns by_cell, by_partner, attribution_coverage,
        claimed count, confirmed count.
      parameters:
        - name: window_days
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Revenue summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedRevenue"
      x-python-signature: |
        def confirmed_revenue(window_days: int | None = None) -> dict

components:
  schemas:
    ConfirmedRevenue:
      type: object
      required: [by_cell, by_partner, attribution_coverage, claimed, confirmed, window_days]
      properties:
        by_cell:
          type: object
          additionalProperties:
            type: number
        by_partner:
          type: object
          additionalProperties:
            type: number
        attribution_coverage:
          type: number
          nullable: true
        claimed:
          type: integer
        confirmed:
          type: integer
        window_days:
          type: integer

    AttributionState:
      type: string
      enum: [PROPOSAL, CLAIMED, CONFIRMED, ATTRIBUTED, CONFLICT]

    AttributionRecord:
      type: object
      required: [attribution_id, state]
      properties:
        attribution_id:
          type: string
          example: "LEAD-20260716-001"
        state:
          $ref: "#/components/schemas/AttributionState"
        cell:
          type: string
        expected_aud:
          type: number
        amount_aud:
          type: number
        lead:
          type: string
        decision_date:
          type: string
          format: date
        claim_date:
          type: string
          format: date
        confirm_date:
          type: string
          format: date
        ref:
          type: string
        matched:
          type: object
        split:
          type: object
          additionalProperties:
            type: number
        partners:
          type: array
          items:
            type: object
            properties:
              who:
                type: string
              pct:
                type: number

  securitySchemes:
    InternalModule:
      type: apiKey
      in: header
      name: X-Internal-Module
      description: Internal attribution access only

security:
  - InternalModule: []

x-octopus-metadata:
  file_path: _ops/budget/attribution.py
  invariant_tags: [I1, I6]
  fail_closed: true
  propose_only: false
  side_effects: true
  notes: |
    Attribution lifecycle is append-only in genome ledger.
    Only reconcile-job writes CONFIRMED/ATTRIBUTED.
    Agents only write PROPOSAL/CLAIMED.
    Fitness only reads CONFIRMED/ATTRIBUTED via confirmed_revenue().
