openapi: 3.0.3
info:
  title: BB-Germline — Backup Immortality & Health Monitor
  version: 2.0.0
  description: |
    Phase 5 · S-2/S-5: germline lag monitoring + MAX_LAG alarm + retry/backoff.
    LifeDoctrine §3: germline immortality = 3-2-1 discipline (≥3 copies, 2 media, 1 off-site).
    Lag thresholds: warn > 2h, ERROR > 26h, CRIT > 72h.
    S-2 retry/backoff: hourly push with logical retry — errors logged+retried, never silently lost.
    Off-site encrypted = runbook only (owner credentials, never .env/.key).
    Additive; stdlib-only; $0 offline.
  contact:
    name: Octopus System
  x-invariant:
    - LifeDoctrine §3: 3-2-1 backup discipline
    - S-2: retry/backoff with logging
    - Fail-soft: disk unavailability does not kill the loop

servers: []

paths:
  /computeLagHours:
    get:
      operationId: germline.compute_lag_hours
      summary: Calculate germline lag in hours
      description: |
        lag = now − max(last_backup_ts, last_hourly_ts) in hours.
        Both missing → inf (no backup). fail-soft: invalid ts → ignored.
      parameters:
        - name: last_backup_ts
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: last_hourly_ts
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: now_ts
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Lag in hours
          content:
            application/json:
              schema:
                type: number
                minimum: 0
      x-python-signature: |
        def compute_lag_hours(last_backup_ts: str | None, last_hourly_ts: str | None, now_ts: str | None = None) -> float

  /lagSeverity:
    get:
      operationId: germline.lag_severity
      summary: Classify lag into alarm severity
      description: |
        ok/warn/ERROR/CRIT per LifeDoctrine thresholds.
      parameters:
        - name: lag_h
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Severity level
          content:
            application/json:
              schema:
                type: string
                enum: [ok, warn, ERROR, CRIT]
      x-python-signature: |
        def lag_severity(lag_h: float) -> str

  /lagAlarm:
    get:
      operationId: germline.lag_alarm
      summary: Compute germline lag from marker files + severity
      description: |
        Reads mtime of E:\germline\hourly.log and latest bundle.
        Returns lag_h, alert severity, and last timestamps.
      responses:
        "200":
          description: Alarm status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagAlarm"
      x-python-signature: |
        def lag_alarm() -> dict

  /lagAlarmFromPaths:
    get:
      operationId: germline.lag_alarm_from_paths
      summary: Injectable version of lag_alarm for testing
      parameters:
        - name: hourly_log
          in: query
          required: true
          schema:
            type: string
        - name: bundle_dir
          in: query
          required: true
          schema:
            type: string
        - name: now_ts
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Alarm status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LagAlarm"
      x-python-signature: |
        def lag_alarm_from_paths(hourly_log: Path, bundle_dir: Path, now_ts: str | None = None) -> dict

  /runWithRetry:
    post:
      operationId: germline.run_with_retry
      summary: Execute function with exponential backoff retry
      description: |
        S-2: retry with exponential backoff (2, 4, 8s base). Errors logged, never silently lost.
        fn should return True/False or dict with "ok" key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fn]
              properties:
                fn:
                  type: object
                  description: Callable to execute (passed by reference in Python)
                max_retries:
                  type: integer
                  default: 3
                base_backoff:
                  type: number
                  default: 2.0
                logger:
                  type: object
                  nullable: true
      responses:
        "200":
          description: Retry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryResult"
      x-python-signature: |
        def run_with_retry(fn: Callable, max_retries: int = 3, base_backoff: float = 2.0, logger: Callable[[str], None] | None = None) -> dict

components:
  schemas:
    LagAlarm:
      type: object
      required: [germline_lag_h, germline_alert, last_hourly, last_bundle]
      properties:
        germline_lag_h:
          type: number
          nullable: true
        germline_alert:
          type: string
          enum: [ok, warn, ERROR, CRIT]
        last_hourly:
          type: string
        last_bundle:
          type: string

    RetryResult:
      type: object
      required: [ok, attempts, last_error, result]
      properties:
        ok:
          type: boolean
        attempts:
          type: integer
        last_error:
          type: string
        result:
          type: object
          nullable: true

  securitySchemes:
    InternalModule:
      type: apiKey
      in: header
      name: X-Internal-Module
      description: Internal germline access only

security:
  - InternalModule: []

x-octopus-metadata:
  file_path: _ops/germline.py
  invariant_tags: [LifeDoctrine-3, S-2]
  fail_closed: false
  propose_only: false
  side_effects: false
  notes: |
    Germline is read-only monitoring plus retry executor.
    Never holds credentials. Off-site encryption via owner runbook.
    Thresholds: WARN=2h, ERROR=26h, CRIT=72h.
