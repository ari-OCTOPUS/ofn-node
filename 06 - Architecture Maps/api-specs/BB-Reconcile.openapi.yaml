openapi: 3.0.3
info:
  title: BB-Reconcile — Offline Payment-to-Attribution Matcher
  version: 2.0.0
  description: |
    Reconcile.py matches payments from human-dropped CSVs against attribution claims.
    NO bank API, NO scrape, NO network. Input: _ops/reconcile/*.csv with columns
    date, amount_aud, lead_id, source.
    Conservative fail-closed rule: match only CONFIRMED when all four hold —
    lead_id exists, attribution in CLAIMED state, amount match (exact or sum of rows),
    payment date within 7-day window.
    v2: partial payment support — multiple CSV rows per lead_id sum-matched against claim_amount.
  contact:
    name: Octopus System
  x-invariant:
    - I1: append-only (writes reconcile-latest.json atomically)
    - I6: no hardcoded numbers (AMOUNT_TOL = 0.005 in code, WINDOW from attribution)
    - Propose-only for fitness: only CONFIRMED affects fitness; UNMATCHED never does

servers: []

paths:
  /run:
    post:
      operationId: reconcile.run
      summary: Full reconcile run
      description: |
        Reads CSV rows, groups by lead_id, checks state/amount/window, confirms matches.
        Writes reconcile-latest.json atomically via LockedJson.
      parameters:
        - name: reconcile_dir
          in: query
          required: false
          schema:
            type: string
          description: Override CSV directory (default _ops/reconcile)
        - name: write
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Reconcile report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileReport"
      x-python-signature: |
        def run(reconcile_dir=None, write: bool = True) -> dict

  /readRows:
    get:
      operationId: reconcile._read_rows
      summary: Read all CSV rows from reconcile directory
      description: |
        Reads all *.csv files with utf-8-sig encoding. Adds _file and _line metadata.
      parameters:
        - name: reconcile_dir
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: CSV rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CSVRow"
      x-python-signature: |
        def _read_rows(reconcile_dir=None) -> list[dict]

components:
  schemas:
    CSVRow:
      type: object
      required: [date, amount_aud, lead_id, source, _file, _line]
      properties:
        date:
          type: string
        amount_aud:
          type: string
        lead_id:
          type: string
        source:
          type: string
        _file:
          type: string
        _line:
          type: integer

    ConfirmedMatch:
      type: object
      required: [attribution_id, cell, amount_aud, n_payments]
      properties:
        attribution_id:
          type: string
        cell:
          type: string
        amount_aud:
          type: number
        n_payments:
          type: integer

    UnmatchedRow:
      type: object
      required: [date, amount_aud, lead_id, source, _file, _line, reason]
      properties:
        date:
          type: string
        amount_aud:
          type: string
        lead_id:
          type: string
        source:
          type: string
        _file:
          type: string
        _line:
          type: integer
        reason:
          type: string
          enum:
            - no-lead_id
            - unknown-lead_id
            - double-claim
            - in-conflict
            - not-claimed
            - bad-amount
            - amount-mismatch
            - out-of-window
            - cohort-partial-out-of-window

    ReconcileReport:
      type: object
      required: [ts, rows_read, confirmed, unmatched, double_claims, attribution_coverage, revenue_by_cell, note]
      properties:
        ts:
          type: string
          format: date-time
        rows_read:
          type: integer
        confirmed:
          type: array
          items:
            $ref: "#/components/schemas/ConfirmedMatch"
        unmatched:
          type: array
          items:
            $ref: "#/components/schemas/UnmatchedRow"
        double_claims:
          type: array
          items:
            type: object
        attribution_coverage:
          type: number
          nullable: true
        revenue_by_cell:
          type: object
          additionalProperties:
            type: number
        note:
          type: string
          example: "فقط CONFIRMEDِ match‌خورده به fitness می‌رود؛ UNMATCHED/CONFLICT هرگز"

  securitySchemes:
    InternalModule:
      type: apiKey
      in: header
      name: X-Internal-Module
      description: Internal reconciliation access only

security:
  - InternalModule: []

x-octopus-metadata:
  file_path: _ops/budget/reconcile.py
  invariant_tags: [I1, I6]
  fail_closed: true
  propose_only: false
  side_effects: true
  notes: |
    reconcile.py is the ONLY writer of CONFIRMED/ATTRIBUTED states.
    Agents NEVER write CONFIRMED. Fitness only reads CONFIRMED/ATTRIBUTED.
    Partial payment support in v2: multiple CSV rows per lead_id.
