# WAVE-GATES.yaml -- گیت‌های عبور موج‌های رشته‌پژوهش (از متن برنامه + یک گیت تازه برای ورودی‌های گمشده)
# هر موج فقط وقتی «بسته» می‌شود که همهٔ فیلدهای گیتش true باشند؛ در غیر این صورت صریحاً open می‌ماند.

WAVE0_SETUP_GATE:            # تازه -- قبل از شروع موج A
  sprint_folders_created: true          # انجام شد 2026-08-18
  evidence_manifest_complete: true      # انجام شد (با وضعیت NOT FOUND صریح)
  megaprompts_01_to_10_available: false # مسدودکننده -- در مخزن وجود ندارند؛ باید توسط مالک عرضه شوند
  octopus_200_checklist_available: false   # NOT FOUND
  obsidian_rebuild_megaprompt_available: false  # NOT FOUND
  board_state_current: true             # تصحیح شد در CURRENT-CONSTRAINTS.md
  gate_note: >
    موج A تا رسیدن مگاپرامت‌های 01-10 شروع نمی‌شود. دو ورودی دیگر (چک‌لیست 200،
    Obsidian-Rebuild) اختیاری برای شروع R01 نیستند ولی باید یا عرضه شوند یا
    صریحاً با علامت WAIVED_BY_OWNER حذف شوند.

R01_GATE:
  canonical_repo_identified: true_or_explicitly_unknown
  canonical_vault_identified: true_or_explicitly_unknown
  gap_001_definition: owner_confirmed_or_proposal_labeled
  board_state_not_fabricated: true
  contradictions_registered: true
  external_effects: 0
  note: >
    gap_001_definition از قبل owner_confirmed است (D5، 2026-08-17)؛ R01 فقط
    وضعیت formalization (امضای معلق) را گزارش می‌کند و تعریف جدید نمی‌سازد.
    board_state_not_fabricated یعنی وضعیت واقعی سه نود از
    CURRENT-CONSTRAINTS.md، نه فرض UNKNOWN/UNREACHABLE_NO_LAN سراسری.

WAVE_B_GATE:
  contract_catalogue_complete: true
  governance_invariants_complete: true
  canonical_write_authorities_defined: true
  prediction_backdating_test_specified: true
  owner_shutdown_supremacy_tested_in_design: true
  unresolved_authority_conflicts: 0

TWIN_GATE:
  physical_network_packets: 0
  detected_unreported_event_loss: 0
  unauthorized_actions: 0
  policy_violations: 0
  prediction_records_immutable: true
  held_out_tests_present: true
  baseline_comparisons_present: true
  reusable_code_target: ">=80%"

SPRINT_LAW:                  # قانون حاکم بر کل رشته
  coding_started: false               # تا خروجی R10 + تأیید CARD-001
  project_files_modified_in_research_waves: false
  one_card_at_a_time_on_critical_path: true
  external_effects: 0
  scheduler_interaction: ZERO
  convergence_is_not_evidence: true   # توافق Kimi+GLM ⇐ CLAIMED فقط
