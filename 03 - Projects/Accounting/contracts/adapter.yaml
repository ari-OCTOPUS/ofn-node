# ===================================================================
# ADAPTER — رابط read-only اتصال Accounting به مغز مرکزی
# ⚠️ هیچ lodge، هیچ پرداخت. هر write فقط از مسیر verdict.
# ===================================================================
adapter_version: "1.0"
tenant: "Accounting"
autonomy_floor: "read-only (until Security Gate + tax agent selected)"

interfaces:
  status:
    method: "read"
    desc: "وضعیت قلب مالی + کدام جریان‌های درآمدی متصل‌اند"
    returns: "{ gate_open, register_complete_pct, ledger_active, bas_next_due }"

  report:
    method: "read"
    params: "period"
    desc: "گزارش P&L/BAS دوره‌ای (draft، [Unverified — accountant to confirm])"
    returns: "{ income_by_source, expenses_by_category, gst_payable, bas_draft }"

  compliance_scan:
    method: "read"
    desc: "اسکن انطباق: Div 7A، no-ABN(>$75)، cash(>$10k)، BAS due"
    returns: "list[flag:{type, amount, entity_hash, severity}]"

  audit:
    method: "read"
    desc: "تاریخچهٔ verdictها و دسته‌بندی‌های تأییدشده"
    returns: "list[decision]"

hard_gated_actions:
  - "lodge to ATO/ASIC (FORBIDDEN — function does not exist)"
  - "move money / pay anything"
  - "change any tax rule from [Unverified] to confirmed (accountant only)"
  - "write to ledger without human verdict"
  - "send PII to any LLM"

autonomous_allowed: []
  # فعلاً هیچ‌چیز — Accounting کاملاً propose-only است تا حسابدار انتخاب شود

forbidden:
  - "lodge_to_ato()"
  - "move_money()"
  - "pay()"
  - "display/copy/transmit PII (names, amounts, account numbers)"
  - "change GST formula (total/11 is correct; amount*0.10 is the BUG)"

# ── نقاط اتصال cross-project (یک خط append در لاگ هر پروژه هنگام درآمد) ──
upstream_tax_touchpoints:
  lead:
    trigger: "invoice issued / payment received"
    action: "append to Accounting ledger: business income + GST 10%"
  mining:
    trigger: "coin mined (received in wallet)"
    action: "append: business income at AUD value at moment of receipt + electricity"
    execution: "INFORM only — financial HARD_STOP (D-10)"
  crypto_etoro:
    trigger: "trade closed"
    action: "append: CGT event (personal, not Pty Ltd — pending structural decision)"
  project_f:
    trigger: "platform credit"
    action: "append: creator income, A's 50% share only, code 'Project-F' (privacy)"
  ziman:
    trigger: "gift sale"
    action: "append: income + COGS"
