# edges.yaml — Admissible edge definitions for QuantumAlphaBot
# =============================================================
# Governing principles: E-0 through E-3 (REMEDIATION doc, EDGE-LAYER extension).
#
# E-0: NO_EDGE is the default.
#       edge_present is PROVEN from MEASURED inputs; never assumed.
#       Any required_input with status != MEASURED → edge_present = False.
#
# E-1: Every edge has BOTH a computable signature AND a computable kill condition.
#       No edge may be set by LLM or manual override.
#
# E-2: PATIENCE is an enabler only. It relaxes liquidity/horizon kill conditions
#       of other edges; it cannot produce edge_present alone.
#
# E-3: Non-admissible edges that can NEVER be assigned:
#       latency_hft, generic_research, narrative_timing
#
# Structure per edge:
#   domain         : category string
#   signature      : list of named boolean conditions (ALL must be True)
#   required_inputs: fields consumed by signature/kill, each with source + type
#                    status must == MEASURED for edge_present to be True
#   kill           : list of named conditions (ANY True → edge_present = False)
#   sizing         : CORE | SPECULATIVE
#   horizon        : long | medium | short
#   notes          : rationale

edges:

  ENERGY:
    domain: mining
    notes: >
      Structural edge from below-market power cost (<= $0.05/kWh) and ARM/CPU
      mining fleet. Admissible only for CPU/ARM-friendly algorithms where our
      fleet can capture a meaningful share of block rewards at profitable cost.
      ASIC-class or GPU-dominated algorithms are a kill — HACash demonstrated
      that ARM cannot compete once GPU farms enter.
    signature:
      - name: algo_runnable
        description: "coin's consensus algorithm is in RUNNABLE_ALGOS list"
        condition: "algo.value in config.RUNNABLE_ALGOS"
        required_input: algo

      - name: cost_below_price
        description: "all-in mining cost per coin < coin_price * (1 - MARGIN)"
        condition: "all_in_cost_per_coin < coin_price.value * (1 - config.ENERGY_MARGIN)"
        required_inputs: [coin_price, network_hashrate, fleet_hashrate_config, power_cost_kwh_config]
        derived: "all_in_cost_per_coin = (power_cost_kwh_config * kWh_per_coin) + amortized_hw_per_coin"

      - name: fleet_share_viable
        description: "fleet hashrate share of network >= MIN_FLEET_SHARE"
        condition: "fleet_hashrate_config / network_hashrate.value >= config.MIN_FLEET_SHARE"
        required_inputs: [network_hashrate, fleet_hashrate_config]

    required_inputs:
      algo:
        source: CoinGecko (detail.hashing_algorithm) OR chain_API
        type: str
        status_if_absent: MISSING
      network_hashrate:
        source: CoinGecko (/coins/{id}) OR chain_API
        type: float   # H/s
        status_if_absent: MISSING
      coin_price:
        source: CoinGecko (market data)
        type: float   # USD
        status_if_absent: MISSING
      fleet_hashrate_config:
        source: config.py (FLEET_HASHRATE_HS)
        type: float   # H/s
        status: MEASURED  # always MEASURED (operator-owned config)
      power_cost_kwh_config:
        source: config.py (POWER_COST_KWH)
        type: float   # USD/kWh
        status: MEASURED  # always MEASURED

    kill:
      - name: asic_dominated
        condition: "algo.value in config.ASIC_ALGOS"
        description: "ASIC-class algo — our ARM fleet cannot compete on cost"

      - name: cost_exceeds_price
        condition: "all_in_cost_per_coin >= coin_price.value"
        description: "mining is unprofitable at current price/hashrate"

      - name: gpu_farm_dominated
        condition: "gpu_share_estimated > config.MAX_GPU_DOMINANCE"
        description: "GPU farms dominate; ARM cannot win on efficiency (HACash pattern)"

    sizing: CORE
    horizon: long

  DISLOCATION:
    domain: forensic_mispricing
    notes: >
      Edge from forensic alpha: a coin whose price has dislocated due to a
      FALSIFIABLE fear (rug scare, panic drawdown uncorrelated with fundamentals)
      but whose on-chain structure is clean. The edge is the information gap
      between panicking market participants and our forensic data.
      Kill fires if forensics flag ANYTHING — a justified dislocation is
      correct pricing, not an opportunity.
    signature:
      - name: forensics_clean
        description: "no forensic vetoes — LP locked, no hooks, no cluster"
        condition: "forensic_vetoed == False AND len(forensic_reasons) == 0"
        required_inputs: [forensic_vetoed, forensic_reasons]

      - name: dislocation_present
        description: "price dislocated beyond floor within recent window"
        condition: "max_dd_pct < -config.DD_FLOOR AND price_7d_pct > config.RECOVERY_SIGNAL"
        required_inputs: [max_dd_pct, price_7d_pct]

      - name: fear_falsifiable
        description: >
          The fear driving the dislocation is provably unfounded by our data.
          Currently: drawdown occurred while holder_count INCREASED (organic sell,
          not insider dump) AND no GoPlus minting/proxy change detected.
          fear_type must be one of {PANIC_SELL, SECTOR_CONTAGION} — not INSIDER_DUMP.
        condition: "fear_type in {PANIC_SELL, SECTOR_CONTAGION} AND holder_growth_during_dd >= 0"
        required_inputs: [fear_type, holder_count_delta_during_dd]

    required_inputs:
      forensic_vetoed:
        source: ScoutForensics (forensic_vetoed field)
        type: bool
        status_if_absent: MISSING
      forensic_reasons:
        source: ScoutForensics (forensic_reasons list)
        type: list
        status_if_absent: MISSING
      max_dd_pct:
        source: GemHunter (price history)
        type: float
        status_if_absent: MISSING
      price_7d_pct:
        source: GemHunter (market data)
        type: float
        status_if_absent: MISSING
      fear_type:
        source: EdgeClassifier (derived from holder_count_delta + on-chain signals)
        type: enum[PANIC_SELL, SECTOR_CONTAGION, INSIDER_DUMP, UNKNOWN]
        status_if_absent: MISSING
      holder_count_delta_during_dd:
        source: HolderChecker (historical holder count comparison)
        type: int   # positive = holders grew during drawdown
        status_if_absent: MISSING

    kill:
      - name: forensics_flag_anything
        condition: "forensic_vetoed == True OR len(forensic_reasons) > 0"
        description: "any forensic flag means dislocation may be correct pricing"

      - name: no_dislocation
        condition: "max_dd_pct >= -config.DD_FLOOR"
        description: "coin at fair price — this is beta, not mispricing"

      - name: fear_justified
        condition: "fear_type == INSIDER_DUMP OR fear_type == UNKNOWN"
        description: "dislocation cannot be falsified — may be correct pricing"

    sizing: SPECULATIVE
    horizon: medium

  YIELD:
    domain: infrastructure_operation
    notes: >
      Edge from operating blockchain infrastructure (validator, full node,
      storage provider) at our cost basis. Profitable only when reward_rate
      clears our opex. Capital-gated or permissioned setups are a kill.
    signature:
      - name: node_runnable_on_fleet
        description: "node requirements within fleet hardware spec"
        condition: "node_min_ram_gb <= config.FLEET_RAM_GB AND node_min_disk_gb <= config.FLEET_DISK_GB"
        required_inputs: [node_min_ram_gb, node_min_disk_gb]

      - name: reward_exceeds_opex
        description: "expected reward value per period > operating cost"
        condition: "reward_value_usd_per_day > opex_usd_per_day"
        required_inputs: [reward_rate, coin_price, power_draw_watts_config]
        derived: "opex_usd_per_day = (power_draw_watts_config / 1000) * 24 * power_cost_kwh_config"

    required_inputs:
      node_min_ram_gb:
        source: chain_docs / chain_API
        type: float
        status_if_absent: MISSING
      node_min_disk_gb:
        source: chain_docs / chain_API
        type: float
        status_if_absent: MISSING
      reward_rate:
        source: chain_API (staking/validator rewards endpoint)
        type: float  # tokens per day per node
        status_if_absent: MISSING
      coin_price:
        source: CoinGecko
        type: float
        status_if_absent: MISSING
      power_draw_watts_config:
        source: config.py (NODE_POWER_DRAW_W)
        type: float
        status: MEASURED

    kill:
      - name: rewards_below_opex
        condition: "reward_value_usd_per_day <= opex_usd_per_day"
        description: "operating the node costs more than it earns"

      - name: capital_gated
        condition: "min_stake_usd > config.MAX_STAKE_CAPITAL"
        description: "capital requirement exceeds our allocation limit"

      - name: permissioned
        condition: "is_permissioned_validator == True"
        description: "joining is not open — cannot deploy"

    sizing: CORE
    horizon: long

  PATIENCE:
    domain: enabler
    edge_present: false   # NEVER True alone (E-2)
    notes: >
      Patience (small position vs capital, no time-bound catalyst) is an
      ENABLER that relaxes liquidity/horizon kill conditions of ENERGY,
      DISLOCATION, and YIELD. It does NOT produce edge_present on its own.
      A NO_EDGE coin remains NO_EDGE even with PATIENCE active.
    effect:
      - relaxes: liquidity_floor (min_pool_tvl reduced by PATIENCE_LIQUIDITY_FACTOR)
      - relaxes: horizon_limit (extended by PATIENCE_HORIZON_EXTENSION_DAYS)
    activation_conditions:
      - position_size_usd < config.PATIENCE_MAX_POSITION_USD
      - no_time_bound_catalyst: true
    signature: []   # intentionally empty — no signature can produce edge_present

# ── Config constants consumed by edge evaluation ──────────────────────────────
config_constants:
  RUNNABLE_ALGOS:
    - yespower        # Best ARM algo — 1500 H/s per OPi5 Pro. Sugarchain, Myriad
    - yespowerr16     # C64 Chain variant — ~1400 H/s per OPi5 Pro
    - gr              # Ghostrider — CPU-only, ~450 H/s per OPi5 Pro
    - minotaur        # CPU-friendly hybrid — ~800 H/s per OPi5 Pro
    - argon2d         # memory-hard, CPU-friendly — ~600 H/s per OPi5 Pro
    - cryptonight     # classic CryptoNight — ~300 H/s per OPi5 Pro
    - scrypt          # Litecoin/Dogecoin, ARM-viable at small scale — ~800 H/s
    - rx/c64          # RandomX/C64 — ARM weak ~120 H/s (borderline)
    - randomx         # Monero — ARM only ~110 H/s vs Ryzen ~15k; include but low priority
    - kawpow          # GPU algo; ARM borderline ~200 H/s; only if gpu_farm_share low
    - octopus         # Conflux GPU algo; ARM ~150 H/s; not viable at scale

  # NOTE on RandomX reality: OPi5 Pro (A76 core) ≈ 110-150 H/s per node.
  # 9 workers = ~990-1350 H/s total. Monero network hashrate ~3 GH/s.
  # Fleet share ≈ 0.00004% — below MIN_FLEET_SHARE. RandomX will fail ENERGY edge.
  # Yespower coins with smaller networks are the viable targets.

  ASIC_ALGOS:
    - sha256           # Bitcoin — ASIC-dominated
    - scrypt_asic      # Litecoin ASIC tier (detect by hashrate/price ratio)
    - ethash           # Ethereum (now PoS, historical)
    - equihash         # Zcash — ASIC miners deployed since 2018
    - blake2s          # ASIC-optimised

  # ── Fleet hardware specs (Orange Pi 5 Plus + 9× OPi5 Pro) ──────────────────
  # Main:    OPi5+  (RK3588,  4×A76+4×A55, 16GB RAM, ~1800 H/s yespower — not mining)
  # Workers: OPi5 Pro (RK3588S, 4×A76+4×A55, 8-16GB RAM, ~1500 H/s yespower each)
  # Watchdog: RPi3B (1GB RAM, ~280 H/s yespower — monitoring only)
  # Sensors: 10× ESP32 (microcontrollers — no mining)
  # Accel:   2× FPGA AX7 (SHA/entropy — future)
  #
  # Per-algo fleet hashrate (9 workers × algo rate × 0.85 overhead):
  #   yespower:  9 × 1500 × 0.85 = 11,475 H/s
  #   gr:        9 ×  450 × 0.85 =  3,443 H/s
  #   minotaur:  9 ×  800 × 0.85 =  6,120 H/s
  #   randomx:   9 ×  110 × 0.85 =    841 H/s  (NOT viable — below MIN_FLEET_SHARE)

  FLEET_HASHRATE_HS: 11475    # yespower (primary algo) — updated from ARM benchmarks
  FLEET_RAM_GB: 16            # per-worker OPi5 Pro (8GB min, 16GB max config)
  FLEET_DISK_GB: 256          # per-worker eMMC/NVMe
  FLEET_TOTAL_RAM_GB: 160     # 1× OPi5+(16GB) + 9× OPi5Pro(16GB) + RPi(1GB)
  FLEET_TOTAL_DISK_GB: 2500   # rough: 1× 2TB NVMe on main + workers eMMC
  NODE_POWER_DRAW_W: 150      # OPi5+ at load (node operation)
  WORKER_POWER_DRAW_W: 10     # OPi5 Pro per unit at mining load (5-15W typical)
  POWER_COST_KWH: 0.05        # USD/kWh — structural edge floor
  ENERGY_MARGIN: 0.20         # require 20% margin above mining cost
  MIN_FLEET_SHARE: 0.0001     # 0.01% minimum network share
  MAX_GPU_DOMINANCE: 0.85     # >85% GPU → ARM cannot compete

  # Per-algo hashrate map (used by hashrate_oracle + edge_classifier)
  ARM_HASHRATE_PER_WORKER:
    yespower:    1500
    yespowerr16: 1400
    gr:           450
    minotaur:     800
    argon2d:      600
    cryptonight:  300
    scrypt:       800
    rx/c64:       120
    randomx:      110
    kawpow:       200
    octopus:      150

  DD_FLOOR: 35.0                 # % drawdown required for DISLOCATION signature
  RECOVERY_SIGNAL: -5.0          # 7d price must be > -5% (not still crashing)

  MAX_STAKE_CAPITAL: 10000       # USD — capital gate for YIELD
  PATIENCE_MAX_POSITION_USD: 500
  PATIENCE_LIQUIDITY_FACTOR: 0.5
  PATIENCE_HORIZON_EXTENSION_DAYS: 90

  NON_ADMISSIBLE_EDGES:          # E-3: can NEVER be assigned
    - latency_hft
    - generic_research
    - narrative_timing
