# -------- آستانه‌های تصمیم --------
thresholds:
  strong_entry: 70
  moderate_entry: 45
  weak_entry: 25

# -------- فازبندی زمانی --------
phases:
  phase_0:
    name: calibration
    min_days: 10
    max_days: 18
    min_volatility_samples: 10

  phase_1:
    name: deployment
    duration_months: 6

  phase_2:
    name: rebalancing
    rebalance_alert_pct: 15

# -------- مدیریت ریسک --------
risk:
  max_drawdown_tolerance: 0.60
  price_alert_pct: 5
  leverage_allowed: false

# -------- Big Scenarios --------
scenarios:
  quantum_threat:
    status: emerging
    score_modifier:
      XMR:  +8
      ZEC:  +5
      XEL:  +6                       # DAG privacy — مقاوم‌تر از ZEC
      DIL:  +12                      # quantum-resistant narrative مستقیم
      CORE: -3                       # public chain — در معرض خطر
      TAO:  -1
    alert_message: "⚛️ سناریوی کوانتومی فعال: DIL/XMR/XEL/ZEC امتیاز بیشتر دارند"

  fiat_erosion:
    status: active
    score_modifier:
      CORE: +7                       # BTC-correlated — بهترین hedge
      XMR:  +4                       # hard money + privacy
      XEL:  +3
      TAO:  +2
      DIL:  0
      USDC: 0
    alert_message: "📉 سناریوی فرسایش فیات: CORE لنگر اصلی — BTC-correlated"

  regulatory_crackdown:
    status: emerging
    score_modifier:
      XMR:  -10
      ZEC:  -7
      XEL:  -5                       # privacy = ریسک delisting
      CORE: +2
      TAO:  +1
      USDC: +2
    alert_message: "⚖️ سناریوی سرکوب رگولاتوری: XMR/ZEC/XEL ریسک delisting دارند"

