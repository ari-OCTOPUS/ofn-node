# -------- تخصیص سرمایه --------
capital:
  total_aud: 3500
  currency: AUD

assets:
  CORE:
    name: CoreDAO
    allocation_pct: 30
    pole: hedge
    signals: [price, social]        # CryptoQuant فقط BTC/ETH — onchain ندارد
    dca_tranches: 4
    coingecko_id: "coredao"
    hypothesis: >
      BTC-correlated L1 با native BTC staking.
      سه موتور: ۱) BTC بره ۲۰۰K → CORE خودبخود بالا.
      ۲) staking yield از روز اول. ۳) نقدینگی بالا.
    expected_6m: "2x-4x خوشبینانه | 30-40% ضرر بدبینانه"

  XEL:
    name: Xelis
    allocation_pct: 15
    pole: privacy
    signals: [price, social]
    dca_tranches: 3
    coingecko_id: "xelis"
    purchase_path: "undecided"
    hypothesis: >
      DAG-based privacy chain با RandomX PoW.
      Catalyst-dependent: listing بزرگ → 5x-8x.
      بدون catalyst → 0-20% نوسان.
    expected_6m: "3x-8x اگه catalyst | 0-20% اگه نیاد"

  XMR:
    name: Monero
    allocation_pct: 12
    pole: privacy
    signals: [price, social]
    dca_tranches: 3
    purchase_path: "undecided"

  ZEC:
    name: Zcash
    allocation_pct: 8
    pole: privacy
    signals: [price, social]
    dca_tranches: 3
    purchase_path: "undecided"

  TAO:
    name: Bittensor
    allocation_pct: 10
    pole: ai
    signals: [price, social]
    dca_tranches: 3
    coingecko_id: "bittensor"
    hypothesis: >
      Decentralized AI network با subnet ecosystem.
      AI narrative + رشد subnet tokens.
    expected_6m: "1.5x-3x محتاطانه"

  DIL:
    name: Dilithion
    allocation_pct: 5
    pole: quantum
    signals: [price]                  # داده بسیار محدود
    dca_tranches: 2
    coingecko_id: "dilithion"
    hypothesis: >
      Quantum-resistant narrative play برای افق ۲۰۳۰.
      در ۶ ماه احتمالاً sideways. ورود زودرس.
    expected_6m: "80% احتمال بین 30%- و 30%+"
    long_term: true

  MEMECOIN:
    name: Memecoin Rotation
    allocation_pct: 5
    pole: speculative
    signals: [price, social]
    dca_tranches: 1
    monthly_rotation: true
    current_pick: "undecided"         # ← هر ماه اینجا آپدیت کن
    hypothesis: >
      High-variance speculation slot. ماهانه تعویض.
      یا 10x-50x یا تقریباً صفر — وسط نداره.
    expected_6m: "10x-50x یا صفر"

  USDC:
    name: USD Coin
    allocation_pct: 10
    pole: stable
    signals: []
    watch_regulatory: true

  USDT:
    name: Tether
    allocation_pct: 5
    pole: stable
    signals: []
    watch_regulatory: true

# -------- وزن‌دهی امتیازدهی --------
scoring_weights:
  # legacy keys — backward compatible
  BTC_ETH:
    drawdown:    0.30
    ma_position: 0.20
    fear_greed:  0.15
    onchain:     0.20
    social:      0.15

  XMR_ZEC:
    drawdown:    0.40
    ma_position: 0.25
    fear_greed:  0.15
    social:      0.20

