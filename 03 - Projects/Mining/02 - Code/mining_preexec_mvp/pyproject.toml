[project]
name = "mining-preexec-mvp"
version = "0.1.0"
description = "Read-only pre-execution MVP for the Mining project: governance gates, hardware registry validation, coin scouting reports."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1"
]

[project.scripts]
mining-preexec = "mining_preexec_mvp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
