name: wlos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wlos
      POSTGRES_PASSWORD: wlos
      POSTGRES_DB: wlos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wlos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://wlos:wlos@postgres:5432/wlos?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "apps/telegram-bot/src/main.ts"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://wlos:wlos@postgres:5432/wlos?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "apps/telegram-bot/src/worker.ts"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://wlos:wlos@postgres:5432/wlos?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "apps/api/src/main.ts"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://wlos:wlos@postgres:5432/wlos?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Nightly logical backup (02:30 Sydney). Copy ./backups offsite (S3/B2) — see docs/deployment.md.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: wlos
      TZ: Australia/Sydney
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'while true; do
        now=$$(date +%H:%M);
        if [ "$$now" = "02:30" ]; then
          pg_dump -h postgres -U wlos -d wlos -F c -f /backups/wlos-$$(date +%Y%m%d).dump && echo "backup done";
          find /backups -name "*.dump" -mtime +30 -delete;
          sleep 90;
        fi;
        sleep 30;
      done'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
