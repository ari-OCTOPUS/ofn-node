# ===================================================================
# ADAPTER — رابط Crypto-eToro به مغز مرکزی (langar)
# read-only tenant adapter. keys OFF-BOX (D-11).
# ===================================================================
adapter_version: "1.0"
tenant: "Crypto-eToro"
autonomy_floor: "INFORM / alert-only — no trade execution path exists"

interfaces:
  status:
    method: "read"
    returns: "{ gate_open, edge_classifier_wired, positions_count, paper_decisions_today }"

  positions:
    method: "read"
    desc: "Portfolio Registry — positions with thesis + invalidation + exit_rules"
    returns: "list[position:{symbol, size_pct, thesis, invalidation, exit_rules_approved}]"

  scout_report:
    method: "read"
    desc: "آخرین خروجی scouting (QuantumAlphaBot) — paper_ledger"
    returns: "list[scout_result:{coin, decision, reasoning, edge_present}]"

  alerts:
    method: "read"
    desc: "هشدارهای فعال: exit_rule trigger، binary event approaching، threshold breach"
    returns: "list[alert:{type, symbol, level, action_proposed}]"

  report:
    method: "read"
    params: "period"
    desc: "گزارش دوره‌ای: scout decisions accuracy، alert hit/miss"
    returns: "{ scouts_run, paper_pnl, alerts_correct_pct }"

hard_gated_actions:
  - "any BUY (always human, any amount)"
  - "any optional SELL (human verdict)"
  - "any change to exit_rules or Standing Rules"
  - "any access to exchange keys (D-11 — OFF-BOX, human co-sign)"

autonomous_allowed:
  # فقط بعد از Security Gate + Anchor Ledger + registered exit_rules:
  - "SELL/TRIM per pre-registered exit_rules (with: ledger entry + instant Telegram notify)"
  # فعلاً مسیر اجرای خودکار وجود ندارد → همه دستی

forbidden:
  - "auto_buy()"
  - "access_exchange_keys()"  # D-11
  - "llm_in_command_path()"   # P11
  - "bypass cross-model check (D-09)"
