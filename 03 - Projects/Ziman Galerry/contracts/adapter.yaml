# ===================================================================
# ADAPTER — رابط read-only اتصال Ziman به مغزِ مرکزی
# هر write فقط از مسیر deploy pipeline گیت‌شده (D-20).
# ===================================================================
adapter_version: "1.0"
tenant: "Ziman"

# رابط‌های مجاز (همه read-only تا Security Gate باز شود)
interfaces:
  status:
    method: "read"
    desc: "وضعیت پروژه + کدام organs فعال"
    returns: "{ phase, capacity_ceiling, drafts_pending, sales_count, tests_green }"

  logs:
    method: "read"
    params: "n (تعداد آخرین رویداد)"
    desc: "آخرین n رویداد از DecisionLog/Strategy-DecisionLog"
    returns: "list[event]"

  report:
    method: "read"
    params: "period (مثلاً 'week' یا 'month')"
    desc: "گزارش دوره‌ای: drafts تولیدشده، funnel metrics، capacity usage"
    returns: "{ drafts_count, funnel:{responses,conversions,revenue}, capacity_used_pct }"

  audit:
    method: "read"
    desc: "تاریخچهٔ تصمیمات و verdictها"
    returns: "list[decision]"

# ── اکشن‌های write (همه hard-gated — نیازمند verdict) ───────────
hard_gated_actions:
  - "publish any post/reel to a platform"
  - "spend any credit (Higgsfield/Ads)"
  - "create any public account"
  - "change capacity ceiling (D4)"
  - "change brand voice"

# ── مجاز خودکار (بعد از Security Gate) ──────────────────────────
autonomous_allowed: []
  # فعلاً هیچ‌چیز — Ziman propose-only است

# ── ممنوع مطلق ──────────────────────────────────────────────────
forbidden:
  - "auto-post to any platform"
  - "auto-spend credits"
  - "ship perishable hamper (C4) outside local area"
  - "exceed capacity ceiling"
