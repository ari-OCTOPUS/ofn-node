# PHOTO-PRODUCT-MAP-SCHEMA.yaml — schema_version: photo_product_map.v1
# Read-only protocol: originals in `08 - Assets/Photos/WhatsApp-2026/` are
# NEVER moved, renamed, or edited. Mapping = metadata only.

schema_version: "photo_product_map.v1"
map_id: ""                 # ZM-PHOTO-MAP-YYYYMMDD
created_at: ""

rules:
  move_originals: false
  rename_originals: false
  read_scope: "08 - Assets/Photos/WhatsApp-2026/ ONLY"   # no other image folders (privacy)
  assign_requires: "owner confirmation OR visible product match evidence"
  unknown_allowed: true    # a photo may stay unmapped — never invent identity

entries:
  - photo_path: ""         # relative vault path (original location)
    sha256: ""             # provenance hash
    product_id: null       # ZM-Cx-NNNN | null (unmapped)
    match_evidence: ""     # "owner said X" | "matches card title/variation"
    match_class: "UNKNOWN" # OWNER_CONFIRMED | VISUAL_MATCH_PROPOSED | UNKNOWN
    privacy_flag: false    # true → exclude (faces / personal content) & stop

governance:
  canonical: false
  updated_at: ""
