# PRODUCT-CARD-SCHEMA.yaml — schema_version: product_card.v1
# ZIMAN · Phase 2 · candidate schema (additive, not yet canonical)
# Invariant: available_to_promise = max(qty_on_hand - qty_reserved, 0)
#            …only computed when quantities are measured AND fresh (measured_at set).

schema_version: "product_card.v1"
product_id: ""            # ZM-C{1..4}-NNNN — stable, never reused
family_id: ""             # C1 | C2 | C3 | C4
title: ""
status: "draft"           # draft | active | reserved | sold | archived

classification:
  product_type: ""
  variation: ""
  personalisable: false
  perishable: false       # MUST be true for C4

inventory:
  quantity_on_hand: null  # null = not measured (never assume 0 or 50)
  quantity_reserved: 0
  available_to_promise: null   # computed only if on_hand measured & fresh
  measured_at: null
  evidence_class: "UNKNOWN"    # OWNER_INPUT | VERIFIED_FACT | INFERENCE | UNKNOWN

commercial:
  cost_aud: null
  public_price_aud: null
  price_status: "unknown"      # unknown | draft | owner_approved
  # invariant: public_price_aud may be non-null ONLY if price_status == owner_approved

fulfilment:
  policy: "unknown"            # local_only | pickup | shippable | unknown
  # invariant: family_id == C4 → policy in (local_only, pickup)
  lead_time_days: null
  delivery_promise_authority: false   # always false for agents

assets:
  photo_paths: []              # relative vault paths; originals NEVER moved/renamed
  photo_hashes: []             # sha256 of file bytes — provenance

evidence:
  source_pointers: []          # e.g. "STATUS.md#numbers", "owner-msg-2026-07-12"
  confidence: 0.0

governance:
  canonical: false             # true only after Memory Curator + owner gate
  owner_approved: false
  updated_at: ""
