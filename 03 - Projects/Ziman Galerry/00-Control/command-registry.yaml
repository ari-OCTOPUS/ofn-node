# ─────────────────────────────────────────────────────────────────────────────
# رجیستریِ واحدِ فرمان‌ها — تنها منبعِ حقیقتِ سطحِ فرمانِ حاکمیتِ زیمان.
# مصرف‌کننده‌ها: هر دو adapterِ تلگرام (control-brain/adapters/telegram_bot.py و
# ziman-agent/ziman/telegram_adapter.py) و داشبوردِ فقط-خواندنی.
# منبع: 00-Control/ZIMAN-DESIGN-RECONCILIATION.md (بخشِ R1 · حلِ C3/C4).
#
# نردبانِ ریسک: GREEN < YELLOW < ORANGE < RED  (هم‌تراز با core/governance.py)
# قاعدهٔ NC-3: هیچ نقشِ ایجنتی (از جمله OCTOPUS) اجازهٔ approve ندارد.
# RED فقط با owner (SahebZiman). فرمانِ ناشناخته → fail-closed (deny / RED).
# ─────────────────────────────────────────────────────────────────────────────
version: 1
risk_ladder: [GREEN, YELLOW, ORANGE, RED]

groups:
  read_status:          # OCTOPUS/VIEWER · فقط-خواندنی · خودکار
    risk: GREEN
    mode: auto
    roles: [owner, admin, operator, viewer, agent]
    commands: [/status, /summary, /health, /risks, /projects, /queue, /incidents, /focus]

  data_catalog:         # propose-only · لاگ + خلاصه (هیچ اجرا/ارسالی)
    risk: YELLOW
    mode: propose
    roles: [owner, admin, operator]
    commands: [/product, /photo, /variant, /reconcile, /catalog]

  control:              # نیازمندِ approval (تغییرِ خط‌مشی/حالت)
    risk: ORANGE
    mode: approval
    roles: [owner, admin]
    commands: [/policy, /pause, /resume, /mode]

  approval:             # SahebZiman only · گیتِ RED
    risk: RED
    mode: red_gate
    roles: [owner]
    commands: [/approve, /reject, /defer, /rollback, /halt_ziman]

# نحوِ canonicalِ تأیید:  /approve ZIM-DEC-YYYYMMDD-NNNN [scope] [artifact_hash]
approval_syntax: "/approve ZIM-DEC-YYYYMMDD-NNNN [scope] [artifact_hash]"

# aliasهای قدیمی /ziman_* → فرمانِ canonical (سازگاریِ عقب‌رو با adapterِ زیمان).
# همه فقط دایجستِ خواندنی‌اند؛ ماهیتِ ریسک از فرمانِ canonical گرفته می‌شود.
aliases:
  /ziman_status: /status
  /ziman_inventory: /summary
  /ziman_products: /product
  /ziman_photos: /photo
  /ziman_experiments: /risks
  /ziman_content: /catalog
  /ziman_decisions: /queue
