# ziman-self.yaml — دستگیره‌های مدلِ خود و ماتریس (مالک به‌ندرت دست می‌زند).
# پیش‌فرض‌ها heuristicِ آغازین‌اند [ESTIMATE]، نه عددِ قطعی. بالاتر = مهم‌تر.
# سندِ کامل: 00-Control/FOUNDATIONS/02-CALCULATION-MATRIX.md

# وزن‌های شش‌سیگنالِ ماتریس (جمعِ وزنی؛ هرکدام روی نامزدِ ۰..۱ اعمال می‌شود)
weights:
  goal_fit: 0.30      # وصل به DIRECTIVE/PRIORITY + بوستِ /focus
  impact: 0.25        # کشیدنِ گلوگاهِ اعتبارسنجی (اولین گفت‌وگو/فروش > محتوا > خانه‌داری)
  readiness: 0.15     # چند درصدِ ورودی‌های لازم حاضرند
  novelty: 0.12       # ضدِ تکرار (افتِ تازگی + «نه»ِ قبلی + mute)
  cost: 0.08          # جریمهٔ هزینه (۰ برای محلیِ رایگان)
  risk_penalty: 0.10  # جریمهٔ ادعای CONFLICT/UNVERIFIED یا F4 الکل بی‌گارد

# آستانهٔ نمایش و سقفِ خروجی
surface_threshold: 0.55     # فقط پیشنهادِ priority >= این به مالک نشان داده می‌شود
max_proposals_per_beat: 1   # پیش‌فرض: فقط بهترین (کم‌نویز)

# سقفِ اختیارِ ADMINِ انسانی در governance (RED همیشه فقط owner)
admin_ceiling: "YELLOW"

# میرایی: وقتی سیستم تحتِ فشار است، محتاط‌تر پیشنهاد بده
damping:
  shadow_on: 0.85           # ضریبِ کاهش وقتی shadow روشن است
  protective_mode: 0.5      # دردِ اُرگانیسم/حالتِ محافظتی
  budget_tight: 0.7         # نزدیکِ سقفِ AU$15

# هدفِ اعتبارسنجی (کفِ north-star برای درصدِ پیشرفت)
validation_target: 10
