# infra-control/docker-compose.yml
# Central infrastructure stack: Traefik (reverse proxy + TLS) + monitoring + control-bot
#
# Start:  docker compose up -d
# Stop:   docker compose down
#
# Requirements:
#   - DOMAIN, CF_API_TOKEN (or ACME_EMAIL for HTTP challenge) set in .env
#   - ./traefik/acme.json exists with chmod 600
#   - ./secrets/ populated (SOPS-decrypted at deploy time)

version: "3.9"

networks:
  proxy:
    name: proxy
    external: false   # shared network; projects join it with `external: true, name: proxy`

volumes:
  uptime-kuma-data:
  dozzle-data:

services:

  # ── Traefik — reverse proxy + automatic TLS ──────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/acme.json:/acme.json       # chmod 600 required
    environment:
      # Cloudflare DNS challenge (recommended for wildcard TLS).
      # Replace with your DNS provider if different; see traefik.yml for HTTP challenge fallback.
      - CF_API_TOKEN=${CF_API_TOKEN:-}
    labels:
      - "traefik.enable=true"
      # Traefik dashboard — only reachable from internal network
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth-basic"
      # Basic auth for dashboard — generate with: htpasswd -nb admin PASSWORD
      - "traefik.http.middlewares.auth-basic.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
    mem_limit: 128m
    cpus: "0.2"

  # ── Uptime Kuma — service uptime monitoring ──────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - uptime-kuma-data:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.${DOMAIN}`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
    mem_limit: 256m
    cpus: "0.3"

  # ── Dozzle — live container log viewer ───────────────────────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
      # Set username/password in .env: DOZZLE_USERNAME, DOZZLE_PASSWORD
      - DOZZLE_USERNAME=${DOZZLE_USERNAME:-admin}
      - DOZZLE_PASSWORD=${DOZZLE_PASSWORD:-changeme}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.${DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
    mem_limit: 128m
    cpus: "0.2"

  # ── Control Bot — Telegram bot for stackctl commands ─────────────────────
  control-bot:
    build:
      context: ./bots/control-bot
      dockerfile: Dockerfile
    image: control-bot:local
    container_name: control-bot
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      # Mounts stackctl + projects.yaml so bot can call them
      - ./stackctl:/opt/infra-control/stackctl:ro
      - ./projects.yaml:/opt/infra-control/projects.yaml:ro
      # Audit log shared with stackctl
      - /var/log/stackctl:/var/log/stackctl
      # Docker socket so bot can run stackctl (which calls docker compose)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CONTROL_BOT_TOKEN=${CONTROL_BOT_TOKEN}
      - ALLOWED_CHAT_IDS=${ALLOWED_CHAT_IDS}
      - STACKCTL_PATH=/opt/infra-control/stackctl
    mem_limit: 128m
    cpus: "0.2"
