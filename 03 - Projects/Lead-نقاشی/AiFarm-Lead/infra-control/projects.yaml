# projects.yaml — infra-control project registry
# stackctl reads this file to know where each project lives and how to manage it.
#
# Fields per project:
#   path:           absolute path on the VPS where the repo is cloned
#   compose:        path to docker-compose.yml (relative to `path`)
#   health_url:     HTTP endpoint for health check (null = process-based check)
#   health_timeout: seconds to wait for health (default: 60)
#   container_name: primary container name for process-based health (if health_url is null)
#   image:          GHCR image reference (used by CI deploy)
#   description:    human-readable note

projects:

  brushline:
    path: /opt/projects/brushline
    compose: docker-compose.yml
    health_url: null                          # Telegram bot — process-based check
    container_name: brushline-bot
    health_timeout: 30
    image: ghcr.io/GITHUB_USERNAME/brushline:latest
    description: "Brushline — AI lead-gen for Sister Painting (Sydney)"

