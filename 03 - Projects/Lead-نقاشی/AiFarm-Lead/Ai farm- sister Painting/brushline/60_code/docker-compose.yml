# brushline/docker-compose.yml
# Brought up via: stackctl up brushline
#
# Env vars injected at runtime. Options:
#   a) .env file in this directory (SOPS-decrypted by deploy script)
#   b) Docker secrets (for future k8s migration)
#
# No HTTP port exposed — Brushline runs as a Telegram bot (polling mode).
# Health check: process-based (see Dockerfile HEALTHCHECK).

version: "3.9"

networks:
  proxy:
    external: true   # shared network managed by infra-control/docker-compose.yml
    name: proxy

services:
  brushline-bot:
    image: ghcr.io/GITHUB_USERNAME/brushline:latest  # replaced at build time by CI
    # For local dev / first-time deploy, build from source:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brushline-bot
    restart: unless-stopped
    networks:
      - proxy
    env_file:
      - .env                # SOPS-decrypted before compose up (see deploy.sh / stackctl deploy)
    volumes:
      - brushline-data:/app/data    # audit logs, kill switch, state
    mem_limit: 512m         # 4GB VPS: 512MB for Brushline (generous for Anthropic API payloads)
    cpus: "0.5"
    # Brushline has its own kill switch file (governance INV-3).
    # stackctl kill brushline also writes .kill_switch to stop external actions.
    healthcheck:
      test: ["CMD", "python", "-c",
             "from src.config import config; v = config.validate(); exit(0 if not v else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  brushline-data:
    name: brushline-data
