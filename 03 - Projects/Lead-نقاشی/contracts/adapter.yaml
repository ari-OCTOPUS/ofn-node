# ===================================================================
# ADAPTER — رابط Lead-نقاشی به مغز مرکزی
# سه زیرمغز (Brushline / کاریابی / Hunter) همه propose-only.
# ===================================================================
adapter_version: "1.0"
tenant: "Lead-Painting"
autonomy_floor: "propose-only (drafts); publish/send/spend = human verdict"

interfaces:
  status:
    method: "read"
    returns: "{ brushline_phase, kariyabi_tests_green, leads_in_pipeline, experiments_active }"

  leads:
    method: "read"
    desc: "pipeline لیدها (schema تعریف‌شده، فعلاً خالی)"
    returns: "list[lead:{date, source, segment, status, value_aud}]"

  drafts:
    method: "read"
    desc: "draftهای آمادهٔ approval (Brushline queue + کاریابی tenders)"
    returns: "list[draft:{type, content_hash, gate_result, sla_status}]"

  report:
    method: "read"
    params: "period"
    desc: "گزارش هفتگی: لید per کانال، هزینه per lead، نرخ تبدیل"
    returns: "{ leads_by_channel, cost_per_lead, conversion_quote_to_job }"

  spend:
    method: "read"
    desc: "خرج امروز vs caps"
    returns: "{ today_aud, per_action_cap, per_day_cap, remaining }"

hard_gated_actions:
  - "send any outreach message to a real customer"
  - "publish any post/campaign"
  - "spend any ad budget"
  - "make any phone call"
  - "sync lead to CRM without consent record"

autonomous_allowed: []
  # هیچ outward action خودکار نیست

forbidden:
  - "auto-send outreach (Spam Act 2003)"
  - "auto-publish (INV-1)"
  - "raw PII in audit log (INV-2 — hash-ref only)"
  - "bypass Constitution Gate"
  - "shared DB with LANGAR/Project-F (Phase 0 isolation)"
