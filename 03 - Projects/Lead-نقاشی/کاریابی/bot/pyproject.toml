[project]
name = "paint-leads-bot"
version = "0.1.0"
description = "Autonomous lead-discovery bot for Sydney building painters"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "tavily-python>=0.5.0",
    "playwright>=1.45.0",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "tenacity>=8.5.0",
    "rich>=13.7.0",
    "pytz>=2024.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py311"
