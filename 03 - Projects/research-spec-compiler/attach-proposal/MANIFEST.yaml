# MANIFEST — research-spec-compiler cognitive organ (blackbox contract)
# Proposal artifact only. Changing these hard_rules or activating the adapter
# is an ORANGE act requiring the owner's verdict (RISK-LADDER.md:28).
name: research-spec-compiler
kind: brain-tool
ring: 2
version: 0.1
status: proposed
off_flag: true

hard_rules:
  - never_write_to_body: "no write to F:\\backup under any code path"
  - never_touch_tcb: "no read/write to the TCB list or genome/pulse; identity anchor 0.135073 untouched"
  - read_only_afferent: "body reads use sqlite file:...?mode=ro&immutable=1 only"
  - efferent_propose_only: "outputs are new files (specs/verdicts/proposals); no outward action"
  - no_c4_claim: "access/functional self-monitoring only; never phenomenal/qualia/sentience"
  - improve_not_rewrite: "additive only; no rewrite without explicit owner request"
  - owner_gate_for_live: "live wiring / production merge requires owner Telegram verdict"
  - firewall: "economy may reorder the experiment queue; it never bends a machine verdict (ADR-007)"

capabilities:
  afferent:                                   # broadband, read-only
    - source: dashboard_events
      mode: "ro&immutable=1"
      purpose: self-monitoring / next-event prediction (H-HYBRID-01)
    - source: [heart-signals.v1, cortex-state.v1]     # schema'd state files (when live)
      mode: read-fail-soft
  efferent:                                   # propose-only
    - emit: falsifiable_spec                   # via rsc.py (5 gates)
    - emit: machine_verdict                    # DISCARD/OPTIMIZE/INTEGRATE/REJECTED
    - emit: shadow_proposal                    # paper-mode $0, off by default
  forbidden:
    - publish
    - send
    - spend
    - trade
    - create_account
    - production_merge          # apply_merge stays unwired
    - live_activation

registration:
  urcp: PROJECT.md              # discoverable by _ops/registry_scan.py (owner + risk_tier)
  revocable: true               # supervisory revoke dissolves the organ; germline intact without it
  cert_derived: true            # instantiated from a Ring-0 differentiation certificate
