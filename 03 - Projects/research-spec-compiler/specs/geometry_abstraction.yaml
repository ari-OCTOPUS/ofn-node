# H-GEO-01 — هندسی‌سازیِ اصل ۷ (پیش‌بینی/فشرده‌سازی/انتقال) روی کرنلِ H-OWN-03.
# مرجع: GEOMETRY.md §۲. دامنه C0؛ هیچ ادعای C4.
# متریک = RTA (Representational Transfer Alignment). ⚠️ این RSA نیست:
# RSA/CKA [N L662–665] و D_causal [N F2] فقط هم‌خانواده/انگیزه‌اند؛ RTA یک نرخِ
# اصابتِ نظارتیِ train→heldout است. anchorها: اصل۷ [P L666]، axis_coordinates [P L1460].
idea: >
  آیا «برتریِ انتقالِ» تنگنای WM را می‌توان با هندسهٔ بازنمایی توضیح داد؟ فرض:
  هم‌ترازیِ انتقال‌محورِ یک بازنمایی با هندسهٔ کنشِ بهینه (RTA)، مقدارِ
  transfer واقعیِ عاملِ آموخته را پیش‌بینی می‌کند.

hypothesis: >
  روی جاروبی از بازنمایی‌ها (خام/تنگنا با K مختلف/تصادفی/task-id)، همبستگیِ
  رتبه‌ایِ Spearman بین RTA(φ) و transfer_accuracy(φ) دست‌کم ۰٫۷ است. توجهِ
  معرفتی: RTA تقریباً سقفِ تحقق‌پذیرِ کلاسِ سیاستِ همان عامل است، پس ρِ بالا
  تنهایی «مکانیزم» را اثبات نمی‌کند؛ محتوای غیرتریویال از دو کنترل می‌آید —
  shuffle≈۰ و ρ(compression,transfer)≈۰ در برابر ρ(RTA,transfer) بالا — که
  «ظرفیتِ خام» و «فشرده‌سازیِ خام» را به‌عنوان محرک رد می‌کند.

prediction:
  statement: alignment انتقال‌محور، transfer را پیش‌بینی می‌کند.
  baseline: 0.0   # [EST] همبستگی تحت برچسبِ به‌هم‌ریخته (کنترل)؛ منبع: تعریفِ null
  expected: 0.85  # [EST] هدف؛ منبع: در pilot درون‌فایلی رابطهٔ coverage↔transfer قوی دیده شد (H-OWN-03: no_gating/K2 هم‌زمان alignment و transfer پایین)

metric:
  name: geo_transfer_rho          # Spearman ρ(alignment, transfer) روی جاروبِ بازنمایی‌ها
  dataset: gridworld-heldout-tasks
  direction: higher_is_better
  primary: true

experiment:
  dataset: ۵ جهانِ grid-world قطعی (suiteهای 993000+، جدا از pilot/confirmatory/census)؛ در هر جهان جاروبِ ۷ بازنمایی.
  n: 7                            # تعداد نقاطِ بازنمایی در هر جاروب
  conditions:
    - name: shuffle_control
      description: baseline — transfer برچسب‌ها قبل از همبستگی به‌هم‌ریخته می‌شوند (ρ باید ≈۰).
    - name: geo_alignment
      description: هم‌ترازیِ واقعیِ alignment↔transfer روی همان جاروب.
  protocol: >
    در هر seed یک جهان ساخته می‌شود؛ برای هر بازنمایی φ در جاروب، عاملِ tabular با
    بودجهٔ یکسان آموزش می‌بیند و transfer_accuracy روی heldout سنجیده می‌شود، و
    مستقل از آن alignment(φ) (کاملاً هندسی، از φ و BFSِ کنشِ بهینه) حساب می‌شود.
    خروجیِ هر condition = Spearman ρ بین این دو بردار روی جاروب. ۵ seed.

failure_condition:
  metric: geo_transfer_rho
  op: "<"
  threshold: 0.4
  note: اگر ρِ واقعی زیر ۰٫۴ بماند، ادعای «هندسه انتقال را توضیح می‌دهد» رد می‌شود.

architecture:
  pattern: Representational Transfer Alignment (RTA) — NOT RSA (no RDM correlation)
  topology: φ (WM projection) -> quotient S/φ -> train-bin majority-action lookup vs BFS optimal-action geometry
  tradeoff: RTA تقریباً سقفِ کلاسِ سیاستِ عامل است، پس ρ آسیب‌شناسیِ یادگیری را از «هندسهٔ غلط» جدا نمی‌کند؛ فقط هندسهٔ بازنمایی را می‌سنجد، نه دینامیکِ یادگیری.

api_contract:
  endpoint: /kernel/geometry/align
  method: POST
  request:
    universe_seed: 993000
    representations: [unlimited, minimal_sufficient, k2, k4, k8, random6, taskid6]
    budget_episodes: 150000
  response:
    # شکل پاسخ ([EST] illustrative — خروجی واقعی از run):
    geo_transfer_rho: 0.85
    per_rep_alignment: [0.1]
    per_rep_transfer: [0.27]
    per_rep_compression: [0.0]

mvp:
  stack: Python (بازاستفاده از experiments/gridworld_wm.py؛ بدون dependency جدید)
  deps: []
  effort: "< 1 day"
  notes: بدون LLM؛ alignment از BFSِ قطعی؛ فقط orchestration روی هارنس موجود.

evaluation:
  comparisons: [shuffle_control, geo_alignment]
  ablation:
    - حساسیت به بودجهٔ آموزش (transfer با بودجهٔ کمتر/بیشتر)
    - تفکیک سهمِ compression در برابر alignment (همبستگیِ جزئی)
  seeds: 5

decision_rule:
  primary_metric: geo_transfer_rho
  rules:
    - max: 0.4
      verdict: DISCARD
    - min: 0.4
      max: 0.7
      verdict: OPTIMIZE
    - min: 0.7
      verdict: INTEGRATE
# self-check: metric✓ falsifiable✓ api✓ mvp✓ decision_rule✓
