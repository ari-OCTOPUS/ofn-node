# H-HYBRID-01 — کرنلِ چهار-مکانیزمی روی دادهٔ واقعیِ ارگانیسمِ اختاپوس (read-only).
# ترکیب: WM-gating (H-OWN-03) + schema consolidation (H-OWN-04) + RTA (H-GEO-01)
# + انتقالِ زمانی (اتوسِ کرنل). هدف: خود-پیش‌بینیِ رفتارِ بدن از event stream.
# دامنه: access/functional self-monitoring فقط — هرگز phenomenal/qualia
# (خطِ سرخِ بدن، 2027-backlog:20). اتصال = Ring-2، afferent broadband /
# efferent propose-only، Risk Ladder سبز، پشتِ off-flag و گیتِ نارنجیِ مالک.
# تصحیحِ بازبینیِ خصمانه (2026-07-14): نسخهٔ اول روی دقتِ مطلقِ خود-پیش‌بینی
# گیت می‌کرد که با یک lookupِ ۲-ستونیِ بی‌مکانیزم هم پاس می‌شد (گیتِ
# ابطال‌ناپذیر). primary به کمیتِ واقعاً ابطال‌پذیرِ فرضیه منتقل شد: مزیتِ
# تنگنای WM بر مدلِ بی‌تنگنا روی انتقالِ زمانی (می‌تواند ≤۰ شود).
idea: >
  آیا تنگنای WM (بازنماییِ کوچکِ gated + تثبیت) رفتارِ ارگانیسمِ زندهٔ اختاپوس را
  روی پنجرهٔ زمانیِ آینده بهتر از حافظهٔ نامحدودِ خام منتقل می‌کند — یعنی همان تزِ
  H-OWN-03 روی دادهٔ واقعیِ بدن؟

hypothesis: >
  دقتِ پیش‌بینیِ رویدادِ بعدیِ عاملِ K=2-gated روی برشِ زمانیِ heldout دست‌کم
  +۰٫۰۲ بیشتر از عاملِ کاملِ ۱۰-ویژگی است (تنگنا کمتر overfit می‌کند و بهتر
  منتقل می‌شود). دقتِ مطلق (~۰٫۹۵) و baselineها فقط زمینه‌اند، نه گیت.

prediction:
  statement: bottleneck_advantage = acc(K=2 gated) − acc(full 10-feature) روی برشِ آینده.
  baseline: 0.0     # [EST] بی‌اثری: اگر تنگنا کمکی نکند، اختلاف ≈۰
  expected: 0.05    # [EST] هدف؛ منبع: pilot ۰٫۰۲۵–۰٫۰۵۱ در ۵ برش (رشد با اندازهٔ آموزش) [FACT]

metric:
  name: bottleneck_advantage
  dataset: octopus-dashboard-events-snapshot-2026-07-12
  direction: higher_is_better
  primary: true

experiment:
  dataset: snapshot read-only از dashboard_events بدن (۵٬۰۴۴ رویداد، ۱۳ agent، ۶ نوع رویداد؛ daemonِ پژوهشی از ۱۱ ژوئیه متوقف → داده ثابت).
  n: 5044
  conditions:
    - name: hybrid_selfpred
      description: زمینه (گیت‌نشده) — دقتِ مطلقِ خود-پیش‌بینی (~۰٫۹۵؛ روی این استریمِ چرخه‌ای تریویال است).
    - name: gain_over_single
      description: زمینه (گیت‌نشده) — بهبود بر baselineِ منصفِ تک-ویژگی (event_name، ~۰٫۷۹)، نه اکثریتِ ~۰٫۴۳.
    - name: bottleneck_advantage
      description: primary — مزیتِ تنگنای WM بر مدلِ کاملِ ۱۰-ویژگی روی آینده (کمیتِ ابطال‌پذیر).
  protocol: >
    برشِ زمانیِ کرونولوژیک (نه تصادفی): آموزش روی رویدادهای قدیمی‌تر، آزمون روی
    رویدادهای جدیدترِ همان بدن. هر seed یک برشِ متفاوت (train_frac ۰٫۶۰–۰٫۸۰)
    برای واریانس و robustness. gating با greedy forward selection روی sliceِ
    اعتبارِ داخلِ آموزش؛ تثبیت = bin→کنشِ اکثریت؛ backoff به اکثریتِ سراسری.
    هیچ نوشتنی به بدن، هیچ LLM.

failure_condition:
  metric: bottleneck_advantage
  op: "<"
  threshold: 0.02
  note: اگر مزیتِ تنگنا بر مدلِ کامل زیر +۰٫۰۲ (SESOI) بماند، تزِ WM روی دادهٔ واقعیِ بدن ارزشِ افزوده ندارد و کرنل نباید صرفاً به‌این‌دلیل وصل شود.

architecture:
  pattern: Four-mechanism hybrid cortex organ (WM-gating + consolidation + RTA + temporal transfer)
  topology: organism event stream (read-only) -> K-slot gated context -> schema library -> next-event prediction
  tradeoff: مطالعهٔ مشاهده‌ایِ تک-snapshot است (بدن ثابت از ۱۱ ژوئیه)؛ ۵ برشِ زمانی همبسته‌اند، نه seedهای واقعاً مستقل — verdict محدود به همین تاریخچهٔ بدن است.

api_contract:
  endpoint: /kernel/cortex/self_monitor
  method: POST
  request:
    source: dashboard_events
    capacity_slots: 3
    split: temporal
  response:
    # شکل پاسخ ([EST] illustrative — خروجی واقعی از run):
    bottleneck_advantage: 0.036
    hybrid_selfpred: 0.946
    single_feature_baseline: 0.789
    mode: propose_only

mvp:
  stack: Python (organism_bridge read-only + hybrid؛ بدون dependency)
  deps: []
  effort: "< 1 day"
  notes: بدون LLM؛ read-only از F:\backup با mode=ro&immutable=1؛ فقط فایل‌نو در کرنل.

evaluation:
  comparisons: [hybrid_selfpred, gain_over_single, bottleneck_advantage]
  ablation:
    - جاروبِ K (حساسیت به ظرفیتِ WM؛ phase_idx افزونه است)
    - جاروبِ برشِ زمانی (robustness)
  seeds: 5

decision_rule:
  primary_metric: bottleneck_advantage
  rules:
    - max: 0.02
      verdict: DISCARD          # تنگنا کمکِ معنادار نمی‌کند → صرفاً به این دلیل وصل نشو
    - min: 0.02
      max: 0.05
      verdict: OPTIMIZE         # مزیتِ کوچکِ واقعی → فقط shadow، بهبود بده
    - min: 0.05
      verdict: INTEGRATE        # مزیتِ قوی → مجاز به پیشنهادِ اتصالِ ناظر (باز هم propose-only + گیتِ نارنجیِ مالک)
# self-check: metric✓ falsifiable✓ api✓ mvp✓ decision_rule✓
