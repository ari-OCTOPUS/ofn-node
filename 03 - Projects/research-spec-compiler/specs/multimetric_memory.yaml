# SUBSTRATE for GEOMETRY.md §4 (اصل ۸, [SPEC] -> [RUN]) — memory as a MULTI-METRIC space.
# Claim: retrieval must index episodes by MORE than semantic similarity — time,
# provenance and outcome (d_causal not instantiated here; disclosed). Semantic-only
# retrieval is GENUINELY insufficient when the stream contains semantic DUPLICATES
# that differ in recency / source-reliability / outcome. Scope C0/C1. No LLM.
# Fully reuses experiments/gridworld_wm.py + memory_policy lineage (improve-not-rewrite).
idea: >
  Is episodic memory a single-metric (semantic) space or a multi-metric one? An
  agent's real experience stream contains semantic duplicates: the same situation
  key written in different life phases — stale early entries, trusted mid-life
  entries, and RECENT-but-poisoned late entries. A retriever that sees only
  semantic similarity must majority-vote over all duplicates and gets corrupted;
  a retriever that weights the same semantic matches by recency, measured source
  reliability (provenance) and episode outcome should recover the trusted advice.
  On a clean stream (no duplicates/poison) the extra metrics have nothing to
  disambiguate, so the advantage must vanish — proving the effect is caused by
  the corrupted duplicates, not by the weighting machinery.

hypothesis: >
  On a corrupted three-phase experience stream with identical semantic coverage
  for both retrieval rules, heldout task success of multi-metric retrieval
  (weighted semantic+recency+provenance+outcome) exceeds semantic-only majority
  retrieval by at least +0.10; the same contrast on a CLEAN stream gives ~0; and
  recency alone must NOT recover the advantage (the newest entries are poisoned),
  isolating provenance+outcome as JOINTLY load-bearing axes (the two are never
  ablated separately, and provenance is outcome-derived — see tradeoff).

prediction:
  statement: retrieval_advantage = success(multimetric) − success(semantic_only) on heldout tasks, corrupted stream, identical key coverage.
  baseline: 0.0     # [EST] no-advantage floor. Source: clean-stream control measured EXACTLY 0.000 on all 5 pilot seeds (family 942000) [FACT: pilot log 2026-07-14]
  expected: 0.11    # [FACT] pilot family 942000 (5 disjoint seeds, frozen volumes): +0.112 mean, min +0.067, max +0.150 [FACT: pilot log 2026-07-14]

metric:
  name: retrieval_advantage
  dataset: gridworld-heldout-tasks
  direction: higher_is_better
  primary: true

experiment:
  dataset: 5 grid-world universes (seeds 942500+, disjoint from the pilot family 942000 and from every other family in the repo); per universe one 32,000-episode stream in three life phases (14k stale / 8k trusted / 10k recent-poisoned greedy rollouts), ~960 semantic keys with cross-phase duplicates; evaluated on the SAME 60 heldout tasks per universe.
  n: 60
  conditions:
    - name: null_same_vs_same
      description: null — semantic_only vs semantic_only, retrieval+evaluation recomputed twice over the shared memoized universe build (must be exactly 0).
    - name: clean_stream_control
      description: discriminating control — the same multimetric−semantic contrast on a CLEAN stream (trusted phase only, own timeline); no duplicates/poison -> must be ~0 (pilot measured exactly 0.000).
    - name: recency_only_gain
      description: reported ablation — semantic+recency alone; the late phase is poisoned, so time-only weighting must NOT recover the advantage (pilot −0.033).
    - name: retrieval_advantage
      description: primary — full multimetric (recency+provenance+outcome, equal thirds frozen a priori) minus semantic-only majority, corrupted stream.
  protocol: >
    Per universe: (1) train a converged tabular-Q policy (80k episodes) and two
    under-trained snapshots (400 episodes each) on the 6-slot minimal-sufficient
    abstract representation over the train tasks; (2) roll out three phases —
    EARLY stale snapshot, MID converged (trusted), LATE second snapshot (recent
    but poisoned) — each episode writing one entry per distinct semantic key
    visited: (key, action, normalized timestamp, source, win/loss outcome);
    (3) retrieve per heldout key among the semantically-tied duplicates by
    (a) semantic_only = plain majority over ALL entries (frequency-weighted kNN,
    uses every datum, non-crippled) vs (b) multimetric = the same matches, each
    vote weighted by (recency + measured source win-rate + outcome)/3;
    (4) evaluate each retrieval rule AS A POLICY on the same heldout tasks with
    gridworld's frozen evaluate() (hit -> retrieved action, miss -> CRC-seeded
    random fallback). Both rules see the IDENTICAL key set (no coverage edge —
    only vote ordering differs), so the advantage is pure indexing. Everything
    is CRC-seeded from (family, seed-index); the harness RNG is never consumed.
    No learning at eval, no LLM.

failure_condition:
  metric: retrieval_advantage
  op: "<"
  threshold: 0.05
  note: >
    If multi-metric weighting cannot beat semantic-only majority by the SESOI
    +0.05 on a stream engineered to punish single-metric retrieval (and the
    advantage CAN be <= 0: down-weighting stale entries also discards their
    correct votes at rarely-revisited keys, both rules share identical coverage,
    and recency_only_gain actually measured NEGATIVE in the pilot), then
    "memory must be a multi-metric space" (اصل ۸) is rejected for this
    instantiation. The clean-stream control must simultaneously sit ~0.

architecture:
  pattern: Multi-metric episodic retrieval (GEOMETRY.md §4) — weighted vote over semantic ties by recency + provenance + outcome vs semantic-only majority
  topology: three-phase experience stream -> episodic store (key, action, t, source, outcome) + measured per-source reliability -> retrieval rule -> memory-lookup policy on heldout tasks
  tradeoff: >
    The multi-metric index must store and maintain three extra scalars per entry
    plus a per-source reliability estimate, and its weights need calibration; on
    clean streams it buys exactly nothing (pilot clean delta 0.000), so the cost
    is only justified where streams accumulate stale or unreliable duplicates.
    d_causal is NOT instantiated (4 of the 5 axes run); provenance reliability is
    outcome-derived at source granularity, not an independent oracle label.

api_contract:
  endpoint: /kernel/memory/retrieve
  method: POST
  request:
    query_key: "<6-slot semantic key>"
    weights: { recency: 0.333, provenance: 0.333, outcome: 0.333 }   # 0 0 0 = semantic_only
  response:
    # shape ([EST] illustrative — real numbers come from the run):
    action: 2
    semantic_only_success: 0.62
    multimetric_success: 0.73
    retrieval_advantage: 0.11

mvp:
  stack: Python (full reuse of experiments/gridworld_wm.py + memory_policy._as_Q; stdlib only)
  deps: []
  effort: "< 1 day"
  notes: >
    No LLM. Store = dict key -> per-action [votes, sum_recency, wins, per-source
    counts]; semantic_only = argmax votes; multimetric = argmax weighted votes;
    both evaluated as policies with gridworld.evaluate() verbatim. One family of
    5 universes runs in ~15 s.

evaluation:
  comparisons: [null_same_vs_same, clean_stream_control, recency_only_gain, retrieval_advantage]
  ablation:
    - clean stream (no duplicates/poison) -> delta EXACTLY 0.000 on all 5 pilot seeds; the mechanism is inert without corruption
    - recency-only weighting -> −0.033 mean (pilot); the time axis alone MISLEADS on this stream (poison is recent), so provenance/outcome are JOINTLY non-redundant (no provenance-only / outcome-only arm)
    - null same-vs-same -> exactly 0 (determinism of the retrieval+evaluation stage over the shared memoized universe)
  seeds: 5

decision_rule:
  primary_metric: retrieval_advantage
  rules:
    - max: 0.05
      verdict: DISCARD
    - min: 0.05
      max: 0.10
      verdict: OPTIMIZE
    - min: 0.10
      verdict: INTEGRATE
# self-check: metric✓ falsifiable✓ api✓ mvp✓ decision_rule✓
