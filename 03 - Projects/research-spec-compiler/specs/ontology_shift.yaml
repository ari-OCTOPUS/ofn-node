# H-GEO-02 — goal lifting under ontology shift.
# GEOMETRY.md section 5's Kan-extension [MAP] object (U_D o F ~= U_C, the
# commuting triangle) promoted to a falsifiable [RUN] spec: the environment of
# ontology change the map was waiting for now exists (experiments/ontology_shift.py,
# full reuse of gridworld_wm — improve-not-rewrite).
# Discipline: pilot on seed family 940000 (5 universes, numbers below), thresholds
# FROZEN before the confirmatory run on the disjoint family 945000 (registry path).
idea: >
  When an agent's observation ontology changes to a different but
  information-equivalent encoding (ontology C -> D), value should be
  preservable by LIFTING the old utility through a learned correspondence
  F: D -> C (U_D = U_C o F), instead of relearning the task from scratch.
  This makes "حفظ ارزش تحت تغییر چارچوب" executable and falsifiable.

hypothesis: >
  After a per-dimension recoding of all 18 gridworld observation features, an
  agent that learns F from a SMALL paired sensor-overlap window (40 episodes)
  and reuses its pre-shift Q through F beats an equal-total-budget (500
  episodes) relearn-from-scratch agent on heldout tasks by at least +0.05
  success; the advantage must vanish (~<=0) when the recoding is randomized
  per-state (no correspondence exists to learn).

prediction:
  statement: >
    lifting_advantage = success(lifted_policy) - success(relearn_from_scratch)
    on heldout tasks in D, equal post-shift budget. Controls: null_no_shift ~ 0,
    unlearnable_shift <= 0, no_mapping_reuse <= 0 AT THE MEAN (that ablation is
    noisy per universe — one pilot universe was +0.057 [FACT] — so the <=0 is a
    mean-level claim, not universe-wise; see ADR-017 caveat 1).
  baseline: 0.0     # [FACT] no-mechanism floor: pilot null_no_shift -0.013+-0.018,
                    # unlearnable_shift -0.035+-0.021, no_mapping_reuse -0.044+-0.069
                    # (family 940000, 5 universes, run 2026-07-14)
  expected: 0.19    # [FACT] pilot mean lifting_advantage +0.191+-0.048, positive in
                    # 5/5 universes (+0.110..+0.230); mapping recovery 0.867-0.967

metric:
  name: lifting_advantage
  dataset: gridworld-ontology-shift
  direction: higher_is_better
  primary: true

experiment:
  dataset: >
    Deterministic grid-world task family (gridworld_wm.build_suite, 200 tasks:
    140 train / 60 heldout per universe). Ontology C = the 18 raw feature
    values; ontology D = per-dimension bijective recoding onto code indices
    (fixed per universe, information-equivalent). Agent representation = the
    a-priori K=6 relational slots of ADR-001.
  n: 200
  conditions:
    - name: null_no_shift
      description: >
        Null control, D == C. Full lifting machinery (learn F from the window,
        refine through it) vs plain reuse-and-refine without F, equal budget.
        Pilot -0.013 [FACT] — the apparatus alone adds ~nothing.
    - name: no_mapping_reuse
      description: >
        Mechanism ablation. Old Q reused + refined on RAW D observations (no F)
        vs relearn; only difference from lifted_policy is the learned mapping.
        Pilot mean -0.044 [FACT] — reuse without F does not beat relearning at
        the mean, though the per-universe spread is wide (-0.147..+0.057).
    - name: unlearnable_shift
      description: >
        Discriminating control. Recoding randomized PER-STATE, so no global
        F exists; the identical machinery must give ~<=0. Pilot -0.035, <=0 in
        5/5 universes [FACT]. Live control: the garbage F-hat maps heldout codes
        into the old Q's keyspace, so lifting CAN be actively misled below floor.
    - name: lifting_advantage
      description: >
        PRIMARY. Learn F-hat: D->C by per-dimension co-occurrence argmax over a
        40-episode paired overlap window (paid from the 500-episode budget),
        then refine + evaluate the pre-shift Q through the lifted view.
        Pilot +0.191 [FACT]; lifted absolute success 0.620-0.717 vs pre-shift
        0.633-0.763 vs relearn 0.390-0.543 [FACT].
  protocol: >
    Per universe (paired suites across all four conditions): pre-train Q_C for
    30000 episodes under C; shift the ontology; give EVERY post-shift arm
    exactly 500 episodes total (relearn: fresh Q, standard anneal — the
    schedule a fresh learner needs; lifted: 40 paired-window episodes + 460
    low-eps refinement — the schedule a trained Q warrants, disclosed
    asymmetry). Each condition returns the paired heldout difference on the
    SAME universe; 5 universes = 5 seeds. All RNGs CRC-derived from
    universe+arm; zero LLM; runtime ~17s for the full pilot [FACT].
    Post-shift scarcity (500 = 1.7% of pre-shift life) was set on the smoke
    family 949000 BEFORE any pilot/confirmatory universe was touched: at 3000
    episodes relearning trivially catches up (+0.037 smoke) and no mechanism
    is being tested. Disclosed: that calibration pass also saw the primary
    effect at budget 500 (+0.213 [FACT smoke 949000]) — a third-family peek,
    and a replication across disjoint families (ADR-017 caveat 3).

failure_condition:
  metric: lifting_advantage
  op: "<"
  threshold: 0.05
  note: >
    SESOI [EST: preregistered as less than half the weakest pilot universe,
    +0.110]. Below +0.05 the lifted utility is not meaningfully better than
    relearning under the same budget -> H-GEO-02 rejected: either F is not
    learnable from the window at this scarcity, or lifting misleads.

architecture:
  pattern: Kan extension of utility along an ontology functor (U_D = U_C o F)
  topology: >
    obs_D -> learned F-hat (per-dimension co-occurrence argmax from the paired
    overlap window) -> C keyspace -> pre-shift Q_C (refined) -> policy. The
    commuting triangle U_D o F ~= U_C is evaluated literally: the old utility
    composed with a learned functor-on-observables.
  tradeoff: >
    Lifting preserves value only if the correspondence is learnable from the
    small window; a wrong F-hat is WORSE than ignorance (it maps new codes onto
    semantically wrong old Q entries — see unlearnable_shift and
    no_mapping_reuse, both <=0 in pilot). Per-dimension bijections are the
    minimal shift class; structural shifts (feature merge/split) remain [MAP].

api_contract:
  endpoint: /kernel/ontology/lift
  method: POST
  request:
    pre_shift_episodes: 30000
    post_shift_budget: 500
    adapt_episodes: 40
    capacity_slots: 6
    seeds: 5
    seed_family: 945000
  response:
    # response SHAPE; values are pilot means [FACT: family 940000] — the
    # confirmatory numbers come from the registry run on 945000.
    lifting_advantage: 0.191
    null_no_shift: -0.013
    unlearnable_shift: -0.035
    no_mapping_reuse: -0.044
    mapping_recovery: 0.93

mvp:
  stack: Python stdlib (full reuse of experiments/gridworld_wm.py)
  deps: []
  effort: "< 1 day"
  notes: >
    No LLM; deterministic given seeds; pilot (4 conditions x 5 universes,
    incl. 20 pre-trainings of 30k episodes) finishes in ~17s [FACT].

evaluation:
  comparisons: [null_no_shift, no_mapping_reuse, unlearnable_shift, lifting_advantage]
  ablation:
    - unlearnable_shift is the discriminating control (must stay ~<=0)
    - no_mapping_reuse isolates F's contribution from mere Q reuse
    - per-universe log (ONTOLOGY_LOG) reports raw arm scores + mapping_recovery
    - >
      budget sensitivity — smoke at 3000 post-shift episodes shows the effect
      shrink to +0.037 [FACT smoke 949000]; the mechanism matters under scarcity
  seeds: 5

decision_rule:
  primary_metric: lifting_advantage
  rules:
    - max: 0.05
      verdict: DISCARD
    - min: 0.05
      max: 0.12
      verdict: OPTIMIZE      # real but weaker than the weakest pilot universe
    - min: 0.12
      verdict: INTEGRATE     # goal lifting preserves value at equal budget
# self-check: metric+ falsifiable+ api+ mvp+ decision_rule+
