# Drake × Cognitive Kernel — نسخهٔ آزمون‌پذیر (خواهر سالمِ drake_multiverse.yaml).
# ایدهٔ دریک را به تنها مولتی‌ورسی می‌بریم که واقعاً کانال مشاهده دارد:
# مولتی‌ورس شبیه‌سازی‌شده. هر suite-seed یک «جهان» مستقل از خانوادهٔ grid-world
# است؛ می‌شماریم در چه کسری از جهان‌ها، هستهٔ WM-محدود (H-OWN-03) به انتزاعِ
# قابل‌انتقال می‌رسد:
#   N_viable = N_universes × f_transfer
# f_transfer همان جنس جملهٔ f_i دریک است (کسری که «هوشِ تعمیم‌دهنده» ظهور می‌کند)،
# اما این‌بار اندازه‌گیری‌پذیر، تکرارپذیر و ابطال‌پذیر.
# SCOPE (قفل C0–C4): این spec فقط دربارهٔ عامل‌های tabular در این خانوادهٔ
# شبیه‌سازی است؛ هیچ ادعایی دربارهٔ مولتی‌ورس فیزیکی یا آگاهی زیستی ندارد.
idea: >
  سرشماری دریک‌گونه روی مولتی‌ورس شبیه‌سازی‌شده: در چه کسری از جهان‌های
  مستقل (suite seedها)، عامل با تنگنای working memory به انتزاع قابل‌انتقال
  می‌رسد (transfer_accuracy > 0.5 روی heldout همان جهان)؟

hypothesis: >
  ظهور انتزاع قابل‌انتقال تحت تنگنای WM یک اتفاق تک-جهانی نیست: در دست‌کم ۷۰٪
  از جهان‌های نمونه‌گیری‌شده، عامل limited_wm به transfer_accuracy > 0.5 می‌رسد،
  در حالی که عامل unlimited_memory تقریباً در هیچ جهانی نمی‌رسد.

prediction:
  statement: f_transfer(limited_wm) >= 0.7 و f_transfer(unlimited) ≈ 0.
  baseline: 0.0     # [EST] f_transfer عامل unlimited؛ منبع: کف random-walk ≈ 0.26 < 0.5 در pilotهای H-OWN-03 (2026-07-13)
  expected: 0.8     # [EST] منبع: دو pilot مستقل H-OWN-03 با transfer 0.547 و 0.567 (> 0.5 در 2/2)؛ n کوچک

metric:
  name: f_transfer          # کسر جهان‌هایی که در آن‌ها transfer_accuracy > 0.5
  dataset: gridworld-multiverse-10u   # ۱۰ جهان مستقل (suite seedهای 997000+)
  direction: higher_is_better
  primary: true

experiment:
  dataset: ۱۰ suite مستقل × ۲۰۰ تکلیف (۱۴۰ train / ۶۰ heldout) از خانوادهٔ grid-world قطعی.
  n: 10
  conditions:
    - name: unlimited_census
      description: عامل بافر خام نامحدود در هر جهان (baseline سرشماری).
    - name: limited_wm_census
      description: عامل K=6 اسلات + gating یادگرفته‌شده در هر جهان (همان پروتکل فریزشدهٔ H-OWN-03).
  protocol: >
    برای هر جهان u، همان پروتکل فریزشدهٔ EXP-001 اجرا می‌شود (بودجهٔ ۱M episode،
    gating با coverage-pressure، ارزیابی eps=0.10)؛ سپس شاخص دوتایی
    success(u) = [transfer_accuracy(u) > 0.5] و f_transfer = میانگین آن روی ۱۰ جهان.
    آستانهٔ 0.5 = «اکثریت episodeهای heldout حل شود» — قاعدهٔ معنایی، نه tune شده.

failure_condition:
  metric: f_transfer
  op: "<"
  threshold: 0.4
  note: اگر در کمتر از ۴۰٪ جهان‌ها انتزاع قابل‌انتقال ظهور کند، ادعای «ظهور robust» رد می‌شود.

architecture:
  pattern: Monte-Carlo Drake census over seeded universes
  topology: universe sampler -> per-universe EXP-001 kernel -> binary viability -> f_transfer
  tradeoff: هزینهٔ compute × تعداد جهان‌ها ↑ در ازای تبدیل ادعای تک-جهانی به توزیع بین-جهانی (n=10 → CI پهن).

api_contract:
  endpoint: /kernel/census/run
  method: POST
  request:
    n_universes: 10
    seed_family: 997000
    viability_threshold: 0.5
  response:
    # شکل پاسخ ([EST] illustrative — خروجی واقعی از run می‌آید):
    f_transfer: 0.8
    per_universe_transfer: [0.55]
    baseline_f_transfer: 0.0

mvp:
  stack: Python (بازاستفادهٔ کامل از experiments/gridworld_wm.py)
  deps: []
  effort: "< 1 day"
  notes: بدون LLM؛ فقط orchestration روی هارنس موجود H-OWN-03؛ seedهای 997000+ (نه pilot و نه confirmatory قبلی).

evaluation:
  comparisons: [unlimited_census, limited_wm_census]
  ablation:
    - حساسیت به آستانهٔ viability (گزارش f در 0.4 و 0.6 به‌عنوان تشخیصی، خارج از verdict)
  seeds: 1   # هر جهان خودش یک تکرار مستقل است؛ واریانس بین-جهانی گزارش می‌شود

decision_rule:
  primary_metric: f_transfer
  rules:
    - max: 0.4
      verdict: DISCARD
    - min: 0.4
      max: 0.7
      verdict: OPTIMIZE
    - min: 0.7
      verdict: INTEGRATE
# self-check: metric✓ falsifiable✓ api✓ mvp✓ decision_rule✓
