# EXP-005 / H-OWN-05 — Prospective Memory: an explicit buffer for retained
# INTENTIONS (cue -> deferred response) that survives interruptions vs a
# reactive bounded-register controller. Reference: homeostasis.py (deterministic
# env + hand-coded policies). Scope: C2/C3 (deferred-intention agency) — but the
# metric is functional task completion ONLY.
# Forbidden interpretation: intention as felt volition/phenomenology.
# Permitted: functional retention of a delayed goal binding.
idea: >
  Does an agent with an EXPLICIT prospective-memory buffer (a dedicated store of
  "when cue X later fires, do Y" bindings, not overwritten by the ongoing task)
  complete deferred intentions better than a reactive agent whose single shared
  working register is overwritten by interruptions — and specifically MORE so
  when episodes are interruption-heavy?

hypothesis: >
  Under interruption-heavy episodes, the deferred-intention completion rate of
  the buffer agent exceeds the reactive agent by at least +0.10 (SESOI); under a
  light-interruption control the advantage is ~0 (the reactive register
  survives), and a null control where intentions never trigger is exactly 0.

prediction:
  statement: pm_advantage_highload = PM_completion(buffer) − PM_completion(reactive) under heavy interruption load.
  baseline: 0.0     # [FACT] null control = 0 BY CONSTRUCTION (no triggers are placed, so no PM events are scored) — a construction zero, not a measured cancellation; source: pilot family 982000, 2026-07-14
  expected: 0.40    # [EST] concrete INTEGRATE target; source: pilot family 982000 gave advantage ≈ 0.48 [FACT: pilot log 2026-07-14], target set conservatively below it

metric:
  name: pm_advantage_highload    # deferred-intention completion-rate advantage (higher = better)
  dataset: prospective-memory-world-highload
  direction: higher_is_better
  primary: true

experiment:
  dataset: 60 deterministic ProspectiveMemory episodes per seed (family 982600+, disjoint from pilot 982000).
  n: 60
  conditions:
    - name: null_control
      description: zero-point — intentions are encoded but never triggered (must be exactly 0).
    - name: low_load_advantage
      description: control — same advantage under LIGHT interruption load (must be ~0; reactive register survives).
    - name: pm_advantage_highload
      description: primary — buffer minus reactive PM completion under interruption-heavy load.
  protocol: >
    Each seed builds one episode batch; per episode both deterministic agents
    (reactive = shared FIFO register K=8; buffer = dedicated intention store P=6)
    are stepped through the identical token stream. Encodes are staggered and
    each trigger is placed `gap` steps after its encode, the gap filled with
    ongoing interruptions; heavy load draws gap∈[3,18] (many > K), light load
    gap∈[1,7] (all ≤ K). Both agents emit an identical deterministic guess when
    the binding is absent, so only the differential store benefit survives. No
    learning, no LLM; the manipulation is the memory architecture only.

failure_condition:
  metric: pm_advantage_highload
  op: "<"
  threshold: 0.10
  note: >
    If the buffer's deferred-completion advantage under heavy interruptions stays
    below +0.10 (SESOI), the explicit intention memory adds no functional
    retention value and H-OWN-05 is rejected. Reachable: the low_load control
    lands at ~0 (in this DISCARD band). The advantage could in principle go
    negative, but only if simultaneously-pending intentions exceed the buffer
    capacity P (forcing a FIFO eviction of a binding the reactive register still
    holds) — P=6<K=8 alone is NOT sufficient, and the staggered encode schedule
    keeps <=P pending here, so that regime is not reached (buffer completion 1.0).

architecture:
  pattern: Explicit prospective-memory buffer (dedicated intention store) vs reactive shared-register controller
  topology: token stream -> {reactive shared FIFO register K} | {dedicated intention buffer P} -> deferred response at trigger
  tradeoff: >
    The buffer carries extra persistent state (space/compute) the reactive agent
    does not; and if its capacity P is smaller than the reactive register K it can
    evict a binding the reactive register still holds and LOSE (advantage < 0).

api_contract:
  endpoint: /kernel/prospective_memory/complete
  method: POST
  request:
    intentions: [{cue: 0, resp: 3}]
    interruption_load: high
    reactive_register: 8
    buffer_capacity: 6
  response:
    # shape ([EST] illustrative — real values come from a run):
    pm_advantage_highload: 0.40
    low_load_advantage: 0.0
    null_control: 0.0

mvp:
  stack: Python (deterministic ProspectiveMemory env; no dependency)
  deps: []
  effort: "< 1 day"
  notes: no LLM; two hand-coded deterministic agents; metric = deferred-intention completion rate.

evaluation:
  comparisons: [null_control, low_load_advantage, pm_advantage_highload]
  ablation:
    - sweep interruption load (gap distribution) — reported, outside verdict
    - sensitivity to buffer capacity P vs register K (P<K can flip the sign)
  seeds: 5

decision_rule:
  primary_metric: pm_advantage_highload
  rules:
    - max: 0.10
      verdict: DISCARD
    - min: 0.10
      max: 0.40
      verdict: OPTIMIZE
    - min: 0.40
      verdict: INTEGRATE
# self-check: metric✓ falsifiable✓ api✓ mvp✓ decision_rule✓
