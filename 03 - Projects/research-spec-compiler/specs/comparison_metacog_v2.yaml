# H-OWN-02b — Skill-Gap Attribution (v2 of comparison-driven metacognition).
# DECLARED FOLLOW-UP to adr/ADR-010: v1's INTEGRATE (+0.019) never gated the
# skill-gap-correction term delta_hat it is named for; an out-of-verdict probe
# put its share at ~+0.005 of the +0.019. v2 promotes exactly that increment to
# the PRIMARY GATED metric on a fresh disjoint seed family. v1 is UNTOUCHED
# (new preregistration, no retro-edit). Scope C0/C1 (functional calibration
# only; NO phenomenal/introspective claim). No LLM anywhere.
# World: bit-identical reuse of v1's Rasch/IRT family (runtime cross-check to
# 1e-12 against v1's universe_result). Pilot family 946000 (n=10) set the
# bands, then parameters were FROZEN; confirmatory family is 946500+
# (disjoint from the pilot and from v1's 980500/981000+ families).
idea: >
  ADR-010 confirmed that social comparison calibrates the self-model (+0.019)
  but found most of the gain comes from fusing OTHER's difficulty-ALIGNED
  heldout rate; the skill-gap correction delta_hat — the term the architecture
  is named for — was never isolated by a gated condition. v2 asks the
  attribution question directly: does shifting OTHER's logit by the LEARNED
  skill gap buy a real calibration increment over the identical fusion with no
  shift at all, on the same data, paired per universe?

hypothesis: >
  On heldout categories of the same IRT world, the FULL comparison mechanism
  (fusion of OTHER's rate shifted by the train-estimated skill gap delta_hat)
  achieves a Brier/calibration-error reduction at least +0.002 larger than the
  mechanism-light ALIGNED-FUSION variant (identical machinery, delta_hat := 0),
  while an exchangeability-null control (delta_hat re-estimated with SELF/OTHER
  roles coin-flip swapped per train category, destroying the skill information)
  yields no positive increment.

prediction:
  statement: delta_gain = brier_reduction(full mechanism) - brier_reduction(aligned fusion) on heldout, paired per universe (= err_aligned - err_full).
  baseline: 0.0     # [EST] if the learned gap carries no information beyond difficulty alignment, the increment is ~0 (and the exchangeability-null control is ~0/negative)
  expected: 0.004   # [FACT: pilot family 946000, n=10, 2026-07-14] delta_gain mean +0.0044 (std 0.0009, min +0.0027, max +0.0059); rounded down

metric:
  name: delta_gain
  dataset: irt-heldout-categories
  direction: higher_is_better
  primary: true

experiment:
  dataset: 5 IRT universes (seeds 946500+, disjoint from pilot 946000+ and from ALL v1 families 980500+/981000+); per universe 60 train + 80 heldout categories, bit-identical to v1's world.
  n: 5    # decision replications = the 5 confirmatory universes (seeds 946500..946504; evaluation.seeds). Each universe INTERNALLY averages 80 heldout categories — 80 is the within-universe scoring set, NOT the number of independent decision samples (lesson recorded in ADR-010 caveat 2).
  conditions:
    - name: null_control
      description: zero-point — aligned fusion vs aligned fusion (must be exactly 0; validates the plumbing on the v2 baseline predictor).
    - name: shuffled_delta_gain
      description: discriminating control — identical machinery, delta_hat re-estimated under an exchangeability null (SELF/OTHER roles coin-flip swapped per train category, exact sign flip since attempt counts are equal); skill information destroyed, must be ~0 or negative.
    - name: aligned_gain
      description: context, NOT gated — aligned fusion's own gain over v1's self-only baseline (the mechanism-light share of v1's effect; attribution accounting).
    - name: delta_gain
      description: primary — the skill-gap correction's OWN increment, brier_reduction(full) - brier_reduction(aligned fusion), paired on the same universe.
  protocol: >
    Per universe (drawn exactly as v1, runtime cross-checked): on TRAIN, SELF
    observes its own and OTHER's outcomes on shared categories and estimates
    delta_hat (difficulty cancels in the logit difference) plus a self base
    rate. On HELDOUT, four predictors share the identical direct self-evidence
    (N_S_HELD=3), prior (KAPPA=4) and OTHER observations (N_O_HELD=15); they
    differ ONLY in the logit shift applied to OTHER's rate before fusion
    (MCMP=8): full = +delta_hat, aligned = 0, shuffled = +delta_hat_shuf
    (exchangeability null). Calibration is the reducible Brier term (MSE of
    predicted prob vs true prob; the irreducible p(1-p) cancels in every
    difference). delta_gain = err_aligned - err_full. No learning, no LLM.

failure_condition:
  metric: delta_gain
  op: "<"
  threshold: 0.002
  note: >
    SESOI. If the skill-gap correction's own increment stays below +0.002,
    the correction adds nothing attributable beyond difficulty alignment ->
    H-OWN-02b rejected: the mechanism v1 is named for would be decorative.
    The +0.002 line was set from the PER-UNIVERSE exchangeability-null band
    [FACT: pilot 946000 n=10, shuffled_delta_gain mean -0.0011 std 0.0019,
    i.e. per-universe +2sigma ~ +0.0027, rounded down]. Precision note
    (post-run prose fix, ADR-020 caveat 2 — threshold untouched): the gate is
    applied to the MEAN over evaluation.seeds=5 universes, whose null band is
    tighter (upper 2sigma edge ~ -0.0011 + 2*0.0019/sqrt(5) ~ +0.0006), so on
    the decision scale the line is conservative — a passing mean >= +0.002
    sits ~3.6 sigma above the shuffled-null mean, not inside the null band;
    the per-universe +0.0027 edge is the wrong comparator for the mean gate.
    Genuinely reachable: a biased/noisy delta_hat shifts OTHER's logit the
    wrong way and the increment goes NEGATIVE — v1's own probe reversed the
    whole gain at theta_o=3/n_o=2 [FACT: ADR-010 / v1 spec probe -0.018], and
    the shuffled control is negative in the mean on the pilot.

architecture:
  pattern: Isolated skill-gap-correction increment — full comparison fusion vs difficulty-aligned fusion (delta_hat := 0) as the gated contrast
  topology: other_outcomes -> logit -> [+delta_hat | +0 | +delta_hat_shuf] -> pseudo-observations -> fuse with self prior/evidence -> paired calibration-error difference
  tradeoff: >
    Gating the increment (not the total gain) makes the verdict attribution-
    exact but SMALL — it rides on ~5x less signal than v1's primary, so bands
    sit near noise and demand tight seeds-level pairing. The increment also
    only exists when a skill gap is learnable at all (shared train tasks,
    equal attempt counts for the swap-null) and shrinks toward 0 as
    THETA_S -> THETA_O (no gap to correct).

api_contract:
  endpoint: /kernel/metacog/attribution
  method: POST
  request:
    mode: delta            # delta | aligned | shuffled_delta | null
    self_attempts: 3       # SELF's direct heldout draws per category
    other_outcomes: [12, 15]   # OTHER's (wins, n) per heldout category
    skill_gap: -0.72       # delta_hat estimated on shared train tasks ([EST] illustrative magnitude, ~THETA_S-THETA_O)
  response:
    # shape ([EST] illustrative — real values come from a run):
    delta_gain: 0.004
    aligned_gain: 0.014
    shuffled_delta_gain: -0.001

mvp:
  stack: Python (stdlib only; reuses v1's deterministic IRT simulator via experiments/comparison_metacog_v2.py with a 1e-12 runtime cross-check against v1)
  deps: []
  effort: "< 0.5 day"
  notes: No LLM. Four predictors share the same evidence and fusion machinery; only the logit shift differs. v1 files untouched.

evaluation:
  comparisons: [null_control, shuffled_delta_gain, aligned_gain, delta_gain]
  ablation:
    - exchangeability-null delta_hat (shuffled_delta_gain) — the verdict-level discriminating control v1 lacked for this term
    - aligned_gain reported alongside — the attribution ledger must satisfy full_gain = aligned_gain + delta_gain exactly (asserted in the pilot path)
    - sweep THETA_O and N_O_TRAIN — outside the verdict; the increment should shrink as the gap vanishes or the gap estimate degrades
  seeds: 5

decision_rule:
  primary_metric: delta_gain
  rules:
    - max: 0.002
      verdict: DISCARD
    - min: 0.002
      max: 0.008
      verdict: OPTIMIZE
    - min: 0.008
      verdict: INTEGRATE
# band rationale (FROZEN before confirmatory, 2026-07-14):
#   DISCARD < 0.002 — set from the PER-UNIVERSE exchangeability-null band
#     (pilot shuffled -0.0011 std 0.0019, +2sigma ~ +0.0027, rounded down);
#     treated as indistinguishable from an information-free shift. See the
#     failure_condition precision note: on the MEAN-over-5 decision scale the
#     null band is tighter and this line is conservative.
#   OPTIMIZE [0.002, 0.008) — real but minority increment; the correction works
#     yet stays a small share of v1's +0.019 total, so it earns keep-and-tune,
#     not first-class-mechanism status.
#   INTEGRATE >= 0.008 — the correction alone contributes >~40% of v1's total
#     gain [FACT: v1 confirmatory +0.019, ADR-010]; only then is naming the
#     architecture after the skill-gap correction justified.
#   Pilot mean +0.0044 => honest expected verdict is OPTIMIZE. Restated
#   post-run (ADR-020 caveat 1 — prose only, bands untouched): the original
#   "DISCARD is live" argument compared the pilot PER-UNIVERSE min (+0.0027)
#   to the kill line, but the gate decides on the 5-seed MEAN — apples/
#   oranges. On the mean scale the pilot puts the kill line ~6 SE below the
#   expected mean ((0.0044-0.002)/(0.0009/sqrt(5))), so DISCARD by sampling
#   noise alone was unlikely; DISCARD stayed genuinely reachable via regime
#   failure only (biased/noisy delta_hat -> negative increment; v1 probe
#   -0.018), not via per-universe spread.
# self-check: metric✓ falsifiable✓ api✓ mvp✓ decision_rule✓
# non-strawman: the v2 baseline is the STRONGEST mechanism-light variant
#   (aligned fusion, delta_hat:=0 — the very probe that created ADR-010's
#   caveat), not v1's self-only baseline; clearing it requires exactly the
#   contested term. shuffled_delta_gain destroys only the skill information
#   (world, alignment, sample counts, fusion weight all held fixed). The
#   primary can be <= 0 (wrong-direction shift hurts; v1 probe -0.018).
# provenance: v1 spec/experiment/ADR-010 untouched — this is a new
#   preregistration; delta_gain numbers above are [FACT] from the 946000 pilot
#   (n=10) or [FACT] ADR-010, as tagged. Confirmatory = 946500..946504.
