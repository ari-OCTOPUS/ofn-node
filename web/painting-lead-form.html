<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painting enquiry</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#0f1a2b; --ink2:#54637a;
  --blue:#1257d2; --line:#dde4ee; --ok:#0e8a4f; --ok-bg:#e2f5eb;
  --warn:#b26a00; --warn-bg:#fdf0dc; --r:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);
  min-height:100vh;line-height:1.6;display:flex;justify-content:center;
  padding:24px 16px 40px}
.app{width:100%;max-width:440px}
h1{font-size:22px;margin-bottom:8px}
.lead{font-size:14px;color:var(--ink2);margin-bottom:18px}
form, .done{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;display:grid;gap:10px}
label{font-size:13px;font-weight:600}
input,textarea,select{
  width:100%;font-family:inherit;font-size:16px;padding:11px 12px;
  border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
button{
  font-family:inherit;font-size:16px;font-weight:700;padding:13px;
  border:0;border-radius:11px;background:var(--blue);color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.note{font-size:12px;color:var(--ink2)}
#status{font-size:14px;border-radius:11px;padding:10px 12px;display:none}
#status.ok{display:block;background:var(--ok-bg);color:var(--ok)}
#status.err{display:block;background:var(--warn-bg);color:var(--warn)}
footer{margin-top:16px;font-size:12px;color:var(--ink2);text-align:center}
</style>
</head>
<body>
<div class="app">
  <h1>Painting enquiry</h1>
  <p class="lead">Leave your details. They are stored on this device only.
  Nothing is emailed or messaged automatically.</p>
  <form id="f" method="post" action="/api/v1/public/painting/leads"
        enctype="application/x-www-form-urlencoded">
    <label for="name">Name</label>
    <input id="name" name="customer_name" required maxlength="120" autocomplete="name">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" maxlength="80" autocomplete="tel">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="160" autocomplete="email">
    <label for="suburb">Suburb</label>
    <input id="suburb" name="suburb" maxlength="120" autocomplete="address-level2">
    <label for="job">Job type</label>
    <input id="job" name="job_type" maxlength="160" placeholder="e.g. interior rooms">
    <label for="msg">Message</label>
    <textarea id="msg" name="message" maxlength="4000"></textarea>
    <p class="note">A phone number or an email is required. Status stays new.
    No outreach is started from this form.</p>
    <button type="submit" id="go">Store enquiry</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
  <footer>Local store only · outbound stays at zero</footer>
</div>
<script>
(function () {
  const form = document.getElementById("f");
  const status = document.getElementById("status");
  const go = document.getElementById("go");
  function show(kind, text) {
    status.className = kind;
    status.textContent = text;
  }
  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    const body = Object.fromEntries(new FormData(form).entries());
    go.disabled = true;
    show("", "");
    try {
      const r = await fetch("/api/v1/public/painting/leads", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const out = await r.json();
      if (!out.ok) {
        show("err", out.error || "Not stored.");
        go.disabled = false;
        return;
      }
      form.reset();
      show("ok", "Stored locally. Nothing was sent.");
    } catch (_) {
      show("err", "Could not reach this device. Nothing was sent.");
      go.disabled = false;
    }
  });
})();
</script>
</body>
</html>
