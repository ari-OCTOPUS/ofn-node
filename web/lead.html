<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لید نقاشی</title>
<!-- Font is an enhancement, not a gate: loaded as print media and promoted on
     load so a blocked font host never holds up the first paint. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Self-hosted. `fonts.gstatic.com` does not open reliably from Iran, and a
   font request that never completes is a wasted connection on exactly the
   network that can least afford one — as a render-blocking stylesheet it was
   a white screen for as long as the timeout took.
   One file: Vazirmatn is a variable font, so the whole 100-900 range comes
   from the same bytes. Downloading 400 and 600 separately gave two identical
   45 KB files, which is what the first attempt shipped.
   `swap` so text is readable immediately and simply improves when it lands. */
@font-face{
  font-family:'Vazirmatn';
  src:url('/font/vazirmatn.woff2') format('woff2');
  font-weight:100 900;
  font-display:swap;
}
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#0f1a2b; --ink2:#54637a; --ink3:#8d9bb0;
  --blue:#1257d2; --blue-d:#0b3f9e; --blue-soft:#e6eefc;
  --green:#0e8a4f; --green-soft:#e2f5eb;
  --amber:#b26a00; --amber-soft:#fdf0dc;
  --red:#c4342a; --red-soft:#fce8e6;
  --line:#dde4ee; --r:16px;
  /* Ordered by what is actually installed on these phones; ending at a
     Latin-first sans is what makes Persian look "broken". */
  --fa:'Vazirmatn','Vazir','IRANSans','IRANYekan','Sahel','Noto Naskh Arabic',
       'Noto Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--fa);background:var(--bg);color:var(--ink);
  min-height:100vh;line-height:1.7;display:flex;justify-content:center;padding-bottom:34px;
  -webkit-font-smoothing:antialiased}
.num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.app{inline-size:100%;max-inline-size:460px}

/* header */
header{background:linear-gradient(160deg,var(--blue-d),#1257d2 65%,#1c6ae8);
  color:#fff;padding:22px 20px 30px;border-end-start-radius:26px;border-end-end-radius:26px;
  box-shadow:0 6px 24px rgba(18,87,210,.22)}
.hrow{display:flex;align-items:center;gap:12px}
.av{inline-size:44px;block-size:44px;border-radius:13px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;font-size:21px;flex:none}
.hnm{font-size:18px;font-weight:700;letter-spacing:-.01em}
.hsub{font-size:12.5px;opacity:.82}
.live{margin-inline-start:auto;font-size:11.5px;background:rgba(255,255,255,.15);
  padding:5px 11px;border-radius:99px;display:flex;align-items:center;gap:6px}
.ld{inline-size:6px;block-size:6px;border-radius:50%;background:#7ef0a8;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}

.kpi{display:flex;gap:9px;margin-top:20px}
.k{flex:1;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.17);
  border-radius:13px;padding:12px 10px;text-align:center}
.kv{font-size:26px;font-weight:800;line-height:1.2}
.kl{font-size:11px;opacity:.8;margin-top:-1px}

.body{padding:20px}

/* section */
.sec{margin-bottom:22px}
.sh{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sh h2{font-size:15.5px;font-weight:700}
.cnt{background:var(--blue);color:#fff;font-size:11.5px;font-weight:700;
  padding:2px 9px;border-radius:99px}
.cnt.a{background:var(--amber)}

/* job card */
.job{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;margin-bottom:11px;box-shadow:0 2px 8px rgba(15,26,43,.045);transition:.2s}
.job.gone{opacity:.4}
.jtop{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.jt{font-size:16px;font-weight:700;line-height:1.5;flex:1}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;flex:none}
.badge.hot{background:var(--red-soft);color:var(--red)}
.badge.cool{background:#eef2f7;color:#64748b;border:1px solid #e2e8f0}
.badge.new{background:var(--green-soft);color:var(--green)}
.badge.wait{background:var(--amber-soft);color:var(--amber)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:11px}
.meta span{display:flex;align-items:center;gap:5px}
.price{background:var(--blue-soft);border:1px solid #c9dcfa;border-radius:11px;
  padding:11px 13px;margin-bottom:11px;display:flex;align-items:center;gap:11px}
.pv{font-size:22px;font-weight:800;color:var(--blue-d)}
.pl{font-size:12px;color:var(--ink2);line-height:1.6}
.warn{font-size:12px;background:var(--amber-soft);border:1px solid #f0dcb8;color:#7a4a00;
  border-radius:10px;padding:9px 11px;margin-bottom:11px;line-height:1.7}
.acts{display:flex;gap:8px}
.b{flex:1;padding:13px;border-radius:11px;border:1.5px solid var(--line);background:#fff;
  font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink2);cursor:pointer;transition:.15s}
.b:active{transform:scale(.97)}
.b.go{background:var(--blue);border-color:var(--blue);color:#fff;
  box-shadow:0 3px 12px rgba(18,87,210,.26)}
.b.no{color:var(--ink3)}
.b.call{background:var(--green);border-color:var(--green);color:#fff}
.res{padding:12px;border-radius:11px;font-size:13.5px;font-weight:600;text-align:center}
.res.ok{background:var(--green-soft);color:var(--green)}
.res.no{background:#eef1f6;color:var(--ink3)}

/* week strip */
.week{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;margin-bottom:12px}
.day{flex:none;inline-size:56px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:10px 6px;text-align:center}
.day.busy{background:var(--blue-soft);border-color:#c1d6f8}
.day.full{background:var(--red-soft);border-color:#f3ccc8}
.dn{font-size:11.5px;color:var(--ink3)}
.dd{font-size:18px;font-weight:800;line-height:1.4}
.dj{font-size:10.5px;color:var(--ink2);margin-top:1px}

footer{text-align:center;font-size:11.5px;color:var(--ink3);padding:0 20px;line-height:1.9}
.demo{display:inline-block;background:#e8ecf3;color:var(--ink2);padding:3px 11px;
  border-radius:8px;font-size:11px;font-weight:600;margin-bottom:7px}
.demo.offline{background:var(--red-soft);color:var(--red)}
.demo.livebadge{background:var(--green-soft);color:var(--green)}
.live.off{background:rgba(255,255,255,.1)}
.live.off .ld{background:#ffcf8a;animation:none}

/* connection state */
.state{border-radius:13px;padding:13px 15px;font-size:13.5px;line-height:1.8;
  margin-bottom:16px;border:1px solid var(--line);background:var(--card);color:var(--ink2)}
.state.warn{background:var(--amber-soft);border-color:#f0dcb8;color:#7a4a00}
.state.empty-warm{text-align:center;padding:28px 18px}
.state.empty-warm .sub{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.7}
.state b{color:var(--ink);font-weight:700}
.state button{font-family:inherit;font-size:13.5px;font-weight:700;margin-top:10px;
  padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer}

/* question card */
.qc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:17px;margin-bottom:11px;box-shadow:0 2px 8px rgba(15,26,43,.045)}
.qq{font-size:17px;font-weight:700;line-height:1.55;margin-bottom:7px}
.qh{font-size:13px;color:var(--ink2);line-height:1.8;margin-bottom:14px}
.qnum{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
.qv{font-size:42px;font-weight:800;min-inline-size:88px;text-align:center;
  font-variant-numeric:tabular-nums;color:var(--blue-d)}
.qu{text-align:center;font-size:12.5px;color:var(--ink3);margin-bottom:12px}
.qb{inline-size:46px;block-size:46px;border-radius:50%;border:1.5px solid var(--line);
  background:#fff;font-size:24px;color:var(--blue-d);cursor:pointer;font-family:inherit;
  display:grid;place-items:center}
.qb:active{transform:scale(.93)}
.qopt{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.qo{inline-size:100%;text-align:start;font-family:inherit;font-size:15.5px;font-weight:600;
  padding:15px 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  color:var(--ink);cursor:pointer}
.qo.pick{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-d)}
.qta{inline-size:100%;font-family:inherit;font-size:15.5px;line-height:1.8;color:var(--ink);
  padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;
  resize:vertical;min-block-size:100px}
.qerr{font-size:13px;color:var(--red);margin-top:9px}
.b:focus-visible,.qb:focus-visible,.qo:focus-visible,.qta:focus{outline:2px solid var(--blue);outline-offset:2px}



.crm{margin-bottom:22px}.crmgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.crmstat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;text-align:center}.crmv{font-size:24px;font-weight:800;color:var(--blue-d)}.crml{font-size:11px;color:var(--ink3)}.miniLead{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}.miniLead .leadmsg{font-size:12.5px;color:var(--ink2);line-height:1.8;margin-top:6px}.miniForm{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;display:grid;gap:8px}.miniForm input,.miniForm textarea{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink)}.miniForm textarea{min-height:80px;resize:vertical}.miniForm .tw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.crmbar{display:grid;grid-template-columns:1fr 140px;gap:8px;margin-bottom:12px}.crmbar input,.crmbar select{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink)}
.leadRow{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.leadRow .ltop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.leadRow .ltitle{font-size:15px;font-weight:700;color:var(--ink)}
.leadRow .lmeta{font-size:12px;color:var(--ink3);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px 12px}
.leadRow .lmsg{font-size:13px;color:var(--ink2);line-height:1.7;background:var(--bg);border-radius:9px;padding:9px 11px;margin:8px 0}
.leadRow .lexp{font-size:12px;color:var(--ink2);line-height:1.7;margin:6px 0;padding:7px 11px;border-radius:8px;background:rgba(99,102,241,.05);border-inline-start:3px solid rgba(99,102,241,.3)}
.leadRow .lacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.leadRow select.stsel{font-family:inherit;font-size:13px;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;color:var(--ink)}
.badge.wait{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:50}
.sheet .spanel{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:88vh;overflow-y:auto}
.sheet .shdr{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:12px}
.sheet textarea{width:100%;font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink);min-height:120px;resize:vertical;margin-bottom:10px}
.sheet .schans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sheet .schans button{font-family:inherit;font-size:13px;padding:11px 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.sheet .schans button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sheet input.amt{width:100%;font-family:inherit;font-size:18px;font-weight:700;border:1.5px solid var(--line);border-radius:11px;padding:12px;background:#fff;color:var(--ink);margin-bottom:10px;text-align:center}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="hrow">
    <div class="av">🎨</div>
    <div>
      <!-- Filled from the verified session. This carried a full name —
           surname included — to every unauthenticated visitor. -->
      <div class="hnm" id="hnm">&nbsp;</div>
      <div class="hsub" id="today"></div>
    </div>
    <div class="live"><span class="ld"></span>فعال</div>
  </div>
  <!-- No starting figures. These shipped as ۱۲ / ۵ / ۳ under real labels, and
       refreshKpis() only overwrites them when its read succeeds — so a failed
       fetch left three invented numbers on screen looking like today's. A dash
       is readable as "not yet"; a number is not. -->
  <div class="kpi">
    <div class="k"><div class="kv num">—</div><div class="kl">در حال خواندن…</div></div>
    <div class="k"><div class="kv num">—</div><div class="kl">در حال خواندن…</div></div>
    <div class="k"><div class="kv num">—</div><div class="kl">در حال خواندن…</div></div>
  </div>
</header>

<div class="body">

  <div class="state" id="state" hidden role="status" aria-live="polite"></div>
  <div id="live" hidden></div>
  <div class="crm" id="leadcrm" hidden></div>

  <!-- The sample job cards, week strip and fresh-lead list lived here.
       They shipped invented suburbs, prices and distances, and their
       buttons called ok(), which printed "✓ ایمیل رفت" without sending
       anything — the same fake-effect button the panel was cleared of.
       boot() removed them, but only after two early returns, so anyone
       who could not authenticate saw the whole fabricated dashboard.
       Real leads render into #leadcrm from the node. -->

</div>

<footer>
  <span class="demo">نمونه</span><br>
  بدون دکمهٔ تو هیچ ایمیلی نمی‌رود
</footer>

</div>

<script>
/* ── OFN connector ────────────────────────────────────────────────────────
   Tries the real API. If it is not there — opened as a plain file, or the
   node is down — the page keeps working on its sample data instead of
   showing an error. A design preview and the live app are the same file.   */
const OFN = (() => {
  let session = null, live = false, why = '', who = '';
  const tg = window.Telegram && window.Telegram.WebApp;


  async function req(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (session) headers['Authorization'] = 'Bearer ' + session;
    const r = await fetch(path, { ...opts, headers });
    if (!r.ok) {
      const err = new Error('http ' + r.status);
      err.status = r.status;
      throw err;
    }
    return r.json();
  }

  return {
    get live() { return live; },
    /* Why this page is not live, specifically. A node that is down and a page
       merely being previewed used to look identical from the footer. */
    get why() { return why; },
    /* The given name, from the verified session. Empty until then. */
    get who() { return who; },
    async connect() {
      if (!tg || !tg.initData) { why = 'no-shell'; return false; }
      try {
        const out = await req('/api/v1/auth/session', {
          method: 'POST',
          body: JSON.stringify({ init_data: tg.initData }),
        });
        session = out.session; who = out.first_name || '';
        live = true; why = '';
        return true;
      } catch (e) {
        why = (e && e.status === 401) ? 'rejected'
            : (e && e.status) ? 'error' : 'unreachable';
        return false;
      }
    },
    get(path) { return req(path); },
    post(path, body) {
      return req(path, { method: 'POST', body: JSON.stringify(body) });
    },
    /* Telegram chrome: theme, buttons, haptics. All optional — every call is
       guarded so the page also runs in a plain browser tab. */
    shell() {
      if (!tg) return;
      tg.ready();
      tg.expand && tg.expand();
      const apply = () => {
        const p = tg.themeParams || {};
        if (p.bg_color) document.documentElement.style.setProperty('--tg-bg', p.bg_color);
      };
      apply();
      tg.onEvent && tg.onEvent('themeChanged', apply);
    },
    tap(style = 'light') {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(style);
      else if (navigator.vibrate) navigator.vibrate(8);
    },
    done(kind = 'success') {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(kind);
      else if (navigator.vibrate) navigator.vibrate([10, 40, 10]);
    },
  };
})();

const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;   // never innerHTML for node data
  return n;
};
function escLike(s) { return s.replace(/[%_\\]/g, '\\$&'); }

/* Sample-card handler. Preview only — it posts nothing, and when the page is
   not live these buttons are disabled outright rather than left to report a
   send that never happened. */


/* ── live questions ──────────────────────────────────────────────────────
   Same contract as the other shells: the node ranks them, the pack words
   them, this renders them. Abbas answers outdoors, so the controls are big
   and there is exactly one card on screen at a time.                      */
const LIVE = document.getElementById('live');
let queue = [], at = 0;

function card(q) {
  const wrap = el('div', 'qc');
  wrap.append(el('div', 'qq', q.label));
  if (q.hint) wrap.append(el('div', 'qh', q.hint));
  if (!q.has_label) wrap.append(el('div', 'qh', 'متن این سؤال هنوز در پک نوشته نشده.'));

  const err = el('div', 'qerr');
  err.hidden = true;
  let read = () => null;

  if (q.kind === 'number') {
    const lo = q.min != null ? q.min : 0;
    const hi = q.max != null ? q.max : 1e9;
    const stepBy = hi - lo > 200 ? 10 : 1;
    let val = q.default != null ? q.default : Math.max(lo, 1);
    const out = el('div', 'qv', fa(val));
    out.setAttribute('aria-live', 'polite');
    const row = el('div', 'qnum');
    const move = d => { val = Math.max(lo, Math.min(hi, val + d)); out.textContent = fa(val); OFN.tap(); };
    const minus = el('button', 'qb', '−');
    minus.type = 'button'; minus.setAttribute('aria-label', 'کمتر');
    minus.onclick = () => move(-stepBy);
    const plus = el('button', 'qb', '+');
    plus.type = 'button'; plus.setAttribute('aria-label', 'بیشتر');
    plus.onclick = () => move(stepBy);
    row.append(minus, out, plus);
    wrap.append(row);
    if (q.unit) wrap.append(el('div', 'qu', q.unit));
    read = () => val;

  } else if (q.kind === 'choice' || q.kind === 'confirm') {
    const opts = q.kind === 'confirm' ? ['بله', 'نه'] : (q.options || []);
    const box = el('div', 'qopt');
    let chosen = null;
    opts.forEach(opt => {
      const b = el('button', 'qo', opt);
      b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.onclick = () => {
        box.querySelectorAll('.qo').forEach(x => {
          x.classList.remove('pick'); x.setAttribute('aria-pressed', 'false');
        });
        b.classList.add('pick'); b.setAttribute('aria-pressed', 'true');
        chosen = q.kind === 'confirm' ? (opt === 'بله') : opt;
        OFN.tap();
      };
      box.append(b);
    });
    wrap.append(box);
    read = () => chosen;

  } else {
    const ta = el('textarea', 'qta');
    ta.placeholder = q.placeholder || '';
    ta.setAttribute('aria-label', q.label);
    wrap.append(ta);
    read = () => ta.value.trim() || null;
  }

  const go = el('button', 'b go', 'ثبت کن');
  go.type = 'button';
  go.style.marginTop = '14px';
  go.onclick = async () => {
    const value = read();
    if (value === null || value === '') {
      err.textContent = 'اول جواب را انتخاب کن.'; err.hidden = false; return;
    }
    err.hidden = true; go.disabled = true; go.textContent = 'در حال ثبت…';
    try {
      const out = await OFN.post('/api/v1/answers', { key: q.key, value });
      if (!out.ok) {
        err.textContent = out.error || 'ثبت نشد.'; err.hidden = false;
        go.disabled = false; go.textContent = 'دوباره'; return;
      }
      OFN.done();
      queue = out.remaining || []; at = 0;
      draw();
      refreshKpis();
    } catch (e) {
      /* A session lasts an hour; that is not a network fault and must not be
         reported as one. */
      err.textContent = e && e.status === 401
        ? 'وقت این صفحه تمام شد. جواب ثبت نشده — برنامه را ببند و دوباره باز کن.'
        : 'به دستگاه وصل نشد. جواب ثبت نشده — دوباره بزن.';
      err.hidden = false; go.disabled = false; go.textContent = 'دوباره';
    }
  };
  const later = el('button', 'b', 'بعداً');
  later.type = 'button';
  later.style.marginTop = '8px';
  later.onclick = () => { at += 1; draw(); };


  wrap.append(go, later, err);

  /* Deferring a question used to be one-way: "بعداً" moved forward and
     nothing came back. A question skipped by accident was then unreachable
     until the queue was rebuilt, which is the same shape of trap the piece
     form had. */
  if (at > 0) {
    const back = el('button', 'b', 'سؤال قبلی');
    back.type = 'button';
    back.onclick = () => { OFN.tap(); at -= 1; draw(); };
    wrap.append(back);
  }
  return wrap;
}

function draw() {
  LIVE.textContent = '';
  const head = el('div', 'sh');
  if (at < queue.length) {
    head.append(el('h2', null, 'دستگاه از تو می‌پرسد'),
                el('span', 'cnt a', fa(queue.length - at)));
    LIVE.append(head, card(queue[at]));
  } else {
    head.append(el('h2', null, 'سؤالی نمانده'));
    const note = el('div', 'qc');
    note.append(el('div', 'qq', 'همه چیز ثبت شده'),
                el('div', 'qh', 'وقتی چیز تازه‌ای لازم باشد، همین‌جا ظاهر می‌شود.'));
    LIVE.append(head, note);
  }
}

async function refreshKpis() {
  try {
    const st = await OFN.get('/api/v1/status');
    const kv = document.querySelectorAll('.kv');
    const kl = document.querySelectorAll('.kl');
    if (kv[0]) { kv[0].textContent = `${fa(st.readiness.done)}/${fa(st.readiness.total)}`; kl[0].textContent = 'آماده‌سازی'; }
    if (kv[1]) { kv[1].textContent = fa(st.pending_decisions || 0); kl[1].textContent = 'منتظر آری'; }
    if (kv[2]) { kv[2].textContent = fa(st.capacity_per_week || 0); kl[2].textContent = 'ظرفیت هفته'; }
    return st;
  } catch (_) {
    /* Say the reading is unavailable rather than leaving the previous one
       standing. A stale number under a live label is the failure this shell
       already had once. */
    document.querySelectorAll('.kv').forEach(n => { n.textContent = '—'; });
    document.querySelectorAll('.kl').forEach(n => { n.textContent = 'در دسترس نیست'; });
    return null;
  }
}



/* ── live lead CRM ───────────────────────────────────────────────────── */
function miniStat(label, value){const n=el('div','crmstat');n.append(el('div','crmv num',fa(value||0)),el('div','crml',label));return n;}
function miniInput(ph,name,type='text'){const i=document.createElement(type==='textarea'?'textarea':'input'); if(type!=='textarea')i.type=type; i.placeholder=ph; i.name=name; return i;}
function miniFormData(f){const o={};[...f.elements].forEach(x=>{if(x.name)o[x.name]=x.value});return o;}
async function refreshLeadCrm(){
  const box=document.getElementById('leadcrm'); if(!box) return;
  try{
    const d=await OFN.get('/api/v1/painting/dashboard');
    if(!d.ok) throw new Error(d.error||'');
    box.hidden=false; box.textContent='';
    const grid=el('div','crmgrid'); grid.append(miniStat('باز',d.open_leads),miniStat('داغ',d.hot_leads),miniStat('کانال',d.connected_channels)); box.append(grid);
    const f=el('form','miniForm'); const tw=el('div','tw'); tw.append(miniInput('نام','customer_name'),miniInput('تلفن','phone')); f.append(tw,miniInput('محله','suburb'),miniInput('نوع کار','job_type'),miniInput('پیام','message','textarea'));
    const b=el('button','b go','ثبت لید دستی'); b.type='submit'; f.append(b); f.onsubmit=async ev=>{ev.preventDefault();b.disabled=true;try{const out=await OFN.post('/api/v1/painting/leads',miniFormData(f));if(!out.ok)throw new Error(out.error||'ثبت نشد');f.reset();OFN.done();refreshLeadCrm();}catch(e){alert(e.message||'ثبت نشد')}finally{b.disabled=false;}}; box.append(f);
    /* search + filter bar */
    const bar=el('div','crmbar');
    const si=el('input'); si.type='search'; si.placeholder='جستجوی نام، محله، نوع کار، پیام…'; si.value=LEAD.q;
    const ss=el('select');
    [{v:'',t:'همهٔ حالت‌ها'},{v:'new',t:'تازه'},{v:'review',t:'بازبینی'},{v:'contacted',t:'در تماس'},{v:'quoted',t:'قیمت داده'},{v:'won',t:'برد'},{v:'lost',t:'باخت'},{v:'spam',t:'هرز'},{v:'archived',t:'بایگانی'}].forEach(o=>{const op=el('option','',o.t); op.value=o.v; if(o.v===LEAD.status)op.selected=true; ss.append(op);});
    bar.append(si,ss);
    box.append(bar);
    let to;
    si.oninput=()=>{clearTimeout(to);to=setTimeout(()=>{LEAD.q=escLike(si.value.trim());LEAD.offset=0;drawList();},350);};
    ss.onchange=()=>{LEAD.status=ss.value;LEAD.offset=0;drawList();};
    /* list container */
    const list=el('div'); list.id='leadlist'; box.append(list);
    /* footer note: who approves outbound */
    box.append(el('div','state','پیام و قیمت اول به آری می‌رسد؛ بعد از تأیید او خارج می‌شود.'));
    drawList();
    /* also keep the recent-mini cards below for at-a-glance */
    (d.recent_leads||[]).slice(0,4).forEach(l=>{const c=el('div','miniLead'); const t=el('div','jt',l.job_type||l.customer_name||'لید'); c.append(t); const m=el('div','meta'); [l.customer_name,l.phone,l.suburb,l.source,l.score!=null?'امتیاز '+fa(l.score):''].filter(Boolean).forEach(x=>m.append(el('span',null,x))); c.append(m); if(l.message)c.append(el('div','leadmsg',l.message)); box.append(c);});
  }catch(e){ box.hidden=false; box.textContent=''; box.append(el('div','state warn','داشبورد لید هنوز آماده نیست.')); }
}

/* ── lead list: search, filter, status change, reply/quote ────────────── */
const LEAD={q:'',status:'',offset:0,busy:false};
const STATUS_LABEL={new:'تازه',review:'بازبینی',contacted:'در تماس',quoted:'قیمت داده',won:'برد',lost:'باخت',spam:'هرز',archived:'بایگانی'};
async function drawList(){
  const list=document.getElementById('leadlist'); if(!list)return;
  list.textContent='';
  list.append(el('div','state','در حال آوردن لیدها…'));
  try{
    const params=new URLSearchParams();
    if(LEAD.q)params.set('q',escLike(LEAD.q));
    if(LEAD.status)params.set('status',LEAD.status);
    const d=await OFN.get('/api/v1/painting/leads'+(params.toString()?'?'+params:''));
    list.textContent='';
    if(!d.ok){list.append(el('div','state warn','الان نمی‌توانم لیدها را بیاورم. دوباره تلاش کن.'));return;}
    const leads=d.leads||[];
    if(!leads.length){
      /* Distinguish "filter found nothing" from "genuinely no leads yet".
         Both are honest, but the call to action differs. */
      if(LEAD.q||LEAD.status){
        list.append(el('div','state','هیچ لیدی با این فیلتر پیدا نشد. فیلتر را عوض کن یا پاک کن.'));
      }else{
        const empty=el('div','state empty-warm');
        empty.append(el('div','', 'هنوز لیدی نرسیده.'));
        empty.append(el('div','sub','وقتی اولین لید بیاید، اینجا می‌بینیش. می‌توانی از بالا خودت یک لید ثبت کنی.'));
        list.append(empty);
      }
      return;
    }
    leads.forEach(l=>list.append(leadRow(l)));
  }catch(e){ list.textContent=''; list.append(el('div','state warn','نمی‌توان لیدها را آورد.')); }
}
function leadRow(l){
  const c=el('div','leadRow');
  const top=el('div','ltop');
  top.append(el('div','ltitle',l.job_type||l.customer_name||'لید'));
  /* priority badge from score_detail recommendation, not just the raw number.
     The model says owner_review / follow_up / nurture — these are warmer and
     more honest than "داغ/نرمال". Falls back to the integer score gracefully. */
  const sd=l.score_detail||{};
  const rec=sd.recommendation||'';
  if(rec==='owner_review'){top.append(el('span','badge hot','اولویت بالا'));}
  else if(rec==='follow_up'){top.append(el('span','badge','پیگیری کن'));}
  else if(rec==='nurture'){top.append(el('span','badge cool','بعداً'));}
  else if(l.score!=null&&l.score>=70){top.append(el('span','badge hot','اولویت بالا'));}
  else if(l.score!=null&&l.score>=40){top.append(el('span','badge','پیگیری کن'));}
  c.append(top);
  const meta=el('div','lmeta');
  [l.customer_name,l.phone,l.suburb,l.source,l.score!=null?'امتیاز '+fa(l.score):''].filter(Boolean).forEach(x=>meta.append(el('span',null,x)));
  c.append(meta);
  /* if the model left a plain-language explanation, show it — it is already
     in warm Persian and tells the partner *why* this priority. */
  if(sd.explanation&&sd.explanation.length){
    const ex=el('div','lexp',sd.explanation.join(' '));
    c.append(ex);
  }
  if(l.message)c.append(el('div','lmsg',l.message));
  /* status dropdown */
  const acts=el('div','lacts');
  const sel=el('select','stsel');
  ['new','review','contacted','quoted','won','lost','spam','archived'].forEach(s=>{const op=el('option','',STATUS_LABEL[s]||s); op.value=s; if(s===l.status)op.selected=true; sel.append(op);});
  sel.onchange=async()=>{
    try{const out=await OFN.post('/api/v1/painting/leads/'+encodeURIComponent(l.lead_id),{status:sel.value});if(!out.ok)throw new Error(out.error||'ذخیره نشد');OFN.done();}
    catch(e){alert(e.message||'ذخیره نشد');drawList();}
  };
  acts.append(sel);
  /* reply button */
  const rb=el('button','b','جواب بنویس'); rb.type='button';
  rb.onclick=()=>openReplySheet(l);
  acts.append(rb);
  /* quote button */
  const qb=el('button','b go','قیمت بده'); qb.type='button';
  qb.onclick=()=>openQuoteSheet(l);
  acts.append(qb);
  c.append(acts);
  return c;
}
function closeSheet(){const s=document.querySelector('.sheet');if(s)s.remove();}
function openReplySheet(l){
  closeSheet();
  const sheet=el('div','sheet');
  const p=el('div','spanel');
  p.append(el('div','shdr','جواب برای '+(l.customer_name||'این لید')));
  const ta=el('textarea'); ta.placeholder='متن جواب…'; p.append(ta);
  const chans=el('div','schans');
  let chan='note';
  const mkBtn=(v,t)=>{const b=el('button','',t); if(v==='note')b.classList.add('on'); b.onclick=()=>{chan=v;[...chans.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');}; return b;};
  chans.append(mkBtn('note','یادداشت'),mkBtn('sms','پیامک'),mkBtn('email','ایمیل'));
  p.append(chans);
  const note=el('div','state','یادداشت فقط اینجا ثبت می‌شود. پیامک و ایمیل بعد از تأیید آری خارج می‌شوند.');
  p.append(note);
  const send=el('button','b go','آماده برای آری'); send.type='button';
  send.onclick=async()=>{
    const msg=ta.value.trim(); if(!msg){alert('متن خالی است');return;}
    send.disabled=true;
    try{
      const out=await OFN.post('/api/v1/painting/leads/'+encodeURIComponent(l.lead_id)+'/reply',{channel:chan,message:msg});
      if(!out.ok)throw new Error(out.error||'نشست');
      OFN.done();closeSheet();
      alert(out.queued?'به آری فرستاده شد — منتظر تأیید اوست.':'ثبت شد.');
      drawList();
    }catch(e){alert(e.message||'نشست');}finally{send.disabled=false;}
  };
  p.append(send);
  sheet.append(p);
  sheet.onclick=e=>{if(e.target===sheet)closeSheet();};
  document.body.append(sheet);
}
function openQuoteSheet(l){
  closeSheet();
  const sheet=el('div','sheet');
  const p=el('div','spanel');
  p.append(el('div','shdr','قیمت برای '+(l.customer_name||'این لید')));
  const amt=el('input','amt'); amt.type='number'; amt.inputMode='decimal'; amt.placeholder='قیمت (دلار)'; amt.min='0'; p.append(amt);
  const ta=el('textarea'); ta.placeholder='توضیح قیمت (اختیاری)…'; p.append(ta);
  const note=el('div','state','قیمت بعد از تأیید آری به مشتری می‌رسد.');
  p.append(note);
  const send=el('button','b go','آماده برای آری'); send.type='button';
  send.onclick=async()=>{
    const a=parseFloat(amt.value||'0'); if(!(a>0)){alert('قیمت درست نیست');return;}
    send.disabled=true;
    try{
      const out=await OFN.post('/api/v1/painting/leads/'+encodeURIComponent(l.lead_id)+'/quote',{amount:a,note:ta.value.trim()});
      if(!out.ok)throw new Error(out.error||'نشست');
      OFN.done();closeSheet();
      alert('قیمت به آری فرستاده شد — منتظر تأیید اوست.');
      drawList();
    }catch(e){alert(e.message||'نشست');}finally{send.disabled=false;}
  };
  p.append(send);
  sheet.append(p);
  sheet.onclick=e=>{if(e.target===sheet)closeSheet();};
  document.body.append(sheet);
}

/* ── boot ──────────────────────────────────────────────────────────────── */
const REASONS = {
  'no-shell': ['نمونه', 'این صفحه <b>نمونه</b> است. کارهایی که اینجا می‌زنی هیچ‌جا ثبت نمی‌شود — نسخهٔ زنده از داخل تلگرام باز می‌شود.'],
  'unreachable': ['قطع', 'به دستگاه وصل نشد. کارت‌های زیر <b>نمونه</b>اند، نه لید واقعی.'],
  'rejected': ['ورود نشد', 'دستگاه این ورود را نپذیرفت. به آری بگو — کارت‌های زیر <b>نمونه</b>اند.'],
  'error': ['خطا', 'دستگاه با خطا جواب داد. کارت‌های زیر <b>نمونه</b>اند.'],
};

function showState(kind) {
  const [tag, text] = REASONS[kind] || REASONS['error'];
  const badge = document.querySelector('.demo');
  if (badge) { badge.textContent = tag; badge.classList.add('offline'); }
  const pill = document.querySelector('.live');
  if (pill) { pill.classList.add('off'); pill.lastChild.textContent = tag; }
  const box = document.getElementById('state');
  box.hidden = false;
  box.className = 'state warn';
  box.textContent = '';
  const p = el('div');
  p.innerHTML = text;              // fixed strings above; no data interpolated
  box.append(p);
  if (kind !== 'no-shell') {
    const retry = el('button', null, 'دوباره تلاش کن');
    retry.type = 'button';
    retry.onclick = () => location.reload();
    box.append(retry);
  }
  /* Nothing in a preview may look operable: "ایمیل بفرست" reporting success
     against a node that never saw the request is the worst screen in the app. */
  document.querySelectorAll('.body .b').forEach(b => {
    b.disabled = true; b.style.opacity = '.5'; b.style.pointerEvents = 'none';
  });
}

/* The header ships with no name in it. This is the only thing that ever puts
   one there, and it runs after the session exists, via textContent —
   signed or not, a display name is somebody's own text. */
function greet(name) {
  const nm = document.getElementById('hnm');
  if (nm) nm.textContent = name || ' ';
}

async function boot() {
  OFN.shell();
  /* The header carried a fixed date, so it read "دوشنبه ۱۲ مرداد" on every
     day of the year. The platform can format a Jalali date without a library;
     if it cannot, the line stays empty rather than wrong. */
  try {
    const t = document.getElementById('today');
    if (t) t.textContent = new Intl.DateTimeFormat('fa-IR',
      { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
  } catch (_) { /* leave it blank */ }
  const connected = await OFN.connect();
  if (!connected) { showState(OFN.why); return; }
  greet(OFN.who);

  const badge = document.querySelector('.demo');
  if (badge) { badge.textContent = 'زنده'; badge.classList.add('livebadge'); }

  let qs;
  try {
    qs = await OFN.get('/api/v1/questions');
  } catch (_) { showState('unreachable'); return; }
  const st = await refreshKpis();

  LIVE.hidden = false;
  queue = qs.questions || [];
  at = 0;
  draw();

  /* The CRM was built, styled and endpoint-backed, and nothing on the boot
     path ever called it — so `#leadcrm` stayed hidden and the partner opened
     the app to no CRM at all. Not awaited: it handles its own failures, and
     the question flow above must not wait on a dashboard read.
     Pinned by tests/test_shell_reachability.py. */
  refreshLeadCrm().catch(e => console.error('refreshLeadCrm failed:', e));

  if (st && st.safe_mode) {
    const box = document.getElementById('state');
    box.hidden = false;
    box.className = 'state warn';
    box.textContent = 'دستگاه در حالت ایمن است. جواب‌ها ثبت می‌شوند ولی هیچ کاری بیرون نمی‌رود.';
  }
}
document.addEventListener('DOMContentLoaded', () => boot().catch(e => console.error('boot failed:', e)));
</script>
