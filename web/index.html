<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><script defer src="https://telegram.org/js/telegram-web-app.js"></script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>آرام‌جا</title><style>@font-face{font-family:Vazirmatn;src:url('/font/vazirmatn.woff2') format('woff2');font-weight:100 900;font-display:swap}:root{color-scheme:dark;--bg:#111217;--soft:#303448;--ink:#f7efe8;--muted:#b9b1a8;--line:#3d425a;--gold:#f2bd55;--ok:#74d69a;--bad:#ff8b8b;--r:22px;--fa:Vazirmatn,Tahoma,system-ui,sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--fa);background:radial-gradient(560px 300px at 80% -10%,rgba(126,45,77,.36),transparent),radial-gradient(500px 300px at 5% 105%,rgba(242,189,85,.16),transparent),var(--bg);color:var(--ink);min-height:100dvh;line-height:1.85;padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom))}.app{max-width:460px;margin:auto;padding:20px 16px}.eyebrow{color:var(--gold);font-size:13px}h1{font-size:25px}.sub,.status,.meta{color:var(--muted);font-size:13px}.panel{background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin:12px 0;box-shadow:0 22px 50px rgba(0,0,0,.25)}.notice{background:rgba(126,45,77,.18)}.row,.grid{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr}.chip,.btn{font-family:inherit;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:15px;padding:10px 13px;cursor:pointer}.chip.on,.btn.primary{border-color:var(--gold);background:var(--gold);color:#14100c;font-weight:800}.btn.ok{border-color:var(--ok)}.chat{display:flex;flex-direction:column;gap:10px;min-height:180px;max-height:48dvh;overflow:auto}.msg{border-radius:18px;padding:12px 14px;font-size:14.5px;white-space:pre-wrap}.user{align-self:flex-start;background:rgba(242,189,85,.14)}.bot{align-self:stretch;background:rgba(255,255,255,.06);border:1px solid var(--line)}.err{border-color:var(--bad);color:#ffdede}.composer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(0deg,#101116 78%,transparent);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:10}.composer-inner{max-width:460px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:9px}.input,.field{font-family:inherit;font-size:16px;color:var(--ink);background:#171923;border:1px solid var(--line);border-radius:17px;padding:12px;width:100%}.ackbox{display:flex;gap:10px;font-size:13px;color:#eaded1}.ackbox input{margin-top:8px;accent-color:var(--gold)}dialog{border:1px solid var(--line);background:#1b1d27;color:var(--ink);border-radius:22px;max-width:440px;width:calc(100% - 28px);margin:auto;padding:18px;max-height:88vh;overflow-y:auto}dialog::backdrop{background:rgba(0,0,0,.65)}label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}textarea.field{min-height:130px}input[type=range]{width:100%;accent-color:var(--gold);margin:4px 0}.doc{border-top:1px solid var(--line);padding:10px 0;font-size:12.5px;color:var(--muted);position:relative}.doc b{color:var(--ink);font-size:13.5px}.delx{position:absolute;top:8px;left:8px;width:22px;height:22px;border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:.5}.delx:hover{opacity:1}.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid var(--line)}.tab{flex:1;padding:10px 4px;text-align:center;font-size:13px;font-family:inherit;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;margin-bottom:-2px}.tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}.tabpane{display:none}.tabpane.on{display:block}.slider-row{display:flex;align-items:center;gap:10px;margin:8px 0}.slider-row label{margin:0;flex:0 0 90px;font-size:13px;color:var(--ink)}.slider-row input[type=range]{flex:1}.slider-row .sv{flex:0 0 30px;text-align:center;color:var(--gold);font-weight:700;font-size:15px}.verdict{padding:14px;border-radius:14px;margin:12px 0;text-align:center;font-size:16px;font-weight:700}.verdict.green{background:rgba(116,214,154,.15);color:var(--ok);border:1px solid var(--ok)}.verdict.yellow{background:rgba(242,189,85,.15);color:var(--gold);border:1px solid var(--gold)}.verdict.red{background:rgba(255,139,139,.15);color:var(--bad);border:1px solid var(--bad)}</style></head><body><div class="app"><header><div class="eyebrow">آرام‌جا</div><h1>دستیار شخصی خودهیپنوتیزمی</h1><p class="sub">حافظه‌دار، علمی، امن، قابل‌خروجی.</p></header><section class="panel notice">قبل از هر جلسه، مغز از دانش و حافظهٔ تو priming می‌گیرد. درمان پزشکی یا کنترل ذهن نیست.</section><section class="panel"><div class="row" id="modes"><button class="chip on" data-mode="calm">آرام‌سازی</button><button class="chip" data-mode="focus">تمرکز</button><button class="chip" data-mode="sleep">خواب</button><button class="chip" data-mode="learn">یادگیری</button><button class="chip" data-mode="custom">شخصی</button></div><label class="ackbox"><input id="ack" type="checkbox"> <span>الان در جای امن هستم و هر لحظه می‌توانم توقف کنم.</span></label><div class="status" id="status">در حال اتصال…</div></section><section class="panel"><div class="grid"><button class="btn primary" id="start">شروع جلسه</button><button class="btn" id="learn">آموزش</button><button class="btn" id="remember">حافظه</button><button class="btn" id="note">یادداشت امروز</button><button class="btn" id="notes">یادداشت‌ها</button><button class="btn" id="lab">آزمایشگاه</button><button class="btn" id="control">پژوهش</button><button class="btn ok" id="brain">وضعیت مغز</button><button class="btn" id="obsidian">خروجی</button></div></section><section class="panel"><div class="chat" id="chat"></div></section></div><div class="composer"><div class="composer-inner"><textarea class="input" id="text" rows="1" placeholder="پیامت را بنویس…"></textarea><button class="btn primary" id="send">ارسال</button></div></div>

<dialog id="memDialog"><h3>حافظه شخصی</h3><label>نوع</label><input class="field" id="memKind" value="preference"><label>متن</label><textarea class="field" id="memText"></textarea><div class="row"><button class="btn primary" id="saveMem">ذخیره</button><button class="btn" onclick="memDialog.close()">بستن</button></div></dialog>
<dialog id="ragDialog"><h3>منبع علمی</h3><label>عنوان</label><input class="field" id="ragTitle"><label>متن</label><textarea class="field" id="ragText"></textarea><div class="row"><button class="btn primary" id="saveRag">افزودن</button><button class="btn" onclick="ragDialog.close()">بستن</button></div></dialog>
<dialog id="noteDialog"><h3>یادداشت امروز</h3><textarea class="field" id="noteText" placeholder="هر چی امروز تو ذهنته بنویس…"></textarea><div class="row"><button class="btn primary" id="saveNote">ذخیره</button><button class="btn" onclick="noteDialog.close()">بستن</button></div></dialog>
<dialog id="notesListDialog"><h3>یادداشت‌های تو</h3><div id="notesList"></div><div class="row" style="margin-top:12px"><button class="btn" id="noteAddMore">یادداشت تازه</button><button class="btn" onclick="notesListDialog.close()">بستن</button></div></dialog>

<dialog id="labDialog"><h3>آزمایشگاه شخصی</h3><div class="tabs"><button class="tab on" data-ltab="eq">معادلات</button><button class="tab" data-ltab="read">مقاله‌ها</button><button class="tab" data-ltab="play">بازی</button></div>
<div class="tabpane on" id="lEq"><label>ارزیابی امروز (۰ تا ۱۰)</label><div class="slider-row"><label>بدن</label><input type="range" id="slB" min="0" max="10" value="5"><span class="sv" id="slBv">۵</span></div><div class="slider-row"><label>خود</label><input type="range" id="slC" min="0" max="10" value="5"><span class="sv" id="slCv">۵</span></div><div class="slider-row"><label>ابرموجود</label><input type="range" id="slX" min="0" max="10" value="5"><span class="sv" id="slXv">۵</span></div><button class="btn primary" id="eqRun" style="width:100%;margin-top:8px">حکم امروز</button><div id="eqResult"></div></div>
<div class="tabpane" id="lRead"><input class="field" id="readQ" placeholder="جستجو در مقاله‌ها…"><button class="btn" id="readSearch" style="margin-top:6px">جستجو</button><div id="readList" style="margin-top:10px"></div></div>
<div class="tabpane" id="lPlay"><p class="sub">سناریو را بخون و حدس بزن حکم چی میشه.</p><div id="quizScenario" style="margin:12px 0;font-size:15px"></div><div class="row" id="quizBtns"><button class="btn" data-q="سبز">سبز</button><button class="btn" data-q="زرد">زرد</button><button class="btn" data-q="قرمز">قرمز</button></div><div id="quizResult"></div><button class="btn primary" id="quizNext" style="width:100%;margin-top:10px;display:none">سناریوی بعدی</button></div>
<div class="row" style="margin-top:14px"><button class="btn" onclick="labDialog.close()">بستن</button></div></dialog>

<dialog id="ctlDialog"><h3>پژوهش</h3><div id="ctlStats" style="margin-bottom:10px"></div><input class="field" id="ctlQ" placeholder="جستجو…" style="margin-bottom:6px"><div class="row" style="margin-bottom:10px"><button class="btn" id="searchCtl">جستجو</button><button class="btn" id="cleanupCtl">پاک‌سازی</button><button class="btn" id="importCtl">وارد کردن</button></div><div id="ctlList"></div><div class="row" style="margin-top:12px"><button class="btn" onclick="ctlDialog.close()">بستن</button></div></dialog>

<script>const tg=()=>window.Telegram&&window.Telegram.WebApp;let mode='calm',initData='';const E=id=>document.getElementById(id);const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function add(r,t,m='',cls=''){let d=document.createElement('div');d.className='msg '+(r==='user'?'user':'bot')+' '+cls;d.textContent=t;if(m){let x=document.createElement('div');x.className='meta';x.textContent=m;d.appendChild(x)}E('chat').appendChild(d);E('chat').scrollTop=E('chat').scrollHeight}
function authHint(){return 'اگر خطای ورود دیدی: مینی‌اپ را ببند و فقط از دکمهٔ همین ربات باز کن.'}
async function api(p,b={}){b.initData=initData;let h={'Content-Type':'application/json'};if(initData)h.Authorization='tma '+initData;let r=await fetch(p,{method:'POST',headers:h,body:JSON.stringify(b)});let j=await r.json().catch(()=>({ok:0,error:'خطا'}));if(!j.ok&&j.code)add('bot','خطا: '+(j.error||'')+'\n'+authHint(),j.code,'err');return j}
async function get(p){let h={};if(initData)h.Authorization='tma '+initData;let r=await fetch(p,{headers:h});return r.json()}
async function boot(){try{let T=tg();if(T){T.ready();T.expand();try{T.enableClosingConfirmation&&T.enableClosingConfirmation()}catch(e){}initData=T.initData||''}let j=await api('/api/session',{mode,safety_acknowledged:E('ack').checked});E('status').innerHTML=j.ok?'<b style="color:var(--ok)">آماده</b> · '+(j.brain||'')+' · '+fa(j.research_docs||0)+' منبع':'خطا: '+(j.error||'ورود');if(j.ok)add('bot',j.message||'آماده','ورود موفق');else add('bot',authHint(),'خطا','err')}catch(e){E('status').textContent='خطا: '+e;add('bot','خطای اتصال','راه‌اندازی','err')}}
async function send(t){t=(t||E('text').value).trim();if(!t)return;E('text').value='';add('user',t);let j=await api('/api/chat',{text:t,mode,safety_acknowledged:E('ack').checked});if(j.ok)add('bot',j.reply||j.error,(j.source||'')+' · '+(j.safety||'')+(j.primed_chunks?' · '+fa(j.primed_chunks)+' منبع':''))}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;api('/api/session',{mode,safety_acknowledged:E('ack').checked})});
E('send').onclick=()=>send();E('text').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
E('start').onclick=()=>{let extra=prompt('اگر می‌خوای، خواب و هوس و استرس امروزت را ۰ تا ۱۰ بنویس (اختیاری).\nمثلاً: خواب ۳ هوس ۷ استرس ۵\nیا خالی بگذار تا فقط جلسه شروع شه.');if(extra===null)return;send(extra?('شروع جلسه، '+extra):'شروع جلسه')};
E('learn').onclick=()=>send('خودهیپنوتیزمی را مرحله به مرحله یاد بده');
E('remember').onclick=()=>memDialog.showModal();E('note').onclick=()=>noteDialog.showModal();E('notes').onclick=()=>notes();E('lab').onclick=()=>labDialog.showModal();E('control').onclick=ctl;E('brain').onclick=async()=>{let j=await api('/api/brain/status',{mode});if(j.ok)add('bot','مغز: '+(j.brain||'')+'\nحافظه: '+fa(j.memory_count)+'\nپیام: '+fa(j.message_count)+'\nمنبع: '+fa(j.research_docs),'مغز')};E('obsidian').onclick=async()=>{let j=await api('/api/obsidian/export',{mode});if(j.ok){add('bot','خروجی ساخته شد ✅\nفایل‌ها: '+fa(j.files||0),'خروجی');window.open(j.download_url,'_blank')}};
E('saveMem').onclick=async()=>{let j=await api('/api/memory',{kind:E('memKind').value,content:E('memText').value});if(j.ok){add('bot','حافظه ثبت شد ✅','حافظه');memDialog.close()}};
E('saveRag').onclick=async()=>{let j=await api('/api/research/ingest',{title:E('ragTitle').value||'منبع',text:E('ragText').value});if(j.ok){add('bot','منبع اضافه شد ✅','پژوهش');ragDialog.close()}};
async function notes(){notesListDialog.showModal();let j=await api('/api/daily-notes',{limit:50});renderNotes(j.notes||[])}
function renderNotes(rows){E('notesList').innerHTML=(rows||[]).map(r=>'<div class="doc"><b>'+r.day+'</b><br>'+((r.content||'').slice(0,300))+'<br><button class="btn" style="margin-top:6px;border-color:var(--bad);color:var(--bad)" data-nid="'+r.id+'">حذف</button></div>').join('')||'<p class="sub">هنوز یادداشتی ننوشتی.</p>';document.querySelectorAll('#notesList button[data-nid]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف شه؟'))return;await api('/api/daily-note/delete',{id:parseInt(b.dataset.nid)});notes()})}
E('noteAddMore').onclick=()=>{notesListDialog.close();noteDialog.showModal()};
E('saveNote').onclick=async()=>{let t=E('noteText').value.trim();if(!t){alert('خالی است');return}let j=await api('/api/daily-note',{content:t});if(j.ok){add('bot','یادداشت ثبت شد ✅','یادداشت');noteDialog.close();E('noteText').value=''}};

/* lab tabs */
document.querySelectorAll('.tab[data-ltab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab[data-ltab]').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('on'));b.classList.add('on');E('l'+b.dataset.ltab.charAt(0).toUpperCase()+b.dataset.ltab.slice(1)).classList.add('on')});
['slB','slC','slX'].forEach(id=>{E(id).oninput=()=>{E(id+'v').textContent=fa(E(id).value)}});
E('eqRun').onclick=async()=>{let B=+E('slB').value,C=+E('slC').value,X=+E('slX').value;let j=await api('/api/edge/daily',{B,C,X});if(!j.ok)return;let cls=j.verdict==='سبز'?'green':j.verdict==='زرد'?'yellow':'red';E('eqResult').innerHTML='<div class="verdict '+cls+'">'+j.verdict+'</div><p class="sub" style="text-align:center;margin-top:6px">'+(j.advice||'')+'</p>';await api('/api/lab/record',{kind:'daily',payload:{b:B,c:C,x:X,verdict:j.verdict}})};
E('readSearch').onclick=async()=>{let q=E('readQ').value.trim();let j=await get('/api/research/list?q='+encodeURIComponent(q)+'&limit=20');renderRead(j.results||[])};
async function renderRead(rows){E('readList').innerHTML=(rows||[]).map(r=>'<div class="doc"><b>'+((r.title||'بدون عنوان').slice(0,50))+'</b><br>'+((r.text||'').slice(0,150))+'…<br><div class="row" style="margin-top:6px"><button class="btn" data-read="'+r.id+'">بیشتر</button><button class="btn" data-sum="'+r.id+'">خلاصه</button></div></div>').join('')||'<p class="sub">چیزی پیدا نشد.</p>';document.querySelectorAll('#readList button[data-read]').forEach(b=>b.onclick=async()=>{let l=await get('/api/research/list?limit=200');let doc=(l.results||[]).find(d=>d.id==b.dataset.read);if(doc)alert(doc.text||'(متن موجود نیست)')});document.querySelectorAll('#readList button[data-sum]').forEach(b=>b.onclick=async()=>{add('bot','در حال خلاصه‌کردن…','مغز');let j=await api('/api/research/summary',{id:parseInt(b.dataset.sum)});if(j.ok)add('bot','خلاصه: '+(j.summary||''),'خلاصه');else add('bot','خطا: '+(j.error||''),'خلاصه','err')})}

/* quiz */
let quizAnswer='';
E('quizBtns').querySelectorAll('button').forEach(b=>b.onclick=async()=>{let guess=b.dataset.q;if(guess===quizAnswer){E('quizResult').innerHTML='<div class="verdict green">درست! ✅</div>'}else{E('quizResult').innerHTML='<div class="verdict red">جواب درست: '+quizAnswer+'</div>'}await api('/api/lab/record',{kind:'quiz',payload:{guess,answer:quizAnswer,correct:guess===quizAnswer}});E('quizNext').style.display='block';E('quizBtns').style.pointerEvents='none';E('quizBtns').style.opacity='.5'});
E('quizNext').onclick=()=>newQuiz();
async function newQuiz(){E('quizResult').innerHTML='';E('quizNext').style.display='none';E('quizBtns').style.pointerEvents='';E('quizBtns').style.opacity='1';let j=await api('/api/edge/quiz',{});if(!j.ok)return;let s=j.scenario;quizAnswer=j.answer;E('quizScenario').innerHTML='فرض کن امروز:<br>بدن: <b>'+fa(s.b)+'</b> از ۱۰<br>خود: <b>'+fa(s.c)+'</b> از ۱۰<br>ابرموجود: <b>'+fa(s.x)+'</b> از ۱۰<br><br>حکم امروز چی میشه؟'}

/* research panel (minimal) */
async function ctl(){ctlDialog.showModal();let s=await get('/api/research/stats');let edgeCount=(s.source_types||{}).edge_seed||0;E('ctlStats').innerHTML='<b style="font-size:18px;color:var(--gold)">'+fa(s.total||0)+'</b> سند · <b style="color:var(--ok)">'+fa(edgeCount)+'</b> مدل لبه';let l=await get('/api/research/list?limit=30');renderCtl(l.results||[])}
function renderCtl(rows){E('ctlList').innerHTML=(rows||[]).map(r=>'<div class="doc"><button class="delx" data-del="'+r.id+'">×</button><b>'+((r.title||'بدون عنوان').slice(0,50))+'</b><br>'+((r.text||'').slice(0,120))+'…</div>').join('')||'<p class="sub">چیزی نیست.</p>';document.querySelectorAll('#ctlList button[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('این سند حذف شه؟'))return;await api('/api/research/delete',{id:parseInt(b.dataset.del)});ctl()})}
E('searchCtl').onclick=async()=>{let q=E('ctlQ').value.trim();let j=await get('/api/research/list?q='+encodeURIComponent(q)+'&limit=30');renderCtl(j.results||[])};
E('cleanupCtl').onclick=async()=>{if(!confirm('پاک‌سازی خودکار نویز و تکراری؟'))return;let j=await api('/api/research/cleanup',{});if(j.ok){add('bot','پاک‌سازی شد: '+fa((j.cleanup||{}).removed_noise||0)+' نویز، '+fa((j.cleanup||{}).removed_duplicates||0)+' تکراری','پژوهش');ctl()}};
E('importCtl').onclick=async()=>{let j=await api('/api/research/import',{});if(j.ok){add('bot','وارد شد: '+fa(j.imported_chunks||0)+' سند','پژوهش');ctl()}};

addEventListener('DOMContentLoaded',boot);</script></body></html>
