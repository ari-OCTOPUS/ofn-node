global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: octopus_stability_live
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9101
        labels:
          source: live
          namespace: runtime
          profile: WAVE0_OBSERVE_ONLY
          board_id: sensorium-opi5pro-68e44cdf
