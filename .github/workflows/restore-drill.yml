name: restore-drill

on:
  pull_request:

# F-07/F-08 lesson (2026-09-03): cancel superseded runs so a stale red/green
# never lingers as the PR's verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_restore_drill_disposable.py
      - run: python -m compileall octopus_recovery
