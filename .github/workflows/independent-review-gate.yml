name: independent-review-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-independent-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require a GOV-V6 approval (Elahe-z | aram-ui; never author, never bots)
        uses: actions/github-script@v7
        with:
          script: |
            const SENSITIVE = [
              'ofn/adapters/',
              'ofn/kernel/',
              'migrations/',
              'octopus_survival/',
              '.github/workflows/',
              '.github/CODEOWNERS',
            ];

            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = pr.number;
            const author = pr.user.login;

            const files = await github.paginate(
              github.rest.pulls.listFiles, { owner, repo, pull_number });
            const touched = files
              .map(f => f.filename)
              .filter(f => SENSITIVE.some(p => f.startsWith(p)));

            if (touched.length === 0) {
              core.info('No sensitive path touched - gate not applicable.');
              return;
            }

            core.info(`Sensitive paths touched:\n  ${touched.join('\n  ')}`);

            const reviews = await github.paginate(
              github.rest.pulls.listReviews, { owner, repo, pull_number });

            const latest = new Map();
            for (const r of reviews) {
              if (!r.user) continue;
              if (r.state === 'COMMENTED') continue;
              latest.set(r.user.login, r.state);
            }

            // GOV-V6 (owner ruling 2026-09-03): Elahe-z and aram-ui are equally valid
            // human reviewers — either one alone is sufficient. Two things still do
            // NOT count:
            //   1. the author approving their own change
            //   2. any bot / GitHub App approval — e.g. cursor[bot] APPROVED #102 at
            //      13:59:59Z with "no applicable approval policy requires human review"
            const VALID_REVIEWERS = ['Elahe-z', 'aram-ui'];

            const approvals = [...latest.entries()]
              .filter(([, state]) => state === 'APPROVED');

            const approvers = approvals
              .filter(([login]) =>
                login !== author &&
                !login.endsWith('[bot]') &&
                VALID_REVIEWERS.includes(login))
              .map(([login]) => login);

            if (approvers.length === 0) {
              const seen = approvals.map(([l]) => l).join(', ') || 'none';
              core.setFailed(
                `No valid independent approval on a sensitive path. Author: ${author}. ` +
                `Approvals seen: ${seen}. Required: one of ${VALID_REVIEWERS.join(' or ')}, ` +
                'and not the author. Bot/App approvals do not satisfy this check. ' +
                'This check is deliberately separate from the branch ruleset: lowering ' +
                'required-approvals does not satisfy it. See issue #51 and GOV-V6.');
              return;
            }

            core.info(`GOV-V6 approval by: ${approvers.join(', ')}`);
