name: independent-review-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

# F-07/F-08 lesson (2026-09-03): a superseded run's red/green lingers in the
# UI and reads as the PR's verdict. Cancel the previous run of the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # F-06 (2026-09-03): a PR based on a pre-rule commit runs the OLD rules —
  # #73 and #108 sat on stale bases and bypassed GOV-V6. Until this check,
  # only "strict" branch protection complained, at merge time, invisibly to
  # reviewers. Now staleness is a visible red context.
  require-fresh-base:
    runs-on: ubuntu-latest
    steps:
      - name: PR head must contain the current base head (stale base = red)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('not a pull_request event — nothing to check');
              return;
            }
            const base = pr.base.ref;
            const head = pr.head.sha;
            const cmp = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base,
              head,
            });
            const status = cmp.data.status; // ahead | behind | diverged | identical
            const behindBy = cmp.data.behind_by || 0;
            core.info(`base=${base} head=${head.slice(0, 7)} status=${status} behind_by=${behindBy}`);
            if (status === 'behind' || status === 'diverged') {
              core.setFailed(
                `Stale base: this PR is ${behindBy || '?'} commit(s) behind ` +
                `'${base}'. A PR on a pre-rule base executes the OLD rules ` +
                '(F-06). Fix: `git fetch origin && git merge origin/' + base +
                '` and push. This check is red until the branch contains the ' +
                'current base head.');
              return;
            }
            core.info(`fresh base: ${status} vs ${base}`);
  require-independent-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require a GOV-V6 approval (Elahe-z | aram-ui; never author, never bots)
        uses: actions/github-script@v7
        with:
          script: |
            const SENSITIVE = [
              'ofn/agents/',
              'ofn/adapters/',
              'ofn/kernel/',
              'migrations/',
              'octopus_survival/',
              '.github/workflows/',
              '.github/CODEOWNERS',
            ];

            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = pr.number;
            const author = pr.user.login;

            const files = await github.paginate(
              github.rest.pulls.listFiles, { owner, repo, pull_number });
            const touched = files
              .map(f => f.filename)
              .filter(f => SENSITIVE.some(p => f.startsWith(p)));

            if (touched.length === 0) {
              // structural honesty (2026-09-03): a green check must never read as
              // "review happened". Mark this run explicitly not-applicable.
              await core.summary
                .addHeading('GOV-V6 gate: NOT-APPLICABLE')
                .addRaw('No sensitive paths touched - this green is NOT a review approval.')
                .write();
              core.notice('not-applicable: no sensitive paths');
              try {
                const runs = await github.paginate(
                  github.rest.checks.listForRef,
                  { owner, repo, ref: pr.head.sha, filter: 'latest', per_page: 100 });
                const mine = runs.find(r =>
                  r.name.startsWith('require-independent-approval'));
                if (mine) {
                  await github.rest.checks.update({
                    owner, repo, check_run_id: mine.id, conclusion: 'neutral',
                    output: {
                      title: 'not-applicable: no sensitive paths',
                      summary: 'Gate not applicable - this is NOT a review approval.',
                    },
                  });
                }
              } catch (err) {
                // Actions may re-conclude the check when the job finishes; the
                // step summary above remains the durable signal either way.
                core.info('neutral re-conclusion unavailable: ' + err.message);
              }
              return;
            }

            core.info(`Sensitive paths touched:\n  ${touched.join('\n  ')}`);

            const reviews = await github.paginate(
              github.rest.pulls.listReviews, { owner, repo, pull_number });

            const latest = new Map();
            for (const r of reviews) {
              if (!r.user) continue;
              if (r.state === 'COMMENTED') continue;
              latest.set(r.user.login, r.state);
            }

            // GOV-V6 (owner ruling 2026-09-03): Elahe-z and aram-ui are equally valid
            // human reviewers — either one alone is sufficient. Two things still do
            // NOT count:
            //   1. the author approving their own change
            //   2. any bot / GitHub App approval — e.g. cursor[bot] APPROVED #102 at
            //      13:59:59Z with "no applicable approval policy requires human review"
            const VALID_REVIEWERS = ['Elahe-z', 'aram-ui'];

            const approvals = [...latest.entries()]
              .filter(([, state]) => state === 'APPROVED');

            const approvers = approvals
              .filter(([login]) =>
                login !== author &&
                !login.endsWith('[bot]') &&
                VALID_REVIEWERS.includes(login))
              .map(([login]) => login);

            if (approvers.length === 0) {
              const seen = approvals.map(([l]) => l).join(', ') || 'none';
              core.setFailed(
                `No valid independent approval on a sensitive path. Author: ${author}. ` +
                `Approvals seen: ${seen}. Required: one of ${VALID_REVIEWERS.join(' or ')}, ` +
                'and not the author. Bot/App approvals do not satisfy this check. ' +
                'This check is deliberately separate from the branch ruleset: lowering ' +
                'required-approvals does not satisfy it. See issue #51 and GOV-V6.');
              return;
            }

            core.info(`GOV-V6 approval by: ${approvers.join(', ')}`);
