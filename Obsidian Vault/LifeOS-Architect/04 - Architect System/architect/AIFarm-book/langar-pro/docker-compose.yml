# LANGAR Pro — فاز ۱: ستونِ فقرات (Postgres+pgvector + Redis).
# Neo4j/Qdrant/Celery/Next.js در فازهای بعد اضافه می‌شوند (کامنت‌شده پایین).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: langar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: langar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

