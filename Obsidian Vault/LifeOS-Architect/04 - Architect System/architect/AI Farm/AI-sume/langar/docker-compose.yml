# باتِ سبکِ LANGAR — اجرای ۲۴ ساعته با Docker (SQLite، بدونِ سرویسِ جانبی).
services:
  langar:
    build: .
    container_name: langar-bot
    restart: unless-stopped      # بعد از ری‌استارتِ سرور خودکار بالا می‌آید
    env_file:
      - .env
    volumes:
      - ./data:/app/data         # دیتابیس + state (پایدار)
      - ./patches:/app/patches   # diffهای AI-Lab
      - ./logs:/app/logs
