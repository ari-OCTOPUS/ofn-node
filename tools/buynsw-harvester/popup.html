<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 320px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 10px;
    }
    h1 { font-size: 14px; margin: 0 0 8px; }
    #status {
      min-height: 34px;
      margin: 6px 0;
      color: #333;
      white-space: pre-line;
    }
    button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 4px 0;
      padding: 7px 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .row { display: flex; gap: 6px; }
    .row button { flex: 1; }
    .row input { width: 64px; text-align: center; }
    small { color: #666; line-height: 1.5; display: block; margin-top: 6px; }
    details { margin-top: 8px; }
    details input[type="text"], details input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      margin: 2px 0;
      padding: 4px;
    }
    label.toggle { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  </style>
</head>
<body>
  <h1>buy.nsw Harvester (OFN H1)</h1>
  <div id="status">…</div>

  <button id="scrape">برداشت از این صفحه</button>

  <div class="row">
    <label class="toggle">
      خودکار
      <input type="number" id="maxPages" value="15" min="1" max="40" />
      صفحه
    </label>
    <button id="startAuto">شروع خودکار</button>
    <button id="stopAuto">توقف</button>
  </div>

  <div class="row">
    <button id="exportJson">خروجی JSON</button>
    <button id="exportCsv">خروجی CSV</button>
  </div>
  <div class="row">
    <button id="debug">دامپ دیباگ DOM</button>
    <button id="clear">پاک کردن</button>
  </div>

  <details>
    <summary>تنظیمات نود (پیشرفته — پیش‌فرض خاموش)</summary>
    <input type="text" id="endpoint" placeholder="https://…/api/leads/ingest" />
    <input type="password" id="token" placeholder="توکن (اختیاری)" />
    <label class="toggle">
      <input type="checkbox" id="autoPost" />
      ارسال خودکار بعد از هر برداشت
    </label>
    <button id="saveCfg">ذخیرهٔ تنظیمات</button>
    <button id="postAll">ارسال همهٔ رکوردها الان</button>
  </details>

  <small>
    خروجی JSON را با <code>tools/ingest_buynsw_batch.py</code> به نود بدهید.
    فیلتر نهایی سمت پایتون است؛ فیلدهای <code>_painting_hint</code> فقط پیش‌نمایش‌اند.
  </small>

  <script src="popup.js"></script>
</body>
</html>
