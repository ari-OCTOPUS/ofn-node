# OCTOPUS Mini Scientist — current phase gate
# The agent may ONLY perform tasks listed here.
# Phase advancement requires the owner to set owner_approval: true
# AND phase_status: APPROVED. The agent must never edit this file itself.

phase_id: P6_DAILY_ADVISORY
phase_status: APPROVED
owner_approval: true
authorization_ref: OWNER-DECISIONS.md D2 + D7 (timer octopus-miniscientist-daily.timer, report-only)
mode: WAVE0_OBSERVE_ONLY
network: disabled
production_write: false
service_control: false
max_changes_per_run: 1   # sandbox-internal only

goal: >
  Create octopus-miniscientist-daily.timer (+ service) that runs once daily and
  ONLY writes an advisory report inside /opt/octopus-agent/REPORTS/daily/
  (phase status, authority hash check, changelog tail, sensorium write-rate
  sample). No deploy, no restart, no network, no promotion. Report-only
  behavior must be verifiable from the journal.

allowed_reads:
  - /opt/octopus/current
  - /var/lib/octopus/state
  - /var/lib/octopus/evidence
  - /proc, /sys
  - /opt/octopus-agent/**

allowed_writes:
  - /opt/octopus-agent/REPORTS/daily
  - /opt/octopus-agent/CHANGELOG.jsonl
  - /opt/octopus-agent/RECEIPTS
  - systemd unit files for this timer ONLY (octopus-miniscientist-daily.*)

forbidden:
  - any write to /opt/octopus/current, /var/lib/octopus (except inbound/TO-LAPTOP per D8)
  - restart/stop of any other service
  - network egress

required_outputs:
  - /etc/systemd/system/octopus-miniscientist-daily.service
  - /etc/systemd/system/octopus-miniscientist-daily.timer
  - REPORTS/daily/<date>.md (first report generated by one manual trigger)
  - RECEIPTS/P6_receipt.json (gate partially deferred: full PASS needs >= 3 days of journal evidence)

pass_conditions:
  - timer_created_and_scheduled
  - first_report_written_by_timer
  - journal_shows_no_side_effects
  - receipt_written (interim; final after 3 days)

stop_conditions:
  - HALT_AGENT exists
  - timer attempts anything beyond report writing

open_owner_decisions: {}

