# wiring.yaml — Octopus truthful component registry
# Built 2026-07-15 from a 14-agent read-only ground-truth pass (verified against the REAL _ops tree,
# adversarially cross-checked). This is the source of truth the cockpit reads to decide LIVE vs
# STALE/DORMANT/ORPHANED/CRITICAL. RULE: nothing renders 🟢 unless status == live AND (no status_source
# OR status_source is fresh within stale_after_seconds).
#
# status vocabulary:
#   live                    — real writer + real reader + fresh traffic → 🟢
#   dormant-flag-off        — code present & wired, gated OFF by an env flag → ⚫ (show flag name)
#   orphaned-no-writer      — reader(s) exist but nothing writes it → 🟠 (never 🟢)
#   legacy-no-live-traffic  — looks wired but no live producer/consumer path → ⚪
#   critical-real-bug       — a real, currently-unresolved defect → 🔴
#   partial                 — correct but idle, or half-wired → 🟡
#   unknown-pending-verify  — not yet verified in the live tree → ❔ (never 🟢)

