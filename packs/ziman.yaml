# ═══════════════════════════════════════════════════════════════════════
# pack: ziman — gift gallery, handmade, capacity-bound
# partner-facing app: warm, one question per screen
# ═══════════════════════════════════════════════════════════════════════
tenant: ziman

# کد محصول: ZM-0001. اینجاست چون چیزی است که مالک پای تلفن بلند می‌خواند،
# نه چیزی که کد از نام tenant بسازد.
sku_prefix: ZM

# ── locale ─────────────────────────────────────────────────────────────
# The market this business sells into. One object, because currency alone is
# a display parameter and a display parameter is not a market: a price is only
# meaningful together with the tax treatment behind it, the timezone the week
# was counted in, and the law the claim has to survive.
#
# en-AU is the only implemented locale. Any other id is refused at load time
# (`unsupported_locale`) rather than falling back — see packloader.
#
# Ziman is in AUD because its paying customer is Australian. That is the whole
# reason; it is not inherited from any other project on this node.
locale:
  id: en-AU
  timezone: Australia/Sydney
  # ABN دارد، GST ثبت نشده — انتخاب مالک، ۲۰۲۶-۰۸-۰۴. زیر آستانهٔ گردش
  # سالانه این یک انتخاب قانونی است؛ بالای آن دیگر انتخاب نیست، پس آستانه
  # در locale نگه داشته می‌شود و پایش می‌شود نه اینکه کسی یادش بماند.
  tax:
    status: not_registered
    pricing: inclusive
  payment_rails: []         # کانال فروش هنوز انتخاب نشده — خالی یعنی «تصمیم نگرفته»
  platforms: []             # هنوز هیچ‌جا نمی‌فروشد. تازه شروع می‌کند.

# Owner-confirmed 2026-08-03 as a range of 6-10. The operational ceiling is
# the FLOOR of that range, not the middle and certainly not the top: a system
# that promises 10 and delivers 6 has manufactured a broken promise out of an
# optimistic reading of its own config.
capacity_units_per_week: 6

# Definition of Ready. Until each of these exists at the stated confidence,
# any action that leaves the node is forced to RED.
#
# `offer.cogs_per_family` used to be asked directly, with wording that told
# her not to count her own time. That was the industry's default mistake
# written into the pack it was supposed to cure: an item priced against
# materials alone looks profitable at exactly the price that loses money.
# COGS is now derived from the inputs below instead of asked for, so there is
# no path by which an unpriced hour reaches a shelf price.
required_facts:
  materials.cost_per_batch: measured
  production.batch_size: measured
  time.hours_per_item: measured
  time.hourly_floor: owner_confirmed
  offer.price_current: owner_confirmed
  stock.units_left: measured
  sales.units_last_7d: measured
  ops.delivery_model: owner_confirmed
  ops.capacity_by_family: measured

# Under this margin an item is not worth making; under this many days of
# stock she is about to run out. Both are the owner's call, so both are here.
costing:
  margin_floor: 0.30
  runway_warn_days: 7

# How each fact is asked, in Maliheh's words. The kernel decides *which* of
# these to ask and when; it has no business inventing the sentence. A fact
# with no wording here still gets asked — the shell shows the bare key, which
# is deliberately ugly so that a missing sentence gets noticed and written.
questions:
  ops.capacity_by_family:
    label: این هفته چند تا می‌توانید بسازید؟
    hint: هر چه بگویید، همان می‌شود. بیشتر از آن سفارش گرفته نمی‌شود.
    unit: باکس در هفته
    min: 1
    max: 60
    default: 6
  materials.cost_per_batch:
    label: برای آخرین دسته‌ای که ساختید، مواد چقدر شد؟
    hint: مواد و بسته‌بندی همان دسته. وقتِ خودتان را اینجا حساب نکنید — جدا می‌پرسیم.
    unit: دلار استرالیا
    min: 1
    max: 5000
    default: 120
  production.batch_size:
    label: از آن مواد، چند تا درآمد؟
    hint: تعداد باکس‌های سالم همان دسته.
    unit: عدد
    min: 1
    max: 500
    default: 10
  time.hours_per_item:
    label: هر باکس تقریباً چند ساعت وقت می‌برد؟
    hint: از شروع تا آمادهٔ ارسال. تخمین کافی است.
    unit: ساعت
    min: 0.1
    max: 40
    default: 1.5
  time.hourly_floor:
    label: ساعتی چند دلار، ارزش وقتتان است؟
    hint: پایین‌ترین عددی که با آن حاضرید کار کنید. ماهی یک بار می‌پرسیم.
    unit: دلار استرالیا در ساعت
    min: 1
    max: 500
    default: 25
  offer.price_current:
    label: الان هر باکس را چند می‌فروشید؟
    hint: قیمتی که مشتری می‌پردازد.
    unit: دلار استرالیا
    min: 1
    max: 5000
    default: 80
  stock.units_left:
    label: الان چند تا آماده دارید؟
    hint: چیزی که همین حالا می‌شود فرستاد.
    unit: عدد
    min: 0
    max: 1000
    default: 0
  sales.units_last_7d:
    label: این هفته چند تا فروختید؟
    hint: هفت روز گذشته. صفر هم یک جواب است.
    unit: عدد
    min: 0
    max: 1000
    default: 0
  ops.delivery_model:
    label: تحویل را چطور انجام می‌دهید؟
    hint: این تعیین می‌کند چه چیزی به مشتری قول داده شود.
    options:
      - پست
      - تحویل حضوری
      - هر دو

gates:
  - capacity
  - budget
  - claim
  - consent
  - asset
  - publish
  - secret_rotation

# Overrides may only raise a tier, never lower it. Listed here for the
# actions where the generic rules would land too low.
risk_overrides:
  publish_price: red
  confirm_order: red
  send_dm_reply: yellow
  ask_partner_question: yellow
  classify_inbound: green
  draft_caption: green

quota_share: 0.40
