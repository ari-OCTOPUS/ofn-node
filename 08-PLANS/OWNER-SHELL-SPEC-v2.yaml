  - "یک approval lifecycle"
  - "یک correlation_id از proposal تا receipt"
  - "timestamp و authority روی هر metric"
  - "صفر undefined در schema contract tests"
  - "اختلاف تمام نماها = صفر"
  - "legacy panels فقط view، نه control plane"
  - "rollback و receipt کامل"
