# /etc/systemd/system.conf.d/99-watchdog.conf
# Hardware watchdog on RK3588 (Synopsys DesignWare, /dev/watchdog).
#
# The timeout is quantised to a fixed ladder: 1, 2, 5, 11, 22, 44, 89 seconds.
# A request is rounded UP to the next rung and capped at 89. Asking for 30
# gets you 44 — so ask for 44 and avoid the surprise.
#
# Verify before relying on it:
#   dmesg | grep -i wdt
#   wdctl /dev/watchdog0
[Manager]
RuntimeWatchdogSec=44s
RebootWatchdogSec=10min
KExecWatchdogSec=off
