# =============================================================================
# painter_lead_scoring.yaml
# Lead scoring + routing for a Sydney painting operator.
#
# Philosophy (survival-filter style): most DAs are noise. The job of this config
# is NOT to "pick winners" — it's to FILTER hard and ROUTE by BUYER TYPE.
#   strata          -> highest strategic value (one strata-manager relationship
#                      unlocks a recurring portfolio of repaints)
#   commercial      -> the BUILDER is the buyer, not the tenant; paint is downstream
#   gov / new-multi -> relationship seeds, lower urgency
# Everything is tunable. Change weights, don't change code.
# =============================================================================

meta:
  operator: "Sydney painter"
  base_lat: -33.8688        # Sydney CBD — set to your real service centroid
  base_lng: 151.2093
  max_service_radius_km: 40

# ---- final score -> action --------------------------------------------------
actions:
  draft_threshold: 70       # >=70  -> auto /draft outreach
  save_threshold: 45        # 45-69 -> /save to pipeline for manual review
  #                           <45   -> /skip

# ---- order in which categories are tested (first match wins) ----------------
# strata first on purpose: it is the niche you said you want.
category_priority:
  - strata_remedial
  - government_education
  - new_residential_multi
  - commercial_fitout

# ---- hard filters: if ANY hits -> auto /skip regardless of score ------------
hard_skip:
  any_phrase:
    - "demolition only"
    - "tree removal"
    - "subdivision of land"
    - "strata subdivision"        # paper subdivision, no physical works
    - "boundary adjustment"
    - "torrens title subdivision"
    - "swimming pool"             # pool-only DAs -> no paint
    - "signage only"
  # single dwellings below a value floor are residential one-offs -> skip
  single_dwelling_phrases:
    - "dwelling house"
    - "single dwelling"
    - "detached dwelling"
    - "secondary dwelling"
    - "granny flat"
  single_dwelling_value_floor: 250000   # only skip if cost is KNOWN and below this

# ---- category routing -------------------------------------------------------
# A category wins if it has >=1 required_any match AND (if present) >=1 context_any.
categories:

  strata_remedial:
    base: 55
    label: "Strata remedial / common-property repaint"
    required_any:
      - "common property"
      - "owners corporation"
      - "remedial"
      - "render and paint"
      - "render & paint"
      - "balustrade"
      - "balcony"
    context_any:                 # must also look like multi-unit residential strata
      - "strata"
      - "units"
      - "apartments"
      - "flat building"
      - "multi dwelling"
      - "multi-dwelling"
      - "common property"
      - "owners corporation"

  government_education:
    base: 35
    label: "Government / education / social housing (route to tenders)"
    required_any:
      - "school"
      - "tafe"
      - "hospital"
      - "health facility"
      - "social housing"
      - "community facility"
      - "public building"

  new_residential_multi:
    base: 30
    label: "New multi-residential build (future client + builder relationship)"
    required_any:
      - "residential flat building"
      - "multi dwelling housing"
      - "multi-dwelling housing"
      - "apartment building"
      - "townhouses"
      - "shop top housing"
      - "boarding house"

  commercial_fitout:
    base: 40
    label: "Commercial fitout / change of use (builder is the buyer)"
    required_any:
      - "fitout"
      - "fit out"
      - "fit-out"
      - "change of use"
      - "retail premises"
      - "office"
      - "tenancy"
      - "shopfront"
      - "refurbishment"

# ---- additive signals (applied on top of the category base) -----------------
signals:

  paint_scope:               # direct evidence painting is actually in scope
    weight: 18
    any_phrase:
      - "paint"
      - "repaint"
      - "render"
      - "coating"
      - "external alteration"
      - "internal alteration"
      - "facade"
      - "fitout"
      - "fit out"
      - "fit-out"
      - "refurbishment"

  recurring_buyer:           # implies a repeating maintenance buyer (strata/portfolio)
    weight: 10
    any_phrase:
      - "common property"
      - "owners corporation"
      - "strata"
      - "maintenance"

  red_flags:                 # down-weight (not a hard skip)
    weight: -15
    any_phrase:
      - "business identification signage"   # signage-led job, little paint
      - "advertising"
      - "illuminated sign"
      - "awning"
      - "heritage"                          # approval friction + specialist scope

# ---- project value tiers (uses cost_of_development if available) ------------
# PlanningAlerts free API does NOT include cost; DA Leads / Cordell do.
value_tiers:
  - { min: 1000000, bonus: 15 }
  - { min: 300000,  bonus: 10 }
  - { min: 100000,  bonus: 5 }
  - { min: 0,       bonus: 0 }

# ---- geographic fit ---------------------------------------------------------
geo:
  in_radius_bonus: 8
  out_of_radius_penalty: -20
