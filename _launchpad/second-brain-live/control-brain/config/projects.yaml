# رجیستریِ پروژه‌ها — مغزِ کنترل از روی همین فایل، پروژه‌ها را می‌شناسد.
#
# هر پروژه:
#   id, name, workdir, start (دستور روشن‌کردن), test (اختیاری), enabled (فعال؟)
#   secrets: نگاشتِ «نامِ متغیرِ محیطی → عنوانِ ورودی در KeePassXC»
#            (عنوانِ هر ورودی در KeePassXC باید یکتا باشد)

owner_chat_id: 6150431610   # می‌توانی خالی بگذاری و در .env مقدار OWNER_CHAT_ID را پر کنی

projects:
  # پروژهٔ نمونه — بدونِ رمز، همین حالا فعال است تا مغزِ کنترل را تست کنی.
  - id: demo
    name: "پروژهٔ نمونه (برای تست خودِ مغز)"
    workdir: "sample_project"
    start: ["python", "worker.py"]
    test: ["python", "-c", "print('ok')"]
    enabled: true

  # ⭐ زیمان — ایجنتِ مارکتینگ. زنده و فعال (حالتِ محلی).
  #    workdir نسبی است و کنارِ همین پوشهٔ control-brain حل می‌شود → ../ziman-agent
  #    بدونِ کلید، offline کار می‌کند. با افزودنِ ANTHROPIC_API_KEY در KeePassXC، تولیدِ زندهٔ Claude فعال می‌شود.
  #    این ایجنت هرگز منتشر/خرج نمی‌کند (autonomy=read-only) و قیدِ ظرفیت D4 را رعایت می‌کند.
  - id: ziman
    name: "زیمان — ایجنتِ مارکتینگ (Sydney gifts)"
    workdir: "../ziman-agent"
    start: ["python", "worker.py"]
    test: ["python", "worker.py", "--selftest"]
    enabled: true
    secrets:
      ANTHROPIC_API_KEY: "anthropic-key"

  # ربات نقاشی — کپی محلی کنار همین پوشه (مغز دوم). توکن نو از فرم wizard می‌آید.
  - id: painting
    name: "ربات نقاشی (لیدگیری سیدنی)"
    workdir: "../painting-bot"
    start: ["python", "main.py"]
    test: ["python", "-c", "import main; print('import ok')"]
    enabled: true
    secrets:
      TELEGRAM_BOT_TOKEN: "painting-telegram-token"
      ANTHROPIC_API_KEY: "anthropic-key"
      TAVILY_API_KEY: "tavily-key"

  # ربات حسابداری — کپی محلی (Node لازم دارد؛ گزارش اتصال چک می‌کند).
  - id: accounting
    name: "ربات حسابداری"
    workdir: "../accounting-bot"
    start: ["node", "bot.js"]
    test: ["node", "-e", "require('./bot.js') && console.log('load ok')"]
    enabled: true
    secrets:
      TELEGRAM_TOKEN: "accounting-telegram-token"

  # Project-F 🔒 — ماژول قفل‌دار: تا GATE 0 فقط status، صفر اجرا (قاعدهٔ پروژه).
  #   صبا operator این ماژول است (allowed) — start/stop/test همین یکی، نه بقیه.
  - id: projectf
    name: "Project-F 🔒 (status-only تا GATE 0)"
    workdir: "../projectf-agent"
    start: ["python", "worker.py"]
    test: ["python", "worker.py", "--selftest"]
    enabled: true
    allowed: ["saba"]

  # پنل‌های سادهٔ گوشی — UI برای صبا و تولید زیمان؛ backend کامل (PIN/sqlite/audit/GATE).
  - id: panels
    name: "پنل‌های گوشی (زیمان + Project-F)"
    workdir: "../panels"
    start: ["python", "panel_server.py"]
    test: ["python", "panel_server.py", "--selftest"]
    enabled: true

  # دو رکن (v2 فاز ۳) — تحقیق روزانه + پیام‌های صف تأیید برای هر ۳ بیزنس.
  - id: rokn-daily
    name: "دو رکن — تحقیق و تعامل روزانه"
    workdir: "."
    start: ["python", "rokn_daily.py"]
    test: ["python", "rokn_daily.py", "--selftest"]
    enabled: true

  # مغز تکاملی (v2 فاز ۴) — هفته‌ای یک Proposal بازمهندسی، propose-only، TTL ۳۰روزه.
  - id: evolution
    name: "🧬 مغز تکاملی (هفتگی، propose-only)"
    workdir: "."
    start: ["python", "evolution_loop.py"]
    test: ["python", "evolution_loop.py", "--selftest"]
    enabled: true
