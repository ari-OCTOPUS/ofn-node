# کاربران و نقش‌ها (فاز ۱ چند-کاربره). نقش‌ها: admin | operator | viewer
# - admin: همه‌کار روی همهٔ پروژه‌ها + مدیریت + رمز + halt/resume.
# - operator: فقط start/stop/test روی پروژه‌های assign‌شده (owner/allowed در projects.yaml).
# - viewer: فقط دیدنِ وضعیت.
# فعلاً فقط تو (ادمین) هستی → رفتار دقیقاً مثلِ تک‌کاربرهٔ قبلی است.
# telegram_chat_id را با آی‌دیِ عددیِ خودت پر کن (همان OWNER_CHAT_ID) تا در تلگرام شناخته شوی.

users:
  - id: admin
    name: "آری (ادمین)"
    role: admin
    telegram_chat_id: 6150431610
    enabled: true

  # صبا — فقط operator ماژول Project-F (allowed در projects.yaml)؛ chat_id از فرم wizard پر می‌شود.
  - id: saba
    name: "صبا (Project-F)"
    role: operator
    telegram_chat_id: 0
    enabled: true

  # مامان — صاحب زیمان؛ گیرندهٔ پیام‌های رکن B (فقط viewer، هیچ کنترلی).
  - id: mom
    name: "مامان (زیمان)"
    role: viewer
    telegram_chat_id: 0
    enabled: true

  # نمونه‌های آینده (خاموش تا وقتی بخواهی) — id را یکتا نگه‌دار:
