# پیکربندیِ ایجنتِ مارکتینگِ زیمان — تنها منبعِ حقیقتِ اعداد و قواعد.
# منبعِ اعداد: Business-Zeiman.md و Strategy-DecisionLog.md در همین vault.

business:
  name: "Ziman Gift"
  location: "Sydney, Australia"
  positioning: "luxury"          # [Belief] جهت‌گیریِ قیمتیِ لوکس
  products:
    - "گل‌آراییِ مصنوعی"
    - "سبدِ هدیه"
    - "شادوباکسِ گلِ قاب‌شده"
    - "همپرِ شکلات (فقط تحویلِ محلی)"
  payment: "PayID"

# قیدِ مقدمِ D4 — سقفِ ظرفیتِ تولید. منبع: Business-Zeiman.md [Measured] «تا ۳۰ واحد در هفته».
capacity:
  units_per_week_ceiling: 30
  source: "Business-Zeiman.md [Measured] — تا ۳۰ واحد در هفته"
  current_inventory: 20          # [Measured] حدود ۲۰ واحدِ موجود

# پیام‌رسانیِ مناسبتی (Strategy-DecisionLog.md)
occasions: ["تولد", "نامزدی", "خانه‌تکونی", "سالگرد"]
calendar_anchors:
  - {name: "روزِ پدر", month: 9}
  - {name: "یلدا", month: 12}

audience:
  warm_first: true
  segments: ["آشنایان", "جامعهٔ ایرانیانِ سیدنی"]

# تولیدِ محتوا
generation:
  model: "claude-sonnet-5"       # ارزان‌تر برای صرفه‌جویی: claude-haiku-4-5
  language: "fa"
  cadence_seconds: 3600          # در حالتِ زنده، هر چند ثانیه یک draftِ تازه
  max_tokens: 700

# مسیرِ vault (read-only) نسبت به همین پوشه — برای خواندنِ manifest/استراتژی
vault:
  path: ".."
  notes: ["PROJECT.md", "Capacity & Channels.md", "Business-Zeiman.md", "Strategy-DecisionLog.md"]

# گیتِ ایمنی — این ایجنت هرگز منتشر یا خرج نمی‌کند
safety:
  autonomy: "read-only"          # فقط draftِ محلی می‌نویسد
  publish_requires_human: true
