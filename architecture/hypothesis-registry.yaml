  - date: "2026-08-12"
    action: "added"
    author: "octopus-core"
    note: "HYP-2026-08-12-004: first real (self-referential) hypothesis — does testable hypothesis-making aid discovery in deceptive envs? Seed evidence = deceptive-grid experiment."
