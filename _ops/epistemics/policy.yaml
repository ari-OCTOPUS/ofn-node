# policy.yaml — سیاستِ موتورِ آزمونِ معرفتی (ADR-039, C1).
#
# SINGLE SOURCE OF TRUTH برای سقف‌ها و مرزهای epistemics. policy.py این فایل را
# fail-closed بارگذاری می‌کند: هر کلیدِ الزامیِ غایب یا مقدارِ غیرمجاز ⇒ RuntimeError
# (FREEZE، ADR-039 §7: "missing config = STOP").
#
# سخت‌مرزها (قابل‌تغییر نیستند — policy.py باز هم enforcing می‌کند):
#   sandbox_profile: فقط no_network
#   max_authority:   فقط propose (execute ممنوع)
#   default_off:     true (EPISTEMIC_TESTS=0 تا رأی مالک)
# ---------------------------------------------------------------------------

schema_version: 1
adr: ADR-039
default_off: true
env_flag: EPISTEMIC_TESTS

# مرزِ سختِ sandbox — تنها مقدارِ مجاز.
sandbox_profile: no_network

# مرزِ سختِ authority — execute ممنوع (ADR-034 propose-only).
max_authority: propose

# سقفِ منابعِ هر طرحِ آزمون. policy.py ceilingهای مطلقِ بالاتری هم enforcing می‌کند.
caps:
  max_runs: 100
  max_wall_seconds: 3600
  max_cost_aud: 1.0

# باور-update محدود (log-odds، clipped). C4 (bayes.py) این مقادیر را می‌خواند.
belief_update:
  clip_log_odds: 6.0
  lambda_disagreement: 0.5

# تجمیعِ چندایجنتی: حداقلِ خوشهٔ مستقل؛ کلیدهای خوشه‌بندی.
independence:
  min_clusters: 3
  clustering_keys: [provider, prompt_family, toolchain, data_overlap]

# فقط Plane-3 sandbox runner مجاز است receipt تولید کند (ADR §11 تست #7).
producers:
  authorized: [epistemic_sandbox_runner]

# نردبانِ بلوغ (ADR §5) — نگاشتِ هر سطح به gate_map + شواهدِ لازم.
# گیت هرگز به‌تنهایی ارتقا نمی‌دهد؛ ارتقا فقط از طریقِ OwnerDecisionPacket + رأی مالک.
maturity_ladder:
  E0:
    gate_map: infra
    required_evidence: [harness_green, validator_green]
  E1:
    gate_map: TESTING
    required_evidence: [b_gt_a_holdout]
  E2:
    gate_map: TESTING
    required_evidence: [ablation_b_full_gt_b_static, ablation_b_full_gt_b_no_eig]
  E3:
    gate_map: EVIDENCED_CANDIDATE
    required_evidence: [unseen_families, benign_null]
  E4:
    gate_map: EVIDENCED
    required_evidence: [autonomy_provenance_no_human_edge]
  E5:
    gate_map: SUPPORTED
    required_evidence: [robustness_battery]
  E6:
    gate_map: CROSS_DOMAIN
    required_evidence: [odd_transfer]
