# budgets.yaml — SINGLE SOURCE OF TRUTH بودجهٔ API کل ارگانیسم
# تعارض #۴ STATE-MAP بسته شد: verdict آری 2026-07-06 → cap_monthly = AU$30
# مصرف‌کننده: METABOLIC-GOVERNOR (shadow) — سند: "04 - Architect System/2026-07-06 METABOLIC-GOVERNOR-proposal.md"
# enforce: budget_gate v1.1 هاردکد هم‌خوان (همهٔ سقف‌ها AUD — verdict V1 آری 2026-07-07: روز 2 · ماه 30 · فاجعه 500)؛ v2 باید از این فایل بخواند.
# config-only: خواندنِ این فایل هیچ اتوماسیونی روشن نمی‌کند.

global:
  cap_monthly: 30            # AUD — verdict آری 2026-07-10 «۳۰ بماند» هنگام go-live (بازگشت از ۲۰۰ که 07-09 balanced شده بود). سقفِ سختِ خرجِ ماهانه با گیتِ پولیِ باز.
  # ⚠️ enforceِ واقعیِ این عدد نیازِ راست‌کردنِ hardcode-floor در budget_gate.py دارد (تسکِ GLM)؛
  #    تا آن، سقفِ مؤثر همان min(yaml, hardcode) می‌ماند. disaster line=۵۰۰ (ترمزِ recursive-loop) و
  #    spike_pct=۲۵ (kill-switch) و alert ۵۰/۸۰٪ همه دست‌نخورده. GLM=سابسکرایبِ فلت؛ Fugu=متریِ AU$100.
  currency: AUD
  epoch: daily               # re-plan استراتژیک: هفتگی، جمعه (هم‌راستا با حلقهٔ KPI)
  explore_pct: 0.10          # سهم MUSE / جهش — ارگان‌های جاافتاده حق برداشت ندارند
  spike_pct: 25              # آستانهٔ kill-switch: ٪ بودجهٔ epoch در <۱ ساعت — MAX_DRAWDOWN پک OCTOPUS ≡ همین کلید (verdict 2026-07-07)
  idle_epochs: 5             # خواب خودکار سلول بی‌خروجی
  lend_max_pct: 15           # سقف قرض بین‌پروژه‌ای بدون verdict
  human_gate_aud: 20         # Autonomy Ramp: بالای این مبلغ هر اقدام پولی همیشه human-gated — verdict آری 2026-07-07 (پاسخ‌های STAGE-0: AU$20، جایگزین $10 اولیه)
  weights: {value: 0.30, urgency: 0.25, efficiency: 0.20, human: 0.20, waste: 0.05}
  # ✅ بسته شد 2026-07-07 (verdict V1 همه-AUD): budget_gate v1.1 — روز AU$2 (سقف burst، نه نرخ پایدار)،
  # ماه AU$30، فاجعه AU$500؛ باگ واحد DISASTER (:90) فیکس شد. حل نهایی (خواندن از همین فایل): budget_gate v2.

projects:
  PROJECT_F:      {floor: 3,  human_priority: 2.0, deadline: 2026-07-20}   # فاز −۱ فروش؛ deadline shield فعال
  ARCHITECT_SYS:  {floor: 2,  human_priority: 1.0}
  GENOME_SYS:     {floor: 2,  human_priority: 1.0}
  ZIMAN:          {floor: 1,  human_priority: 0.5}
  # جمع floorها = AU$8 + explore 10% = AU$3 → headroom رقابتی ≈ AU$19/ماه.

loop:
  # مرجع رسمی سقف لوپ مناظره — opslib.organ_table از همین بخش می‌خواند (پیش‌فرض کد 5 = fallback)
  DEBATE_LOOP: {cap_monthly: 10, floor: 0}   # verdict آری 2026-07-07 (پاسخ‌های STAGE-0: AU$10/ماه)

allocation:
  # پول‌بر‌درصد — تخصیصِ barbell (verdict آری 2026-07-09). propose-only: تخصیصِ کوشش/API، نه پولِ بیزنس.
  barbell:
    core_share: 0.70              # CORE = Ziman+Lead (امن/اثبات‌نزدیک)
    satellite_share: 0.30         # SATELLITE = Project-F/Crypto/Mining/experiment (انفجاری/capped)
    satellite_cap_pct: 0.10       # هیچ satelliteِ منفرد از ۱۰٪ کل بیشتر نمی‌گیرد
    cull_zero_streak_days: 30     # survival-cull: satellite با سیگنالِ صفرِ پایدار (۳۰ روز) → cull
    hysteresis_max_delta: 0.05    # تغییرِ درصدِ هر organ در هر epoch حداکثر ۵٪ (ضدِ نوسان)
  core_members: [ZIMAN, ARCHITECT_SYS, GENOME_SYS]
  satellite_members: [PROJECT_F, MINING]
  partners_default:
    # انتسابِ سهمِ پیش‌فرض (attribution partners[]) — verdict آری 2026-07-09
    PROJECT_F: [{who: Ari, pct: 50}, {who: Saba, pct: 50}]
    ZIMAN: [{who: Ari, pct: 70}, {who: Mother, pct: 30}]
    ARCHITECT_SYS: [{who: Ari, pct: 100}]
    GENOME_SYS: [{who: Ari, pct: 100}]
    MINING: [{who: Ari, pct: 100}]

# ─── business identity (invoice/quote — config-only, no secrets) ──────────
business:
  abn: ""                        # Australian Business Number — REQUIRED for tax invoice
  trading_name: ""               # Business trading name
  address: ""                    # Business address
  payment_terms: "Due within 14 days"
  payment_methods: "Bank Transfer"
  bank_details: ""               # BSB + Account number

# ─── email integration (P3 — flag-off, secrets in .env) ────────────────
email:
  gmail_client_id: ""            # Google Cloud OAuth client ID
  gmail_client_secret: ""         # Google Cloud OAuth client secret
  gmail_token_path: "state/email/gmail_token.json"
  polling_interval_minutes: 30

routing:
  # 🔴 اصلاح 2026-07-06: aliasهای deepseek-chat/reasoner از 2026-07-24 (15:59 UTC) بازنشسته می‌شوند [FACT — چند منبع].
  # قیمت‌ها ✅ [VERIFIED 2026-07-07 · api-docs.deepseek.com/quick_start/pricing] — قفل شد (verdict پاسخ‌های STAGE-0؛ تخمین بی‌مدرک ممنوع)
  econ:
    provider: deepseek
    model: deepseek-v4-flash          # [VERIFIED 2026-07-07] in $0.14 (cache-hit $0.0028) / out $0.28 per 1M
    base_url: "https://api.deepseek.com"
  reason:
    provider: deepseek
    model: deepseek-v4-flash          # thinking پیش‌فرض؛ همان قیمت flash [VERIFIED]. جایگزین: deepseek-v4-pro — [VERIFIED 2026-07-07] $0.435 (hit $0.003625) / $0.87
    mode: thinking
    base_url: "https://api.deepseek.com"
    # 🔀 verdict آری 2026-07-09: reason باید به GLM (زیر ↓) سوییچ کند — ولی فقط پس از multi-providerشدنِ
    #    client.py (تسکِ GLM)؛ تا آن، deepseek فعال می‌ماند تا leak-guard چیزی را RefuseToSend نکند.
  glm:                                # مغزِ فرعی (verdict آری 2026-07-10: fugu اصلی، glm فرعی)
    provider: glm
    model: "glm-4.6"                  # [نیازِ تأییدِ GLM از dashboardِ پلنِ MAX — مدلِ دقیق را بگذارد]
    base_url: "${GLM_BASE_URL}"       # از env (Ari نوشته)؛ کلید فقط env: GLM_API_KEY — هرگز hardcode
    subscription: max                 # فلت (~AU$200 خریده‌شده) → سقفِ دلاریِ متری ندارد
    system_share: 0.5                 # verdict آری 2026-07-10: نصفِ سهمیهٔ اشتراک سهمِ سیستم است
  anthropic:
    provider: anthropic
    note: >
      فقط برای متر شدن مصرف. genome-system طبق genome/gates.yaml روی سه-tier Anthropic
      قفل است (invariant core؛ تغییر = پروتکل تغییر ژنوم + owner_confirmed).
      تعارض #۳ STATE-MAP عمداً این‌جا حل نشده — verdict جدا.
  orchestr:
    provider: sakana
    model: fugu                        # نرخ = top-model فعال pool؛ fee انباشته نمی‌شود [FACT: sakana.ai/fugu]
    base_url: "https://api.sakana.ai/v1"   # verdict آری 2026-07-09 — باید /v1 داشته باشد وگرنه ۴۰۴ (مستند Sakana). کلید فقط env: FUGU_API_KEY
    cap_monthly: 100                   # AUD — بودجهٔ متریِ Fugu، verdict آری 2026-07-09 (پس از اطمینانِ پایداری → ۵۰۰)
    subscription: pro                  # verdict آری 2026-07-10: پلنِ Pro خریده شده — مغزِ اصلیِ مجموعه
    system_share: 0.5                  # نصفِ سهمیهٔ اشتراک سهمِ سیستم
  premium:
    provider: sakana
    model: fugu-ultra-20260615         # [FACT] $5/$30؛ >272K: $10/$45؛ cache $0.50/$1.00 — توکن orchestration هم شارژ می‌شود
    human_gated: true
  local:                               # مغزِ محلیِ روزمره (verdict آری 2026-07-10) — $0، فقط localhost
    provider: ollama
    model: "qwen2.5:1.5b"              # روی Legion 5 (i5 + GTX 1660Ti)؛ ارتقایِ بعدی: 7B-quantized
    base_url: "http://127.0.0.1:11434"
    cost: 0                            # بدونِ متر — بیرونِ مسیرِ پول؛ rate-limit در cortex/local_llm
