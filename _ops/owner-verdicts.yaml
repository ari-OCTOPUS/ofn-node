# owner-verdicts.yaml — رأی‌های تاریخ‌دارِ مالک که به knob تبدیل شده‌اند.
# ردیفِ A2 ِ REPAIR-PLAN-2026-08-03، با رأیِ مالک در چت ۲۰۲۶-۰۸-۰۳.
#
# چرا این فایل هست:
#   `_ops/OCTOPUS-flags.cmd` عمداً gitignore است (داشبورد تولیدش می‌کند و ممکن
#   است secret بگیرد) — و همین یعنی هر رأیِ مالک که به فلگ تبدیل می‌شد **در هیچ
#   کامیتی نبود**. تمدیدِ ۰۸-۰۳ ِ دو استثنا هم فقط روی یک ماشین زندگی می‌کرد.
#   این‌جا فقط knobهای **غیرمحرمانه** می‌نشینند تا تاریخچه‌شان در گیت بماند.
#
# ⛔ هرگز secret این‌جا نمی‌آید: نه کلیدِ API، نه توکن، نه سید، نه آدرسِ کیف‌پول.
#    این فایل tracked است؛ هر چه این‌جا بنویسی برای همیشه در تاریخچه می‌ماند.
#
# تقدم (عمدی، تغییرش رأی می‌خواهد):
#   env (از flags.cmd) **برنده** است؛ این فایل فقط وقتی خوانده می‌شود که env
#   غایب باشد. پس رفتارِ امروز بایت‌به‌بایت همان است و این فایل تورِ نجات است:
#   اگر flags.cmd گم یا بازتولید شود، رأی‌ها زنده می‌مانند.
#   واگراییِ env با این فایل = خطا، نه سکوت → `owner_verdicts.drift()`.
#
# قالب سخت‌گیر است (پارسرِ stdlib، بدونِ PyYAML): دقیقاً دو سطح تورفتگی،
# `verdicts:` در ستون ۰، نامِ رأی با ۲ فاصله، کلیدها با ۴ فاصله.

verdicts:
  spend_cap:
    env: OCTOPUS_SPEND_CAP_USD
    until_env: OCTOPUS_SPEND_CAP_UNTIL
    value: "200"
    until: "2026-08-13"
    unit: USD
    decided: "2026-07-30"
    extended: "2026-08-03"
    reader: budget_gate.spend_cap_now
    expires_to: "سقفِ پایه (AU$30/ماه)"
    quote: "سقفِ این پنجره US$200 است، نه AU$30."
    note: "تا ۰۸-۰۳ فقط در GOALS-OCTOPUS.md نوشته بود و هیچ کدی نمی‌خواندش."

  goal_max_circular:
    env: OCTOPUS_GOAL_MAX_CIRCULAR
    until_env: OCTOPUS_GOAL_MAX_CIRCULAR_UNTIL
    value: "6"
    until: "2026-08-13"
    unit: count
    decided: "2026-07-30"
    extended: "2026-08-03"
    reader: goal_directed.max_circular_now
    expires_to: "2"
    quote: "max_circular رو بذار ۶ تا آخر آزمون."
    note: "از ۰۷-۳۰ خودکار منقضی می‌شد؛ این‌جا فقط تاریخچه‌اش گیت‌دار شد."

  fugu_weekly_share:
    env: OCTOPUS_FUGU_WEEKLY_SHARE_PCT
    value: "40"
    unit: percent_of_measured_capacity
    decided: "2026-08-04"
    reader: "NONE-YET — متر توکن هنوز ساخته نشده (ممیزیِ ۰۸-۰۳)"
    quote: "۴۰٪ = ۷۲M/هفته → زیمان ۲۸٫۸M · لید ۲۸٫۸M · استودیو ۱۴٫۴M"
    split_ziman_pct: "40"
    split_lead_pct: "40"
    split_studio_pct: "20"
    standing: "yes"
    note: "درصد است نه عددِ مطلق. رأیِ مالک: اگر مصرفِ واقعی نشان داد تخمین غلط بوده، ۴۰٪ روی ظرفیتِ *واقعی* اعمال می‌شود نه روی ۱۸۰M ِ تخمینی — کرنل خودش اصلاح می‌کند. پس ۷۲M مشتق است، رأی همان ۴۰٪ است."
    blocked_on: "صفر صداکننده: هیچ متری در ریپو توکن نمی‌شمارد. fugu_quota درخواست می‌شمارد؛ subscription=max باعث می‌شود est_worst_case و complete صفر بدهند پس organ_gate/budget_gate صفر جمع می‌زنند (organ-state.json روی spent_month_musd=0 بعد از ۳۹۵ فراخوان). تنها منبعِ توکنِ واقعی paid-calls.jsonl است و خواننده ندارد."

  neural_learned_apply:
    env: OCTOPUS_NEURAL_LEARNED_APPLY
    value: "1"
    unit: boolean
    decided: "2026-08-12"
    reader: wiring.effective_flag
    quote: "هردو — فلگ ۱ و apply اجرایی"
    standing: "yes"
    adr: ADR-035
    expires_to: "0 (ADR-034 proposal-only) only by explicit owner rollback"
    note: "فقط protective_skip محلی برای کارِ غیرضروری؛ هیچ پول، ارسال، ایمیل، CRM، ledger یا tool. env صریح حتی اگر 0 باشد بر این fallback مقدم است."

  chrono_rhythm_cr_b0:
    env: OCTOPUS_WIRE_CHRONO_RHYTHM
    value: "1"
    unit: boolean
    decided: "2026-08-12"
    reader: wiring.effective_flag
    quote: "CR-B0 موجود را نگه دار؛ Improve don't rewrite"
    standing: "yes"
    expires_to: "0 by explicit owner rollback"
    note: "فلگ مستقل برای هستهٔ موجودِ ریتم؛ اثر مستقیم ندارد و فقط از pulse-arbiter برای wall-clock spacing عبور می‌کند. age_tick/hash-chain دست‌نخورده."

  math_control_spine:
    env: OCTOPUS_MATH_CONTROL_SPINE
    value: "1"
    unit: boolean
    decided: "2026-08-12"
    reader: math_control.spine.enabled
    quote: "سقف اختیار خیلی نرم؛ سایه جلوی اثر را نگیرد"
    standing: "yes"
    adr: ADR-036
    expires_to: "0 by explicit owner rollback"
    note: "معادلات LIVE → rank/schedule hint/AUTO_KNOBS. observe موازی است نه گیت. پول/ارسال/code-apply از این مسیر ممنوع."

  math_autotune_knobs:
    env: OCTOPUS_MATH_AUTOTUNE_KNOBS
    value: "1"
    unit: boolean
    decided: "2026-08-12"
    reader: math_control.spine
    quote: "اتوماتیک با معادلات روی AUTO_KNOBS سفید"
    standing: "yes"
    adr: ADR-036
    expires_to: "0 by explicit owner rollback"
    note: "فقط CORTEX_THINK_EVERY_N / CHRONO_NUDGE_EVERY_N_BEATS / HEART_SAMPLE_INTERVAL_S و نیازمند ACT_AUTO."

  limited_effect_phase_n:
    env: OCTOPUS_LIMITED_EFFECT_PHASE_N
    value: "3"
    unit: choice
    decided: "2026-08-12"
    reader: limited_effect.enabled
    quote: "همه چیز با کمترین محدودیت — اثر محدود مجاز (انتخاب ۳ فاز M)"
    standing: "yes"
    adr: ADR-037
    expires_to: "0 (advisory-only) only by explicit owner rollback"
    note: "اثر محدود فقط: throttle · pause_proposal · reduce_concurrency · block_suspicious_proposal · request_human_approval. هر اقدام ۵ فیلد الزامی دارد (proposal_hash/policy_version/state_version/expiry_at/idempotency_key) + owner_verdict؛ غایب = DENY. ممنوع همیشگی: تغییر کد/policy، بازنویسی حافظهٔ معنایی، اجرای proposal بدون PolicyGate، پیام خارجی، secret/Project-F. اجرا فقط از PolicyGate؛ این رأی فقط دروازهٔ proposal را باز می‌کند."
