[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbb-cp-kre"
version = "0.2.0"
description = "Knowledge Reality module for the NBB Control Plane — live read-only vault scan, link graph, representation competition, 18 visualisations, missing-link proposals"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "networkx>=3.1", "scikit-learn>=1.3"]

[project.optional-dependencies]
# v0.2: added plotly + matplotlib + pydeck for the 18-visualisation gallery, and
# watchdog for the live file-watcher. All are already installed in the host env,
# so no pip step is required — they are declared for reproducibility only.
ui = [
  "streamlit>=1.30",
  "pandas>=2.0",
  "altair>=5.0",
  "plotly>=5.20",
  "matplotlib>=3.8",
  "pydeck>=0.8",
]
live = ["watchdog>=4.0"]
dev = ["pytest>=8.0"]

[project.scripts]
nbb-kre = "nbb_cp_kre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Always resolve the package from THIS copy's src/ — several clones of this
# app exist on the machine (Desktop, F:\kre-out), one of which may be
# editable-installed. Without this, tests silently test a different copy than
# the one beside them.
pythonpath = ["src"]
