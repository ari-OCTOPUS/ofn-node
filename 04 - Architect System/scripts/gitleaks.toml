# gitleaks config — backup vault (جلسه ۸، 2026-07-04)
# vault گیت نیست، پس با --no-git اجرا کن:
#   gitleaks detect --no-git --source "F:\backup" \
#     -c "04 - Architect System/scripts/gitleaks.toml" -v --report-path gitleaks-report.json
# هدف: کشفِ رازِ *جدید* در نوت/کد. secrets-export و .env.example عمداً allowlist نشده‌اند
# تا تا وقتی داخل vaultند، اسکن بلند یادآوری کند.

title = "backup-vault"

[extend]
useDefault = true   # قواعد پیش‌فرض gitleaks: AWS/GCP/GitHub/Stripe، PEM، sk-، telegram token، ...

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''[0-9]{8,10}:[A-Za-z0-9_-]{35}'''
tags = ["telegram", "token"]

[[rules]]
id = "anthropic-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9-]{20,}'''
tags = ["anthropic", "apikey"]

[[rules]]
id = "monero-address"
description = "Monero public address (95 chars)"
regex = '''4[0-9AB][1-9A-HJ-NP-Za-km-z]{93}'''
tags = ["crypto", "wallet"]

[allowlist]
description = "false-positive های بی‌خطر — نه رازِ واقعی"
paths = [
  '''.*cacert\.pem''',       # CA bundle (certifi) — راز نیست
  '''.*/venv/.*''',
  '''.*/node_modules/.*''',
  '''_Duplicates/.*''',
  '''\.git/.*''',
]

# ── ۲۰۲۶-۰۸-۰۴ — چرا این کانفیگ تا امروز هرگز سیم‌کشی نشده بود ────────────────
# اولین اجرای واقعی‌اش (`--no-git --source _ops`): **۲۱۳ یافته**، هر ۲۱۳ از
# قاعدهٔ `generic-api-key`، و پس از بررسی هر ۲۱۳ **کاذب**:
#   · ۱۵۸ کلیدِ hex در `_ops/state/cortex/outcomes.jsonl`
#   · ۴۸ فیلدِ `token_sha256` — یعنی دایجستِ توکن، نه خودِ توکن
#   · ۴ موردِ `OWNER_AUTH` که خطِ **کامنتِ REM** است و به شناسهٔ رأی اشاره می‌کند
#   · ۳ توکنِ ساختگی در دو فایلِ تست
# شاهدِ تعیین‌کننده: آنتروپیِ هر ۲۱۳ بینِ ۳٫۵۵ و ۳٫۹۵ بود — سقفِ الفبای hex دقیقاً
# ۴٫۰ است، در حالی که کلیدِ واقعی معمولاً ۴٫۵+ دارد. یعنی همه‌شان دایجستِ hex‌اند.
#
# پس گاردی که ۲۱۳ کاذب می‌دهد **بدتر از نبودنش** است: هر کامیت را می‌بندد تا
# اولین نفر خاموشش کند. علتِ سیم‌کشی‌نشدنش همین بود، نه فراموشی.
#
# ⚠️ این regexها عمداً طوری نوشته شده‌اند که **نتوانند** یک راز واقعی را بپوشانند:
# فقط hex ِ خالص با طولِ دقیقِ دایجست. کلیدِ Anthropic ‏(`sk-ant-…`)، توکنِ تلگرام
# (`رقم:base64`)، کلیدِ AWS ‏(`AKIA…` با حروفِ بزرگ) و بلوکِ PEM هیچ‌کدام hex ِ
# خالصِ ۳۲/۴۰/۶۴ نیستند، پس قواعدِ اختصاصی‌شان دست‌نخورده شلیک می‌کنند.
regexes = [
  '''^[0-9a-f]{64}$''',   # SHA-256 hex
  '''^[0-9a-f]{40}$''',   # SHA-1 hex
  '''^[0-9a-f]{32}$''',   # MD5 hex
  # شناسهٔ ۱۳ کاراکتریِ فیلدِ `key` در outcomes.jsonl. شکلش با ماسک‌کردنِ حروف
  # سنجیده شد (نه با خواندنِ مقدارها): `hh-hh9…` با طولِ ثابتِ ۱۳. هیچ کلیدِ
  # واقعیِ هیچ سرویسی این‌قدر کوتاه نیست، پس این الگو نمی‌تواند رازی را بپوشاند.
  '''^[a-z]{2}-[a-z0-9]{8,16}$''',
  # شناسهٔ رأی در کامنت‌های REM — «VQ-MISSION-APPROVAL-001». اصلاً مقدار نیست.
  '''^VQ-[A-Z0-9-]+-[0-9]{3}$''',
]
