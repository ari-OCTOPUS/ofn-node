ratified_invariants:
  - id: INV-17
    statement: "Worker isolation is STRUCTURAL, not behavioral: a worker's maximum possible output is an inspectable proposal; it can never reach secrets, the ledger, or unrelated files — by construction (process boundary), not by trusting its behavior."
    source: [MasterHandoff(§5.1-5.2 D1/D3), IsolationModel.md]
    enforcement: "separate non-root process + seccomp-bpf + dropped caps/userns + cgroups v2 + brokered egress; secrets:[] always"
    status: RATIFIED 2026-07-08 (invariants 16→17)
    confidence: 88; evidence_level: EST

ratified_anti_patterns:
  - id: AP-14
    name: "Trust-boundary fallacy"
    why_dangerous: "Believing a worker is safe because it was INSTRUCTED to behave, or because its prompt is 'trusted'. Injection defeats behavioral trust; only a structural boundary holds."
    guard_against: "treat every worker + every LLM call as potentially compromised; confine by structure (INV-17*), catch residue with human review + Critic"
    appears_in: [MasterHandoff(§5.2 residual risk), IsolationModel.md(R1/R2)]
    status: RATIFIED 2026-07-08 (anti_patterns 13→14)
    severity: high; evidence_level: EST
