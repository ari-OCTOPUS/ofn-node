  nodes:
    - {module: Ledger+EventBus, layer: L0, status: code-ready(B)}   # SQL schema now available (DOC-B §8); MER-1 closed
    - {module: EpistemicKernel, layer: L1, status: spec-ready}
    - {module: PersonalState+Modes, layer: Lp}
    - {module: ModelPool(LiteLLM), layer: L2, blocked_by: "routing rules = MER-2"}
    - {module: Orchestrator+SubLegs, layer: L3}
    - {module: Memory(Vault+Ladder+Reconsolid), layer: L4, blocked_by: "vault fields = MER-2"}
    - {module: Reasoning/WorldModel, layer: L5, status: speculative}
    - {module: KnowledgeFabric, layer: L6}
    - {module: EvolutionDoctor, layer: L7}
    - {module: Governance(Guards), layer: L8}
    - {module: BusinessMoney(registry/money_link), layer: L9}
    - {module: ResearchEngine(ingest/experiments), layer: L10}
    - {module: Observability(checkpoint/replay), layer: L13}
  edges:
    - {from: L0, to: L1, type: epistemic, blocking: true}       # tags need writes
    - {from: L0, to: L13, type: data, blocking: true}           # replay over hash-chain
    - {from: L0, to: L3, type: runtime, blocking: true}         # HLC for sub-legs
    - {from: L1, to: L4, type: epistemic, blocking: true}       # tagged memory writes
    - {from: L8, to: "*", type: safety, blocking: true}         # guards wrap everything
    - {from: HumanAnchor, to: L7, type: approval, blocking: true} # doctor merges need human-append
    - {from: L4, to: L7, type: memory, blocking: false}         # doctor mines memory
    - {from: L6, to: L7, type: knowledge, blocking: false}      # doctor mines fabric
    - {from: Lp, to: L8, type: safety, blocking: false}         # state modulates guards
    - {from: L13, to: L3, type: infrastructure, blocking: false}# checkpoint before sub-legs
    - {from: L9, to: L10, type: business, blocking: false}      # money_link gates research→active
  critical_path: "L0 → (L1 ∥ L13-checkpoint) → L4(ladder) → L3(sub-legs) → L7(anchored doctor)"
  note: "Mirrors DOC-C/DOC-06 phased roadmap: ship substrate → checkpoint → memory → sub-legs → anchored evolve → interop. Layer numbers canonical (see UnifiedArchitecture)."

# ============================================================
# GRAPH 3 — EXECUTION GRAPH (one full beat + loops)   [READY]
# ============================================================
execution_graph:
  steps:
    - {id: S1, actor: Pacemaker, process: "emit beat (HLC tick)", output: beat_event, next: S2, event_emitted: beat}
    - {id: S2, actor: Orchestrator, input: beat_event, process: "collect leg acks; phi-accrual liveness; broadcast shared-now", next: S3}
    - {id: S3, actor: Legs, process: "load own leg_memory (not full history); do work", guard: WorkerGuard, next: S4}
    - {id: S4, actor: Leg, process: "if breadth needed → spawn mortal sub-leg (cost-billed, capped)", guard: "concurrency cap; cost≠∞", next: S5, event_emitted: subleg.spawned}
    - {id: S5, actor: Leg, process: "produce PROPOSAL only (to proposals/)", next: S6, event_emitted: proposal.created}
    - {id: S6, actor: EpistemicKernel, input: proposal, process: "attach tags + falsifier; run eliminability/added-value; write gap-report", next: S7}
    - {id: S7, actor: Critic, process: "adversarial review, before→after", next: S8}
    - {id: S8, actor: GuardLayer, process: "classify: reversible? money/irreversible? autonomy>ceiling? mode-impulsive?", next: [S9a, S9b]}
    - {id: S9a, cond: "reversible & within autonomy", actor: System, process: "apply; snapshot; append event", next: S12}
    - {id: S9b, cond: "irreversible OR autonomy>ceiling OR impulsive-mode", actor: System, process: "enqueue cooldown; await HUMAN-APPEND", guard: MoneyGuard/AutonomyGuard/StateGuard, next: S10}
    - {id: S10, actor: HumanAnchor, process: "verdict (root-of-trust); on Offline → freeze irreversible, cognition may continue (effect/cognition split)", next: S11}
    - {id: S11, actor: Ledger, process: "human-append settles → age_tick advances → effect fires", next: S12, event_emitted: settled}
    - {id: S12, actor: Observability, process: "per-beat checkpoint over hash-chain; metrics(cost/latency/error)", next: S13}
    - {id: S13, actor: EvolutionDoctor, process: "(periodic) mine KnowledgeFabric+metrics → bottleneck → RFC → sandbox → back to S5 as proposal", guard: EvolutionGuard, next: S1}
  loops:
    - {name: heartbeat, over: "S1→S2"}
    - {name: metabolic_aging, note: "experience_rate accrues per work; faster=older (INV-07)"}
    - {name: anchored_improvement, over: "S13→S5→…→S10 (human-append)"}
    - {name: reconsolidation, note: "on mismatch, update stored prior (L4)"}
  recovery:
    - {trigger: module.failed, action: "OTP-style doctor restart from known-good ledger state; time-travel replay to beat"}
    - {trigger: offline, action: "queue events; build Re-entry Packet from log on return"}
