<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>fBackup Octopus · 3D Topology</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#e5e7eb}
  #panelTL{position:fixed;top:14px;left:14px;z-index:10;background:rgba(10,10,10,.8);padding:12px 16px;border-radius:8px;border:1px solid #333;pointer-events:none}
  #panelTL h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.3px}
  #panelTL p{margin:4px 0 0;font-size:11px;color:#8b8b8b}
  #legend{position:fixed;top:14px;right:14px;z-index:10;background:rgba(10,10,10,.8);padding:12px 14px;border-radius:8px;border:1px solid #333;pointer-events:none}
  #legend .row{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
  #legend .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 6px currentColor}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:10;font-size:12px;color:#666;pointer-events:none}
  #tip{position:fixed;z-index:20;display:none;background:rgba(0,0,0,.9);padding:8px 12px;border-radius:6px;font-size:12px;pointer-events:none;line-height:1.6}
  #tip b{font-size:13px}
  #err{position:fixed;inset:0;display:none;place-items:center;z-index:30;color:#f87171;font-size:14px}
</style>
</head>
<body>
<div id="panelTL"><h1>fBackup Octopus · 3D Topology</h1><p>8 agents · 8 tentacles · live data flow</p></div>
<div id="legend"></div>
<div id="hint">drag to rotate · scroll to zoom · hover to inspect</div>
<div id="tip"></div>
<div id="err">Three.js failed to load — check your internet connection.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js">\x3C/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>(window.THREE&&THREE.OrbitControls)||document.write('<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js">\x3C/script>');</script>
<script>
var _tries=0;
(function boot(){
 if(!window.THREE||!THREE.OrbitControls){ if(_tries++>60){document.getElementById('err').style.display='grid';return;} return setTimeout(boot,120); }
 init();
})();

function init(){
 var V=THREE.Vector3;
 var AGENTS=[
  {name:'scanner',    role:'اسکنِ پوشه',        color:0x3b82f6, pos:[ 40, 35, 30], active:true},
  {name:'compressor', role:'فشرده‌سازی',        color:0xef4444, pos:[-40, 35, 30], active:true},
  {name:'encryptor',  role:'رمزنگاری AES-256',  color:0x22c55e, pos:[ 40, -5, 30], active:true},
  {name:'uploader',   role:'آپلود',            color:0xa855f7, pos:[-40, -5, 30], active:true},
  {name:'scheduler',  role:'زمان‌بندی',         color:0xf59e0b, pos:[ 25, 45,-35], active:true},
  {name:'verifier',   role:'راستی‌آزماییِ hash', color:0x06b6d4, pos:[-25, 45,-35], active:true},
  {name:'logger',     role:'لاگ‌گیری',          color:0xec4899, pos:[ 25,-15,-35], active:true},
  {name:'notifier',   role:'اعلان',            color:0x84cc16, pos:[-25,-15,-35], active:false}
 ];
 var idxOf={}; AGENTS.forEach(function(a,i){idxOf[a.name]=i;});
 var CORE=new V(0,10,0);

 // ---- scene / camera / renderer (STEP 2) ----
 var scene=new THREE.Scene(); // NO fog
 var camera=new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 2000);
 camera.position.set(60,50,80); camera.lookAt(0,10,0);
 var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
 renderer.setClearColor(0x0a0a0a,1); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 document.body.appendChild(renderer.domElement);
 var controls=new THREE.OrbitControls(camera,renderer.domElement);
 controls.enableDamping=true; controls.dampingFactor=0.05; controls.target.set(0,10,0);

 // ---- lights (STEP 3) ----
 scene.add(new THREE.AmbientLight(0x404040,0.5));
 var dl=new THREE.DirectionalLight(0xffffff,0.8); dl.position.set(50,100,50); scene.add(dl);
 var pc=new THREE.PointLight(0x3b82f6,0.6,150); pc.position.set(0,10,0); scene.add(pc);
 var pt=new THREE.PointLight(0xffaa00,0.3,100); pt.position.set(0,40,0); scene.add(pt);

 var octo=new THREE.Group(); scene.add(octo);

 // ---- core head (STEP 4) ----
 var core=new THREE.Mesh(new THREE.SphereGeometry(12,32,32),
   new THREE.MeshPhysicalMaterial({color:0x111111,emissive:0x222222,emissiveIntensity:0.3,roughness:0.3,metalness:0.8,clearcoat:1.0,clearcoatRoughness:0.1}));
 core.position.copy(CORE); octo.add(core);
 // eyes + pupils
 var eyes=[],pupils=[];
 [[-4,12,8],[4,12,8]].forEach(function(p){
   var e=new THREE.Mesh(new THREE.SphereGeometry(2.5,16,16),new THREE.MeshBasicMaterial({color:0x00ffff})); e.position.set(p[0],p[1],p[2]); octo.add(e); eyes.push(e);
   var pu=new THREE.Mesh(new THREE.SphereGeometry(1.0,12,12),new THREE.MeshBasicMaterial({color:0x001018})); pu.position.set(0,0,2.1); e.add(pu); pupils.push(pu);
 });
 // pulse ring
 var ring=new THREE.Mesh(new THREE.TorusGeometry(16,0.5,16,64),new THREE.MeshBasicMaterial({color:0x3b82f6,transparent:true,opacity:0.3,side:THREE.DoubleSide}));
 ring.position.copy(CORE); ring.rotation.x=Math.PI/2; octo.add(ring);

 // ---- agents: black boxes + face dots + status (STEP 6) ----
 AGENTS.forEach(function(a){
   var g=new THREE.Group(); g.position.set(a.pos[0],a.pos[1],a.pos[2]); octo.add(g); a.group=g;
   var box=new THREE.Mesh(new THREE.BoxGeometry(10,8,10),
     new THREE.MeshPhysicalMaterial({color:0x0a0a0a,roughness:0.7,metalness:0.3,clearcoat:0.5})); g.add(box); a.box=box;
   // face plane + 4 dots facing +z toward core direction
   var toCore=CORE.clone().sub(new V(a.pos[0],a.pos[1],a.pos[2])).normalize();
   var face=new THREE.Mesh(new THREE.PlaneGeometry(8,6),new THREE.MeshBasicMaterial({color:0x050505,side:THREE.DoubleSide}));
   face.position.copy(toCore.clone().multiplyScalar(5.1)); face.lookAt(face.position.clone().add(toCore)); g.add(face);
   var dotMat=new THREE.MeshBasicMaterial({color:a.color});
   [[-2,1.4],[2,1.4],[-2,-1.4],[2,-1.4]].forEach(function(o){
     var d=new THREE.Mesh(new THREE.SphereGeometry(0.8,12,12),dotMat);
     var right=new V().crossVectors(toCore,new V(0,1,0)).normalize(); var up=new V().crossVectors(right,toCore).normalize();
     d.position.copy(face.position).add(right.clone().multiplyScalar(o[0])).add(up.clone().multiplyScalar(o[1])).add(toCore.clone().multiplyScalar(0.3)); g.add(d);
   });
   var st=new THREE.Mesh(new THREE.SphereGeometry(1.5,16,16),new THREE.MeshBasicMaterial({color:a.active?0x22c55e:0xef4444}));
   st.position.set(0,6,0); g.add(st); a.status=st; a.box.userData={agent:a,ts:1};
 });

 // ---- tentacles + branches + particles (STEP 5 & 7) ----
 AGENTS.forEach(function(a,i){
   var ap=new V(a.pos[0],a.pos[1],a.pos[2]);
   a.curve=new THREE.CatmullRomCurve3([CORE.clone(),CORE.clone().add(ap).multiplyScalar(0.5),ap.clone()]);
   var mat=new THREE.MeshPhysicalMaterial({color:a.color,emissive:a.color,emissiveIntensity:0.2,transparent:true,opacity:0.7,roughness:0.4,metalness:0.6});
   a.tmat=mat;
   a.tube=new THREE.Mesh(new THREE.TubeGeometry(a.curve,64,1.2,8,false),mat); octo.add(a.tube);
   a.branchMat=new THREE.MeshPhysicalMaterial({color:a.color,emissive:a.color,emissiveIntensity:0.2,transparent:true,opacity:0.5,roughness:0.4,metalness:0.6});
   a.b1=new THREE.Mesh(new THREE.TubeGeometry(a.curve,20,0.4,6,false),a.branchMat); octo.add(a.b1);
   a.b2=new THREE.Mesh(new THREE.TubeGeometry(a.curve,20,0.4,6,false),a.branchMat); octo.add(a.b2);
   // particles + trails
   a.parts=[];
   for(var k=0;k<5;k++){
     var mainM=new THREE.MeshBasicMaterial({color:0xffffff});
     var m=new THREE.Mesh(new THREE.SphereGeometry(0.6,8,8),mainM); octo.add(m);
     var trails=[]; [0.4,0.2,0.1].forEach(function(op){var tm=new THREE.Mesh(new THREE.SphereGeometry(0.6,8,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:op})); octo.add(tm); trails.push(tm);});
     a.parts.push({t:k/5,speed:0.002+Math.random()*0.004,mesh:m,trails:trails});
   }
 });

 // ---- inter-agent web (STEP 8) ----
 var PAIRS=[['scanner','compressor'],['scanner','encryptor'],['compressor','uploader'],['encryptor','uploader'],['scheduler','verifier'],['logger','notifier'],['scanner','scheduler'],['compressor','verifier'],['encryptor','logger'],['uploader','notifier'],['scheduler','logger'],['verifier','notifier']];
 var webLines=[];
 PAIRS.forEach(function(pr,i){var A=AGENTS[idxOf[pr[0]]].pos,B=AGENTS[idxOf[pr[1]]].pos;
   var geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute([A[0],A[1],A[2],B[0],B[1],B[2]],3));
   var ln=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x333333,transparent:true,opacity:0.15})); ln.userData.ph=i; octo.add(ln); webLines.push(ln);
 });

 // ---- ground + grid (STEP 9) ----
 var ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x050505,roughness:0.9,metalness:0.5}));
 ground.rotation.x=-Math.PI/2; ground.position.set(0,-30,0); scene.add(ground);
 var grid=new THREE.GridHelper(300,60,0x1a1a1a,0x0d0d0d); grid.position.y=-29.9; scene.add(grid);

 // ---- legend UI ----
 var lg=document.getElementById('legend');
 AGENTS.forEach(function(a){var hx='#'+a.color.toString(16).padStart(6,'0');
   lg.insertAdjacentHTML('beforeend','<div class="row"><span class="dot" style="background:'+hx+';color:'+hx+'"></span>'+a.name+'<span class="dot" style="width:7px;height:7px;background:'+(a.active?'#22c55e':'#ef4444')+';color:'+(a.active?'#22c55e':'#ef4444')+'"></span></div>');});

 // ---- interaction (STEP 11) ----
 var ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),ndc=new THREE.Vector2(),tip=document.getElementById('tip'),hovered=null;
 var groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),30),look=new V();
 addEventListener('pointermove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;ndc.x=(e.clientX/innerWidth)*2-1;ndc.y=-(e.clientY/innerHeight)*2+1;});
 renderer.domElement.addEventListener('click',function(){if(hovered)console.log(hovered.name+' clicked');});

 function hover(){
   ray.setFromCamera(ndc,camera);
   var hit=ray.intersectObjects(AGENTS.map(function(a){return a.box;}))[0];
   var a=hit?hit.object.userData.agent:null;
   if(a!==hovered){
     if(hovered){hovered.box.userData.ts=1;hovered.tmat.opacity=0.7;hovered.tmat.emissiveIntensity=0.2;core.material.emissiveIntensity=0.3;}
     hovered=a;
     if(a){a.box.userData.ts=1.2;a.tmat.opacity=1.0;a.tmat.emissiveIntensity=0.5;
       tip.style.display='block';tip.style.borderTop='1px solid #'+a.color.toString(16).padStart(6,'0');tip.style.border='1px solid #'+a.color.toString(16).padStart(6,'0');
       tip.innerHTML='<b>'+a.name+'</b><br>role: '+a.role+'<br>status: '+(a.active?'active ✓':'inactive ✗');}
     else tip.style.display='none';
   }
   if(a){tip.style.left=(mouse.x+14)+'px';tip.style.top=(mouse.y+14)+'px';}
 }

 // ---- animation loop (STEP 10) ----
 var time=0;
 function animate(){
   requestAnimationFrame(animate); time+=0.016;
   // core ring pulse
   ring.scale.setScalar(1+Math.sin(time*2)*0.1);
   // eyes glow + pupil follow
   ray.setFromCamera(ndc,camera); ray.ray.intersectPlane(groundPlane,look);
   pupils.forEach(function(pu){pu.position.x=THREE.MathUtils.clamp(ndc.x*0.9,-0.9,0.9);pu.position.y=THREE.MathUtils.clamp(ndc.y*0.9,-0.9,0.9)+0;});
   // tentacles: wiggle control point + rebuild + branches
   AGENTS.forEach(function(a,i){
     var ap=new V(a.pos[0],a.pos[1],a.pos[2]);
     var mid=CORE.clone().add(ap).multiplyScalar(0.5); mid.y+=-20+Math.sin(time+i)*5;
     a.curve.points[1].copy(mid);
     a.tube.geometry.dispose(); a.tube.geometry=new THREE.TubeGeometry(a.curve,64,1.2,8,false);
     var p30=a.curve.getPoint(0.3),p70=a.curve.getPoint(0.7);
     var off=new V(Math.sin(time*1.5+i)*4,Math.cos(time*1.3+i)*4,Math.sin(time+i)*4);
     var c1=new THREE.CatmullRomCurve3([p30,p30.clone().add(off.clone().multiplyScalar(0.5)),p30.clone().add(off)]);
     var c2=new THREE.CatmullRomCurve3([p70,p70.clone().add(off.clone().multiplyScalar(-0.5)),p70.clone().add(off.clone().multiplyScalar(-1))]);
     a.b1.geometry.dispose(); a.b1.geometry=new THREE.TubeGeometry(c1,12,0.4,6,false);
     a.b2.geometry.dispose(); a.b2.geometry=new THREE.TubeGeometry(c2,12,0.4,6,false);
     // particles + trails
     a.parts.forEach(function(pp){pp.t+=pp.speed; if(pp.t>=1)pp.t=0; pp.mesh.position.copy(a.curve.getPoint(pp.t));
       pp.trails.forEach(function(tm,ti){var tt=pp.t-0.02*(ti+1); if(tt<0)tt+=1; tm.position.copy(a.curve.getPoint(tt));});});
     // status pulse
     if(a.active)a.status.scale.setScalar(1+Math.sin(time*3)*0.2);
     // hover scale lerp
     var s=THREE.MathUtils.lerp(a.box.scale.x,a.box.userData.ts,0.15); a.box.scale.setScalar(s);
   });
   // web opacity pulse
   webLines.forEach(function(ln){ln.material.opacity=0.175+Math.sin(time+ln.userData.ph)*0.075;});
   // slow auto-rotate whole octopus
   octo.rotation.y+=0.001;
   hover(); controls.update(); renderer.render(scene,camera);
 }
 animate();
 addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}
</script>
</body>
</html>
