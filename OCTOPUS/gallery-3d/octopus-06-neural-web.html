<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — شبکهٔ اعصاب</title>
<style>
  html,body{margin:0;height:100%;background:#050216;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 52%,rgba(2,0,10,.92) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#67e8f9,#3b82f6,#00ffff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #3b82f655}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:11.5px/1.6 ui-monospace,Menlo,monospace;color:#67e8f9;pointer-events:none}
  #st b{color:#93c5fd}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#67e8f9}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>AFFERENT NEURAL WEB</b><span>شبکهٔ اعصابِ آوران · سیگنالِ حسیِ بالا‌رونده به نخاع (UnifiedBus)</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · هر ماژول که آتش می‌گیرد یک <b>پالس</b> به نخاع می‌فرستد</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050216);scene.fog=new THREE.FogExp2(0x050216,0.012);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,400);camera.position.set(0,2,30);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.45;controls.target.set(0,-2,0);controls.minDistance=14;controls.maxDistance=70;
scene.add(new THREE.AmbientLight(0x223355,0.55));
const blueL=new THREE.PointLight(0x3b82f6,20,90);blueL.position.set(0,6,4);scene.add(blueL);
(function(){const n=800,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=90+Math.random()*90,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.16,transparent:true,opacity:0.5})));})();
// spine
const spine=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,22,20,1,true),new THREE.MeshStandardMaterial({color:0x0a1a3a,emissive:0x3b82f6,emissiveIntensity:1.0,transparent:true,opacity:0.6,side:THREE.DoubleSide}));spine.position.y=1;scene.add(spine);
scene.add(new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,22,20,1,true),new THREE.MeshBasicMaterial({color:0x3b82f6,transparent:true,opacity:0.09,blending:ADD,side:THREE.DoubleSide})).translateY(1));
const MODS=['rhythm','circadian','sensory','nociceptor','consolidation','hebbian','latent','stress'];
const mods=[];const R=8;
for(let i=0;i<8;i++){const ang=(i/8)*Math.PI*2;const y=-7+Math.sin(i*1.3)*1.5;const pos=new THREE.Vector3(Math.cos(ang)*R,y,Math.sin(ang)*R);
  const node=new THREE.Mesh(new THREE.IcosahedronGeometry(0.9,0),new THREE.MeshStandardMaterial({color:0x081826,emissive:0x67e8f9,emissiveIntensity:0.5,roughness:0.35,metalness:0.4,transparent:true,opacity:0.8,flatShading:true}));node.position.copy(pos);scene.add(node);
  // filament climbing up to spine top region
  const top=new THREE.Vector3(0,4+Math.random()*3,0);const mid=new THREE.Vector3(pos.x*0.4,(pos.y+top.y)/2+1,pos.z*0.4);
  const c=new THREE.CatmullRomCurve3([pos,mid,new THREE.Vector3(pos.x*0.15,top.y-2,pos.z*0.15),top]);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(c,30,0.04,6,false),new THREE.MeshBasicMaterial({color:0x67e8f9,transparent:true,opacity:0.4,blending:ADD})));
  mods.push({node,curve:c,flash:0,phase:Math.random()*6.28});}
// upward pulses
const PN=60,pPos=new Float32Array(PN*3),pp=[];for(let i=0;i<PN;i++)pp.push({m:i%8,t:Math.random(),sp:0.2+Math.random()*0.4});
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({color:0x00ffff,size:0.5,transparent:true,opacity:0.95,blending:ADD,depthWrite:false})));
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.05,0.8,0.12));
const stEl=document.getElementById('st');const clock=new THREE.Clock();let fired='sensory';
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05),t=clock.getElapsedTime();
  spine.material.emissiveIntensity=0.9+Math.sin(t*3)*0.2;
  mods.forEach((m,i)=>{m.node.rotation.y+=0.01;m.flash=Math.max(0,m.flash-dt*2);m.node.material.emissiveIntensity=0.4+m.flash*1.4;m.node.position.y+=Math.sin(t+m.phase)*0.003;});
  for(let i=0;i<PN;i++){const c=pp[i];c.t+=c.sp*dt;if(c.t>=1){c.t=0;mods[c.m].flash=1;fired=MODS[c.m];c.m=Math.floor(Math.random()*8);}const p=mods[c.m].curve.getPoint(c.t);pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;}pGeo.attributes.position.needsUpdate=true;
  stEl.innerHTML=`<b>▲ afferent flow</b><br>last fired: <span style="color:#00ffff">${fired}</span><br><span style="color:#6b5b85">8 nerve modules → spine</span>`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
