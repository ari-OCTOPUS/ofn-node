<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — SECTOR ARM (بازوی منفرد)</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,4,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#22d3ee,#38bdf8,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #22d3ee55}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#7dd3fc;pointer-events:none}
  #st b{color:#fcd34d}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#22d3ee}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>SECTOR ARM · بازوی منفرد</b><span>یک بازو = یک شاخهٔ بکاپ · دو ردیفِ مکنده در تمامِ طول (biserial) · مکنده = restore point</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · مکنده‌ها از قاعده (بزرگ) تا نوک (ریز) = <b>ریستور پوینت‌ها</b></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.01);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,400);camera.position.set(0,4,26);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.5;controls.target.set(0,0,0);controls.minDistance=10;controls.maxDistance=60;
scene.add(new THREE.AmbientLight(0x22344f,0.55));
const key=new THREE.PointLight(0x9fd8ff,26,110);key.position.set(6,8,10);scene.add(key);
const rim=new THREE.DirectionalLight(0x67e8f9,0.9);rim.position.set(-6,2,-4);scene.add(rim);
(function(){const n=600,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=90+Math.random()*90,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.15,transparent:true,opacity:0.5})));})();
const SKIN=()=>new THREE.MeshStandardMaterial({color:0x081826,emissive:0x22d3ee,emissiveIntensity:0.8,roughness:0.35,metalness:0.4,transparent:true,opacity:0.66,flatShading:true});
const arm=new THREE.Group();scene.add(arm);
// gentle S-curve in a plane, base(left,thick) -> tip(right,thin)
const pts=[new THREE.Vector3(-9,3,0),new THREE.Vector3(-4,-1,0),new THREE.Vector3(1,2.5,0),new THREE.Vector3(6,-1.5,0),new THREE.Vector3(9.5,1.5,0)];
const curve=new THREE.CatmullRomCurve3(pts);
// tapered tube via custom radius (frames)
const N=120,frames=curve.computeFrenetFrames(N,false),path=curve.getSpacedPoints(N);
const tubeGeo=new THREE.TubeGeometry(curve,N,1,16,false);
// manual taper: rebuild positions radius by t
const pos=tubeGeo.attributes.position, rad=16;
for(let i=0;i<=N;i++){const t=i/N;const r=1.3*(1-t*0.92);const P=path[i],No=frames.normals[i],B=frames.binormals[i];
  for(let j=0;j<=rad;j++){const a=j/rad*Math.PI*2;const idx=(i*(rad+1)+j)*3;const nx=Math.cos(a)*No.x+Math.sin(a)*B.x,ny=Math.cos(a)*No.y+Math.sin(a)*B.y,nz=Math.cos(a)*No.z+Math.sin(a)*B.z;pos.setXYZ(i*(rad+1)+j,P.x+nx*r,P.y+ny*r,P.z+nz*r);}}
pos.needsUpdate=true;tubeGeo.computeVertexNormals();
const armMesh=new THREE.Mesh(tubeGeo,SKIN());arm.add(armMesh);
arm.add(new THREE.Mesh(new THREE.TubeGeometry(curve,N,1.15,16,false),new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:0.07,blending:ADD})));
// base cap
const cap=new THREE.Mesh(new THREE.CircleGeometry(1.3,24),SKIN());cap.position.copy(path[0]);cap.lookAt(path[1]);arm.add(cap);
// biserial suckers (two rows on oral/inner face = -normal side), size grade
const suckMat=new THREE.MeshStandardMaterial({color:0x0a1a24,emissive:0xbfe9ff,emissiveIntensity:0.7,roughness:0.3,metalness:0.5,transparent:true,opacity:0.9});
const nsuck=42;const suckers=[];
for(let i=1;i<nsuck;i++){const t=i/nsuck;const P=curve.getPointAt(t),T=curve.getTangentAt(t);
  const idx=Math.round(t*N),No=frames.normals[idx],B=frames.binormals[idx];
  const r=1.3*(1-t*0.92);const ss=0.42*(1-t*0.8)+0.06;
  for(let row=0;row<2;row++){const s=row?1:-1;
    const off=No.clone().multiplyScalar(-r*0.65).add(B.clone().multiplyScalar(s*r*0.5));
    const cup=new THREE.Mesh(new THREE.TorusGeometry(ss,ss*0.35,6,14),suckMat.clone());cup.position.copy(P).add(off);cup.lookAt(P.clone().add(No.clone().multiplyScalar(-1)));arm.add(cup);suckers.push(cup);
    const hole=new THREE.Mesh(new THREE.CircleGeometry(ss*0.6,12),new THREE.MeshBasicMaterial({color:0x001018}));hole.position.copy(cup.position);hole.rotation.copy(cup.rotation);arm.add(hole);}}
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.9,0.8,0.2));
const stEl=document.getElementById('st');const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
  arm.rotation.z=Math.sin(t*0.5)*0.04;armMesh.material.emissiveIntensity=0.7+Math.sin(t*1.6)*0.2;
  const pulse=(t*0.4)%1;suckers.forEach((c,i)=>{const ph=(i/suckers.length);const on=Math.abs(((pulse-ph)%1))<0.05;c.material.emissiveIntensity=on?1.8:0.6;});
  stEl.innerHTML=`<b>➤ SECTOR ARM</b> · one backup branch<br>~200 suckers biserial<br>base→tip taper · <span style="color:#bfe9ff">restore points</span>`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
