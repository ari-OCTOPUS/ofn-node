<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — ۸ بازو · ۸ مسیرِ بکاپ</title>
<style>
  html, body { margin: 0; height: 100%; background: #02030e; overflow: hidden; font-family: "Segoe UI", Tahoma, sans-serif; }
  #app { position: fixed; inset: 0; }
  #scan { position: fixed; inset: 0; pointer-events: none; z-index: 3; background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(120,180,255,.04) 2px 3px); mix-blend-mode: screen; }
  #vig  { position: fixed; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,4,.9) 100%); }
  .top { position: fixed; top: 14px; left: 0; right: 0; text-align: center; z-index: 5; pointer-events: none; }
  .top b { font-size: 15px; font-weight: 800; letter-spacing: 3px; background: linear-gradient(90deg,#7dd3fc,#34d399,#fcd34d); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 22px #34d39955; }
  .top span { display: block; font-size: 11px; color: #5b6b85; margin-top: 3px; letter-spacing: 1px; }
  #legend { position: fixed; top: 14px; left: 16px; z-index: 6; direction: ltr; text-align: left;
    font: 11.5px/1.55 ui-monospace, Menlo, monospace; color: #9fb3cc; pointer-events: none; }
  #legend .row { display: flex; align-items: center; gap: 7px; }
  #legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; box-shadow: 0 0 8px currentColor; }
  #legend .t { color: #5b6b85; margin-top: 7px; font-size: 10.5px; }
  #hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; z-index: 5; pointer-events: none; font-size: 11.5px; color: #5b6b85; }
  #hint b { color: #bae6fd; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="scan"></div><div id="vig"></div>
<div class="top"><b>۸ ARMS · 8 PATHS</b><span>۸ بازو = ۸ مسیر/مقصدِ بکاپ · مکنده‌ها = restore point · همه propose-only پشتِ گیتِ مالک</span></div>
<div id="legend"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · رنگِ نقطهٔ قاعده = <b>ردهٔ ریسک</b> (سبز→زرد→نارنجی→قرمز)</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const ADD = THREE.AdditiveBlending;
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030e);
scene.fog = new THREE.FogExp2(0x02030e, 0.011);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 14, 40);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.05;
controls.autoRotate=true; controls.autoRotateSpeed=0.4;
controls.target.set(0,-4,0); controls.minDistance=18; controls.maxDistance=110;

scene.add(new THREE.AmbientLight(0x22344f, 0.55));
const key=new THREE.PointLight(0x9fd8ff,35,160); key.position.set(0,12,10); scene.add(key);

(function(){ const n=900,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const r=100+Math.random()*100,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.18,transparent:true,opacity:0.5}))); })();

// central body-orb (canonical skin)
const body=new THREE.Mesh(new THREE.IcosahedronGeometry(4.5,2),new THREE.MeshStandardMaterial({
  color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.6,roughness:0.35,metalness:0.45,transparent:true,opacity:0.6,flatShading:true}));
scene.add(body);
scene.add(new THREE.Mesh(new THREE.SphereGeometry(6.5,24,24),new THREE.MeshBasicMaterial({color:0x38bdf8,transparent:true,opacity:0.07,blending:ADD,depthWrite:false})));

// 8 domains (grounded in OCTOPUS-STRUCTURE) + risk tier color
const RISK = { low:0x34d399, medium:0xf59e0b, high:0xfb923c, critical:0xef4444 };
const DOMAINS = [
  {name:'Accounting',   col:0x22d3ee, risk:'high'},
  {name:'Lead-نقاشی',    col:0xec4899, risk:'medium'},
  {name:'Mining',       col:0x8b5cf6, risk:'medium'},
  {name:'Crypto',       col:0xf59e0b, risk:'critical'},
  {name:'Ziman',        col:0x34d399, risk:'low'},
  {name:'Project-F',    col:0x818cf8, risk:'high'},
  {name:'architect',    col:0xa855f7, risk:'critical'},
  {name:'Knowledge',    col:0x2dd4bf, risk:'low'},
];

const SEG=40;
const arms=[];
for(let i=0;i<8;i++){
  const ang=(i/8)*Math.PI*2, col=DOMAINS[i].col;
  const g=new THREE.Group(); g.rotation.y=ang; scene.add(g);
  // arm centerline curve (out and down, tapering)
  const basePts=[];
  for(let s=0;s<=6;s++){ const t=s/6;
    basePts.push(new THREE.Vector3(Math.sin(t*2.2)*1.5, -t*16, 3.5 + t*15)); }
  const curve=new THREE.CatmullRomCurve3(basePts);
  const tube=new THREE.TubeGeometry(curve,SEG,0.7,10,false);
  const mat=new THREE.MeshStandardMaterial({color:0x081826,emissive:col,emissiveIntensity:0.85,roughness:0.35,metalness:0.4,transparent:true,opacity:0.62,flatShading:true});
  const arm=new THREE.Mesh(tube,mat); g.add(arm);
  const glowMat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.14,blending:ADD});
  const armGlow=new THREE.Mesh(new THREE.TubeGeometry(curve,SEG,0.85,10,false),glowMat); g.add(armGlow);

  // biserial suckers = restore points (two rows of small glowing dots)
  const suckN=22, sPos=new Float32Array(suckN*2*3);
  const suckGeo=new THREE.BufferGeometry(); suckGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
  const suckers=new THREE.Points(suckGeo,new THREE.PointsMaterial({color:0xbfe9ff,size:0.42,transparent:true,opacity:0.85,blending:ADD,depthWrite:false}));
  g.add(suckers);

  // risk-tier dot at base
  const riskDot=new THREE.Mesh(new THREE.SphereGeometry(0.6,14,14),new THREE.MeshBasicMaterial({color:RISK[DOMAINS[i].risk],blending:ADD,depthWrite:false}));
  const bp=curve.getPoint(0.06); riskDot.position.copy(bp); g.add(riskDot);

  // value particles flowing outward (backup writes)
  const vN=16, vPos=new Float32Array(vN*3), vOff=[];
  for(let k=0;k<vN;k++) vOff.push(Math.random());
  const vGeo=new THREE.BufferGeometry(); vGeo.setAttribute('position',new THREE.BufferAttribute(vPos,3));
  const vpts=new THREE.Points(vGeo,new THREE.PointsMaterial({color:col,size:0.55,transparent:true,opacity:0.95,blending:ADD,depthWrite:false}));
  g.add(vpts);

  arms.push({g,arm,armGlow,curve,mat,col,suckGeo,sPos,suckN,vGeo,vPos,vOff,phase:i*0.7});
}

// gold orbital ring (value orbit)
const ring=new THREE.Mesh(new THREE.TorusGeometry(20,0.08,12,140),
  new THREE.MeshBasicMaterial({color:0xfcd34d,transparent:true,opacity:0.32,blending:ADD}));
ring.rotation.x=Math.PI/2 - 0.24; ring.position.y=-14; scene.add(ring);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.0,0.75,0.14));

// legend
document.getElementById('legend').innerHTML =
  DOMAINS.map(d=>`<div class="row"><i style="color:#${d.col.toString(16).padStart(6,'0')}"></i>${d.name} · <span style="color:#${RISK[d.risk].toString(16).padStart(6,'0')}">${d.risk}</span></div>`).join('') +
  `<div class="t">propose-only · gate = owner verdict</div>`;

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.getElapsedTime();

  body.rotation.y+=0.003; body.material.emissiveIntensity=0.55+Math.sin(t*1.3)*0.15;

  arms.forEach((a,i)=>{
    // undulate
    a.g.rotation.z=Math.sin(t*0.8+a.phase)*0.06;
    a.arm.rotation.x=Math.sin(t*0.6+a.phase)*0.03;
    a.mat.emissiveIntensity=0.7+Math.sin(t*1.6+i)*0.2;
    // suckers along arm (two rows)
    for(let k=0;k<a.suckN;k++){ const tt=0.08+(k/a.suckN)*0.9;
      const p=a.curve.getPoint(tt); const tan=a.curve.getTangent(tt);
      const nrm=new THREE.Vector3(0,0,1).cross(tan).normalize();
      const rad=0.5*(1-tt*0.6);
      for(let row=0;row<2;row++){ const s=row?1:-1; const idx=(k*2+row)*3;
        a.sPos[idx]=p.x+nrm.x*rad*s; a.sPos[idx+1]=p.y+nrm.y*rad*s; a.sPos[idx+2]=p.z+nrm.z*rad*s; } }
    a.suckGeo.attributes.position.needsUpdate=true;
    // value particles outward
    for(let k=0;k<a.vOff.length;k++){ a.vOff[k]=(a.vOff[k]+0.006)%1;
      const p=a.curve.getPoint(a.vOff[k]); a.vPos[k*3]=p.x; a.vPos[k*3+1]=p.y; a.vPos[k*3+2]=p.z; }
    a.vGeo.attributes.position.needsUpdate=true;
  });

  ring.rotation.z+=0.0015;
  controls.update();
  composer.render();
}
animate();

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
