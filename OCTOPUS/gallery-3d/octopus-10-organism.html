<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — کل ارگانیسم</title>
<style>
  html, body { margin: 0; height: 100%; background: #02030e; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #6fd0e6; letter-spacing: .04em; text-shadow: 0 0 8px rgba(42,143,214,.6);
    user-select: none; pointer-events: none;
  }
  #hud b { color: #fcd34d; font-weight: 600; }
  #title {
    position: fixed; left: 18px; top: 16px; z-index: 10;
    font: 600 13px/1.4 ui-monospace, Menlo, monospace;
    color: #a855f7; letter-spacing: .18em; text-transform: uppercase;
    text-shadow: 0 0 12px rgba(168,85,247,.7); user-select: none; pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="title">🐙 OCTOPUS · whole organism</div>
<div id="hud">drag to orbit · scroll to zoom · <b>heartbeat</b> drives the whole creature</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ---------- palette (canonical) ----------
const C = {
  skin:   0x081826, skinEmis: 0x2a8fd6,
  cortex: 0x1a0b2e, cortexEmis: 0xa855f7,
  heart:  0x081826, heartEmis: 0x22d3ee,
  blood:  0x00ffff,
  spine:  0x0a1a3a, spineEmis: 0x3b82f6,
  gold:   0xfcd34d,
  eyePupil: 0x00ffff, eyeIris: 0x001018,
  legs: [0x22d3ee, 0xec4899, 0x34d399, 0xf59e0b, 0x8b5cf6],
};

// ---------- renderer / scene / camera ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030e);
scene.fog = new THREE.FogExp2(0x02030e, 0.018);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 4, 32);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 1, 0);
controls.minDistance = 12;
controls.maxDistance = 60;

// ---------- lights ----------
scene.add(new THREE.AmbientLight(0x223355, 0.6));
const keyPurple = new THREE.PointLight(C.cortexEmis, 40, 60); keyPurple.position.set(0, 8, 4); scene.add(keyPurple);
const heartLight = new THREE.PointLight(C.heartEmis, 30, 40); heartLight.position.set(0, 2, 2); scene.add(heartLight);
const goldLight  = new THREE.PointLight(C.gold, 18, 70); goldLight.position.set(0, 1, 0); scene.add(goldLight);
const rimCyan = new THREE.DirectionalLight(0x67e8f9, 1.2); rimCyan.position.set(-8, 3, 6); scene.add(rimCyan);

// ---------- starfield ----------
(function stars(){
  const n = 1400, pos = new Float32Array(n*3);
  for (let i=0;i<n;i++){ const r=60+Math.random()*60, t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(p)*Math.cos(t); pos[i*3+1]=r*Math.cos(p); pos[i*3+2]=r*Math.sin(p)*Math.sin(t); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x88aacc, size:0.12, transparent:true, opacity:0.5 })));
})();

const skinMat = (emis, opacity=0.6, ei=0.6) => new THREE.MeshStandardMaterial({
  color: C.skin, emissive: emis, emissiveIntensity: ei,
  roughness: 0.35, metalness: 0.45, transparent: true, opacity, flatShading: true,
});

const organism = new THREE.Group();
scene.add(organism);

// ---------- spine / unified bus ----------
const spine = new THREE.Mesh(
  new THREE.CylinderGeometry(0.22, 0.22, 26, 16, 1, true),
  new THREE.MeshStandardMaterial({ color: C.spine, emissive: C.spineEmis, emissiveIntensity: 1.1, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
);
spine.position.y = 0; organism.add(spine);

// nerve lines radiating from spine
const nerves = new THREE.Group(); organism.add(nerves);
for (let i=0;i<10;i++){
  const y = -6 + i*1.3, ang = (i/10)*Math.PI*2;
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, y, 0),
    new THREE.Vector3(Math.cos(ang)*2, y+0.4, Math.sin(ang)*2),
    new THREE.Vector3(Math.cos(ang)*4, y+0.2, Math.sin(ang)*4),
  ]);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.03, 6, false),
    new THREE.MeshBasicMaterial({ color: C.spineEmis, transparent:true, opacity:0.35, blending: THREE.AdditiveBlending }));
  nerves.add(m);
}

// ---------- cortex / brain node ----------
const cortex = new THREE.Mesh(new THREE.IcosahedronGeometry(2.4, 1), skinMat(C.cortexEmis, 0.72, 1.0));
cortex.material.color.setHex(C.cortex);
cortex.position.set(0, 6.5, 0); organism.add(cortex);
const cortexGlow = new THREE.Mesh(new THREE.IcosahedronGeometry(2.7, 1),
  new THREE.MeshBasicMaterial({ color: C.cortexEmis, transparent:true, opacity:0.12, blending:THREE.AdditiveBlending }));
cortex.add(cortexGlow);

// ---------- doctor's eye (above) ----------
const eye = new THREE.Group(); eye.position.set(0, 11.5, 0); organism.add(eye);
const sclera = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 24), skinMat(C.skinEmis, 0.55, 0.5));
eye.add(sclera);
const iris = new THREE.Mesh(new THREE.CircleGeometry(0.85, 32),
  new THREE.MeshStandardMaterial({ color: C.eyeIris, emissive: 0x002028, emissiveIntensity:0.2 }));
iris.position.set(0, -0.2, 1.35); iris.lookAt(0,-4,4); eye.add(iris);
const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.34, 32),
  new THREE.MeshBasicMaterial({ color: C.eyePupil, blending: THREE.AdditiveBlending }));
pupil.position.set(0, -0.22, 1.45); pupil.lookAt(0,-4,4); eye.add(pupil);
// calibration ring
const calRing = new THREE.Mesh(new THREE.TorusGeometry(1.75, 0.02, 8, 64),
  new THREE.MeshBasicMaterial({ color: C.gold, transparent:true, opacity:0.5 }));
calRing.rotation.x = Math.PI/2.3; eye.add(calRing);
// tendrils from eye down to cortex
for (let i=0;i<6;i++){
  const ang=(i/6)*Math.PI*2;
  const c=new THREE.CatmullRomCurve3([
    new THREE.Vector3(Math.cos(ang)*0.7, -1.4, Math.sin(ang)*0.7),
    new THREE.Vector3(Math.cos(ang)*1.4, -3.2, Math.sin(ang)*1.4),
    new THREE.Vector3(Math.cos(ang)*0.9, -5, Math.sin(ang)*0.9),
  ]);
  eye.add(new THREE.Mesh(new THREE.TubeGeometry(c,24,0.025,6,false),
    new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending })));
}

// ---------- heart (below brain) ----------
const heart = new THREE.Group(); heart.position.set(0, 2, 0); organism.add(heart);
const heartOrb = new THREE.Mesh(new THREE.SphereGeometry(1.8, 32, 24), skinMat(C.heartEmis, 0.62, 0.9));
heart.add(heartOrb);
const fencing = new THREE.Mesh(new THREE.TorusGeometry(2.35, 0.06, 12, 80),
  new THREE.MeshBasicMaterial({ color: C.gold, transparent:true, opacity:0.85, blending:THREE.AdditiveBlending }));
fencing.rotation.x = Math.PI/2.6; heart.add(fencing);
// blood particles inside heart
const bloodN=220, bloodPos=new Float32Array(bloodN*3), bloodSeed=[];
for(let i=0;i<bloodN;i++){ const r=Math.cbrt(Math.random())*1.5, t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
  bloodSeed.push({r,t,p, s:0.4+Math.random()}); }
const bloodGeo=new THREE.BufferGeometry(); bloodGeo.setAttribute('position', new THREE.BufferAttribute(bloodPos,3));
const blood=new THREE.Points(bloodGeo, new THREE.PointsMaterial({ color:C.blood, size:0.11, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending }));
heart.add(blood);
// halo ring facing camera
const halo=new THREE.Mesh(new THREE.RingGeometry(2.5, 3.4, 64),
  new THREE.MeshBasicMaterial({ color:C.gold, transparent:true, opacity:0.0, blending:THREE.AdditiveBlending, side:THREE.DoubleSide }));
heart.add(halo);

// ---------- five revenue legs ----------
const legGroup=new THREE.Group(); legGroup.position.y=-1; organism.add(legGroup);
const legs=[];
for(let i=0;i<5;i++){
  const ang=(i/5)*Math.PI*2;
  const col=C.legs[i];
  const g=new THREE.Group(); g.rotation.y=ang; legGroup.add(g);
  const pts=[]; const seg=8;
  for(let s=0;s<=seg;s++){ const t=s/seg;
    pts.push(new THREE.Vector3(Math.sin(t*2)*1.2, -t*7, 1.5 + t*9)); }
  const curve=new THREE.CatmullRomCurve3(pts);
  const geo=new THREE.TubeGeometry(curve, 40, 0.55, 10, false);
  // taper radius manually by scaling? Tube constant; use radius fn via custom -> approximate with cone caps
  const mat=skinMat(col, 0.65, 0.9); mat.color.setHex(C.skin);
  const legMesh=new THREE.Mesh(geo, mat); g.add(legMesh);
  const glow=new THREE.Mesh(new THREE.TubeGeometry(curve,40,0.62,10,false),
    new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.15, blending:THREE.AdditiveBlending }));
  g.add(glow);
  // value particles along leg
  const pN=30, pPos=new Float32Array(pN*3), off=[];
  for(let k=0;k<pN;k++) off.push(Math.random());
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pPos,3));
  const pp=new THREE.Points(pg, new THREE.PointsMaterial({ color:col, size:0.18, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending }));
  g.add(pp);
  legs.push({ curve, off, pg, mat, glow, col });
}

// ---------- outer golden halo / membrane ----------
const membrane=new THREE.Mesh(new THREE.TorusGeometry(11, 0.05, 12, 120),
  new THREE.MeshBasicMaterial({ color:C.gold, transparent:true, opacity:0.3, blending:THREE.AdditiveBlending }));
membrane.rotation.x=Math.PI/2 - 0.26; organism.add(membrane);

// ---------- post: bloom ----------
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.1, 0.7, 0.2);
composer.addPass(bloom);

// ---------- heartbeat: double-thump ----------
function beat(t){ // period ~1.4s, returns 0..1 envelope
  const p=(t%1.4)/1.4;
  const g=(c,w)=>Math.exp(-((p-c)*(p-c))/(2*w*w));
  return Math.min(1, g(0.10,0.05)*1.0 + g(0.28,0.06)*0.7);
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const b=beat(t);

  // global breathing
  const breathe=1 + b*0.02;
  organism.scale.setScalar(breathe);

  // heart pulse
  const hs=1 + b*0.12; heartOrb.scale.setScalar(hs);
  heartOrb.material.emissiveIntensity=0.8 + b*0.9;
  heartLight.intensity=20 + b*40;
  fencing.rotation.z += 0.006;
  halo.material.opacity = b*0.5;
  halo.scale.setScalar(1 + b*0.4);
  halo.lookAt(camera.position);

  // blood swirl
  for(let i=0;i<bloodN;i++){ const s=bloodSeed[i]; s.t += 0.01*s.s;
    const r=s.r*(1+b*0.1);
    bloodPos[i*3]=r*Math.sin(s.p)*Math.cos(s.t);
    bloodPos[i*3+1]=r*Math.cos(s.p);
    bloodPos[i*3+2]=r*Math.sin(s.p)*Math.sin(s.t); }
  bloodGeo.attributes.position.needsUpdate=true;

  // cortex think
  cortex.rotation.y += 0.004; cortex.rotation.x += 0.0015;
  cortex.material.emissiveIntensity=0.9 + Math.sin(t*1.7)*0.25;

  // eye scan
  eye.rotation.y = Math.sin(t*0.4)*0.25;
  pupil.scale.setScalar(1 + Math.sin(t*0.9)*0.12);
  calRing.rotation.z += 0.01;

  // legs undulate + particles
  legs.forEach((L,i)=>{
    L.mat.emissiveIntensity = 0.7 + Math.sin(t*1.5 + i)*0.2;
    const arr=L.pg.attributes.position.array;
    for(let k=0;k<L.off.length;k++){
      L.off[k]=(L.off[k]+0.004)%1;
      const v=L.curve.getPoint(L.off[k]);
      arr[k*3]=v.x; arr[k*3+1]=v.y; arr[k*3+2]=v.z;
    }
    L.pg.attributes.position.needsUpdate=true;
  });
  legGroup.rotation.y += 0.0008;

  // membrane
  membrane.rotation.z += 0.0015;
  membrane.scale.setScalar(1 + b*0.03);

  controls.update();
  composer.render();
}
animate();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
