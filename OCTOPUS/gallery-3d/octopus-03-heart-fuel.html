<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — قلب + مترِ سوخت</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 54%,rgba(0,0,4,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#22d3ee,#f59e0b,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #22d3ee55}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#f59e0b;pointer-events:none}
  #st b{color:#22d3ee}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#f59e0b}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>HONEST HEART · FUEL</b><span>ضربانِ صادق + مترِ سوختِ شناخت (هزینهٔ API/Ollama) · هر تپش کمی می‌سوزاند</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · سطحِ <b>سوخت</b> با هر ضربان افت و بین ضربان‌ها ترمیم می‌شود</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.014);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,400);camera.position.set(2,2,24);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.4;controls.target.set(1.5,0,0);controls.minDistance=11;controls.maxDistance=60;
scene.add(new THREE.AmbientLight(0x22344f,0.5));
const goldCore=new THREE.PointLight(0xfcd34d,10,60);goldCore.position.set(-2,0,2);scene.add(goldCore);
const cyanFill=new THREE.DirectionalLight(0x67e8f9,1.1);cyanFill.position.set(6,2,6);scene.add(cyanFill);
(function(){const n=700,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=80+Math.random()*80,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.16,transparent:true,opacity:0.5})));})();
// heart
const heart=new THREE.Mesh(new THREE.IcosahedronGeometry(4.2,2),new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.6,roughness:0.35,metalness:0.45,transparent:true,opacity:0.6,flatShading:true}));heart.position.x=-2;scene.add(heart);
const heartWire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(4.3,1),18),new THREE.LineBasicMaterial({color:0xbfe9ff,transparent:true,opacity:0.4,blending:ADD}));heart.add(heartWire);
// inner blood particles
const BN=180,bPos=new Float32Array(BN*3),bs=[];for(let i=0;i<BN;i++)bs.push({r:Math.cbrt(Math.random())*3.6,t:Math.random()*6.28,p:Math.acos(2*Math.random()-1),s:0.4+Math.random()});
const bGeo=new THREE.BufferGeometry();bGeo.setAttribute('position',new THREE.BufferAttribute(bPos,3));
const blood=new THREE.Points(bGeo,new THREE.PointsMaterial({color:0x00ffff,size:0.18,transparent:true,opacity:0.85,blending:ADD,depthWrite:false}));heart.add(blood);
// halo
const halo=new THREE.Mesh(new THREE.RingGeometry(4.6,6.4,64),new THREE.MeshBasicMaterial({color:0xfcd34d,transparent:true,opacity:0,blending:ADD,side:THREE.DoubleSide}));heart.add(halo);
// fuel gauge (glass column + liquid) to the right
const gauge=new THREE.Group();gauge.position.set(6.5,0,0);scene.add(gauge);
const glass=new THREE.Mesh(new THREE.CylinderGeometry(0.95,0.95,10,24,1,true),new THREE.MeshBasicMaterial({color:0x0a1420,transparent:true,opacity:0.25,side:THREE.DoubleSide}));gauge.add(glass);
const glassEdge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.CylinderGeometry(0.95,0.95,10,24,1,true)),new THREE.LineBasicMaterial({color:0x67e8f9,transparent:true,opacity:0.4,blending:ADD}));gauge.add(glassEdge);
const liquid=new THREE.Mesh(new THREE.CylinderGeometry(0.82,0.82,10,24),new THREE.MeshBasicMaterial({color:0xf59e0b,transparent:true,opacity:0.92,blending:ADD}));gauge.add(liquid);
const liquidCore=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,10,16),new THREE.MeshBasicMaterial({color:0xfde68a,transparent:true,opacity:0.9,blending:ADD}));gauge.add(liquidCore);
for(let i=0;i<9;i++){const tick=new THREE.Mesh(new THREE.TorusGeometry(0.95,0.02,6,24),new THREE.MeshBasicMaterial({color:0xfcd34d,transparent:true,opacity:0.5,blending:ADD}));tick.rotation.x=Math.PI/2;tick.position.y=-5+i*1.25;gauge.add(tick);}
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.05,0.8,0.14));
function beat(t){const p=(t%1.4)/1.4;const g=(c,w)=>Math.exp(-((p-c)*(p-c))/(2*w*w));return Math.min(1,g(0.10,0.045)*1.0+g(0.28,0.06)*0.7);}
const stEl=document.getElementById('st');const clock=new THREE.Clock();let fuel=0.85;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05),t=clock.getElapsedTime();const b=beat(t);
  heart.scale.setScalar(1+b*0.11);heart.material.emissiveIntensity=0.6+b*0.9;heartWire.material.opacity=0.3+b*0.3;
  goldCore.intensity=6+b*16;halo.material.opacity=b*0.5;halo.scale.setScalar(1+b*0.35);halo.lookAt(camera.position);
  fuel-=b*0.012;fuel+=0.004*dt*60;fuel=Math.max(0.2,Math.min(1,fuel));
  liquid.scale.y=fuel;liquid.position.y=-5*(1-fuel);liquidCore.scale.y=fuel;liquidCore.position.y=-5*(1-fuel);
  for(let i=0;i<BN;i++){const s=bs[i];s.t+=0.01*s.s;const r=s.r*(1+b*0.08);bPos[i*3]=r*Math.sin(s.p)*Math.cos(s.t);bPos[i*3+1]=r*Math.cos(s.p);bPos[i*3+2]=r*Math.sin(s.p)*Math.sin(s.t);}bGeo.attributes.position.needsUpdate=true;
  heart.rotation.y+=0.003;
  stEl.innerHTML=`<b>♥ heartbeat</b> · lub-dub<br>fuel: <span style="color:${fuel<0.4?'#ef4444':'#f59e0b'}">${(fuel*100).toFixed(0)}%</span> cognition budget`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
