<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — EDGE NODE (نوکِ بازو)</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,4,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#67e8f9,#22d3ee,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #22d3ee55}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#67e8f9;pointer-events:none}
  #st b{color:#fcd34d}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#22d3ee}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>EDGE NODE · نوکِ بازو</b><span>ماکروِ ۸cmِ انتهاییِ بازو · مکنده‌های ریز و کریسپ · آخرین گرهِ مسیر</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · نوک = <b>آخرین گرهِ مسیرِ بکاپ</b> (edge of the path)</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.012);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,400);camera.position.set(4,3,18);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.5;controls.target.set(0,0,0);controls.minDistance=7;controls.maxDistance=45;
scene.add(new THREE.AmbientLight(0x22344f,0.55));
const key=new THREE.PointLight(0x9fd8ff,24,80);key.position.set(5,7,8);scene.add(key);
const rim=new THREE.DirectionalLight(0x67e8f9,0.9);rim.position.set(-5,2,-3);scene.add(rim);
(function(){const n=500,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=80+Math.random()*80,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.15,transparent:true,opacity:0.5})));})();
const SKIN=()=>new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.7,roughness:0.35,metalness:0.4,transparent:true,opacity:0.7,flatShading:true});
const tip=new THREE.Group();scene.add(tip);
// tapering tip with a gentle curl, thick(6)->point(0.3), flattened paddle tip
const pts=[new THREE.Vector3(-7,-2,0),new THREE.Vector3(-3,0,0),new THREE.Vector3(1,1.2,0),new THREE.Vector3(4.5,1.4,0),new THREE.Vector3(7,0.4,0)];
const curve=new THREE.CatmullRomCurve3(pts);
const N=140,frames=curve.computeFrenetFrames(N,false),path=curve.getSpacedPoints(N),rad=16;
const tubeGeo=new THREE.TubeGeometry(curve,N,1,rad,false);const pos=tubeGeo.attributes.position;
for(let i=0;i<=N;i++){const t=i/N;const rr=1.7*Math.pow(1-t,1.3)+0.12;const flat=1-t*0.4;const P=path[i],No=frames.normals[i],B=frames.binormals[i];
  for(let j=0;j<=rad;j++){const a=j/rad*Math.PI*2;const cx=Math.cos(a)*flat,cz=Math.sin(a);const nx=cx*No.x+cz*B.x,ny=cx*No.y+cz*B.y,nz=cx*No.z+cz*B.z;pos.setXYZ(i*(rad+1)+j,P.x+nx*rr,P.y+ny*rr,P.z+nz*rr);}}
pos.needsUpdate=true;tubeGeo.computeVertexNormals();
tip.add(new THREE.Mesh(tubeGeo,SKIN()));
tip.add(new THREE.Mesh(new THREE.TubeGeometry(curve,N,1.1,rad,false),new THREE.MeshBasicMaterial({color:0x38bdf8,transparent:true,opacity:0.06,blending:ADD})));
// annular ring creases
for(let k=0;k<6;k++){const t=0.2+k*0.12;const P=curve.getPointAt(t);const rr=1.7*Math.pow(1-t,1.3)+0.12;const ring=new THREE.Mesh(new THREE.TorusGeometry(rr*1.02,0.02,6,24),new THREE.MeshBasicMaterial({color:0x67e8f9,transparent:true,opacity:0.3,blending:ADD}));P&&ring.position.copy(P);const T=curve.getTangentAt(t);ring.lookAt(P.clone().add(T));tip.add(ring);}
// mini suckers, smaller & more spaced toward tip
const suckMat=new THREE.MeshStandardMaterial({color:0x0a1a24,emissive:0xbfe9ff,emissiveIntensity:0.8,roughness:0.3,metalness:0.5,transparent:true,opacity:0.92});
const suckers=[];const ns=20;
for(let i=1;i<ns;i++){const t=Math.pow(i/ns,0.8)*0.92;const P=curve.getPointAt(t);const idx=Math.round(t*N),No=frames.normals[idx],B=frames.binormals[idx];const rr=1.7*Math.pow(1-t,1.3)+0.12;const ss=0.3*(1-t*0.85)+0.03;
  for(let row=0;row<2;row++){const s=row?1:-1;const off=No.clone().multiplyScalar(-rr*0.6).add(B.clone().multiplyScalar(s*rr*0.45));const cup=new THREE.Mesh(new THREE.TorusGeometry(ss,ss*0.4,6,12),suckMat.clone());cup.position.copy(P).add(off);cup.lookAt(P.clone().add(No.clone().multiplyScalar(-1)));tip.add(cup);suckers.push(cup);}}
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.9,0.8,0.2));
const stEl=document.getElementById('st');const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
  tip.rotation.z=Math.sin(t*0.6)*0.06;
  const sweep=(t*0.35)%1;suckers.forEach((c,i)=>{const ph=(i/suckers.length);c.material.emissiveIntensity=Math.abs(((sweep-ph)%1))<0.08?2:0.7;});
  stEl.innerHTML=`<b>◦ EDGE NODE</b><br>terminal 8cm · 6mm → 1mm<br><span style="color:#bfe9ff">last node of the path</span>`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
