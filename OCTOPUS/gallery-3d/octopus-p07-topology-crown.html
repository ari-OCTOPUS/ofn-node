<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — TOPOLOGY CROWN (تاجِ ۸ بازو)</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,4,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#7dd3fc,#38bdf8,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #38bdf855}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#7dd3fc;pointer-events:none}
  #st b{color:#fcd34d}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#22d3ee}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>TOPOLOGY CROWN · تاجِ ۸ بازو</b><span>تاجِ بازوها از بالا · غشای وب بین یک‌سومِ نزدیک · نقشهٔ کاملِ شبکه</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · ۸ بازو با ۴۵° · دهانِ مرکزی · <b>نقشهٔ کاملِ شبکه</b></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.009);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,400);camera.position.set(0,24,14);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.5;controls.target.set(0,0,0);controls.minDistance=14;controls.maxDistance=70;
scene.add(new THREE.AmbientLight(0x22344f,0.55));
const key=new THREE.PointLight(0x9fd8ff,30,140);key.position.set(4,16,8);scene.add(key);
(function(){const n=700,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=100+Math.random()*90,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.15,transparent:true,opacity:0.5})));})();
const SKIN=()=>new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.6,roughness:0.35,metalness:0.45,transparent:true,opacity:0.66,flatShading:true});
const crown=new THREE.Group();scene.add(crown);
// central oral disc
const disc=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.8,1.2,32),SKIN());crown.add(disc);
const mouth=new THREE.Mesh(new THREE.TorusGeometry(0.9,0.4,10,24),new THREE.MeshStandardMaterial({color:0x0a0410,emissive:0x1a0b2e,emissiveIntensity:0.5,roughness:0.5,metalness:0.3}));mouth.rotation.x=Math.PI/2;mouth.position.y=0.7;crown.add(mouth);
// 8 arms radiating, organic variation
const arms=[];const armCurves=[];
for(let i=0;i<8;i++){const ang=(i/8)*Math.PI*2;const len=14+Math.sin(i*2.1)*3;const wob=Math.sin(i*1.7)*0.5;
  const pts=[new THREE.Vector3(Math.cos(ang)*2.4,0,Math.sin(ang)*2.4)];
  for(let s=1;s<=4;s++){const t=s/4;const a2=ang+wob*t;const r=2.4+len*t;const y=-Math.sin(t*2)*1.2;pts.push(new THREE.Vector3(Math.cos(a2)*r,y,Math.sin(a2)*r));}
  const curve=new THREE.CatmullRomCurve3(pts);armCurves.push({curve,ang});
  const N=60,frames=curve.computeFrenetFrames(N,false),path=curve.getSpacedPoints(N),rad=12;
  const tubeGeo=new THREE.TubeGeometry(curve,N,1,rad,false);const pos=tubeGeo.attributes.position;
  for(let k=0;k<=N;k++){const t=k/N;const rr=1.15*(1-t*0.9);const P=path[k],No=frames.normals[k],B=frames.binormals[k];for(let j=0;j<=rad;j++){const a=j/rad*Math.PI*2;const nx=Math.cos(a)*No.x+Math.sin(a)*B.x,ny=Math.cos(a)*No.y+Math.sin(a)*B.y,nz=Math.cos(a)*No.z+Math.sin(a)*B.z;pos.setXYZ(k*(rad+1)+j,P.x+nx*rr,P.y+ny*rr,P.z+nz*rr);}}
  pos.needsUpdate=true;tubeGeo.computeVertexNormals();
  const m=new THREE.Mesh(tubeGeo,SKIN());crown.add(m);arms.push(m);
  // numbering notch (small marker at base)
  const notch=new THREE.Mesh(new THREE.SphereGeometry(0.18,8,8),new THREE.MeshBasicMaterial({color:0xfcd34d,blending:ADD}));notch.position.copy(curve.getPointAt(0.05));notch.position.y+=1;crown.add(notch);
}
// web membrane between proximal thirds of adjacent arms
const webMat=new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.4,transparent:true,opacity:0.28,side:THREE.DoubleSide,flatShading:true});
for(let i=0;i<8;i++){const a=armCurves[i].curve,b=armCurves[(i+1)%8].curve;
  const p0=a.getPointAt(0.02),p1=a.getPointAt(0.32),p2=b.getPointAt(0.32),p3=b.getPointAt(0.02);
  const geo=new THREE.BufferGeometry();const v=[p0,p1,p2,p0,p2,p3];const arr=[];v.forEach(p=>arr.push(p.x,p.y-0.3,p.z));geo.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));geo.computeVertexNormals();crown.add(new THREE.Mesh(geo,webMat));}
// value pulses along arms
const PN=48,pPos=new Float32Array(PN*3),pp=[];for(let i=0;i<PN;i++)pp.push({a:i%8,t:Math.random(),sp:0.15+Math.random()*0.3});
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
crown.add(new THREE.Points(pGeo,new THREE.PointsMaterial({color:0x67e8f9,size:0.4,transparent:true,opacity:0.9,blending:ADD,depthWrite:false})));
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.95,0.8,0.18));
const stEl=document.getElementById('st');const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05),t=clock.getElapsedTime();
  crown.rotation.y+=0.0012;disc.material.emissiveIntensity=0.55+Math.sin(t*1.3)*0.1;
  for(let i=0;i<PN;i++){const c=pp[i];c.t+=c.sp*dt;if(c.t>=1){c.t=0;c.a=Math.floor(Math.random()*8);}const p=armCurves[c.a].curve.getPointAt(Math.min(0.99,c.t));pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;}pGeo.attributes.position.needsUpdate=true;
  stEl.innerHTML=`<b>✳ TOPOLOGY CROWN</b><br>8 arms · 45° · central mouth<br><span style="color:#67e8f9">full network map</span>`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
