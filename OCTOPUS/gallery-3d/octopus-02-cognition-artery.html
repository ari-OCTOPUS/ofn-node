<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — شریانِ شناخت</title>
<style>
  html,body{margin:0;height:100%;background:#050216;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 52%,rgba(2,0,10,.92) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#fcd34d,#a855f7,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #fcd34d55}
  .top span{display:block;font-size:11px;color:#6b5b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:13px/1.7 ui-monospace,Menlo,monospace;pointer-events:none}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#6b5b85}
  #hint b{color:#fcd34d}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>COGNITION ARTERY</b><span>شریانِ شناخت · گذر از تصمیم به اثرِ قابل‌شمارش · فقط با تأییدِ مالک باز می‌شود</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · جریانِ طلایی فقط وقتی <b>گیت باز است</b> برقرار می‌شود</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050216);scene.fog=new THREE.FogExp2(0x050216,0.014);
const camera=new THREE.PerspectiveCamera(54,innerWidth/innerHeight,0.1,400);camera.position.set(5,1,20);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.4;controls.target.set(0,0,0);controls.minDistance=12;controls.maxDistance=70;
scene.add(new THREE.AmbientLight(0x2a2a55,0.5));
const pL=new THREE.PointLight(0xa855f7,25,80);pL.position.set(0,8,3);scene.add(pL);
const cL=new THREE.PointLight(0x22d3ee,25,80);cL.position.set(0,-8,3);scene.add(cL);
const goldL=new THREE.PointLight(0xfcd34d,0,90);scene.add(goldL);
(function(){const n=700,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=80+Math.random()*80,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x7766bb,size:0.16,transparent:true,opacity:0.5})));})();
function skin(geo,emis,ei,op){return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x1a0b2e,emissive:emis,emissiveIntensity:ei,roughness:0.38,metalness:0.35,transparent:true,opacity:op,flatShading:true}));}
// brain node top, heart orb bottom
const brain=skin(new THREE.IcosahedronGeometry(2.6,1),0xa855f7,0.9,0.7);brain.position.y=8;scene.add(brain);
const heart=new THREE.Mesh(new THREE.SphereGeometry(2.8,32,24),new THREE.MeshStandardMaterial({color:0x081826,emissive:0x22d3ee,emissiveIntensity:0.9,roughness:0.35,metalness:0.45,transparent:true,opacity:0.6,flatShading:true}));heart.position.y=-8;scene.add(heart);
// artery curve
const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,6.6,0),new THREE.Vector3(1.5,3,1),new THREE.Vector3(-1.3,-0.5,-1),new THREE.Vector3(1,-4,1),new THREE.Vector3(0,-6.6,0)]);
const tubeGeo=new THREE.TubeGeometry(curve,80,0.45,12,false);
const artery=new THREE.Mesh(tubeGeo,new THREE.MeshStandardMaterial({color:0x3a2a05,emissive:0x594100,emissiveIntensity:0.15,roughness:0.4,metalness:0.3,transparent:true,opacity:0.45}));scene.add(artery);
const arteryGlow=new THREE.Mesh(new THREE.TubeGeometry(curve,80,0.62,12,false),new THREE.MeshBasicMaterial({color:0xfcd34d,transparent:true,opacity:0,blending:ADD}));scene.add(arteryGlow);
// flowing gold particles
const FN=90,fPos=new Float32Array(FN*3),fp=[];for(let i=0;i<FN;i++)fp.push(Math.random());
const fGeo=new THREE.BufferGeometry();fGeo.setAttribute('position',new THREE.BufferAttribute(fPos,3));
const flow=new THREE.Points(fGeo,new THREE.PointsMaterial({color:0xfcd34d,size:0.5,transparent:true,opacity:0,blending:ADD,depthWrite:false}));scene.add(flow);
// approval card near top
const card=new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.5),new THREE.MeshStandardMaterial({color:0x2a2a2a,emissive:0x000000,emissiveIntensity:0,transparent:true,opacity:0.5,side:THREE.DoubleSide}));card.position.set(3.4,4.6,0);scene.add(card);
const cardEdge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.4,1.5)),new THREE.LineBasicMaterial({color:0xfcd34d,transparent:true,opacity:0.6}));card.add(cardEdge);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.1,0.8,0.12));
const stEl=document.getElementById('st');
const clock=new THREE.Clock();let open=0;
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
  const cycle=(t%8)/8; const isOpen=cycle>0.5; const target=isOpen?1:0; open+=(target-open)*0.06;
  arteryGlow.material.opacity=open*0.7; artery.material.emissive.setHex(0x594100); artery.material.emissiveIntensity=0.15+open*1.2;
  flow.material.opacity=open*0.95; goldL.intensity=open*20; goldL.position.set(0,4-open*2,0);
  card.material.color.lerpColors(new THREE.Color(0x2a2a2a),new THREE.Color(0xfcd34d),open);
  card.material.emissive.setHex(0xfcd34d);card.material.emissiveIntensity=open*1.5;card.lookAt(camera.position);
  brain.rotation.y+=0.005;brain.material.emissiveIntensity=0.8+Math.sin(t*1.6)*0.2;
  const hb=isOpen?Math.max(0,1-((cycle-0.5)*8)):0; heart.scale.setScalar(1+hb*0.12*open);heart.material.emissiveIntensity=0.8+hb*0.8;
  for(let i=0;i<FN;i++){fp[i]=(fp[i]+0.004+open*0.006)%1;const p=curve.getPoint(fp[i]);fPos[i*3]=p.x;fPos[i*3+1]=p.y;fPos[i*3+2]=p.z;}fGeo.attributes.position.needsUpdate=true;
  stEl.innerHTML=isOpen?`<span style="color:#fcd34d">● APPROVED</span> <span style="color:#8ba0bd">— owner consent granted</span><br><span style="color:#6ee7b7">flow: brain → heart</span>`:`<span style="color:#6b7280">○ GATED</span> <span style="color:#8ba0bd">— awaiting owner approval</span><br><span style="color:#6b5b85">flow: blocked</span>`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
