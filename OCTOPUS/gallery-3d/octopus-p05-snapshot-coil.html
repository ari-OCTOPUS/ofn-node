<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — SNAPSHOT COIL (حلقهٔ اسنپ‌شات)</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,4,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#5eead4,#22d3ee,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #22d3ee55}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#5eead4;pointer-events:none}
  #st b{color:#fcd34d}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#22d3ee}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>SNAPSHOT COIL · حلقهٔ اسنپ‌شات</b><span>بازوی پیچیده در مارپیچِ لگاریتمی (فنرِ ساعت) · چرخهٔ اسنپ‌شات‌ها</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · هر دورِ مارپیچ = یک <b>چرخهٔ اسنپ‌شات</b> · نوک در مرکز می‌پیچد</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.011);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,400);camera.position.set(0,20,10);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.6;controls.target.set(0,0,0);controls.minDistance=10;controls.maxDistance=55;
scene.add(new THREE.AmbientLight(0x22344f,0.55));
const key=new THREE.PointLight(0x9fd8ff,26,110);key.position.set(4,12,6);scene.add(key);
(function(){const n=600,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=90+Math.random()*90,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.15,transparent:true,opacity:0.5})));})();
const SKIN=()=>new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2dd4bf,emissiveIntensity:0.8,roughness:0.35,metalness:0.4,transparent:true,opacity:0.68,flatShading:true});
const coil=new THREE.Group();scene.add(coil);
// logarithmic spiral, 2.5 turns, flat (XZ), slight curl to center
const TURNS=2.5,steps=160,pts=[];const r0=9,k=0.28;
for(let i=0;i<=steps;i++){const a=(i/steps)*TURNS*Math.PI*2;const r=r0*Math.exp(-k*a/(Math.PI*2));const y=Math.max(0,(a-(TURNS-0.5)*Math.PI*2))*0.25;pts.push(new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r));}
const curve=new THREE.CatmullRomCurve3(pts);
const N=200,frames=curve.computeFrenetFrames(N,false),path=curve.getSpacedPoints(N),rad=14;
const tubeGeo=new THREE.TubeGeometry(curve,N,1,rad,false);const pos=tubeGeo.attributes.position;
for(let i=0;i<=N;i++){const t=i/N;const rr=0.9*(1-t*0.85);const P=path[i],No=frames.normals[i],B=frames.binormals[i];
  for(let j=0;j<=rad;j++){const a=j/rad*Math.PI*2;const nx=Math.cos(a)*No.x+Math.sin(a)*B.x,ny=Math.cos(a)*No.y+Math.sin(a)*B.y,nz=Math.cos(a)*No.z+Math.sin(a)*B.z;pos.setXYZ(i*(rad+1)+j,P.x+nx*rr,P.y+ny*rr,P.z+nz*rr);}}
pos.needsUpdate=true;tubeGeo.computeVertexNormals();
coil.add(new THREE.Mesh(tubeGeo,SKIN()));
coil.add(new THREE.Mesh(new THREE.TubeGeometry(curve,N,1.05,rad,false),new THREE.MeshBasicMaterial({color:0x2dd4bf,transparent:true,opacity:0.06,blending:ADD})));
// suckers inward-down (two rows), graded
const suckMat=new THREE.MeshStandardMaterial({color:0x0a1a24,emissive:0xbbf7d0,emissiveIntensity:0.7,roughness:0.3,metalness:0.5,transparent:true,opacity:0.9});
const suckers=[];const nsuck=54;
for(let i=1;i<nsuck;i++){const t=i/nsuck;const P=curve.getPointAt(t);const idx=Math.round(t*N),No=frames.normals[idx],B=frames.binormals[idx];const rr=0.9*(1-t*0.85);const ss=0.34*(1-t*0.8)+0.05;
  for(let row=0;row<2;row++){const s=row?1:-1;const off=new THREE.Vector3(0,-1,0).multiplyScalar(rr*0.5).add(B.clone().multiplyScalar(s*rr*0.45));
  const cup=new THREE.Mesh(new THREE.TorusGeometry(ss,ss*0.35,6,12),suckMat.clone());cup.position.copy(P).add(off);cup.rotation.x=Math.PI/2;coil.add(cup);suckers.push(cup);}}
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.95,0.8,0.2));
const stEl=document.getElementById('st');const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
  coil.rotation.y+=0.0015;
  const sweep=(t*0.5)%1;suckers.forEach((c,i)=>{const ph=(i/suckers.length);const on=Math.abs(((sweep-ph)%1))<0.06;c.material.emissiveIntensity=on?1.8:0.6;});
  stEl.innerHTML=`<b>◠ SNAPSHOT COIL</b><br>2.5 turns · tip curls to center<br><span style="color:#bbf7d0">each loop = snapshot cycle</span>`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
