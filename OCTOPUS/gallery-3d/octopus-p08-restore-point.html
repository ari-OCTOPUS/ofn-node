<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — RESTORE POINT (مکنده)</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,4,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#7dd3fc,#38bdf8,#bfe9ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #38bdf855}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#7dd3fc;pointer-events:none}
  #st b{color:#fcd34d}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#22d3ee}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>RESTORE POINT · مکنده</b><span>ماکروِ ۵۰x · لبهٔ infundibulum با شیارِ شعاعی + حفرهٔ acetabulum + پایه · مکنده = ریستور پوینت</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · چپ = مکندهٔ کامل · راست = <b>برشِ نیم‌رخ</b> (دو حفرهٔ داخلی)</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.012);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,400);camera.position.set(3,7,16);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.5;controls.target.set(1,0,0);controls.minDistance=8;controls.maxDistance=45;
scene.add(new THREE.AmbientLight(0x22344f,0.55));
const key=new THREE.PointLight(0x9fd8ff,24,90);key.position.set(4,10,8);scene.add(key);
const rim=new THREE.DirectionalLight(0x67e8f9,0.9);rim.position.set(-5,3,-3);scene.add(rim);
(function(){const n=500,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=80+Math.random()*80,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.15,transparent:true,opacity:0.5})));})();
const SKIN=(op)=>new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.6,roughness:0.35,metalness:0.45,transparent:true,opacity:op??0.7,flatShading:true,side:THREE.DoubleSide});
// full sucker at left
function buildSucker(half){const g=new THREE.Group();
  const phi=half?Math.PI:Math.PI*2;
  // infundibulum rim (torus outer) + funnel wall via lathe
  const prof=[[3.0,0.2],[2.9,0.9],[2.4,1.2],[1.6,0.7],[1.0,-0.2],[0.9,-1.2],[1.6,-2.2],[1.8,-3.2]];
  const pts=prof.map(p=>new THREE.Vector2(p[0],p[1]));
  const body=new THREE.Mesh(new THREE.LatheGeometry(pts,48,0,phi),SKIN(0.72));g.add(body);
  const wire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.LatheGeometry(pts,24,0,phi),20),new THREE.LineBasicMaterial({color:0xbfe9ff,transparent:true,opacity:0.3,blending:ADD}));g.add(wire);
  // radial grooves on rim
  const nG=half?12:24;for(let i=0;i<nG;i++){const a=(i/24)*phi;if(half&&a>Math.PI)continue;const gr=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.05,1.2),new THREE.MeshBasicMaterial({color:0x67e8f9,transparent:true,opacity:0.4,blending:ADD}));gr.position.set(Math.cos(a)*2.4,1.05,Math.sin(a)*2.4);gr.rotation.y=-a;g.add(gr);}
  // inner cavity glow (acetabulum)
  const cav=new THREE.Mesh(new THREE.SphereGeometry(1.1,24,16,0,phi),new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:0.25,blending:ADD,side:THREE.DoubleSide}));cav.position.y=-0.3;g.add(cav);
  return g;}
const full=buildSucker(false);full.position.set(-3.5,0,0);scene.add(full);
const sect=buildSucker(true);sect.position.set(4,0,0);scene.add(sect);
// section label chambers (two-chamber hint)
const c1=new THREE.Mesh(new THREE.SphereGeometry(0.9,16,12),new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:0.3,blending:ADD}));c1.position.set(4,0.2,0.6);scene.add(c1);
const c2=new THREE.Mesh(new THREE.SphereGeometry(0.55,16,12),new THREE.MeshBasicMaterial({color:0xfcd34d,transparent:true,opacity:0.35,blending:ADD}));c2.position.set(4,-1.6,0.4);scene.add(c2);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.9,0.8,0.2));
const stEl=document.getElementById('st');const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
  full.rotation.y+=0.004;const suck=1+Math.sin(t*1.5)*0.05;full.scale.set(1,suck,1);
  c1.material.opacity=0.25+Math.sin(t*2)*0.08;c2.material.opacity=0.3+Math.sin(t*2+1)*0.08;
  stEl.innerHTML=`<b>◎ RESTORE POINT</b><br>infundibulum + acetabulum + pedestal<br><span style="color:#bfe9ff">one sucker = one restore point</span>`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
