<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — پایِ حسابداریِ زنده</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 52%,rgba(0,0,4,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#34d399,#6ee7b7,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #34d39955}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#34d399;pointer-events:none}
  #st .o{color:#6ee7b7}#st .d{color:#3a4a63}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#34d399}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>LIVING ACCOUNTING LEG</b><span>یک پایِ زندهٔ سبز میانِ خواهرانِ خفته · دریافت ← برچسب‌گذاری ← بازنویسی</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · جریانِ <b>دوطرفه</b>: ingest به داخل، labelها به بیرون · بقیهٔ پاها خاموش</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.02);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,400);camera.position.set(3,3,24);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.35;controls.target.set(0,-2,0);controls.minDistance=12;controls.maxDistance=60;
scene.add(new THREE.AmbientLight(0x1a2a2a,0.4));
const greenL=new THREE.PointLight(0x34d399,22,70);greenL.position.set(2,0,6);scene.add(greenL);
(function(){const n=600,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=90+Math.random()*90,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x557766,size:0.16,transparent:true,opacity:0.4})));})();
// body
const body=new THREE.Mesh(new THREE.IcosahedronGeometry(2.4,1),new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.4,roughness:0.35,metalness:0.45,transparent:true,opacity:0.5,flatShading:true}));body.position.y=5;scene.add(body);
// active green leg (foreground)
const gpts=[];for(let s=0;s<=6;s++){const t=s/6;gpts.push(new THREE.Vector3(Math.sin(t*3)*2.2,4-t*13,2+t*3));}
const gcurve=new THREE.CatmullRomCurve3(gpts);
const gleg=new THREE.Mesh(new THREE.TubeGeometry(gcurve,50,0.7,12,false),new THREE.MeshStandardMaterial({color:0x052017,emissive:0x34d399,emissiveIntensity:1.2,roughness:0.3,metalness:0.4,transparent:true,opacity:0.72,flatShading:true}));scene.add(gleg);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(gcurve,50,0.9,12,false),new THREE.MeshBasicMaterial({color:0x6ee7b7,transparent:true,opacity:0.12,blending:ADD})));
// ledger glyph at tip
const tip=gcurve.getPoint(1);
const ledger=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.8,0.3),new THREE.MeshStandardMaterial({color:0x3a2a05,emissive:0xfcd34d,emissiveIntensity:1.3,roughness:0.4,metalness:0.5}));ledger.position.copy(tip);scene.add(ledger);
// inflow + outflow particles
const IN=26,inPos=new Float32Array(IN*3),ino=[];for(let i=0;i<IN;i++)ino.push(Math.random());
const inGeo=new THREE.BufferGeometry();inGeo.setAttribute('position',new THREE.BufferAttribute(inPos,3));
scene.add(new THREE.Points(inGeo,new THREE.PointsMaterial({color:0x34d399,size:0.4,transparent:true,opacity:0.95,blending:ADD,depthWrite:false})));
const OUT=20,outPos=new Float32Array(OUT*3),outo=[];for(let i=0;i<OUT;i++)outo.push(Math.random());
const outGeo=new THREE.BufferGeometry();outGeo.setAttribute('position',new THREE.BufferAttribute(outPos,3));
scene.add(new THREE.Points(outGeo,new THREE.PointsMaterial({color:0xecfdf5,size:0.55,transparent:true,opacity:0.95,blending:ADD,depthWrite:false})));
// dormant siblings (dim, background)
const dormCols=[0x22d3ee,0xec4899,0xf59e0b,0x8b5cf6];
dormCols.forEach((col,i)=>{const ang=(i/4)*Math.PI*2+0.7;const g=new THREE.Group();g.rotation.y=ang;scene.add(g);
  const pts=[];for(let s=0;s<=5;s++){const t=s/5;pts.push(new THREE.Vector3(Math.sin(t*2)*1.5,3-t*11,6+t*4));}
  const c=new THREE.CatmullRomCurve3(pts);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(c,40,0.55,10,false),new THREE.MeshStandardMaterial({color:0x081826,emissive:col,emissiveIntensity:0.08,roughness:0.5,metalness:0.3,transparent:true,opacity:0.25,flatShading:true})));});
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.0,0.8,0.15));
const stEl=document.getElementById('st');const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05),t=clock.getElapsedTime();
  gleg.material.emissiveIntensity=1.0+Math.sin(t*2)*0.3;body.rotation.y+=0.003;
  ledger.rotation.y+=0.02;ledger.position.copy(gcurve.getPoint(1));ledger.material.emissiveIntensity=1.1+Math.sin(t*3)*0.3;
  for(let i=0;i<IN;i++){ino[i]=(ino[i]+0.006)%1;const p=gcurve.getPoint(1-ino[i]);inPos[i*3]=p.x-0.3;inPos[i*3+1]=p.y;inPos[i*3+2]=p.z;}inGeo.attributes.position.needsUpdate=true;
  for(let i=0;i<OUT;i++){outo[i]=(outo[i]+0.005)%1;const p=gcurve.getPoint(outo[i]);outPos[i*3]=p.x+0.3;outPos[i*3+1]=p.y;outPos[i*3+2]=p.z;}outGeo.attributes.position.needsUpdate=true;
  stEl.innerHTML=`<span class="o">● ACTIVE · green</span> — Accounting<br>↓ ingest (PocketSmith) · ↑ labels write-back<br><span class="d">4 siblings: dormant / flag-off</span>`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
