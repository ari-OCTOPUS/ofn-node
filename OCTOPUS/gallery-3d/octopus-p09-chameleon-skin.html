<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — CHAMELEON LAYER (لایهٔ پوست)</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,4,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#c084fc,#22d3ee,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #c084fc44}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#c4b5fd;pointer-events:none}
  #st b{color:#fcd34d}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#c084fc}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>CHAMELEON LAYER · لایهٔ پوست</b><span>کاشیِ برجستهٔ پوست · پاپیلا + شبکهٔ چین + رزتِ کروماتوفور · لایهٔ رمزنگاری / state-hash</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · تغییرِ رنگِ کروماتوفورها = <b>چرخشِ کلید / hash</b></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.01);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.1,400);camera.position.set(3,9,13);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.5;controls.target.set(0,0,0);controls.minDistance=8;controls.maxDistance=40;
scene.add(new THREE.AmbientLight(0x223355,0.5));
const key=new THREE.PointLight(0x9fd8ff,20,80);key.position.set(4,12,6);scene.add(key);
const rim=new THREE.DirectionalLight(0xc084fc,0.7);rim.position.set(-5,4,-3);scene.add(rim);
(function(){const n=400,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=80+Math.random()*80,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.15,transparent:true,opacity:0.5})));})();
const tile=new THREE.Group();scene.add(tile);
// base plane
const base=new THREE.Mesh(new THREE.BoxGeometry(10,0.4,10),new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.35,roughness:0.4,metalness:0.4,transparent:true,opacity:0.7,flatShading:true}));tile.add(base);
// papillae bumps
const bumpMat=new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.5,roughness:0.35,metalness:0.4,flatShading:true});
for(let i=0;i<90;i++){const s=0.15+Math.random()*0.5;const b=new THREE.Mesh(new THREE.ConeGeometry(s,s*1.6,8),bumpMat);b.position.set((Math.random()-0.5)*9,0.2+s*0.7,(Math.random()-0.5)*9);tile.add(b);}
// wrinkle network (thin lines on surface)
for(let i=0;i<40;i++){const x=(Math.random()-0.5)*9,z=(Math.random()-0.5)*9;const pts=[new THREE.Vector3(x,0.22,z)];for(let k=0;k<4;k++)pts.push(new THREE.Vector3(pts[k].x+(Math.random()-0.5)*2,0.22,pts[k].z+(Math.random()-0.5)*2));tile.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x67e8f9,transparent:true,opacity:0.2,blending:ADD})));}
// chromatophore rosettes (star depressions that shift color)
const CHROMA=[0xc084fc,0x22d3ee,0x34d399,0xf59e0b,0xec4899];
const rosettes=[];
for(let i=0;i<16;i++){const x=(Math.random()-0.5)*8.5,z=(Math.random()-0.5)*8.5;const g=new THREE.Group();g.position.set(x,0.25,z);
  const disc=new THREE.Mesh(new THREE.CircleGeometry(0.5+Math.random()*0.3,16),new THREE.MeshBasicMaterial({color:0xc084fc,transparent:true,opacity:0.8,blending:ADD}));disc.rotation.x=-Math.PI/2;g.add(disc);
  for(let k=0;k<8;k++){const a=(k/8)*Math.PI*2;const ray=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.02,0.05),new THREE.MeshBasicMaterial({color:0xc084fc,transparent:true,opacity:0.5,blending:ADD}));ray.position.set(Math.cos(a)*0.5,0.01,Math.sin(a)*0.5);ray.rotation.y=-a;g.add(ray);}
  tile.add(g);rosettes.push({g,disc,rays:g.children.slice(1),phase:Math.random()*6.28,ci:i%5});}
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.85,0.8,0.2));
const stEl=document.getElementById('st');const clock=new THREE.Clock();let hashN=0;
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
  rosettes.forEach((r,i)=>{const ph=t*0.6+r.phase;const ci=Math.floor(ph)%5;const nx=(ci+1)%5;const f=ph%1;const col=new THREE.Color(CHROMA[ci]).lerp(new THREE.Color(CHROMA[nx]),f);r.disc.material.color.copy(col);r.rays.forEach(ry=>ry.material.color.copy(col));const sc=1+Math.sin(ph*3.14)*0.15;r.disc.scale.setScalar(sc);});
  if(Math.floor(t*2)!==hashN){hashN=Math.floor(t*2);}
  stEl.innerHTML=`<b>▦ CHAMELEON</b> · skin relief tile<br>papillae + wrinkles + rosettes<br><span style="color:#c084fc">chromatophores = key rotation</span>`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
