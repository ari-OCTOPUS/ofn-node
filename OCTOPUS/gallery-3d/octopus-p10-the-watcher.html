<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — THE WATCHER (چشمِ ناظر)</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 52%,rgba(0,0,4,.92) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#00ffff,#67e8f9,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #00ffff44}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#67e8f9;pointer-events:none}
  #st b{color:#fcd34d}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#00ffff}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>THE WATCHER · چشمِ ناظر</b><span>ماکروِ چشم ۱۰x · مردمکِ مستطیلی · عنبیهٔ الیافی + قرنیه + پلکِ متحدالمرکز · مانیتورینگ و Verify</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · مردمک اسکن می‌کند · پرتوِ <b>verify</b> هرازگاهی می‌گذرد</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.011);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.1,400);camera.position.set(2,1,15);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.45;controls.target.set(0,0,0);controls.minDistance=7;controls.maxDistance=45;
scene.add(new THREE.AmbientLight(0x22344f,0.5));
const pupilL=new THREE.PointLight(0x00ffff,14,60);pupilL.position.set(0,0,4);scene.add(pupilL);
(function(){const n=500,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=80+Math.random()*80,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.15,transparent:true,opacity:0.5})));})();
const SKIN=(op)=>new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.55,roughness:0.35,metalness:0.45,transparent:true,opacity:op??0.6,flatShading:true});
const eye=new THREE.Group();scene.add(eye);
// eyeball
const ball=new THREE.Mesh(new THREE.SphereGeometry(4,48,36),SKIN(0.6));eye.add(ball);
// socket skin (back half, papillae)
const socket=new THREE.Mesh(new THREE.SphereGeometry(4.3,32,24,0,Math.PI*2,Math.PI*0.45,Math.PI*0.55),SKIN(0.7));socket.rotation.x=Math.PI;eye.add(socket);
// iris with radial fibers (geometry relief, no color)
const iris=new THREE.Mesh(new THREE.CircleGeometry(2.4,48),new THREE.MeshStandardMaterial({color:0x001018,emissive:0x00343f,emissiveIntensity:0.5,roughness:0.4,metalness:0.3}));iris.position.z=3.4;eye.add(iris);
for(let i=0;i<40;i++){const a=(i/40)*Math.PI*2;const fib=new THREE.Mesh(new THREE.BoxGeometry(0.05,1.5,0.04),new THREE.MeshBasicMaterial({color:0x67e8f9,transparent:true,opacity:0.4,blending:ADD}));fib.position.set(Math.cos(a)*1.6,Math.sin(a)*1.6,3.5);fib.rotation.z=-a+Math.PI/2;eye.add(fib);}
// rectangular pupil (bar)
const pupil=new THREE.Mesh(new THREE.PlaneGeometry(1.9,0.6),new THREE.MeshBasicMaterial({color:0x00ffff,blending:ADD}));pupil.position.z=3.55;eye.add(pupil);
const pupilGlow=new THREE.Mesh(new THREE.PlaneGeometry(2.6,1.1),new THREE.MeshBasicMaterial({color:0x00ffff,transparent:true,opacity:0.3,blending:ADD}));pupilGlow.position.z=3.5;eye.add(pupilGlow);
// corneal bulge (transparent dome)
const cornea=new THREE.Mesh(new THREE.SphereGeometry(2.8,32,24,0,Math.PI*2,0,Math.PI*0.42),new THREE.MeshPhysicalMaterial({color:0x0a1a24,transmission:0.6,roughness:0.05,transparent:true,opacity:0.35,side:THREE.DoubleSide}));cornea.position.z=2.2;cornea.rotation.x=-Math.PI/2;eye.add(cornea);
// eyelid ring with concentric folds + outer-corner notch
for(let k=0;k<4;k++){const tr=new THREE.Mesh(new THREE.TorusGeometry(2.8+k*0.4,0.12,10,48),SKIN(0.6));tr.position.z=3-k*0.25;eye.add(tr);}
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.0,0.8,0.12));
// verify beam plane
const beam=new THREE.Mesh(new THREE.PlaneGeometry(10,0.3),new THREE.MeshBasicMaterial({color:0xfcd34d,transparent:true,opacity:0,blending:ADD,side:THREE.DoubleSide}));beam.position.z=4;scene.add(beam);
const stEl=document.getElementById('st');const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
  eye.rotation.y=Math.sin(t*0.4)*0.25;eye.rotation.x=Math.sin(t*0.3)*0.1;
  const dil=1+Math.sin(t*0.9)*0.18;pupil.scale.x=dil;pupilGlow.scale.x=dil;pupilL.intensity=12+Math.sin(t*0.9)*4;
  ball.material.emissiveIntensity=0.5+Math.sin(t*1.2)*0.08;
  const vcyc=(t%6)/6;if(vcyc<0.25){beam.material.opacity=0.7;beam.position.y=(vcyc/0.25-0.5)*8;}else beam.material.opacity=0;
  const verifying=vcyc<0.25;
  stEl.innerHTML=`<b>◉ THE WATCHER</b> · monitor + verify<br>rectangular pupil scan<br>${verifying?'<span style="color:#fcd34d">▶ VERIFY sweep</span>':'<span style="color:#67e8f9">passive watch</span>'}`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
