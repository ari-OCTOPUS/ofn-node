<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — گیتِ تأییدِ مالک</title>
<style>
  html,body{margin:0;height:100%;background:#050216;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 52%,rgba(2,0,10,.92) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#34d399,#f59e0b,#ef4444);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #f59e0b44}
  .top span{display:block;font-size:11px;color:#6b5b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:13px/1.7 ui-monospace,Menlo,monospace;pointer-events:none}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#6b5b85}
  #hint b{color:#fcd34d}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>OWNER CONSENT GATE</b><span>غشای deny-by-default بینِ پاها و دنیای بیرون · نردبانِ سه‌رنگِ ریسک</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · پیشنهادها پشتِ گیت جمع می‌شوند تا <b>کارتِ تأیید</b> طلایی شود</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050216);scene.fog=new THREE.FogExp2(0x050216,0.013);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,400);camera.position.set(0,2,26);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.3;controls.target.set(0,0,0);controls.minDistance=12;controls.maxDistance=60;
scene.add(new THREE.AmbientLight(0x2a2a44,0.5));
const gateL=new THREE.PointLight(0x34d399,20,80);gateL.position.set(0,0,0);scene.add(gateL);
(function(){const n=600,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=90+Math.random()*90,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6677bb,size:0.16,transparent:true,opacity:0.4})));})();
// gate membrane — two halves that part when open
const gateMat=()=>new THREE.MeshStandardMaterial({color:0x0a1420,emissive:0x34d399,emissiveIntensity:0.9,roughness:0.4,metalness:0.3,transparent:true,opacity:0.4,side:THREE.DoubleSide});
const gL=new THREE.Mesh(new THREE.PlaneGeometry(6,12),gateMat());gL.position.x=-3;scene.add(gL);
const gR=new THREE.Mesh(new THREE.PlaneGeometry(6,12),gateMat());gR.position.x=3;scene.add(gR);
const gGlow=new THREE.Mesh(new THREE.PlaneGeometry(12.5,12.5),new THREE.MeshBasicMaterial({color:0x34d399,transparent:true,opacity:0.06,blending:ADD,side:THREE.DoubleSide}));scene.add(gGlow);
// legs pressing from near side (z+)
const legCols=[0x22d3ee,0xec4899,0x34d399,0x8b5cf6,0xf59e0b];
const legs=[];legCols.forEach((col,i)=>{const x=-6+i*3;const pts=[new THREE.Vector3(x*1.3,-1+i*0.4,11),new THREE.Vector3(x,0,6),new THREE.Vector3(x*0.4,0,3)];const c=new THREE.CatmullRomCurve3(pts);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(c,30,0.4,10,false),new THREE.MeshStandardMaterial({color:0x081826,emissive:col,emissiveIntensity:0.5,roughness:0.4,metalness:0.4,transparent:true,opacity:0.5,flatShading:true})));legs.push({c,col});});
// pooled proposal particles at gate (near side)
const PP=140,ppPos=new Float32Array(PP*3),pool=[];for(let i=0;i<PP;i++)pool.push({x:(Math.random()-0.5)*11,y:(Math.random()-0.5)*11,z:3+Math.random()*1.2,vx:(Math.random()-0.5)*0.02,vy:(Math.random()-0.5)*0.02});
const ppGeo=new THREE.BufferGeometry();ppGeo.setAttribute('position',new THREE.BufferAttribute(ppPos,3));
scene.add(new THREE.Points(ppGeo,new THREE.PointsMaterial({color:0x67e8f9,size:0.3,transparent:true,opacity:0.8,blending:ADD,depthWrite:false})));
// passing pulse
const pulse=new THREE.Mesh(new THREE.SphereGeometry(0.8,16,16),new THREE.MeshBasicMaterial({color:0xfcd34d,transparent:true,opacity:0,blending:ADD,depthWrite:false}));scene.add(pulse);
// approval card (front)
const card=new THREE.Mesh(new THREE.PlaneGeometry(2.6,1.7),new THREE.MeshStandardMaterial({color:0x2a2a2a,emissive:0xfcd34d,emissiveIntensity:0,transparent:true,opacity:0.6,side:THREE.DoubleSide}));card.position.set(0,-7.5,7);scene.add(card);
card.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.6,1.7)),new THREE.LineBasicMaterial({color:0xfcd34d,transparent:true,opacity:0.7})));
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.05,0.8,0.12));
const RISK=[new THREE.Color(0x34d399),new THREE.Color(0xf59e0b),new THREE.Color(0xef4444)];
const stEl=document.getElementById('st');const clock=new THREE.Clock();let open=0;
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05),t=clock.getElapsedTime();
  // risk color cycle (mostly green, flickers amber, briefly red)
  const rk=(Math.sin(t*0.7)*0.5+0.5);let risk;if(rk>0.9)risk=2;else if(rk>0.6)risk=1;else risk=0;
  const rc=RISK[risk];gL.material.emissive.copy(rc);gR.material.emissive.copy(rc);gGlow.material.color.copy(rc);gateL.color.copy(rc);
  // consent cycle every 5s
  const cyc=(t%5)/5;const granted=cyc>0.82&&cyc<0.95;const target=granted?1:0;open+=(target-open)*0.12;
  gL.position.x=-3-open*3.5;gR.position.x=3+open*3.5;gL.material.opacity=0.4-open*0.25;gR.material.opacity=0.4-open*0.25;
  card.material.emissiveIntensity=granted?1.6:0;card.material.color.lerpColors(new THREE.Color(0x2a2a2a),new THREE.Color(0xfcd34d),open);card.lookAt(camera.position);
  // pulse passes through when open
  if(open>0.5){pulse.material.opacity=0.95;pulse.position.set(0,0,3-(open-0.5)*2*12);}else pulse.material.opacity=0;
  // pooled particles jitter, unable to pass
  for(let i=0;i<PP;i++){const p=pool[i];p.x+=p.vx;p.y+=p.vy;if(Math.abs(p.x)>5.5)p.vx*=-1;if(Math.abs(p.y)>5.5)p.vy*=-1;p.z=3+Math.sin(t*3+i)*0.3;ppPos[i*3]=p.x;ppPos[i*3+1]=p.y;ppPos[i*3+2]=p.z;}ppGeo.attributes.position.needsUpdate=true;
  const rn=['🟢 LOW','🟡 MEDIUM','🔴 HIGH'][risk];const rcol=['#34d399','#f59e0b','#ef4444'][risk];
  stEl.innerHTML=`<span style="color:${rcol}">■ risk: ${rn}</span><br>${granted?'<span style="color:#fcd34d">✓ CONSENT GRANTED — pulse passes</span>':'<span style="color:#8ba0bd">◌ deny-by-default — proposals pooled</span>'}`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
