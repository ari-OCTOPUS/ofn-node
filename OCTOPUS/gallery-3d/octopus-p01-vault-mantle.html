<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — THE VAULT (کلاهک)</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 54%,rgba(0,0,4,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#7dd3fc,#38bdf8,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #38bdf855}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#7dd3fc;pointer-events:none}
  #st b{color:#fcd34d}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#7dd3fc}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>THE VAULT · کلاهک</b><span>کلاهک = آرشیوِ مرکزی / کاتالوگ · مردمکِ مستطیلیِ افقی · سیفونِ همگام‌سازی</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · <b>mantle</b> کیسهٔ آرشیو است — هرچه داری این‌جا نگه داشته می‌شود</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.011);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,400);camera.position.set(6,2,22);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.5;controls.target.set(0,0,0);controls.minDistance=10;controls.maxDistance=55;
scene.add(new THREE.AmbientLight(0x22344f,0.55));
const key=new THREE.PointLight(0x9fd8ff,28,90);key.position.set(6,8,10);scene.add(key);
const rim=new THREE.DirectionalLight(0x67e8f9,0.9);rim.position.set(-6,2,-4);scene.add(rim);
(function(){const n=700,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=90+Math.random()*80,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.15,transparent:true,opacity:0.5})));})();
const SKIN=()=>new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.6,roughness:0.35,metalness:0.45,transparent:true,opacity:0.62,flatShading:true});
const organism=new THREE.Group();scene.add(organism);
// mantle: pear-shaped lathe (apex up, neck down) ratio ~1.7:1
const prof=[[0.15,6.5],[1.4,5.6],[2.5,4.6],[3.1,3.4],[3.25,2.0],[3.1,0.6],[2.7,-0.8],[2.2,-2.0],[2.0,-2.9],[2.15,-3.6],[1.7,-4.3],[1.0,-4.9]];
const latheeap=prof.map(p=>new THREE.Vector2(p[0],p[1]));
const mantle=new THREE.Mesh(new THREE.LatheGeometry(latheeap,48),SKIN());organism.add(mantle);
const mantleWire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.LatheGeometry(latheeap,24),25),new THREE.LineBasicMaterial({color:0xbfe9ff,transparent:true,opacity:0.35,blending:ADD}));organism.add(mantleWire);
const mantleGlow=new THREE.Mesh(new THREE.SphereGeometry(4.6,24,24),new THREE.MeshBasicMaterial({color:0x38bdf8,transparent:true,opacity:0.06,blending:ADD,depthWrite:false}));mantleGlow.position.y=1.5;organism.add(mantleGlow);
// papillae (scattered small bumps)
for(let i=0;i<40;i++){const y=-3+Math.random()*8;const ang=Math.random()*6.28;const r=(3.1-Math.abs(y-2)*0.28)*0.98;
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.12+Math.random()*0.12,8,8),SKIN());b.position.set(Math.cos(ang)*r,y,Math.sin(ang)*r);organism.add(b);}
// two eyes with rectangular pupils (lower front sides)
function eye(sx){const g=new THREE.Group();g.position.set(sx*2.4,-2,2.0);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(1.0,28,22),SKIN());g.add(ball);
  const iris=new THREE.Mesh(new THREE.CircleGeometry(0.65,32),new THREE.MeshStandardMaterial({color:0x001018,emissive:0x002830,emissiveIntensity:0.4}));iris.position.set(sx*0.3,0,0.85);iris.lookAt(sx*3,-2,8);g.add(iris);
  const pupil=new THREE.Mesh(new THREE.PlaneGeometry(0.7,0.18),new THREE.MeshBasicMaterial({color:0x00ffff,blending:ADD}));pupil.position.set(sx*0.3,0,0.95);pupil.lookAt(sx*3,-2,8);g.add(pupil);
  // concentric eyelid folds
  for(let k=1;k<=3;k++){const t=new THREE.Mesh(new THREE.TorusGeometry(0.7+k*0.16,0.03,6,32),new THREE.MeshBasicMaterial({color:0x67e8f9,transparent:true,opacity:0.35-k*0.07,blending:ADD}));t.position.set(sx*0.25,0,0.8);t.lookAt(sx*3,-2,8);g.add(t);}
  organism.add(g);return pupil;}
const pupilL=eye(-1),pupilR=eye(1);
// siphon (funnel) lower-front
const siphon=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.75,2.2,20,1,true),SKIN());siphon.position.set(0.9,-4.2,2.2);siphon.rotation.set(0.7,0,-0.2);organism.add(siphon);
// sync particles flowing out of siphon
const SF=30,sfPos=new Float32Array(SF*3),sf=[];for(let i=0;i<SF;i++)sf.push({t:Math.random()});
const sfGeo=new THREE.BufferGeometry();sfGeo.setAttribute('position',new THREE.BufferAttribute(sfPos,3));
scene.add(new THREE.Points(sfGeo,new THREE.PointsMaterial({color:0x67e8f9,size:0.35,transparent:true,opacity:0.85,blending:ADD,depthWrite:false})));
const siphonDir=new THREE.Vector3(0.9,-2.2,3.4).normalize();const siphonBase=new THREE.Vector3(1.0,-5.2,3.0);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.9,0.8,0.2));
const stEl=document.getElementById('st');const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05),t=clock.getElapsedTime();
  mantle.material.emissiveIntensity=0.55+Math.sin(t*1.2)*0.12;mantleWire.material.opacity=0.3+Math.sin(t*1.2)*0.08;
  const dil=1+Math.sin(t*0.9)*0.08;pupilL.scale.x=dil;pupilR.scale.x=dil;
  for(let i=0;i<SF;i++){sf[i].t=(sf[i].t+0.012)%1;const d=sf[i].t*6;sfPos[i*3]=siphonBase.x+siphonDir.x*d+(Math.random()-0.5)*0.3;sfPos[i*3+1]=siphonBase.y+siphonDir.y*d;sfPos[i*3+2]=siphonBase.z+siphonDir.z*d+(Math.random()-0.5)*0.3;}sfGeo.attributes.position.needsUpdate=true;
  stEl.innerHTML=`<b>▣ VAULT</b> · central archive<br>mantle = catalog · <span style="color:#67e8f9">siphon → sync</span><br>eyes: rectangular pupil scan`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
