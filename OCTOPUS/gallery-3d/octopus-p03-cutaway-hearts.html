<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — 3-2-1 HEARTS (برشِ داخلی)</title>
<style>
  html,body{margin:0;height:100%;background:#02030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 54%,rgba(0,0,4,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#22d3ee,#38bdf8,#fcd34d);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #22d3ee55}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#7dd3fc;pointer-events:none}
  #st b{color:#fcd34d}#st .g{color:#67e8f9}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#22d3ee}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>3-2-1 HEARTS · برشِ داخلی</b><span>برشِ ربعِ کلاهک · ۲ آبشش + ۳ قلب (۱ سیستمیک + ۲ آبششی) + کیسهٔ مرکب</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · ۳ قلب = <b>۳ نسخه</b> · ۲ رسانه = ۲ آبشش · ۱ آفلاین = off-site</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030e);scene.fog=new THREE.FogExp2(0x02030e,0.012);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,400);camera.position.set(7,3,20);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.5;controls.target.set(0,0,0);controls.minDistance=10;controls.maxDistance=55;
scene.add(new THREE.AmbientLight(0x22344f,0.55));
const key=new THREE.PointLight(0x9fd8ff,26,90);key.position.set(8,8,10);scene.add(key);
(function(){const n=600,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=90+Math.random()*80,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.15,transparent:true,opacity:0.5})));})();
const SKIN=(op)=>new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.6,roughness:0.35,metalness:0.45,transparent:true,opacity:op,flatShading:true,side:THREE.DoubleSide});
const org=new THREE.Group();scene.add(org);
// outer mantle shell — quarter removed via phiLength (lathe)
const prof=[[0.2,6],[1.6,5.2],[2.8,4],[3.3,2.4],[3.35,0.6],[3.1,-1],[2.6,-2.4],[2.1,-3.6],[1.6,-4.6]];
const pts=prof.map(p=>new THREE.Vector2(p[0],p[1]));
const shell=new THREE.Mesh(new THREE.LatheGeometry(pts,40,0,Math.PI*1.5),SKIN(0.32));org.add(shell);
const shellWire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.LatheGeometry(pts,20,0,Math.PI*1.5),25),new THREE.LineBasicMaterial({color:0xbfe9ff,transparent:true,opacity:0.3,blending:ADD}));org.add(shellWire);
// cut-edge rings to show wall thickness
[6,-4.6].forEach(()=>{});
// 2 gills (feathery) flanking midline
function gill(sx){const g=new THREE.Group();g.position.set(sx*1.8,0.5,0);
  const spine=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,5,8),new THREE.MeshBasicMaterial({color:0x67e8f9,transparent:true,opacity:0.6,blending:ADD}));g.add(spine);
  for(let i=0;i<9;i++){const y=2.3-i*0.55;const fil=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.4,6),new THREE.MeshBasicMaterial({color:0x67e8f9,transparent:true,opacity:0.4,blending:ADD}));fil.position.set(sx*0.7,y,0);fil.rotation.z=sx*0.9;g.add(fil);const fil2=fil.clone();fil2.position.z=0.6;g.add(fil2);const fil3=fil.clone();fil3.position.z=-0.6;g.add(fil3);}
  org.add(g);}
gill(-1);gill(1);
// 3 hearts: systemic (center-big) + 2 branchial (base of each gill)
const hearts=[];
function makeHeart(pos,size,label){const h=new THREE.Mesh(new THREE.IcosahedronGeometry(size,1),new THREE.MeshStandardMaterial({color:0x081826,emissive:0x22d3ee,emissiveIntensity:0.9,roughness:0.35,metalness:0.45,transparent:true,opacity:0.75,flatShading:true}));h.position.copy(pos);org.add(h);
  const gl=new THREE.Mesh(new THREE.SphereGeometry(size*1.7,16,16),new THREE.MeshBasicMaterial({color:0x22d3ee,transparent:true,opacity:0.12,blending:ADD,depthWrite:false}));h.add(gl);hearts.push({h,gl,size});return h;}
makeHeart(new THREE.Vector3(0,-1,0.4),1.5,'systemic');
makeHeart(new THREE.Vector3(-2.4,-2.2,0.2),0.85,'gill-L');
makeHeart(new THREE.Vector3(2.4,-2.2,0.2),0.85,'gill-R');
// vessels
function vessel(a,b){const c=new THREE.CatmullRomCurve3([a,a.clone().lerp(b,0.5).add(new THREE.Vector3(0,0.6,0)),b]);return new THREE.Mesh(new THREE.TubeGeometry(c,20,0.12,6,false),new THREE.MeshBasicMaterial({color:0x7fc7ff,transparent:true,opacity:0.5,blending:ADD}));}
org.add(vessel(hearts[1].h.position,hearts[0].h.position),vessel(hearts[2].h.position,hearts[0].h.position));
// ink sac (dark pear) beneath digestive gland
const ink=new THREE.Mesh(new THREE.SphereGeometry(1.1,20,16),new THREE.MeshStandardMaterial({color:0x05060a,emissive:0x0a0416,emissiveIntensity:0.4,roughness:0.6,metalness:0.2,transparent:true,opacity:0.9}));ink.scale.set(0.9,1.3,0.9);ink.position.set(0,2.2,-0.6);org.add(ink);
// intestine (coiled tube)
const ic=new THREE.CatmullRomCurve3([new THREE.Vector3(0,-1,-1),new THREE.Vector3(1,-2,-1),new THREE.Vector3(-0.6,-3,-0.8),new THREE.Vector3(0.5,-4,-0.6)]);
org.add(new THREE.Mesh(new THREE.TubeGeometry(ic,30,0.18,8,false),SKIN(0.6)));
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.0,0.8,0.15));
function beat(t,ph){const p=((t+ph)%1.3)/1.3;const g=(c,w)=>Math.exp(-((p-c)*(p-c))/(2*w*w));return Math.min(1,g(0.1,0.045)+g(0.27,0.055)*0.65);}
const stEl=document.getElementById('st');const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
  hearts.forEach((h,i)=>{const b=beat(t,i*0.25);h.h.scale.setScalar(1+b*0.14);h.h.material.emissiveIntensity=0.8+b*0.8;h.gl.material.opacity=0.1+b*0.12;});
  shell.material.emissiveIntensity=0.5+Math.sin(t*1.2)*0.1;
  stEl.innerHTML=`<b>❤❤❤ 3-2-1</b> backup law<br><span class="g">3 hearts</span> = 3 copies<br>2 gills = 2 media · 1 = off-site`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
