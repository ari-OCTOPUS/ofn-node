<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OCTOPUS — CONTROL DECK (سر + منقار)</title>
<style>
  html,body{margin:0;height:100%;background:#04030e;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif}
  #app{position:fixed;inset:0}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 90% at 50% 45%,transparent 54%,rgba(2,0,6,.9) 100%)}
  .top{position:fixed;top:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none}
  .top b{font-size:15px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#fcd34d,#7dd3fc,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px #fcd34d44}
  .top span{display:block;font-size:11px;color:#5b6b85;margin-top:3px;letter-spacing:1px}
  #st{position:fixed;top:16px;left:16px;z-index:6;direction:ltr;text-align:left;font:12px/1.7 ui-monospace,Menlo,monospace;color:#7dd3fc;pointer-events:none}
  #st b{color:#fcd34d}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:11.5px;color:#5b6b85}
  #hint b{color:#fcd34d}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div><div id="vig"></div>
<div class="top"><b>CONTROL DECK · سر + منقار</b><span>سر = کنترل‌پنل · منقارِ کیتینی = آخرین کلیدِ رمز · حلقهٔ ۸ پایهٔ بازو</span></div>
<div id="st"></div>
<div id="hint">بکش تا بچرخانی · اسکرول = زوم · <b>منقار</b> تنها بخشِ سختِ بدن است — آخرین خطِ دفاع</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const ADD=THREE.AdditiveBlending;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
document.getElementById('app').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x04030e);scene.fog=new THREE.FogExp2(0x04030e,0.012);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,400);camera.position.set(4,-1,20);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.5;controls.target.set(0,-1.5,0);controls.minDistance=9;controls.maxDistance=50;
scene.add(new THREE.AmbientLight(0x22344f,0.55));
const key=new THREE.PointLight(0x9fd8ff,24,90);key.position.set(6,8,10);scene.add(key);
const goldK=new THREE.PointLight(0xfcd34d,8,40);goldK.position.set(0,-4,3);scene.add(goldK);
(function(){const n=600,p=new Float32Array(n*3);for(let i=0;i<n;i++){const r=90+Math.random()*80,t=Math.random()*6.28,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x6688bb,size:0.15,transparent:true,opacity:0.5})));})();
const SKIN=()=>new THREE.MeshStandardMaterial({color:0x081826,emissive:0x2a8fd6,emissiveIntensity:0.6,roughness:0.35,metalness:0.45,transparent:true,opacity:0.6,flatShading:true});
const org=new THREE.Group();scene.add(org);
// head mass (squashed) with supraocular crest
const head=new THREE.Mesh(new THREE.SphereGeometry(3.4,40,32),SKIN());head.scale.set(1.1,0.85,1);head.position.y=1;org.add(head);
org.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.SphereGeometry(3.45,20,16),18),new THREE.LineBasicMaterial({color:0xbfe9ff,transparent:true,opacity:0.3,blending:ADD})).translateY(1));
const crest=new THREE.Mesh(new THREE.TorusGeometry(0.9,0.18,8,20,Math.PI),SKIN());crest.position.set(0,3.4,0.6);crest.rotation.z=Math.PI;org.add(crest);
// eyes
function eye(sx){const g=new THREE.Group();g.position.set(sx*2.9,1.2,1.4);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(1.15,28,22),SKIN());g.add(ball);
  const iris=new THREE.Mesh(new THREE.CircleGeometry(0.72,32),new THREE.MeshStandardMaterial({color:0x001018,emissive:0x002830,emissiveIntensity:0.4}));iris.position.set(sx*0.4,0,0.95);iris.lookAt(sx*4,1,8);g.add(iris);
  const pupil=new THREE.Mesh(new THREE.PlaneGeometry(0.78,0.2),new THREE.MeshBasicMaterial({color:0x00ffff,blending:ADD}));pupil.position.set(sx*0.4,0,1.05);pupil.lookAt(sx*4,1,8);g.add(pupil);
  for(let k=1;k<=3;k++){const tr=new THREE.Mesh(new THREE.TorusGeometry(0.78+k*0.18,0.035,6,32),new THREE.MeshBasicMaterial({color:0x67e8f9,transparent:true,opacity:0.35-k*0.07,blending:ADD}));tr.position.set(sx*0.35,0,0.9);tr.lookAt(sx*4,1,8);g.add(tr);}
  org.add(g);return pupil;}
const pL=eye(-1),pR=eye(1);
// siphon
const siphon=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.85,2.4,20,1,true),SKIN());siphon.position.set(1.6,-1.4,2.4);siphon.rotation.set(0.9,0,-0.3);org.add(siphon);
// beak = two chitinous mandibles (gold), hooked upper over lower, half-open
const beak=new THREE.Group();beak.position.set(0,-3.2,1.2);org.add(beak);
const beakMat=new THREE.MeshStandardMaterial({color:0x2a1e05,emissive:0xfcd34d,emissiveIntensity:1.0,roughness:0.3,metalness:0.7});
const upper=new THREE.Mesh(new THREE.ConeGeometry(0.7,1.6,4),beakMat);upper.position.set(0,0.35,0.2);upper.rotation.set(Math.PI-0.35,Math.PI/4,0);beak.add(upper);
const lower=new THREE.Mesh(new THREE.ConeGeometry(0.62,1.3,4),beakMat);lower.position.set(0,-0.45,0);lower.rotation.set(0.35,Math.PI/4,0);beak.add(lower);
const beakGlow=new THREE.Mesh(new THREE.SphereGeometry(1.4,16,16),new THREE.MeshBasicMaterial({color:0xfcd34d,transparent:true,opacity:0.1,blending:ADD,depthWrite:false}));beak.add(beakGlow);
// ring of 8 arm-base stumps around oral cavity
for(let i=0;i<8;i++){const ang=(i/8)*Math.PI*2;const stump=new THREE.Mesh(new THREE.ConeGeometry(0.55,1.6,10),SKIN());
  stump.position.set(Math.cos(ang)*3.0,-3.4,Math.sin(ang)*3.0+0.5);stump.rotation.set(Math.PI*0.62,0,-Math.cos(ang)*0.5);stump.lookAt(Math.cos(ang)*7,-6,Math.sin(ang)*7);org.add(stump);}
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.95,0.8,0.18));
const stEl=document.getElementById('st');const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
  head.material.emissiveIntensity=0.55+Math.sin(t*1.2)*0.1;
  const dil=1+Math.sin(t*0.9)*0.08;pL.scale.x=dil;pR.scale.x=dil;
  const clamp=Math.max(0,Math.sin(t*0.6));upper.rotation.x=Math.PI-0.15-clamp*0.35;lower.rotation.x=0.15+clamp*0.35;
  beakMat.emissiveIntensity=1.0+Math.sin(t*2.4)*0.4;beakGlow.material.opacity=0.1+Math.sin(t*2.4)*0.05;goldK.intensity=6+Math.sin(t*2.4)*4;
  stEl.innerHTML=`<b>⌘ CONTROL DECK</b><br>head = control panel<br><span style="color:#fcd34d">beak = last key 🔑</span> · 8 arm stumps`;
  controls.update();composer.render();}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
