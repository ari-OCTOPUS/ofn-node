<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>بلور عادت · habit</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#060814;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:"Segoe UI",Tahoma,sans-serif;color:#c7d2fe}
  canvas{position:fixed;inset:0;display:block}
  .top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:6;pointer-events:none;text-align:right}
  .top b{font-size:15px;font-weight:700;color:#a5b4fc;display:block;text-shadow:0 0 12px #6366f1aa}
  .top span{font-size:11px;color:#585f80}
  .act{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:6;background:rgba(10,12,30,.62);border:1px solid #3730a3;border-radius:12px;padding:9px 12px;text-align:right;pointer-events:none}
  .act b{color:#c7d2fe;font-size:12.5px}.act span{color:#818cf8;font-size:11.5px;display:block;margin-top:2px}
  .tabs{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:12px;right:12px;z-index:6;display:flex;gap:8px}
  .tabs button{flex:1;background:#0a0e20;border:1px solid #3730a3;color:#a5b4fc;border-radius:9px;padding:8px 4px;font-size:12px;font-family:inherit}
  .tabs button.on{background:#1e1b4b;border-color:#818cf8}
  .back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:7;color:#818cf8;text-decoration:none;font-size:12px}
</style>
</head>
<body>
<a class="back" href="../index.html">‹ خانه</a>
<canvas id="c"></canvas>
<div class="top"><b>بلورِ عادت</b><span>هر بلور = یک نوعِ رویداد؛ ارتفاع = تعداد (ریتمِ زندهٔ سیستم)</span></div>
<div style="position:fixed;top:calc(env(safe-area-inset-top,0px)+36px);right:12px;z-index:6;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);color:#22d3ee;border-radius:999px;padding:2px 10px;font-size:10px;font-weight:700;pointer-events:none">READ-ONLY</div>
<div class="act"><b id="an"></b><span id="ad"></span></div>
<div class="tabs">
  <button data-m="0" class="on">شبکه</button>
  <button data-m="1">استریک</button>
  <button data-m="2">امروز</button>
</div>
<!-- real organism blood (read-only extract from F:/backup/4d_system/outputs) -->
<script src="../../../nervous-system/live-data.js"></script>
<script src="../octo-data.js"></script>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;function fit(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}fit();
const L=window.LIVE_DATA||null;
function mkHab(){
 const def=[{k:'ورزش',s:12,done:false},{k:'نوشتن',s:5,done:false},{k:'مطالعه',s:20,done:false},{k:'کارِ عمیق',s:8,done:false},{k:'مراقبه',s:3,done:false},{k:'زبان',s:15,done:false}];
 if(!L||!(L.events&&L.events.by_name))return def;
 const es=Object.entries(L.events.by_name).sort((a,b)=>b[1]-a[1]).slice(0,6);
 return es.length?es.map(([k,v])=>({k:k.replace(/^.*\./,'').slice(0,10),s:v,done:false})):def;
}
const HAB=mkHab();
const IX=32,IY=16,IZ=6;
function iso(gx,gy,gz){return{x:W/2+(gx-gy)*IX,y:H*0.5+(gx+gy)*IY-gz*IZ};}
let mode=0,rot=0,tsel=-1;
function tierCol(s){return s>=15?'#34d399':s>=7?'#818cf8':'#f472b6';}
function setMode(m){mode=m;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.m===m));
 if(m===0)an('کارِ بعدی → یک تکرارِ امروز','بلندترین بلور «مطالعه» (۲۰) است. کوتاه‌ترین را امروز نجات بده.');
 if(m===1){const top=HAB.reduce((a,b)=>a.s>b.s?a:b);an('استریکِ «'+top.k+'»: '+top.s+' روز','یک روز نشکن — همین حفظش امروز کافی است.');}
 if(m===2)an('یک عادت را لمس کن تا تیک بخورد','هر تیک، بلورش را یک واحد بلندتر می‌کند.');}
function an(a,b){document.getElementById('an').textContent=a;document.getElementById('ad').textContent=b;}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
cv.addEventListener('pointerdown',e=>{ if(mode!==2)return;
  HAB.forEach((h,i)=>{const gx=(i%3-1)*1.4,gy=(Math.floor(i/3)-0.5)*1.4;const p=iso(gx,gy,h.s*0.5+6);
   if((e.clientX-p.x)**2+(e.clientY-p.y)**2<1400){if(!h.done){h.done=true;h.s++;tsel=i;an('«'+h.k+'» تیک خورد ✓','استریک شد '+h.s+' روز. بلورش رشد کرد.');}}});});
function prism(cx,cy,h,col,lbl,s,glow){
 const w=IX*0.9;
 const top=[[cx,cy-h-IY*0.9],[cx+w,cy-h],[cx,cy-h+IY*0.9],[cx-w,cy-h]];
 ctx.fillStyle=col;ctx.globalAlpha=0.95;if(glow){ctx.shadowColor=col;ctx.shadowBlur=18;}
 ctx.beginPath();top.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();ctx.shadowBlur=0;
 // left face
 ctx.globalAlpha=0.65;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(cx-w,cy-h);ctx.lineTo(cx,cy-h+IY*0.9);ctx.lineTo(cx,cy+IY*0.9);ctx.lineTo(cx-w,cy);ctx.closePath();ctx.fill();
 // right face
 ctx.globalAlpha=0.45;ctx.beginPath();ctx.moveTo(cx+w,cy-h);ctx.lineTo(cx,cy-h+IY*0.9);ctx.lineTo(cx,cy+IY*0.9);ctx.lineTo(cx+w,cy);ctx.closePath();ctx.fill();
 ctx.globalAlpha=1;ctx.fillStyle='#e0e7ff';ctx.font='11px Tahoma';ctx.textAlign='center';ctx.fillText(lbl+' '+s,cx,cy-h-IY*1.3);
}
function draw(now){requestAnimationFrame(draw);
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#060814';ctx.fillRect(0,0,W,H);
 // iso floor grid
 ctx.strokeStyle='rgba(129,140,248,0.12)';ctx.lineWidth=1;
 for(let g=-3;g<=3;g++){let a=iso(g,-3,0),b=iso(g,3,0);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
   a=iso(-3,g,0);b=iso(3,g,0);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
 if(mode===1){ const top=HAB.reduce((a,b)=>a.s>b.s?a:b);
   ctx.fillStyle='#c7d2fe';ctx.font='13px Tahoma';ctx.textAlign='center';ctx.fillText('استریکِ «'+top.k+'» — ۲۱ روزِ اخیر',W/2,H*0.24);
   for(let i=0;i<21;i++){const x=W*0.12+(i%7)*(W*0.76/6),y=H*0.30+Math.floor(i/7)*26;
     ctx.fillStyle=i<top.s?tierCol(top.s):'#1e1b4b';ctx.beginPath();ctx.rect(x-9,y,18,18);ctx.fill();}
 } else {
   const ord=HAB.map((h,i)=>i).sort((a,b)=>{const pa=iso((a%3-1)*1.4,(Math.floor(a/3)-0.5)*1.4,0),pb=iso((b%3-1)*1.4,(Math.floor(b/3)-0.5)*1.4,0);return pa.y-pb.y;});
   ord.forEach(i=>{const h=HAB[i];const gx=(i%3-1)*1.4,gy=(Math.floor(i/3)-0.5)*1.4;const base=iso(gx,gy,0);
     prism(base.x,base.y,h.s*3+10,tierCol(h.s),h.k,h.s,tsel===i||mode===2&&!h.done);});
 }
}
setMode(0);requestAnimationFrame(draw);addEventListener('resize',fit);
</script>
<script>window.MATHVIZ={type:'curve',color:0xa5b4fc,dist:30,formula:'H = 1 - e^(-k*s)',value:'k = 0.1',k:0.1,gap:'no forgetting curve'};</script>
<script src="../shared-ui.js"></script>
<script src="../octo-info.js"></script>
</body>
</html>
