<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>fBackup · Octopus Topology</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#e5e7eb}
  #ui{position:fixed;top:16px;left:16px;z-index:10;pointer-events:none;user-select:none}
  #ui h1{margin:0 0 10px;font-size:15px;font-weight:600;letter-spacing:.4px}
  #ui .sub{font-size:11px;color:#8b8b8b;margin:-6px 0 12px}
  .legend{display:flex;flex-direction:column;gap:6px;font-size:12px}
  .legend .row{display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:2px;box-shadow:0 0 8px currentColor}
  #hint{position:fixed;bottom:14px;left:16px;font-size:11px;color:#6b7280;z-index:10;pointer-events:none}
  #tip{position:fixed;padding:4px 8px;background:rgba(20,20,20,.9);border:1px solid #333;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:20}
</style>
</head>
<body>
<div id="ui">
  <h1>fBackup · Octopus Topology</h1>
  <div class="sub">static architecture map · not live organism telemetry</div>
  <div class="legend" id="legend"></div>
</div>
<div id="hint">drag = rotate · scroll = zoom · hover an agent</div>
<div id="tip"></div>

<!-- deps: jsDelivr primary, unpkg auto-fallback -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js">\x3C/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>(window.THREE&&THREE.OrbitControls)||document.write('<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js">\x3C/script>');</script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.0018);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0, 80, 180);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 60;
controls.maxDistance = 500;

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dir = new THREE.DirectionalLight(0xffffff, 0.8);
dir.position.set(-80, 120, 80);
scene.add(dir);
const pt = new THREE.PointLight(0x3b82f6, 0.6, 400);
scene.add(pt);

const group = new THREE.Group();
scene.add(group);

// ---- Core node ----
const core = new THREE.Mesh(
  new THREE.SphereGeometry(8, 32, 32),
  new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x222222, roughness:0.3, metalness:0.8 })
);
group.add(core);
const coreGlow = new THREE.Mesh(
  new THREE.SphereGeometry(11, 24, 24),
  new THREE.MeshBasicMaterial({ color:0x3b82f6, transparent:true, opacity:0.08 })
);
group.add(coreGlow);

// ---- Agents ----
const AGENTS = [
  { name:'scanner',    pos:[ 60, 30,  0], color:0x3b82f6 },
  { name:'compressor', pos:[-60, 30,  0], color:0xef4444 },
  { name:'encryptor',  pos:[  0, 30, 60], color:0x22c55e },
  { name:'uploader',   pos:[  0, 30,-60], color:0xa855f7 },
  { name:'scheduler',  pos:[ 42,-40, 42], color:0x6b7280 },
  { name:'verifier',   pos:[-42,-40,-42], color:0x3b82f6 },
];

const agentMeshes = [];
const packets = [];

AGENTS.forEach(a => {
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(10,10,10),
    new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.7, metalness:0.2, emissive:0x000000 })
  );
  box.position.set(a.pos[0], a.pos[1], a.pos[2]);
  box.userData = { agent:a, tentacles:[], baseScale:1 };

  // four "eyes" facing the core
  const toCore = new THREE.Vector3().sub(box.position).normalize();
  const eyeMat = new THREE.MeshBasicMaterial({ color:a.color });
  const up = Math.abs(toCore.y) > 0.9 ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
  const right = new THREE.Vector3().crossVectors(toCore, up).normalize();
  const localUp = new THREE.Vector3().crossVectors(right, toCore).normalize();
  [[-2.5,-2.5],[2.5,-2.5],[-2.5,2.5],[2.5,2.5]].forEach(([u,v])=>{
    const eye = new THREE.Mesh(new THREE.SphereGeometry(1.5,16,16), eyeMat);
    eye.position.copy(box.position)
      .add(toCore.clone().multiplyScalar(5.2))
      .add(right.clone().multiplyScalar(u))
      .add(localUp.clone().multiplyScalar(v));
    group.add(eye);
  });

  // ---- Tentacles: curve from core to agent ----
  const mid = new THREE.Vector3(a.pos[0]*0.45, a.pos[1]*0.45 + 12, a.pos[2]*0.45);
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,0,0),
    mid,
    new THREE.Vector3(a.pos[0]*0.8, a.pos[1]*0.8, a.pos[2]*0.8),
    new THREE.Vector3(a.pos[0], a.pos[1], a.pos[2]),
  ]);
  const tubeWire = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 20, 1.4, 8, false),
    new THREE.MeshBasicMaterial({ color:a.color, transparent:true, opacity:0.15, wireframe:true })
  );
  const tubeSolid = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 20, 2.2, 8, false),
    new THREE.MeshBasicMaterial({ color:a.color, transparent:true, opacity:0.05 })
  );
  group.add(tubeWire, tubeSolid);
  box.userData.tentacles.push(tubeWire, tubeSolid);

  // two data packets per tentacle
  for (let k=0;k<2;k++){
    const pkt = new THREE.Mesh(
      new THREE.SphereGeometry(1.2,12,12),
      new THREE.MeshBasicMaterial({ color:0xffffff })
    );
    pkt.userData = { curve, t:Math.random(), speed:0.15+Math.random()*0.12, color:a.color };
    group.add(pkt);
    packets.push(pkt);
  }

  group.add(box);
  agentMeshes.push(box);
});

// ---- Inter-agent hexagonal web ----
const webPts = [];
for (let i=0;i<agentMeshes.length;i++){
  const A = agentMeshes[i].position;
  const B = agentMeshes[(i+1)%agentMeshes.length].position;
  webPts.push(A.x,A.y,A.z, B.x,B.y,B.z);
}
const web = new THREE.LineSegments(
  new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(webPts,3)),
  new THREE.LineBasicMaterial({ color:0x9ca3af, transparent:true, opacity:0.08 })
);
group.add(web);

// ---- Mirror floor ----
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(400,400),
  new THREE.MeshStandardMaterial({ color:0x050505, roughness:0.1, metalness:0.9 })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -60;
scene.add(floor);

// ---- Legend UI ----
const legend = document.getElementById('legend');
AGENTS.forEach(a=>{
  const row = document.createElement('div');
  row.className='row';
  row.innerHTML = `<span class="dot" style="background:#${a.color.toString(16).padStart(6,'0')};color:#${a.color.toString(16).padStart(6,'0')}"></span>${a.name}`;
  legend.appendChild(row);
});

// ---- Hover ----
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tip = document.getElementById('tip');
let hovered = null;
addEventListener('pointermove', e=>{
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;
  tip.style.left = (e.clientX+14)+'px';
  tip.style.top  = (e.clientY+14)+'px';
});

function updateHover(){
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(agentMeshes)[0];
  const target = hit ? hit.object : null;
  if (target !== hovered){
    if (hovered){
      hovered.userData.baseScale = 1;
      hovered.userData.tentacles.forEach((t,i)=> t.material.opacity = i===0?0.15:0.05);
    }
    hovered = target;
    if (hovered){
      hovered.userData.baseScale = 1.2;
      hovered.userData.tentacles.forEach(t=> t.material.opacity = 0.6);
      tip.textContent = hovered.userData.agent.name;
      tip.style.opacity = 1;
    } else tip.style.opacity = 0;
  }
}

// ---- Animate ----
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  group.rotation.y += 0.001;
  coreGlow.scale.setScalar(1 + Math.sin(clock.elapsedTime*2)*0.05);

  packets.forEach(p=>{
    p.userData.t = (p.userData.t + dt*p.userData.speed) % 1;
    p.position.copy(p.userData.curve.getPointAt(p.userData.t));
    p.material.color.setHex(0xffffff);
  });

  agentMeshes.forEach(m=>{
    const s = THREE.MathUtils.lerp(m.scale.x, m.userData.baseScale, 0.15);
    m.scale.setScalar(s);
  });

  updateHover();
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
