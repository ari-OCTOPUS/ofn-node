provider_identity_invariant:
  rule: vendor_id NEVER inferred from URL/dialect; DeepSeek on anthropic-compatible endpoint stays vendor_id=deepseek
  current_violation_risk: brainport.py keys provider off BRAIN_PROVIDER env and constructs URLs — dialect≠vendor trap NOT yet modeled → acceptance test AC-XV-01 (api.deepseek.com/anthropic must yield vendor_id=deepseek) REQUIRED before any T2
prefix_cache_guard:
  canonical_order: [stable role contract, stable policy/schema, stable task class, stable reference material, untrusted payload, volatile metadata at suffix]
  forbidden_in_prefix: [run_id, task_id, timestamp, nonce, random UUID, absolute path, unordered JSON, rewritten memory]
  serialization: 'json.dumps(obj, sort_keys=True, ensure_ascii=False, separators=(",", ":"))'
  metrics_required: [prompt_prefix_sha256, prompt_cache_hit_tokens, prompt_cache_miss_tokens, cache_hit_ratio]
  lab_report_registered:
    label: REPORT — offline deterministic simulator, node 191, external_api_calls=0, scope=simulator_only, claim_type=hypothesis
    verdict: PARTIAL · COMMON_PREFIX_NOT_A_COMPLETE_UNIT (44/48 common units = 91.7%; largest matched persisted unit: none; hard blockers: 0)
    canonical_evidence_sha256: df45d216e30df7f57ce8ccc19f771622881612cb7474094f828cf783270b74ad (recomputed==stored → MATCH; matched-prefix hash 67ec134a41a4…; lookup ALLOW)
    key_rules_adopted: [exact-prefix from token zero only; mid-span never promoted, BLOCKED≠PARTIAL≠MISS semantics per matrix, provider usage receipt required — simulator prediction is NOT execution evidence]
budget_schemas:
  pre_call: budget_reservation.v1 {reservation_id, logical_task_id, vendor_id, capability_class, estimated_input_tokens, max_output_tokens, worst_case_cost_usd, price_source=official, price_observed_at_utc, status=RESERVED}
  post_call: cost_reconciliation.v1 {reservation_id, input_tokens, output_tokens, cache_hit_tokens, cache_miss_tokens, actual_cost_usd, variance_usd, status=RECONCILED}
  crash_rule: crash after provider-response before ledger-write ⇒ BLOCKED_UNTRACKED_SPEND_RISK until reconciled
  idempotency_key_rule: sha256(run_id + step_id + artifact_sha256 + capability_class) — model_id EXCLUDED (fallback must not create new logical task)
