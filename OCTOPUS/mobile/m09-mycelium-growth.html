<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>رشدِ میسیلیوم · Mycelium Growth</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#03080a;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;color:#bbf7d0}
  canvas{display:block;position:fixed;inset:0}
  .top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:6;pointer-events:none;text-align:right}
  .top b{font-size:15px;font-weight:700;color:#86efac;display:block;text-shadow:0 0 10px #22c55eaa}
  .top span{font-size:11px;color:#5b7a68}
  .cap{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);z-index:6;background:rgba(6,24,16,.66);border:1px solid #14532d;border-radius:12px;padding:9px 12px;text-align:right;pointer-events:none}
  .cap b{font-size:13px;color:#bbf7d0}.cap span{font-size:11.5px;color:#86efac;display:block;margin-top:2px}
  .foot{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:12px;right:12px;z-index:6;display:flex;gap:12px;align-items:center;font-size:10.5px;color:#4b6455;direction:ltr}
  .foot a{color:#4ade80;text-decoration:none;font-size:12px;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><b>رشدِ میسیلیوم — ساختِ پشت‌هم</b><span>گراف واقعی، گره‌به‌گره، از ریشه می‌روید · لمس = بذرِ تازه</span></div>
<div class="cap"><b id="cn"></b><span id="cd"></span></div>
<div class="foot"><a href="index.html">‹ hub</a><span id="st"></span></div>
<script src="../../nervous-system/graph-data.js"></script>
<script src="octo-core.js"></script>
<script>
const cv=document.getElementById('c'); let S=OCTO.fit(cv),ctx=S.ctx,W=S.w,H=S.h;
const G=OCTO.G, N=G.nodes.length, adj=OCTO.adjacency();
let P=OCTO.forceLayout(W,H,110);

let revealed, edgesDone, queue, active, doneEdges;
function seed(root){
  revealed=new Array(N).fill(false); edgesDone=[]; queue=[]; active=[];
  revealed[root]=true; adj[root].forEach(v=>queue.push([root,v]));
}
seed(0);
const MAXA=9, SPEED=0.9;

function step(dt){
  while(active.length<MAXA && queue.length){ const e=queue.shift(); if(!revealed[e[1]]) active.push({a:e[0],b:e[1],p:0}); }
  for(let i=active.length-1;i>=0;i--){ const g=active[i]; g.p+=dt*SPEED;
    if(g.p>=1){ if(!revealed[g.b]){ revealed[g.b]=true; edgesDone.push([g.a,g.b]);
        adj[g.b].forEach(v=>{ if(!revealed[v]) queue.push([g.b,v]); }); } active.splice(i,1); } }
  if(!queue.length && !active.length){ // cover disconnected bits or restart
    let next=-1; for(let k=0;k<N;k++) if(!revealed[k]){next=k;break;}
    if(next>=0){ revealed[next]=true; adj[next].forEach(v=>queue.push([next,v])); }
    else { setTimeout(()=>seed(Math.floor(Math.random()*N)), 1200); }
  }
}
function nearest(x,y){let bi=0,bd=1e9;for(let i=0;i<N;i++){const dx=P[i].x-x,dy=P[i].y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i;}}return bi;}
cv.addEventListener('pointerdown',e=>seed(nearest(e.clientX,e.clientY)));

function draw(now){
  requestAnimationFrame(draw);
  const dt=Math.min(0.05,(now-(draw._l||now))/1000); draw._l=now; step(dt);
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#03080a'; ctx.fillRect(0,0,W,H);
  // grown edges
  ctx.lineWidth=1; ctx.strokeStyle='rgba(74,222,128,0.22)';
  for(const e of edgesDone){const a=P[e[0]],b=P[e[1]];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  // growing tips
  let cnt=0;
  active.forEach(g=>{const a=P[g.a],b=P[g.b];const x=a.x+(b.x-a.x)*g.p,y=a.y+(b.y-a.y)*g.p;
    ctx.strokeStyle='rgba(134,239,172,0.6)';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(x,y);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,3.5,0,6.283);ctx.fillStyle='#f0fff4';ctx.shadowColor='#4ade80';ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;});
  // revealed nodes
  for(let i=0;i<N;i++){ if(!revealed[i])continue; cnt++; const p=P[i];
    ctx.beginPath();ctx.arc(p.x,p.y,OCTO.radius(G.nodes[i].d),0,6.283);ctx.fillStyle=G.nodes[i].c;ctx.globalAlpha=0.9;ctx.fill();ctx.globalAlpha=1; }
  const pct=Math.round(100*cnt/N);
  document.getElementById('cn').textContent='رشد: '+cnt+' از '+N+' گره ('+pct+'%)';
  document.getElementById('cd').textContent='شاخه‌های فعال: '+active.length+' · صف: '+queue.length+' · مثل اسپورِ mycelium';
  document.getElementById('st').textContent=G.total_files+' notes total';
}
requestAnimationFrame(draw);
addEventListener('resize',()=>{S=OCTO.fit(cv);ctx=S.ctx;W=S.w;H=S.h;P=OCTO.forceLayout(W,H,90);seed(0);});
</script>
</body>
</html>
