<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>پروازِ اتاق‌ها · Office Fly-through</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#04060b;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;color:#e0f2fe}
  #g{position:fixed;inset:0}
  .top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:6;pointer-events:none;text-align:right}
  .top b{font-size:15px;font-weight:700;color:#7dd3fc;display:block;text-shadow:0 0 10px #0ea5e9aa}
  .top span{font-size:11px;color:#5b7a95}
  .cap{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);z-index:6;background:rgba(8,18,30,.7);border:1px solid #1e3a5b;border-radius:12px;padding:9px 12px;text-align:right;pointer-events:none}
  .cap b{font-size:13px;color:#bae6fd}.cap span{font-size:11.5px;color:#93c5fd;display:block;margin-top:2px}
  .foot{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:12px;right:12px;z-index:6;display:flex;gap:12px;align-items:center;font-size:10.5px;color:#4b6480;direction:ltr}
  .foot a{color:#38bdf8;text-decoration:none;font-size:12px;pointer-events:auto}
</style>
</head>
<body>
<div id="g"></div>
<div class="top"><b>پروازِ اتاق‌ها — دوربینِ سینمایی</b><span>از اتاقِ ورودی تا خروجی · لمس = اتاقِ بعد</span></div>
<div class="cap"><b id="cn"></b><span id="cd"></span></div>
<div class="foot"><a href="index.html">‹ hub</a><span id="st"></span></div>
<script src="../../nervous-system/graph-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js">\x3C/script>');</script>
<script>
const G=window.OCTOPUS_GRAPH;
const cnt={}; (G.groups||[]).forEach(g=>cnt[g.name]=g.n);
const ROOMS=[
 {fa:'اتاق ۱ — دریافت', f:'00 - Inbox', c:0x9ca3af, note:'دربِ ورود؛ سیگنالِ خام وارد می‌شود'},
 {fa:'اتاق ۲ — کورتکس', f:'04 - Architect System', c:0xa855f7, note:'تصمیم و مسیریابی (ignition)'},
 {fa:'اتاق ۳ — کارمندها', f:'05 - Agents', c:0x22c55e, note:'لیمب‌ها کار را برمی‌دارند'},
 {fa:'اتاق ۴ — دانش', f:'07 - Knowledge', c:0xeab308, note:'غنی‌سازی با مرجع'},
 {fa:'اتاق ۵ — حکمرانی', f:'06 - Architecture Maps', c:0xef4444, note:'قواعد و ریسک‌لدر'},
 {fa:'اتاق ۶ — پروژه‌ها', f:'03 - Projects', c:0x3b82f6, note:'کارِ واقعی انجام می‌شود'},
 {fa:'اتاق ۷ — خروجی', f:'_memory', c:0xf59e0b, note:'ثبت در حافظه و انتشار به بیرون'},
];
const GAP=48;
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x04060b,0.006);
const camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x04060b,1); document.getElementById('g').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.5));
const dl=new THREE.DirectionalLight(0xffffff,0.6); dl.position.set(20,40,20); scene.add(dl);
scene.add(new THREE.GridHelper(600,60,0x123, 0x0b1a2a));

ROOMS.forEach((r,i)=>{
  const z=-i*GAP;
  const box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(30,18,26)),
    new THREE.LineBasicMaterial({color:r.c,transparent:true,opacity:0.9}));
  box.position.set(0,9,z); scene.add(box);
  const fill=new THREE.Mesh(new THREE.BoxGeometry(30,18,26),
    new THREE.MeshBasicMaterial({color:r.c,transparent:true,opacity:0.05})); fill.position.set(0,9,z); scene.add(fill);
  const n=Math.min(cnt[r.f]||3,8);
  for(let k=0;k<n;k++){ const e=new THREE.Mesh(new THREE.BoxGeometry(2.4,3+ (k%3),2.4),
     new THREE.MeshStandardMaterial({color:r.c,emissive:r.c,emissiveIntensity:0.3}));
     e.position.set(-10+(k%4)*6, 2, z-7+Math.floor(k/4)*10); scene.add(e); }
  r.z=z;
});
// conveyor packets
const packs=[]; for(let i=0;i<24;i++){ const s=new THREE.Mesh(new THREE.SphereGeometry(0.9,10,10),
  new THREE.MeshBasicMaterial({color:0xbae6fd})); s.userData.t=i/24; scene.add(s); packs.push(s); }
const totalZ=(ROOMS.length-1)*GAP;

let room=0, roomT=0; const DUR=3.8;
document.getElementById('g').addEventListener('pointerdown',()=>{room=(room+1)%ROOMS.length;roomT=0;});
const camPos=new THREE.Vector3(30,26,40), look=new THREE.Vector3(0,9,0);
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  roomT+=dt; if(roomT>=DUR){room=(room+1)%ROOMS.length;roomT=0;}
  const R=ROOMS[room];
  const sway=Math.sin(clock.elapsedTime*0.4)*10;
  camPos.lerp(new THREE.Vector3(sway,24,R.z+42),0.03);
  look.lerp(new THREE.Vector3(0,9,R.z),0.05);
  camera.position.copy(camPos); camera.lookAt(look);

  packs.forEach(p=>{ p.userData.t=(p.userData.t+dt*0.05)%1; const z=6 - p.userData.t*(totalZ+12);
    p.position.set(Math.sin(p.userData.t*20)*1.5, 3, z); });

  document.getElementById('cn').textContent=R.fa;
  document.getElementById('cd').textContent=R.note+'  ·  '+(cnt[R.f]||0)+' نوت در این اتاق';
  document.getElementById('st').textContent='اتاق '+(room+1)+'/'+ROOMS.length+' · '+G.total_files+' notes';
  renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
