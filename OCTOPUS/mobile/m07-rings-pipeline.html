<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>رینگ‌های ۰–۴ · Rings Pipeline</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#060409;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;color:#fbcfe8}
  canvas{display:block;position:fixed;inset:0}
  .top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:6;pointer-events:none;text-align:right}
  .top b{font-size:15px;font-weight:700;color:#f0abfc;display:block;text-shadow:0 0 10px #d946efaa}
  .top span{font-size:11px;color:#8b6b85}
  .cap{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);z-index:6;background:rgba(24,10,24,.66);border:1px solid #4a1d47;border-radius:12px;padding:9px 12px;text-align:right;pointer-events:none}
  .cap b{font-size:13px;color:#f5d0fe}.cap span{font-size:11.5px;color:#e9a8f0;display:block;margin-top:2px}
  .foot{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:12px;right:12px;z-index:6;display:flex;gap:12px;align-items:center;font-size:10.5px;color:#7a5570;direction:ltr}
  .foot a{color:#e879f9;text-decoration:none;font-size:12px;pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><b>رینگ‌های ۰–۴ — نزول به هسته</b><span>پرمخاطب‌ترین هاب‌ها در مرکز (Ring 0) · برگ‌ها بیرون (Ring 4)</span></div>
<div class="cap"><b id="cn">دیتا از حلقهٔ بیرونی به سمت هسته می‌ریزد</b><span id="cd"></span></div>
<div class="foot"><a href="index.html">‹ hub</a><span id="st"></span></div>
<script src="graph-data.js"></script>
<script src="octo-core.js"></script>
<script>
const cv=document.getElementById('c'); let S=OCTO.fit(cv),ctx=S.ctx,W=S.w,H=S.h;
const G=OCTO.G, N=G.nodes.length;
const RINGS=5;
let ringOf=[], P=[], base=[];
function layout(){
  const order=[...Array(N).keys()].sort((a,b)=>G.nodes[b].d-G.nodes[a].d); // desc
  ringOf=new Array(N);
  order.forEach((idx,rank)=>{ ringOf[idx]=Math.min(RINGS-1,Math.floor(rank/N*RINGS)); });
  // group per ring, order by folder for arcs
  const perRing=Array.from({length:RINGS},()=>[]);
  for(let i=0;i<N;i++) perRing[ringOf[i]].push(i);
  perRing.forEach(a=>a.sort((x,y)=>G.nodes[x].g.localeCompare(G.nodes[y].g)));
  const cx=W/2, cy=H/2, minD=Math.min(W,H);
  const coreR=minD*0.07, step=minD*0.085;
  base=new Array(N);
  perRing.forEach((a,ring)=>{ const R=coreR+ring*step; a.forEach((idx,k)=>{ const ang=k/a.length*Math.PI*2; base[idx]={r:R,a:ang}; }); });
}
layout();
let rot=0;
function pos(i){ const b=base[i]; const a=b.a+rot*(1-ringOf[i]*0.12); return {x:W/2+Math.cos(a)*b.r, y:H/2+Math.sin(a)*b.r}; }

// inward packets: pick edges that cross rings, animate outer->inner
const inward=G.edges.filter(e=>ringOf[e[0]]!==ringOf[e[1]]).map(e=> ringOf[e[0]]>ringOf[e[1]]?[e[0],e[1]]:[e[1],e[0]]);
const pk=inward.filter((_,i)=>i%3===0).slice(0,60).map(e=>({e,t:Math.random(),sp:0.15+Math.random()*0.25}));

function draw(now){
  requestAnimationFrame(draw);
  const dt=Math.min(0.05,(now-(draw._l||now))/1000); draw._l=now; rot+=dt*0.06;
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#060409'; ctx.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2,minD=Math.min(W,H),coreR=minD*0.07,step=minD*0.085;
  // ring guides
  for(let r=0;r<RINGS;r++){ ctx.beginPath();ctx.arc(cx,cy,coreR+r*step,0,6.283);
    ctx.strokeStyle='rgba(217,70,239,'+(0.05+ (RINGS-r)*0.015)+')';ctx.lineWidth=1;ctx.stroke(); }
  // edges
  ctx.lineWidth=0.5;
  for(const e of G.edges){ const a=pos(e[0]),b=pos(e[1]); ctx.strokeStyle='rgba(230,150,220,0.06)';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke(); }
  // nodes
  for(let i=0;i<N;i++){ const p=pos(i); ctx.beginPath();ctx.arc(p.x,p.y,OCTO.radius(G.nodes[i].d),0,6.283);
    ctx.fillStyle=G.nodes[i].c; ctx.globalAlpha=0.85; ctx.fill(); ctx.globalAlpha=1; }
  // core
  ctx.beginPath();ctx.arc(cx,cy,coreR*0.6,0,6.283);ctx.fillStyle='rgba(245,208,254,0.9)';
  ctx.shadowColor='#f0abfc';ctx.shadowBlur=20;ctx.fill();ctx.shadowBlur=0;
  // inward packets
  pk.forEach(o=>{ o.t=(o.t+dt*o.sp)%1; const a=pos(o.e[0]),b=pos(o.e[1]);
    const x=a.x+(b.x-a.x)*o.t,y=a.y+(b.y-a.y)*o.t;
    ctx.beginPath();ctx.arc(x,y,3.2,0,6.283);ctx.fillStyle='#fdf4ff';ctx.fill(); });
  document.getElementById('cd').textContent='Ring 4 دریافت ⟶ Ring 0 هسته/kill-switch · '+pk.length+' جریان فعال';
  document.getElementById('st').textContent=N+' hub-notes · '+G.total_files+' total';
}
requestAnimationFrame(draw);
addEventListener('resize',()=>{S=OCTO.fit(cv);ctx=S.ctx;W=S.w;H=S.h;layout();});
</script>
</body>
</html>
