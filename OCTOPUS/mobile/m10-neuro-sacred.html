<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>هندسهٔ آگاهی · Neuro-Sacred Map</title>
<style>
  *{margin:0;box-sizing:border-box}
  html,body{height:100%;background:#080611;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;color:#fde68a}
  canvas{display:block;position:fixed;inset:0}
  .top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:6;pointer-events:none;text-align:right}
  .top b{font-size:15px;font-weight:700;color:#fcd34d;display:block;text-shadow:0 0 10px #f59e0baa}
  .top span{font-size:11px;color:#8b7a55}
  .cap{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);z-index:6;background:rgba(24,18,6,.6);border:1px solid #5b451d;border-radius:12px;padding:9px 12px;text-align:right;pointer-events:none}
  .cap span{font-size:11.5px;color:#fde68a}
  .foot{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:12px;right:12px;z-index:6;display:flex;gap:12px;align-items:center;font-size:10.5px;color:#7a6a45;direction:ltr}
  .foot a{color:#fbbf24;text-decoration:none;font-size:12px;pointer-events:auto}
  .foot .ep{opacity:.7;font-style:italic}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><b>هندسهٔ آگاهی — نقشهٔ وحدت</b><span>۱۳ هابِ اصلیِ والت روی متاترون · یال‌های واقعی</span></div>
<div class="cap"><span id="cd">وحدتِ کورتکس/قلب/بودجه/اپیستمیک — یکپارچگیِ گراف</span></div>
<div class="foot"><a href="index.html">‹ hub</a><span id="st"></span><span class="ep">access-consciousness · not qualia</span></div>
<script src="../../nervous-system/graph-data.js"></script>
<script src="octo-core.js"></script>
<script>
const cv=document.getElementById('c'); let S=OCTO.fit(cv),ctx=S.ctx,W=S.w,H=S.h;
const G=OCTO.G, N=G.nodes.length;
const order=[...Array(N).keys()].sort((a,b)=>G.nodes[b].d-G.nodes[a].d);
const top=order.slice(0,13);
const topSet=new Set(top);
const rest=order.slice(13);

let rot=0;
function geom(){
  const cx=W/2, cy=H*0.46, r=Math.min(W,H)*0.20;
  const pts=[{x:0,y:0}];
  for(let k=0;k<6;k++) pts.push({x:Math.cos(k*Math.PI/3)*r, y:Math.sin(k*Math.PI/3)*r});
  for(let k=0;k<6;k++) pts.push({x:Math.cos(Math.PI/6+k*Math.PI/3)*r*1.732, y:Math.sin(Math.PI/6+k*Math.PI/3)*r*1.732});
  return {cx,cy,pts,r};
}
function draw(now){
  requestAnimationFrame(draw);
  const dt=Math.min(0.05,(now-(draw._l||now))/1000); draw._l=now; rot+=dt*0.05;
  const {cx,cy,pts,r}=geom();
  const rp=pts.map(p=>({x:cx+p.x*Math.cos(rot)-p.y*Math.sin(rot), y:cy+p.x*Math.sin(rot)+p.y*Math.cos(rot)}));
  const posOf={}; top.forEach((idx,i)=>posOf[idx]=rp[i]);

  ctx.clearRect(0,0,W,H); ctx.fillStyle='#080611'; ctx.fillRect(0,0,W,H);

  // outer faint ring of remaining nodes
  rest.forEach((idx,i)=>{ const a=i/rest.length*6.283+rot*0.4, R=Math.min(W,H)*0.44;
    const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R*0.82;
    ctx.beginPath();ctx.arc(x,y,1.6,0,6.283);ctx.fillStyle=G.nodes[idx].c;ctx.globalAlpha=0.35;ctx.fill();ctx.globalAlpha=1;
    G._rp=G._rp||{}; G._rp[idx]={x,y}; });

  // sacred geometry: all-pairs among 13 (faint gold)
  ctx.strokeStyle='rgba(251,191,36,0.10)'; ctx.lineWidth=1;
  for(let i=0;i<rp.length;i++)for(let j=i+1;j<rp.length;j++){ctx.beginPath();ctx.moveTo(rp[i].x,rp[i].y);ctx.lineTo(rp[j].x,rp[j].y);ctx.stroke();}
  // flower circles
  ctx.strokeStyle='rgba(252,211,77,0.14)';
  rp.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.283);ctx.stroke();});

  // REAL edges among the 13 hubs (bright)
  ctx.strokeStyle='rgba(253,224,71,0.8)'; ctx.lineWidth=1.8;
  for(const e of G.edges){ if(topSet.has(e[0])&&topSet.has(e[1])){const a=posOf[e[0]],b=posOf[e[1]];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();} }
  // real edges from hubs to outer ring (subset)
  ctx.strokeStyle='rgba(253,224,71,0.10)'; ctx.lineWidth=0.7;
  for(const e of G.edges){ const inA=topSet.has(e[0]),inB=topSet.has(e[1]);
    if(inA!==inB){ const h=inA?e[0]:e[1], o=inA?e[1]:e[0]; if(G._rp&&G._rp[o]){ctx.beginPath();ctx.moveTo(posOf[h].x,posOf[h].y);ctx.lineTo(G._rp[o].x,G._rp[o].y);ctx.stroke();} } }

  // hub nodes + labels
  top.forEach((idx,i)=>{ const p=rp[i], n=G.nodes[idx];
    ctx.beginPath();ctx.arc(p.x,p.y,5+Math.sqrt(n.d)*0.7,0,6.283);
    ctx.fillStyle=n.c;ctx.shadowColor=n.c;ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fffbeb';ctx.font='10px Tahoma';ctx.textAlign='center';
    const lbl=n.l.length>18?n.l.slice(0,17)+'…':n.l; ctx.fillText(lbl,p.x,p.y-10); });

  document.getElementById('st').textContent='۱۳ هاب از '+G.total_files+' نوت';
}
requestAnimationFrame(draw);
addEventListener('resize',()=>{S=OCTO.fit(cv);ctx=S.ctx;W=S.w;H=S.h;G._rp={};});
</script>
</body>
</html>
