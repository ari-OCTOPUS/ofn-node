<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>fBackup · Hexagonal Swarm</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0a;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#e5e7eb}
  #title{position:fixed;top:16px;left:0;right:0;text-align:center;font-size:15px;font-weight:600;letter-spacing:.4px;z-index:10;pointer-events:none}
  #legend{position:fixed;bottom:16px;left:16px;z-index:10;font-size:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  #legend .row{display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .lbl{background:rgba(15,15,15,.9);border:1px solid #333;border-radius:6px;padding:2px 8px;font-size:12px;color:#fff;white-space:nowrap;transform:translateY(-6px)}
  #css{position:fixed;inset:0;pointer-events:none;z-index:5}
</style>
</head>
<body>
<div id="title">fBackup · Hexagonal Swarm</div>
<div id="legend"></div>

<!-- deps: jsDelivr primary, unpkg auto-fallback -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js">\x3C/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>(window.THREE&&THREE.OrbitControls)||document.write('<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js">\x3C/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>(window.THREE&&THREE.CSS2DRenderer)||document.write('<script src="https://unpkg.com/three@0.128.0/examples/js/renderers/CSS2DRenderer.js">\x3C/script>');</script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.008);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 60, 100);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);

const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.id = 'css';
document.body.appendChild(labelRenderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.2;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const d = new THREE.DirectionalLight(0xffffff, 0.7); d.position.set(40,80,40); scene.add(d);

// ---- Center hub ----
const hub = new THREE.Mesh(
  new THREE.CylinderGeometry(6,6,4,6),
  new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0x333333, metalness:0.9, roughness:0.1 })
);
scene.add(hub);

// ---- Agents ----
const AGENTS = [
  { name:'scanner',    pos:[   0,0,-50], color:0x3b82f6 },
  { name:'compressor', pos:[ 43.3,0,-25], color:0xef4444 },
  { name:'encryptor',  pos:[ 43.3,0, 25], color:0x22c55e },
  { name:'uploader',   pos:[   0,0, 50], color:0xa855f7 },
  { name:'scheduler',  pos:[-43.3,0, 25], color:0x6b7280 },
  { name:'verifier',   pos:[-43.3,0,-25], color:0xf59e0b },
];

const agents = [];
AGENTS.forEach((a,i)=>{
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(8,8,12,6),
    new THREE.MeshStandardMaterial({ color:a.color, emissive:a.color, emissiveIntensity:0.35, metalness:0.6, roughness:0.3 })
  );
  mesh.position.set(a.pos[0], a.pos[1], a.pos[2]);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(12, 0.5, 8, 6),
    new THREE.MeshBasicMaterial({ color:a.color, transparent:true, opacity:0.4 })
  );
  ring.rotation.x = Math.PI/2;
  ring.position.copy(mesh.position);
  ring.userData.spin = 0.3 + i*0.15;
  scene.add(ring);

  const el = document.createElement('div');
  el.className='lbl'; el.textContent=a.name; el.style.display='none';
  const label = new THREE.CSS2DObject(el);
  label.position.set(0, 12, 0);
  mesh.add(label);

  mesh.userData = { agent:a, ring, el, base:1, target:1 };
  scene.add(mesh);
  agents.push(mesh);
});

// ---- Connection web ----
const webPts=[];
for (let i=0;i<agents.length;i++){
  const A=agents[i].position, B=agents[(i+1)%agents.length].position;
  webPts.push(A.x,A.y,A.z, B.x,B.y,B.z);          // perimeter
  webPts.push(A.x,A.y,A.z, 0,0,0);                 // spoke
}
scene.add(new THREE.LineSegments(
  new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(webPts,3)),
  new THREE.LineBasicMaterial({ color:0x333333, transparent:true, opacity:0.25 })
));

// ---- Orbiting data rings ----
function orbitRing(r, color, dir){
  const m = new THREE.Mesh(
    new THREE.RingGeometry(r-0.6, r, 96),
    new THREE.MeshBasicMaterial({ color, side:THREE.DoubleSide, transparent:true, opacity:0.15 })
  );
  m.rotation.x = Math.PI/2 - THREE.MathUtils.degToRad(15);
  m.userData.dir = dir;
  scene.add(m);
  return m;
}
const ringInner = orbitRing(35, 0x3b82f6, 1);
const ringMid   = orbitRing(55, 0xef4444, -1);
const ringOuter = orbitRing(70, 0x22c55e, 1);

// ---- Floating particles ----
const N=200, parr=new Float32Array(N*3);
for (let i=0;i<N;i++){
  const u=Math.random(), v=Math.random(), th=u*2*Math.PI, ph=Math.acos(2*v-1), r=80*Math.cbrt(Math.random());
  parr[i*3]=r*Math.sin(ph)*Math.cos(th); parr[i*3+1]=r*Math.cos(ph); parr[i*3+2]=r*Math.sin(ph)*Math.sin(th);
}
const pgeo=new THREE.BufferGeometry(); pgeo.setAttribute('position', new THREE.BufferAttribute(parr,3));
const particles=new THREE.Points(pgeo, new THREE.PointsMaterial({ color:0xffffff, size:0.5, transparent:true, opacity:0.4 }));
scene.add(particles);

// ---- Legend ----
const legend=document.getElementById('legend');
AGENTS.forEach(a=>{
  const row=document.createElement('div'); row.className='row';
  const hex='#'+a.color.toString(16).padStart(6,'0');
  row.innerHTML=`<span class="dot" style="background:${hex};color:${hex}"></span>${a.name}`;
  legend.appendChild(row);
});

// ---- Hover ----
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let hovered=null;
addEventListener('pointermove', e=>{ mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; });
function hover(){
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(agents)[0];
  const t=hit?hit.object:null;
  if (t!==hovered){
    if (hovered){ hovered.userData.target=1; hovered.userData.ring.material.opacity=0.4; hovered.userData.el.style.display='none'; }
    hovered=t;
    if (hovered){ hovered.userData.target=1.3; hovered.userData.ring.material.opacity=0.9; hovered.userData.el.style.display='block'; }
  }
}

// ---- Animate ----
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();
  agents.forEach(m=>{
    const s=THREE.MathUtils.lerp(m.scale.x, m.userData.target, 0.15); m.scale.setScalar(s);
    m.userData.ring.rotation.z += m.userData.ring.userData.spin*dt;
  });
  ringInner.rotation.z += ringInner.userData.dir*0.3*dt;
  ringMid.rotation.z   += ringMid.userData.dir*0.22*dt;
  ringOuter.rotation.z += ringOuter.userData.dir*0.15*dt;

  const pos=particles.geometry.attributes.position.array;
  for (let i=0;i<N;i++){ pos[i*3+1]+=dt*2; if (pos[i*3+1]>80) pos[i*3+1]=-80; }
  particles.geometry.attributes.position.needsUpdate=true;

  hover();
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
