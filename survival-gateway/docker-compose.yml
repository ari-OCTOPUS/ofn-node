# Survival Stack — Layer 0 (Gateway) + Layer 5 (Risk-Governance)
# LiteLLM proxy is the anti-lock-in gateway: EVERY model call goes through here.
#
# SECURITY — image is PINNED to a known-good stable tag (never `latest`):
#   A supply-chain incident hit LiteLLM 1.82.7 / 1.82.8 (March 2026); fixed in 1.83.0.
#   v1.85.0-stable is post-incident. Verify the signature with cosign before first pull:
#     cosign verify \
#       --key https://raw.githubusercontent.com/BerriAI/litellm/v1.85.0-stable/cosign.pub \
#       ghcr.io/berriai/litellm-database:main-stable
#   Re-check current stable + advisories at https://github.com/BerriAI/litellm/releases before bumping.

services:
  litellm:
    # `-database` variant bundles Prisma migrations for Postgres.
    image: ghcr.io/berriai/litellm-database:main-stable
    container_name: survival-gateway
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # localhost ONLY. Do not expose 4000 publicly without a reverse proxy + TLS.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config=/app/config.yaml"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY}"
      STORE_MODEL_IN_DB: "False"           # config.yaml is the source of truth (git-tracked = Ledger)
      # provider creds — only the ones you use need a value:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"   # worker: DeepSeek
      ZAI_API_KEY: "${ZAI_API_KEY:-}"             # worker: GLM (Z.ai)
      SAKANA_API_KEY: "${SAKANA_API_KEY:-}"       # orchestrator: Fugu (Sakana)
    healthcheck:
      # /health/liveliness returns the literal string "I'm alive!". urlopen raises on non-200.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      # json-file driver = the live append-only audit tail (pairs with json_logs: true in config).
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  db:
    image: postgres:16-alpine
    container_name: survival-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

# NOTE: no GPU / no Ollama service yet. The local model tier (Layer 1 "light") is added
# once the Hetzner spec (RAM / GPU) is known — see README "قدمِ بعدی".
