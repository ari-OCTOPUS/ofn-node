# Survival Stack — LiteLLM gateway config (Layer 0) + governance knobs (Layer 5).
# This file is the SOURCE OF TRUTH for models + policy. Keep it in git (Ledger).
#
# Two model GROUPS are exposed. The heavy-vs-fast CHOICE is made by the CALLER
# (the 00-Orchestrator / your agent), NOT by LiteLLM. LiteLLM only serves each
# group and load-balances / falls back WITHIN a group. The routing CONTRACT is
# in the README — implement it in the orchestrator layer.
#
# ⚠️ Confirm the exact model ids below against each provider's console, and confirm
#    the budget keys against your pinned LiteLLM version's docs (schema drifts).

model_list:
  # ---------- (removed) heavy-reasoning + fast tiers ----------
  # Claude/GPT/Gemini tiers حذف شدند (کلیدِ Anthropic معتبر نبود + نیازی نیست).
  # موتور = glm-coder + deepseek-bulk + orchestr/fugu. اگر بعداً Claude خواستی، این‌جا برگردان.

  # ---------- LOCAL tier (Layer 1 "light") — PENDING Hetzner spec ----------
  # Filled once RAM / GPU is known. No-GPU VPS → Phi-4-mini or Qwen3-4B via Ollama.
  # - model_name: local-fast
  #   litellm_params:
  #     model: ollama_chat/phi4-mini          # or ollama_chat/qwen3:4b
  #     api_base: http://ollama:11434

  # ---------- WORKER: GLM (کدنویسِ اصلی) — راه ب ----------
  # ⚠️ VERIFY model-id (glm-4.6 / glm-5.2?) و api_base planت را در docs.z.ai
  - model_name: glm-coder
    litellm_params:
      model: openai/glm-4.6
      api_base: https://api.z.ai/api/coding/paas/v4   # ⚠️ verify — ممکن است coding-plan base متفاوت باشد
      api_key: os.environ/ZAI_API_KEY

  # ---------- WORKER: DeepSeek (دیباگ + review + حجم) — راه ب ----------
  - model_name: deepseek-bulk
    litellm_params:
      model: deepseek/deepseek-v4-flash        # deepseek-chat بعد از 2026-07-24 deprecate
      api_key: os.environ/DEEPSEEK_API_KEY


  # ---------- ORCHESTRATOR: Fugu (Sakana) — روادمپ §۲.۹ ----------
  # ⚠️ VERIFY base_url در console.sakana.ai (عمومی نیست). مدل‌ها: fugu / fugu-ultra
  - model_name: orchestr
    litellm_params:
      model: openai/fugu-ultra
      api_base: https://api.sakana.ai/v1
      api_key: os.environ/SAKANA_API_KEY
  - model_name: fugu
    litellm_params:
      model: openai/fugu
      api_base: https://api.sakana.ai/v1
      api_key: os.environ/SAKANA_API_KEY


litellm_settings:
  # ---- COST CAP (governance, non-removable) — USD ----
  max_budget: 80                 # ← single knob. Handoff envelope: ~$20–80/mo API.
  budget_duration: "30d"

  # ---- resilience ----
  num_retries: 2
  request_timeout: 600
  drop_params: true              # drop provider-unsupported params instead of erroring
  fallbacks: []
  context_window_fallbacks: []

  # ---- audit / logging ----
  json_logs: true                # structured JSON to stdout → captured by docker json-file driver
  turn_off_message_logging: true # PRIVACY DEFAULT: don't ship prompt/response bodies to callbacks.
                                 # Set false if you WANT full-body capture in your audit stream.
  # service_callbacks: ["prometheus"]   # enable once a Prometheus scrape target exists

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

  # ---- durable audit (Postgres spend logs) ----
  # Every request → LiteLLM_SpendLogs (model, key, tokens, cost, timestamp), kept for auditing.
  disable_spend_logs: false
  store_prompts_in_spend_logs: false        # PRIVACY DEFAULT: metadata+cost only, no bodies.
  maximum_spend_logs_retention_period: "90d"
  maximum_spend_logs_retention_interval: "1d"

  # ---- fail-closed governance ----
  allow_requests_on_db_unavailable: false   # DB down → reject (enforcement over availability)
  fail_closed_budget_enforcement: true      # can't verify spend → 503, never silently overspend
  disable_master_key_return: true           # don't leak master key on /user/info
  global_max_parallel_requests: 50          # crude blast-radius cap

  # ---- health ----
  background_health_checks: true
  health_check_interval: 300
