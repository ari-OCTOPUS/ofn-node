# GENOME / METRICS  (INVARIANT CORE -- read-only)
# What "health" means. Perception + Guardian emit these into the ledger as
# METRIC events; the Doctor reads them. Because the definition of health is
# frozen here, no agent can move the goalposts it is scored against.

metrics:
  task_success_rate:
    unit: "ratio"
    good: ">= 0.8"
    note: "completed / attempted tasks"
  daily_cost_usd:
    unit: "usd"
    good: "<= gates.budget_usd.daily_ops"
  cost_per_task_usd:
    unit: "usd"
    good: "trend flat or down"
  retry_count:
    unit: "count/day"
    good: "low + stable"
    note: "spikes = AutoGPT-style looping"
  loop_length:
    unit: "steps"
    good: "<= gates.run_guards.max_steps_per_run"
  proposal_acceptance_rate:
    unit: "ratio"
    good: "0.3 - 0.8"
    note: "too low = Doctor drifted from reality; too high = rubber-stamping"
  index_freshness_s:
    unit: "seconds"
    good: "< 5"
    note: "event-to-index lag; proves event-driven perception is alive"
  query_latency_ms:
    unit: "ms"
    good: "< 500"
  tool_error_rate:
    unit: "ratio"
    good: "< 0.05"
  distance_from_genome:
    unit: "count"
    good: "0"
    note: "number of invariant rules a proposal would violate; must be 0 to ship"
  guardian_uptime_pct:
    unit: "ratio"
    good: ">= 0.99"
    note: "online-ness / liveness of the 24h Guardian"
  backup_last_success_age_h:
    unit: "hours"
    good: "< 24"
    note: "stale backup is a red alert (see backup.yaml)"
