# GENOME / VALUES  (INVARIANT CORE -- read-only for every agent)
# This file defines WHAT DETERMINES how proposals are judged. Nothing in the
# self-improving system may modify it except through genome_change_protocol.md
# (72h cooldown + second human key). Mount this whole directory read-only.

identity:
  name: "genome-system"
  owner: "ari"
  mission: >
    A single-person, single-laptop, local-first knowledge system that improves
    itself SAFELY. Intelligence is expensive and rare at the decision points;
    everything routine is cheap and event-driven.

# The boundary test. Ask it of any proposed change:
#   "If this changes, could the system approve the NEXT bad change more easily?"
#   YES  -> it is GENOME (invariant, this directory, read-only).
#   NO   -> it is SHELL  (mutable: prompts, schedules, tool choice, non-core dirs).
boundary_test: "Does it determine the CRITERIA by which proposals are judged?"

invariant_principles:
  - id: approve_first
    text: "No change reaches production without an explicit human approval."
  - id: propose_only_agents
    text: "Every agent (Guardian, Creativity, Doctor, Perception) may only PROPOSE. None may APPLY."
  - id: evaluator_in_genome
    text: "The evaluator / health metrics live in the genome and are frozen; no agent can rewrite what it is scored against (anti reward-hacking; DGM lesson)."
  - id: genome_not_self_modifiable
    text: "No agent -- including the Guardian that lives 'inside' the genome -- may edit the genome. The Guardian is GOVERNED BY the genome and read-only on it."
  - id: monitor_separate_from_metric
    text: "The safety monitor is never the same signal being optimized, and is never trained against (obfuscation lesson)."
  - id: human_two_key_for_genome
    text: "Genome changes require the same decision made by the owner at two separated times (72h apart)."
  - id: budget_owned_by_human
    text: "Spending ceilings are a value judgement; only the owner sets them."
  - id: perception_allowlist
    text: "Perception indexes only an explicit owner-approved allowlist of folders/types. Default deny. (Recall lesson: the perception layer is the biggest privacy surface.)"
  - id: open_formats_local_first
    text: "Everything lives in open, portable formats (Markdown, JSONL, SQLite, git). No dependence on any single vendor. (Rewind/Limitless lesson.)"
  - id: backup_is_not_optional
    text: "Memory without backup is a liability. See backup.yaml; restore drills are mandatory."

# Things that are explicitly MUTABLE (the shell -- agents may propose edits):
mutable_shell:
  - agent prompts and role instructions
  - schedules and cadences (except the genome 72h rule)
  - which model tier handles which task (within gates.yaml routing)
  - tool selection and non-core folder structure
  - the indexer/embedding implementation
