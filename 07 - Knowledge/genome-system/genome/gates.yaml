# GENOME / GATES  (INVARIANT CORE -- read-only)
# The control valves. All numbers below are PROPOSED DEFAULTS; the owner must
# confirm them (budget is a value judgement, not an engineering choice).

approve_first: true            # nothing ships without human approval
propose_only:                  # these agents can PROPOSE, never APPLY
  - guardian
  - creativity
  - doctor
  - perception

budget_usd:                    # hard ceilings; Guardian halts on breach
  daily_ops: 1.0               # routine perception + nightly digest
  doctor_run: 5.0              # one weekly Opus-tier Doctor pass
  quarterly_radar: 10.0        # Future Radar research run
  monthly_hard_cap: 50.0       # absolute stop; Guardian pauses spend above this
  owner_confirmed: false       # <-- set true only after the owner signs off

# Model routing (INTELLIGENCE tiering). Prices are per 1M tokens, verified
# 2026-07-06 from Anthropic. Sonnet 5 (shipped 2026-06-30) replaced Sonnet 4.6.
intelligence:
  tiers:
    cheap:   { model: "claude-haiku-4-5-20251001", in: 1.0, out: 5.0, use: "digest, classification, routine perception" }
    default: { model: "claude-sonnet-5",   in: 2.0,  out: 10.0, use: "generation tasks; intro pricing to 2026-08-31, then 3/15" }
    premium: { model: "claude-opus-4-8",   in: 5.0,  out: 25.0, use: "weekly Doctor pass + architectural analysis only" }
  batch_discount: 0.5          # Batch API = -50% (use for nightly digest)
  cache_read_multiplier: 0.1   # prompt-cache hit = -90% on repeated context
  expected_saving_vs_all_premium: "40-85%"   # RouteLLM/FrugalGPT-class

doctor:
  cadence: "weekly"            # Opus-tier
  output: "propose_only"
  exceptional_trigger:         # off-cycle run ONLY when a metric breaches threshold
    - "daily_cost > budget_usd.daily_ops"
    - "proposal_acceptance_rate < 0.2"
    - "tool_error_rate > 0.15"
    - "guardian_uptime_pct < 0.95"

scan:
  mode: "event_driven"         # OS file-watcher; polling is forbidden
  nightly_digest: "batch"      # aggregate the day's changes at -50% batch price
  polling_minutely: false      # explicitly disabled (~100x cheaper this way)

# Loop / runaway guards (AutoGPT lesson: no completion criterion = death by cost)
run_guards:
  max_steps_per_run: 40
  max_cost_per_run_usd: 2.0
  max_loop_repeats: 3          # identical action repeated -> abort + PROPOSAL
