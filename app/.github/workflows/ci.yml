name: ci

on:
  push:
  pull_request:

jobs:
  gate-0:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[dev,api]
      - run: python -m pytest
      - run: python -m pytest tests/test_import_lint.py -q
      - run: python run.py
